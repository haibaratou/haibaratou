<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>イベント検証ラボ ― エティモリンゴ</title>
<style>
:root{--ink:#3f3547;--soft:#8b8095;--pane:#fffdf8;--line:#e6dcef;--warm:#f6ead1;
  --accent:#c96a8a;--accent2:#6f62c4;--ok:#4fa87a;--ng:#c9585f;--gold:#d9a441}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Hiragino Maru Gothic ProN","Meiryo",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#fdf8f1,#f4eee6 60%,#efe7dd);display:flex;flex-direction:column;overflow:hidden}
button,input{font-family:inherit;color:inherit}
header{flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 16px;
  background:linear-gradient(#fffefb,#f6eee2);border-bottom:3px solid #ddcdb4;box-shadow:0 2px 8px rgba(90,70,50,.10)}
header h1{font-size:17px}
header h1 small{font-size:11px;color:var(--soft);margin-left:8px;font-weight:normal}
#hstat{margin-left:auto;font-size:11.5px;color:var(--soft)}
.hbtn{background:#fff;border:2.5px solid var(--line);border-radius:12px;padding:6px 12px;font-size:12px;
  cursor:pointer;text-decoration:none;color:inherit;box-shadow:0 3px 0 rgba(120,100,80,.14)}
.hbtn:active{transform:translateY(2px);box-shadow:none}
#main{flex:1 1 auto;min-height:0;display:flex;gap:10px;padding:10px}
.pane{background:var(--pane);border:3px solid var(--line);border-radius:18px;display:flex;flex-direction:column;
  min-height:0;box-shadow:0 6px 16px rgba(90,70,50,.10)}
#left{flex:0 0 296px}
#right{flex:1 1 auto;min-width:0}
.pTtl{flex:0 0 auto;padding:8px 13px;font-size:13px;font-weight:bold;color:var(--accent2);
  border-bottom:2px dashed var(--line);display:flex;align-items:center;gap:8px}
.pTtl .cnt{margin-left:auto;font-size:11px;color:var(--soft);font-weight:normal}
/* イベント一覧 */
#evList{flex:1;overflow-y:auto;padding:8px}
.lvHd{font-size:11px;font-weight:bold;color:var(--soft);padding:8px 4px 4px;letter-spacing:.06em}
.ev{background:#fff;border:2.5px solid var(--line);border-radius:13px;padding:7px 10px;margin-bottom:6px;cursor:pointer;
  transition:transform .1s,border-color .1s}
.ev:hover{transform:translateY(-2px);border-color:var(--accent)}
.ev.on{border-color:var(--accent);background:#fdf3f6;box-shadow:0 0 0 3px rgba(201,106,138,.2)}
.ev .en{font-size:13px;font-weight:bold;line-height:1.3}
.ev .em{font-size:10.5px;color:var(--soft);margin-top:2px}
.ev .ec{font-size:10px;color:var(--gold);font-weight:bold;margin-top:3px}
/* 詳細 */
#detail{flex:1;overflow-y:auto;padding:12px 14px 18px}
.scene{background:linear-gradient(#fffdf6,#f8f0e2);border:2.5px solid #ddcdb4;border-radius:14px;padding:11px 14px}
.scene h2{font-size:17px;margin-bottom:5px}
.scene p{font-size:13px;line-height:1.65;color:#5c5265}
.req{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.tg{font-size:11px;background:#eef0fb;border:1.5px solid #c8c6ea;color:#4c46a0;border-radius:8px;padding:2px 8px;font-weight:bold}
.kw{font-size:11px;background:#fdf0f4;border:1.5px solid #eec2d0;color:#a4415c;border-radius:8px;padding:2px 8px}
.verdict{margin-top:10px;border-radius:13px;padding:10px 13px;font-size:12.5px;line-height:1.7;border:2.5px solid}
.verdict.good{background:#f2fbf6;border-color:#b3e2c8}
.verdict.warn{background:#fffaf0;border-color:#f0d9a6}
.verdict.bad{background:#fdf2f3;border-color:#f0bfc3}
.verdict b{font-size:13px}
.cols{display:flex;gap:10px;margin-top:12px;align-items:flex-start}
.col{flex:1 1 0;min-width:0;background:#fff;border:2.5px solid var(--line);border-radius:14px;overflow:hidden}
.col.solo{flex:1 1 100%}
.colH{padding:7px 11px;font-size:12px;font-weight:bold;border-bottom:2px dashed var(--line);display:flex;gap:8px;align-items:center}
.colH .n{margin-left:auto;font-size:12px;color:var(--accent2)}
.colH.a{background:#f6f6fd}.colH.b{background:#fdf5f8}.colH.v{background:#f4faf6}
.wr .vp{font-size:9.5px;border-radius:6px;padding:0 5px;font-weight:bold}
.wr .vp.p{background:#eafaf0;color:#2f7a52}.wr .vp.n{background:#fdeef2;color:#a4415c}
.wlist{max-height:46vh;overflow-y:auto;padding:6px}
.wr{display:flex;align-items:baseline;gap:7px;padding:4px 7px;border-radius:9px;flex-wrap:wrap}
.wr:nth-child(odd){background:#faf8fc}
.wr b{font-size:13.5px}
.wr .ja{font-size:11px;color:var(--soft)}
.wr .rt{font-size:10px;color:#9a8fa6;font-family:"Shippori Mincho",serif;font-style:italic}
.wr .tt{font-size:9.5px;background:#eef0fb;color:#5b56a8;border-radius:6px;padding:0 5px;margin-left:auto}
.wr .rr{font-size:9.5px;color:#b3a8be}
.wr .gl{flex-basis:100%;font-size:9.5px;color:#a99fb4;font-style:italic;padding-left:2px;line-height:1.3}
.wr .tier{font-size:9px;font-weight:bold;border-radius:6px;padding:0 5px;white-space:nowrap}
.wr .tier.crit{background:#fff3c4;color:#8a6d1f;border:1px solid #e3c96a}
.wr .tier.good{background:#eafaf0;color:#2f7a52;border:1px solid #a9dcc0}
.wr .tier.bad{background:#fdeef2;color:#a4415c;border:1px solid #eec2d0}
.wr .tier.dual{background:#c2185b;color:#fff;border:1px solid #99134a}
/* 初期装備。エティモンを持っていなくても最初から使える原始動詞 */
.wr .init{font-size:9px;font-weight:bold;border-radius:4px;padding:0 4px;background:#2f7a52;color:#fff;white-space:nowrap}
/* 答えの点検。語＝DBの語義 を並べて、英語の語感で選んだ穴を見つける */
.au{display:inline-block;border:1.5px solid var(--line);border-radius:9px;padding:1px 7px;margin:0 3px 3px 0;background:#fff;font-size:11px;color:var(--soft)}
.au b{color:var(--ink);font-size:12px;margin-right:5px}
.au.ng{border-color:#eec2d0;background:#fdeef2;color:#a4415c}
.wr.t-bad{background:#fff6f8}
.wr.t-crit{background:#fffdf2}
.wr.t-dual{background:#fff0f5;box-shadow:inset 3px 0 0 #c2185b}
/* どの属性に刺さったか。二重の語には2つ並ぶ */
.wr .asp{font-size:9px;font-weight:bold;border-radius:6px;padding:0 5px;white-space:nowrap;border:1px solid}
.wr .asp.a0{background:#eef4ff;color:#33549b;border-color:#b9caee}
.wr .asp.a1{background:#f4eeff;color:#63409b;border-color:#cdbcea}
.wr .asp.a2{background:#eefaf6;color:#2b7a68;border-color:#aadcd0}
.wr .asp.a3{background:#fff4ea;color:#95561f;border-color:#eec9a8}
.wr .mm{font-size:9px;font-weight:bold;color:#a4415c;background:#fdeef2;border:1px solid #eec2d0;border-radius:6px;padding:0 4px}
.wr.mism{background:#fff7f8}
.wr.mism:nth-child(odd){background:#fdf0f2}
/* エティモン(語根)のアイコンとID */
.ety{display:inline-flex;align-items:center;gap:2px;background:#fff;border:1.5px solid var(--line);
  border-radius:9px;padding:0 4px 0 1px;white-space:nowrap}
.ety img{width:20px;height:20px;object-fit:contain;vertical-align:-5px}
.ety .dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin:0 2px}
.ety .id{font-size:9px;font-weight:bold;color:#7b6f88}
.ety .jn{font-size:9.5px;color:#6f6579}
.wr.off{opacity:.32}
.wr.off .ety{filter:grayscale(1)}
/* 所持数カバレッジ表 */
.cov{width:100%;border-collapse:collapse;font-size:11.5px}
.cov th,.cov td{border:1px solid var(--line);padding:4px 7px;text-align:right;white-space:nowrap}
.cov th{background:#f6f2fa;font-size:11px}
.cov td.nm{text-align:left;font-weight:bold}
.cov td.hot{background:#eafaf0;color:#2f7a52;font-weight:bold}
.cov td.cold{background:#fdf2f3;color:#a4415c}
.covWrap{overflow-x:auto;margin-top:8px}
.more{width:100%;padding:6px;font-size:11.5px;background:#f4f0f8;border:none;border-radius:9px;cursor:pointer;color:var(--accent2);font-weight:bold}
.none{padding:14px;text-align:center;font-size:12px;color:var(--soft)}
/* 自作イベント */
#lab{margin-top:14px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px}
#lab h3{font-size:14px;color:var(--accent2);margin-bottom:4px}
#lab p{font-size:11.5px;color:var(--soft);line-height:1.6}
#tagPick{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;max-height:132px;overflow-y:auto;padding:2px}
.tp{font-size:10.5px;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:3px 7px;cursor:pointer;white-space:nowrap}
.tp.on{border-color:var(--accent2);background:#eef0fb;color:#4c46a0;font-weight:bold}
.tp small{color:#b3a8be;margin-left:3px}
#kwBox{width:100%;margin-top:9px;border:2.5px solid var(--line);border-radius:11px;padding:8px 11px;font-size:13px}
#labOut{margin-top:10px}
@media(max-width:900px){
  #main{flex-direction:column;overflow-y:auto}
  #left{flex:0 0 auto;max-height:34vh}
  #right{min-height:70vh}
  .cols{flex-direction:column}
  .wlist{max-height:none}
}
</style>
</head>
<body>
<header>
  <h1>🧪 イベント検証ラボ<small>意味タグだけで、あらゆるイベントに単語を割り当てられるか</small></h1>
  <a class="hbtn" href="index.html">← 入口</a>
  <a class="hbtn" href="etymon-explorer.html">🔍 探索</a>
  <label style="font-size:12px;display:flex;align-items:center;gap:6px">もっているエティモン
    <select id="ownSel" class="hbtn" style="padding:5px 8px">
      <option value="1">上位1体（最初）</option><option value="2">上位2体</option>
      <option value="3">上位3体</option><option value="5">上位5体</option><option value="10">上位10体</option>
      <option value="20">上位20体</option><option value="30">上位30体</option>
      <option value="50" selected>上位50体（いま絵があるぶん）</option>
      <option value="100">上位100体</option><option value="200">上位200体</option>
      <option value="400">上位400体</option><option value="9999">全部（1,437体）</option>
    </select></label>
  <label style="font-size:12px;display:flex;align-items:center;gap:5px" title="食べる・切る・運ぶのような原始の行為91語を、エティモン無しで最初から配る">
    <input type="checkbox" id="starterChk" checked>初期装備 91語</label>
  <div id="hstat">読み込み中…</div>
</header>
<div id="main">
  <section class="pane" id="left">
    <div class="pTtl">📋 イベント<span class="cnt" id="evCnt"></span></div>
    <div id="evList"></div>
  </section>
  <section class="pane" id="right">
    <div class="pTtl">🔎 検証<span class="cnt" id="legend"></span></div>
    <div id="detail"></div>
  </section>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===========================================================================
 * イベント定義
 *  tags   … WordNet の意味カテゴリ(supersense)。これに属する語が候補になる
 *  kw     … 語義(日本語)に対する追加の絞り込み。タグだけでは粗すぎる場合に使う
 *  val    … 正負のしぼり('+' or '-')。valence.csv を参照する
 *  expect … 「出るべき語」。再現率チェックに使う。取りこぼしを見つけるための答え合わせ
 *  lv     … 1:かんたん(タグ1つで解ける) 2:ふつう 3:むずかしい(抽象的な要求)
 *  note   … 検証所見。ok=タグだけで成立 / warn=語義の絞り込みが要る / bad=この方式では無理
 * =========================================================================== */
const EVENTS=[
 /* ===== 原始の行為で倒す雑魚(lv:10) ― エティモン0体で倒せる =====
  * <b>初期装備の91語だけで戦えるゾーン。</b>ここはエティモンを1体も持っていない。
  * 「食べる」「切る」「燃やす」しかできない状態で、それが通用する相手だけを出す。
  * 野菜には eat ― 誰でも分かる原始的な遊び。
  * <b>ツルカラミ(蔓)とオモイイシ(岩)は削除した。</b>「道をふさぐ障害物」でしかなく、
  * 悩みも台詞も持てない。性格の無い敵からは面白い答えが出てこない ―
  * 実際、岩の答えは push / lift / 迂回 だけで、そこに water / river を足して
  * 水増ししたせいで「意味が分からない一撃」が生まれた。<b>敵は必ず人格を持たせる。</b>
  * エティモンはこの後から中間層として入り、攻め手が増えていく順になる。
  *
  * <b>ここだけ good(有効)を持たない。</b>意味タグは<b>行為の動詞に効かない</b>ため。
  * WordNet の最頻語義タグを実際に引くと <b>cut=noun.possession / grind=noun.person /
  * beat=noun.location / blade=noun.plant</b> で、切る・打つの語が意味どおりに集まらない。
  * 逆に noun.act を「刈る」に当てると <b>merger / navigation / debut / diversion</b> が
  * 有効として並んだ。これは capital を「頭」と言い張るのと同じ押しつけなので、
  * lv:10 は <b>一撃(列挙)と逆効果だけ</b>で構成する。原始動詞は数が少なく列挙で足りる。
  * (lv:9 は noun.food / noun.possession / noun.feeling のような<b>名詞タグ</b>なので機能する。) */
 {lv:10,ttl:'たべごろ野菜',want:'食べてほしい／集めて（収穫して）ほしい',
  bad:'venom rot frost drought locust mould blight mildew',
  scene:'畑の真ん中で立ち上がった、つやつやの野菜の塊。葉の間から根がぞろぞろ生えている。攻撃してこない。ただ、うまそうだ。',
  asp:[
   {n:'食べる',ans:'eat bite chew swallow taste cook boil bake roast stew soup salad dinner feast plate dish bowl pan knife mouth tooth salt pepper sauce butter oil cream'},
   {n:'収穫',ans:'harvest reap crop autumn cart barn market basket field farm garden'},
   {n:'食べる',con:'食|噛|飲|味'},
   {n:'集める',con:'集め|拾|選'}],
  note:'ok',msg:'<b>「刈る」属性を廃止した</b>。scythe(草刈り鎌) / sickle / strike / beat / split / break を答えにしていたが、<b>草刈り鎌は野菜に使う道具ではない</b>。畑仕事の語(plough / hoe / spade / furrow / soil)も、<b>これは既に育った野菜</b>なので通らない。<br>残したのは <b>食べる</b>(食べる・料理する・食器・調味料)と <b>収穫</b>(harvest / crop / 荷車・納屋・市場)だけ。どちらも「食べごろの野菜がこの先どうなるか」で説明がつく。'},

   {lv:10,ttl:'体が冷えきったびしょ濡れの子ネズミ',want:'温めてほしい／食べさせてほしい',bad:'water rain river swim wash cold ice snow wind frost',
  scene:'びしょ濡れで震えている小さいの。敵意はまるで無い。こちらを見上げて、ひたすら震えている。',
  asp:[
   {n:'温める',ans:'fire flame heat warm warmth sun hearth coal blanket wool cover wear wrap dry burn summer fur bath stove oven candle torch ember lamp shelter roof home house nest bed hut cave glow spring'},
   {n:'食べさせる',ans:'bread milk meat honey apple butter soup berry wine barley bean grain corn fruit nut fish egg broth stew feast meal dinner banquet cream gruel mead ale salt sausage grape olive ham beef pork mutton oat wheat biscuit feed give seed cook bake'},
   {n:'温める',con:'温|暖|熱'},
   {n:'食べる',con:'食|噛|飲|味'}],
  note:'ok',msg:'<b>戦わない相手</b>。攻撃系の初期装備(cut / break / strike)は<b>全部「無効」に落ちる</b>ので、プレイヤーは持ち札を眺め直すことになる。<br>正解は <b>cover / wear / wrap / feed / give</b> ― <b>初期装備の中の、地味な非戦闘動詞</b>。91語を「攻撃カードの束」だと思っていたプレイヤーが、そうではないと気づく設計にしてある。'},

 /* ===== 序盤キャラ(lv:8) ― 語根1体で必ず解ける =====
  * 列挙型キャラは序盤に置けない。実測で、上位3体しか持っていない状態で
  * 9キャラ合計 <b>4語</b> しか作れなかった。各キャラが要求する語根がばらばらで、
  * 1体持っていても1〜6語しか届かないため。
  *
  * そこで序盤は<b>要求の粒度を語根に上げる</b>。「*per1(前へ) の血を引く言葉なら何でもいい」
  * にすれば、エティモンを1体持っているだけで <b>94語</b> から選べて、絶対に詰まない。
  * 中盤以降(10体〜)で列挙型の細かい悩みに移行する。 */
 {lv:8,ttl:'ススマヌ',
  scene:'車輪が逆向きに付いた荷車の精霊。押しても引いても後ろにしか進まない。「さきへ。さきへ」とだけ繰り返している。',
  st:{t:'root',v:'per1'},
  expect:'first far further approach provide period production performance forward private property percent primary prior improve profit',
  note:'ok',msg:'*per1(前へ)を1体持っているだけで<b>94語</b>(単一語根の語)から選べる。2語根の語まで含めると707語。<b>序盤キャラの基本形</b>で、「祖先が合っていれば何でもいい」ので絶対に詰まない。エティモン#1なので最初に配るのに向く。'},

 {lv:8,ttl:'タオレビト',
  scene:'膝から下が霧になった旅人。何度も立ち上がろうとしては崩れる。「たつ、ちからを」',
  st:{t:'root',v:'stā-'},
  expect:'state stand station status stable establish institute constant distance instant substance circumstance rest cost',
  note:'ok',msg:'*stā-(立つ)を1体で<b>79語</b>。#10なので序盤に配れる。state / stand / stable / establish / institute ― 「立つ」から「制度」まで意味が広がるのが見えるので、語源の面白さが最初に伝わる。'},

 {lv:8,ttl:'カラッポ',
  scene:'中が空洞の大きな壺。叩くと澄んだ音がして、少し寂しそうに揺れる。「なかみを、なかみを」',
  st:{t:'root',v:'en'},
  expect:'in into income industry influence information inside interior internal intimate energy enter engine',
  note:'ok',msg:'*en(中に)を1体で<b>70語</b>。#3。income / interior / energy / engine ― 「中」の語が一気に手に入る。ゼニガタ社長の income とも重なるので、<b>序盤で覚えた語が中盤のキャラに効く</b>という繋がりが作れる。'},

 {lv:8,ttl:'メナシ',
  scene:'目のない白い仮面。手探りで何かを探している。触れると動きを止めて、じっとこちらを向く。',
  st:{t:'root',v:'weid-'},
  expect:'view vision visit evident provide advice wise wit idea guide history story review interview supervise',
  note:'ok',msg:'*weid-(見る)を1体で<b>56語</b>。#16。view / vision / wise / wit / idea / history ― <b>「見る」から「知る」へ意味が伸びる</b>のがはっきり見えるので、語源学習として一番おいしい語根のひとつ。'},

 {lv:8,ttl:'ウマレズ',
  scene:'割れかけたまま止まった卵。殻の内側で、何かがずっと動いている。',
  st:{t:'root',v:'genə-'},
  expect:'general kind nature natural generation gender nation gene native genetic generate engine gentle genuine genius',
  note:'ok',msg:'*genə-(命を与える)を1体で<b>67語</b>。#15。kind / nature / king / gentle / genius / gene が全部「生む」から来ていると分かる。<b>ウマレズを鎮めると同時に、語源のいちばん驚く例に触れられる</b>。'},

 /* ===== キャラを鎮める(列挙方式・lv:9) =====
  * アンダーテイルの雑魚敵のように、一体ずつ悩みを持っている。
  * その悩みに効く「ことばカード」を差し出せば、一撃で満足して戦闘を回避できる。
  *
  * ここだけ作り方が違う: タグで引くのではなく <b>答えを人(かAI)が列挙し、
  * DBに在る語だけを残す</b>。実測でDB一致率84%、しかも精度100%・ゴミゼロ。

let WORDS=[],ROOTS={},TAGS={},BYTAG={},VALS={},RANK={},NOPIE={},GLOSS={},cur=-1,showAll={},ownN=50;
const A='../assets/';
async function load(){
  const [ws,rs,tg,vc,np,gl]=await Promise.all([
    fetch('data/pie/words.json').then(r=>r.json()),
    fetch('data/pie/roots.json').then(r=>r.json()),
    fetch('data/pie/tags.json').then(r=>r.json()),
    fetch('data/pie/valence.csv').then(r=>r.text()).catch(()=>''),
    fetch('data/pie/nopie.json').then(r=>r.json()).catch(()=>({})),
    fetch('data/pie/gloss.json').then(r=>r.json()).catch(()=>({})),
  ]);
  WORDS=ws;TAGS=tg;NOPIE=np;GLOSS=gl;
  // valence.csv: word,ja,tag,auto,fix  … fix があれば fix を優先(手で直した値)
  // 語義にカンマが入っていても壊れないよう、先頭と末尾から取る
  vc.split(/\r?\n/).slice(1).forEach(ln=>{
    if(!ln)return;
    const c=ln.split(',');
    if(c.length<5)return;
    VALS[c[0]]=c[c.length-1]||c[c.length-2];
  });
  for(const r of rs)ROOTS[r.key]=r;
  // エティモンID = 派生語が多い順。#1=前へ(795語) #2=一緒に(626語) …
  rs.slice().sort((a,b)=>(b.dict||0)-(a.dict||0)).forEach((r,i)=>{RANK[r.key]=i+1;});
  const seen=new Set();
  for(const x of WORDS){
    // 再現率チェック用: タグの有無に関わらず、綴りで全語を引けるようにする
    const lc=x.w.toLowerCase();
    if(!(lc in WBY)){WBY[lc]=x;ALLW.push(x);}
    const t=TAGS[x.w];
    if(!t||seen.has(x.w))continue;
    seen.add(x.w);
    (BYTAG[t]=BYTAG[t]||[]).push(x);
  }
  for(const k in BYTAG)BYTAG[k].sort((a,b)=>(a.r??9999)-(b.r??9999));
  /* 語根型(asp に root を書いた相手)の答えを<b>実際の語の列</b>に展開する。
     こうしておくと、下の「答えの点検」も再現率も件数も、列挙型と同じ道を通る。
     147語ぜんぶが日本語語義つきで並ぶので、<b>語根で括ったせいで
     場面に合わない語が混ざっていないか</b>を目で確かめられる。 */
  const kids={};
  for(const x of WORDS)for(const k of (x.p||[]))(kids[k]=kids[k]||[]).push(x);
  /* con(概念)は<b>同じ意味の語根 全部</b>に広がる。
     「見る」なら *weid- だけでなく *okʷ- *spek- *derk- も入る。
     1本だけ選ぶと派生語20語のマイナー語根になり、山札にまず来ない。 */
  EVENTS.forEach(e=>{
    let grew=false;
    (e.asp||[]).forEach(a=>{
      if(a.ans||(!a.root&&!a.con&&!a.pre))return;
      if(a.pre){   // 接頭辞型。その接頭辞を持つ語をそのまま答えにする
        const rx=new RegExp('(^|,\\s*)('+a.pre+')');
        const ws=WORDS.filter(x=>rx.test(x.pre||'')&&x.ja&&!/^[A-Z]/.test(x.w)&&!/\s/.test(x.w));
        ws.sort((x,y)=>(x.r??9999)-(y.r??9999));
        a.ans=[...new Set(ws.map(x=>x.w))].join(' '); grew=true; return;
      }
      const keys=a.con?Object.keys(ROOTS).filter(k=>new RegExp(a.con).test(ROOTS[k].ja||''))
                      :[a.root];
      a._keys=keys;
      const ws=[];
      for(const k of keys)for(const x of (kids[k]||[]))
        if(x.ja&&!/^[A-Z]/.test(x.w)&&!/\s/.test(x.w))ws.push(x);
      ws.sort((x,y)=>(x.r??9999)-(y.r??9999));
      a.ans=[...new Set(ws.map(x=>x.w))].join(' ');
      grew=true;
    });
    if(grew)e.ans=e.asp.map(a=>a.ans||'').join(' ').trim();
  });
  $('#legend').innerHTML=`<span style="opacity:.32">うすい文字</span>＝いま持っているエティモンでは作れない語　`
    +`<span style="color:var(--ng)">⚠語義ズレ</span>＝タグが英語の別語義に付いている疑い`;
  $('#hstat').textContent=`タグ付き ${seen.size} 語 ／ グループ ${Object.keys(BYTAG).length} 種 ／ エティモン ${rs.length} 体`;
  $('#ownSel').onchange=e=>{ownN=+e.target.value;renderEv();renderDetail();};
  $('#starterChk').onchange=e=>{useStarter=e.target.checked;renderEv();renderDetail();};
  renderEv();renderDetail();renderLabTags();
}

function byTags(tags){
  const out=[];
  for(const t of tags)for(const x of (BYTAG[t]||[]))out.push(x);
  return out;
}
function byKw(list,kw){
  if(!kw)return list;
  let re;try{re=new RegExp(kw);}catch(e){return list;}
  return list.filter(x=>re.test(x.ja||''));
}
// 正負しぼり。valence.csv に載っていない語(食べ物・道具など)は正負が無関係なので素通し
function byVal(list,v){
  if(!v)return list;
  return list.filter(x=>!(x.w in VALS)||VALS[x.w]===v);
}

/* タグと品詞の食い違いを検出する。
 * タグは「WordNetの最頻語義(英語)」に付いているが、画面に出している語義は日本語で、
 * 両者が別の意味を指していることがある。
 *   come  ja=来る   → WordNet最頻語義は "the thick white fluid…"(精液) なので noun.body
 *   small ja=小さい → "the slender part of the back"(背中のくびれ)
 *   behind ja=後ろに → "the fleshy part … you sit on"(尻)
 * DBの品詞に名詞が無いのに名詞タグが付いていれば、ほぼ確実にこのズレ。 */
function posMismatch(x){
  const t=TAGS[x.w];if(!t)return false;
  const pos=(x.pos||'').split('/');
  if(t.startsWith('noun.'))return !pos.includes('名');
  if(t.startsWith('verb.'))return !pos.includes('動');
  if(t.startsWith('adj.')) return !pos.includes('形');
  return false;
}
// 手持ちの上位N体だけで作れるか(語根を全部そろえている必要がある)
/* ===== 初期装備(原始の行為) =====
 * エティモンを1体も持っていなくても最初から使える91語。食べる・切る・運ぶのような、
 * 人間が言葉を持つ前からやっていた行為だけを集めた。
 *
 * なぜ配る必要があるか(実データ):
 *  - エティモンは派生語が多い順に並ぶので、上位から出てくるのは
 *    <b>and / at / do / for / from / in / to / first / face / state / fact</b>
 *    ― 機能語とロマンス系の抽象名詞ばかりで、<b>「できること」が一つも無い</b>。
 *  - 原始動詞は逆に語根がとても深い。eat=*ed-(#276) drink=*dhreg-(#980)
 *    sleep=*slēb-(#1045) see=*sekʷ-2(#769) weep=*wāb-(#1340)。
 *    「食べる」専用の語根は「食べる」しか産まなかったので、派生語順では最後に来る。
 *  - 結果、78語の原始動詞のうち<b>上位50体で作れるのは9語だけ</b>(中央値#270)。
 * つまりエティモン順に開放すると、<b>抽象から始まって具体に永久に辿り着かない</b>。
 * 初期装備で下駄を履かせるのは飾りではなく、この反転を打ち消すために要る。 */
const STARTER=`eat bite chew swallow taste drink feed cook boil bake
cut break tear split pierce grind beat strike crack
push throw turn carry bear take give hold catch lift drag
go come run walk climb fall fly swim leap ride
see hear feel watch listen
say speak call sing laugh weep shout whisper name
make build weave sew bind tie dig plant sow reap wash burn
sleep wake rest sit stand lie live die grow
wear cover fill empty open close hide wrap
know think learn count choose want fear love`.split(/\s+/).filter(Boolean);
const STARTER_SET=new Set(STARTER);
let useStarter=true;
function isStarter(x){return useStarter&&STARTER_SET.has(x.w.toLowerCase());}
function canMake(x){return isStarter(x)||(x.p||[]).every(k=>(RANK[k]||9999)<=ownN);}
/* ===== 再現率チェック =====
 * 「出るはずの語」を並べて、実際に候補に入るかを1語ずつ診断する。
 * 候補一覧だけ見ていると、出た語の質しか分からず取りこぼしに気づけない
 * (noun.food が全部食べ物なので成立に見えたが、実は6割落としていた)。 */
const WBY={};   // 単語 -> レコード(綴りで引く)
const ALLW=[];  // 重複を除いた全単語(構造イベント用。タグが無い語も含む)
/* 語のしくみで絞る。意味タグを使わないので、レア度にも品詞にも縛られない */
function pickStruct(x,st){
  if(!st)return false;
  switch(st.t){
    case 'g'    : return x.g===st.v;                       // 語派
    case 'root' : return (x.p||[]).includes(st.v);         // 語根を含む
    case 'pre'  : return x.pre===st.v;                     // 接頭辞
    case 'suf'  : return x.suf===st.v;                     // 接尾辞
    case 'rhyme': return x.w.toLowerCase().endsWith(st.v); // 韻(語末)
    case 'pos'  : return (x.pos||'').split('/').includes(st.v);
    case 'nroot': return (x.p||[]).length===st.v;          // 語根の数
  }
  return false;
}
/* 答えとして成立しない語を全イベントから除く。
 * and / but / a / the のような機能語、語義が空の語、固有名詞は
 * どのイベントでも「渡せるもの」にならない。 */
const FUNC_POS=new Set(['前','接','冠','代','助','間','副']);
function isJunk(x){
  const pos=(x.pos||'').split('/').filter(Boolean);
  if(pos.length&&pos.every(p=>FUNC_POS.has(p)))return '機能語・副詞のみ';
  if(!(x.ja||'').trim())return '語義が空';
  if(/^[A-Z]/.test(x.w))return '固有名詞';
  return null;
}
const ST_LABEL={g:'語派',root:'語根',pre:'接頭辞',suf:'接尾辞',rhyme:'韻(語末)',pos:'品詞',nroot:'語根の数'};
const G_JA={G:'ゲルマン',L:'ロマンス',Gr:'ギリシャ'};
function stText(st){
  const v=st.t==='g'?(G_JA[st.v]||st.v):st.t==='rhyme'?('-'+st.v):st.t==='root'?('*'+st.v):st.v;
  return `${ST_LABEL[st.t]} = ${v}`;
}
function reqText(e){
  if(e.asp&&e.asp.length>1)return e.asp.map(a=>a.n).join(' × ');
  if(e.ans)return `列挙 ${e.ans.split(/\s+/).filter(Boolean).length}語`;

 *   crit … 一撃で満足させる。属性ごとに列挙(30〜45語)
 *   good … 少し満足する。属性ごとに語根かタグで自動判定(数百語)
 *   bad  … 激怒する。キャラに1つだけ列挙(10〜15語)
 *   none … 何も起きない。上のどれでもない語ぜんぶ
 * 序盤に強い: good が語根/タグ判定なので、答えを1つも知らなくても必ず何か効く。
 * 執筆量はキャラあたり crit 40語×属性数 + bad 15語。あとは自動。 */

   2つ以上の属性に同時に刺さる語は「二重」。rest(休息/安らかに眠れ)、

function aspHits(x,e){
  const lc=x.w.toLowerCase(), h=[];
  (e.asp||[]).forEach((a,i)=>{

    // <b>語根そのものが答え</b>の相手。その祖先から生まれた語なら どれでも一撃
    if(a._keys&&(x.p||[]).some(k=>a._keys.includes(k))){h.push({i,k:'crit'});return;}
    if(a.pre&&new RegExp('(^|,\\s*)('+a.pre+')').test(x.pre||'')){h.push({i,k:'crit'});return;}

    const seen=new Set(), out=[];
    for(const x of ALLW){

    if(e.tags&&e.tags.length)L=L.filter(x=>e.tags.includes(TAGS[x.w]));

function diagnose(word,e){

  }

  if(posMismatch(x))return {w,x,st:'struct',msg:'除外（語義ズレ）'};

  if(e.kw){let re;try{re=new RegExp(e.kw);}catch(err){re=null;}
    if(re&&!re.test(x.ja||''))return {w,x,st:'kw',msg:'語義しぼりに掛からない'};}

function easyOrder(limit){

      const miss=(x.p||[]).filter(k=>!owned.has(k));
      if(miss.length===1)gain[miss[0]]=(gain[miss[0]]||0)+1;
    }
    const best=Object.entries(gain).sort((a,b)=>b[1]-a[1])[0];
    if(!best)break;
    owned.add(best[0]);
    rem=rem.filter(x=>!(x.p||[]).every(k=>owned.has(k)));
    out.push({k:best[0],g:best[1],cum:easy.length-rem.length});
  }

         : `<span class="tg" style="background:#fff2e6;border-color:#e8c39a;color:#a86a2b">答えを列挙 → DBと突き合わせ</span>`)
      :e.st
      ?`<span style="font-size:11px;color:var(--soft)">しくみ</span><span class="tg" style="background:#f0eefb;border-color:#c0b8ea">${esc(stText(e.st))}</span>`
        +((e.tags&&e.tags.length)?`<span style="font-size:11px;color:var(--soft)">×</span>${e.tags.map(t=>`<span class="tg">${esc(t)}</span>`).join('')}`:'')
      :`<span style="font-size:11px;color:var(--soft)">要求タグ</span>${(e.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join('')}`}
      ${e.val?`<span style="font-size:11px;color:var(--soft);margin-left:6px">正負</span><span class="kw">${e.val==='+'?'＋のみ':'−のみ'}</span>`:''}
      ${e.kw?`<span style="font-size:11px;color:var(--soft);margin-left:6px">語義しぼり</span><span class="kw">${esc(e.kw)}</span>`:''}</div>
    <div style="margin-top:7px;font-size:11.5px;color:var(--soft)">
      このイベントの執筆量 <b style="color:var(--ink)">${e.ans?e.ans.split(/\s+/).filter(Boolean).length:e.st?1:(e.tags||[]).length+(e.kw?e.kw.split('|').length:0)}項目</b>
      （${e.ans?`答えを ${e.ans.split(/\s+/).filter(Boolean).length}語 列挙`:e.st?'しくみの条件1個だけ':`タグ${e.tags.length}個${e.kw?` ＋ キーワード${e.kw.split('|').length}語`:''}`}）
      → 正解候補 <b style="color:var(--accent2)">${fin.length}語</b></div>
  </div>
  <div class="verdict ${vc}"><b>${vt}</b><br>${esc(e.msg)}</div>
  <div class="cols">
    ${listBox('a',raw,'a',e.asp?(e.asp.length>1?'効果のある語（二重→一撃→有効→逆効果の順）':'効果のある語（一撃→有効→逆効果の順）'):e.st?'条件に合う語':'① タグだけ',e)}
    ${e.val?listBox('v',mid,'v','② 正負でも絞る',e):''}
    ${e.kw?listBox('b',fin,'b',(e.val?'③':'②')+' 語義でも絞る',e):''}
  </div>`;
  h+=auditHTML(e);
  h+=recallHTML(e);
  h+=labHTML();
  $('#detail').innerHTML=h;
  document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{showAll[b.dataset.all]=1;renderDetail();});
  bindRecall();bindLab();
}
/* ===== 自作イベント ===== */
let labTags=new Set(),labKw='',labVal='';
function labHTML(){
  const ts=Object.keys(BYTAG).sort((a,b)=>BYTAG[b].length-BYTAG[a].length);
  return `<div id="lab">
    <h3>🧬 自分でイベントを作って試す</h3>
    <p>タグを選び、必要なら語義で絞り込んで、思いついたイベントが本当に解けるか確かめてください。</p>
    <div id="tagPick">${ts.map(t=>`<span class="tp${labTags.has(t)?' on':''}" data-t="${esc(t)}">${esc(t)}<small>${BYTAG[t].length}</small></span>`).join('')}</div>
    <div style="display:flex;gap:6px;align-items:center;margin-top:9px;font-size:11px;color:var(--soft)">正負
      ${[['','しぼらない'],['+','＋のみ'],['-','−のみ']].map(([v,n])=>
        `<span class="tp${labVal===v?' on':''}" data-v="${v}">${n}</span>`).join('')}</div>
    <input id="kwBox" type="search" placeholder="語義でしぼる(例: 光|火|明 ／ 空欄なら絞らない)" value="${esc(labKw)}">
    <div id="labOut"></div></div>`;
}
function bindLab(){
  document.querySelectorAll('.tp').forEach(el=>el.onclick=()=>{
    const t=el.dataset.t;
    labTags.has(t)?labTags.delete(t):labTags.add(t);
    el.classList.toggle('on');renderLabOut();
  });
  document.querySelectorAll('[data-v]').forEach(el=>el.onclick=()=>{
    labVal=el.dataset.v;
    document.querySelectorAll('[data-v]').forEach(o=>o.classList.toggle('on',o.dataset.v===labVal));
    renderLabOut();
  });
  const kb=$('#kwBox');
  if(kb){kb.oninput=()=>{labKw=kb.value;renderLabOut();};}
  renderLabOut();
}
function renderLabOut(){
  const box=$('#labOut');if(!box)return;
  if(!labTags.size){box.innerHTML='<div class="none">タグを1つ以上えらんでください</div>';return;}
  const raw=byTags([...labTags]), mid=byVal(raw,labVal), fin=byKw(mid,labKw);
  box.innerHTML=`<div class="cols">
    ${listBox('la',raw,'a','① タグだけ')}
    ${labVal?listBox('lv',mid,'v','② 正負でも絞る'):''}
    ${labKw?listBox('lb',fin,'b',(labVal?'③':'②')+' 語義でも絞る'):''}</div>`;
  box.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{showAll[b.dataset.all]=1;renderLabOut();});
}
function renderLabTags(){}
load();
</script>
