<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>エティモン キングダム</title>
<style>
:root{
  --bg:#2a1f3d; --bg2:#3d2d57; --panel:#3a2c52; --panel2:#463668; --line:#5e4a85;
  --fg:#f7f2ff; --dim:#b8a8d4; --gold:#f5c542; --ok:#7cd98a; --ng:#ef7f8f;
  --front:#e8955c; --rear:#7fa8e8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(130% 90% at 50% 0%,var(--bg2),var(--bg));color:var(--fg);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;user-select:none;display:flex;flex-direction:column}
.hide{display:none!important}
button{font:inherit;cursor:pointer}
.top{flex:0 0 auto;display:flex;gap:6px;padding:8px 10px;background:rgba(255,255,255,.07);
  border-bottom:2px solid var(--line);align-items:center}
.top h1{font-size:14px;margin:0 6px 0 0;white-space:nowrap;flex:0 0 auto}
@media(max-width:520px){ .top h1{display:none} }
.tab{border:2px solid var(--line);background:transparent;color:var(--fg);border-radius:11px;
  padding:6px 13px;font-size:13.5px;white-space:nowrap;flex:0 0 auto}
.tab.on{background:var(--gold);color:#3a2b05;border-color:var(--gold);font-weight:700}
.top .r{margin-left:auto;font-size:12.5px;color:var(--dim);white-space:nowrap}
.wrap{flex:1 1 auto;overflow-y:auto;padding:11px 10px 26px}
h2{font-size:17px;margin:0 0 3px}.sub{color:var(--dim);font-size:12.5px;margin:0 0 11px}
.big{background:var(--gold);border:0;border-radius:15px;padding:13px;width:100%;
  font-size:17px;font-weight:700;color:#3a2b05;box-shadow:0 5px 0 #b8901c}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #b8901c}
.big:disabled{opacity:.4;box-shadow:none}

/* ---- 編成 ---- */
.slotrow{display:flex;gap:6px;margin-bottom:10px}
.slot{flex:1;background:var(--panel);border:3px dashed var(--line);border-radius:14px;
  min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4px 2px;position:relative}
.slot.on{border-style:solid;border-color:var(--sc)}
.slot img{width:100%;max-height:56px;object-fit:contain}
.slot .jp{font-size:10.5px;font-weight:700;text-align:center;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.slot .ro{font-size:9.5px;color:var(--dim)}
.slot .ps{position:absolute;top:3px;left:4px;font-size:9px;padding:0 5px;border-radius:6px;
  background:var(--rear);color:#12203a;font-weight:700}
.slot .ps.f{background:var(--front);color:#3a1f08}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.pk{background:var(--panel);border:3px solid var(--line);border-radius:13px;padding:4px 2px 5px;
  text-align:center;position:relative}
.pk.on{border-color:var(--gold);background:var(--panel2)}
.pk:active{transform:scale(.95)}
.pk img{width:100%;height:52px;object-fit:contain}
.pk .jp{font-size:10.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .rk{font-size:9px;color:var(--gold)}
.pk .ro{font-size:9px;color:var(--dim)}

/* ---- バトル ---- */
.arena{background:linear-gradient(#4a3a6b,#2f2447);border:3px solid var(--line);
  border-radius:16px;padding:9px;margin-bottom:9px;display:flex;gap:8px}
.side{flex:1;display:flex;flex-direction:column;gap:5px}
.side.foe{align-items:flex-end}
.unit{display:flex;align-items:center;gap:6px;width:100%}
.side.foe .unit{flex-direction:row-reverse}
.unit img{width:38px;height:38px;object-fit:contain;flex:0 0 auto}
.unit .bar{flex:1;min-width:0}
.unit .nm{font-size:10.5px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit .hp{height:7px;background:#241b38;border-radius:4px;overflow:hidden;margin-top:2px}
.unit .hp u{display:block;height:100%;background:var(--ok);transition:width .25s}
.unit.dead{opacity:.28;filter:grayscale(1)}
.unit.flash img{animation:fl .3s}
@keyframes fl{50%{filter:brightness(2.2)}}
.log{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 11px;
  font-size:12.5px;color:var(--dim);height:92px;overflow-y:auto;margin-bottom:9px}
.log b{color:var(--fg)}.log .s{color:var(--gold)}
.skills{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sk{background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:5px 2px;
  text-align:center;position:relative;overflow:hidden}
.sk .cd{position:absolute;inset:0;background:rgba(10,6,20,.72);display:flex;
  align-items:center;justify-content:center;font-size:17px;font-weight:700}
.sk.rdy{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,197,66,.25)}
.sk img{width:100%;height:38px;object-fit:contain}
.sk .w{font-size:10px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk:disabled{opacity:.4}

/* ---- トッピング ---- */
.tp{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:7px 0 4px}
.tslot{background:var(--panel);border:2px dashed var(--line);border-radius:11px;min-height:56px;
  padding:4px 2px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.tslot.on{border-style:solid;border-color:var(--tc)}
.tslot .w{font-size:10px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tslot .j{font-size:8.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tslot .e{font-size:9px;color:var(--dim)}
.setbox{background:var(--panel2);border:2px solid var(--gold);border-radius:12px;
  padding:7px 11px;font-size:12.5px;margin-bottom:9px}
.setbox b{color:var(--gold)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.iv{background:var(--panel);border:2px solid var(--line);border-radius:11px;padding:6px 5px;
  text-align:left;line-height:1.2}
.iv.mine{border-color:var(--gold)}
.iv .w{font-size:13px;font-weight:700}
.iv .j{font-size:10px;color:var(--dim)}
.iv .s{font-size:10px;color:var(--gold);margin-top:2px}
.hero{display:flex;gap:9px;align-items:center;background:var(--panel);border:3px solid var(--hc);
  border-radius:15px;padding:8px 11px;margin-bottom:8px}
.hero img{width:56px;height:56px;object-fit:contain}
.hero .nm{font-size:16px;font-weight:700}
.hero .ro{font-size:11.5px;color:var(--dim)}
.picker{display:flex;gap:5px;overflow-x:auto;margin-bottom:8px}
.picker img{width:44px;height:44px;object-fit:contain;border:3px solid transparent;
  border-radius:11px;flex:0 0 auto;padding:2px}
.picker img.on{border-color:var(--gold);background:var(--panel2)}
</style>
</head>
<body>

<div class="top">
  <h1>エティモン キングダム</h1>
  <button class="tab on" data-t="team">へんせい</button>
  <button class="tab" data-t="battle">バトル</button>
  <button class="tab" data-t="top">トッピング</button>
  <div class="r" id="rn"></div>
</div>
<div class="wrap">

<section id="team">
  <h2>5にん えらぶ</h2>
  <p class="sub">前列は まもり、後列は こうげき。役割は その一族の ことばの かたよりで きまります。</p>
  <div class="slotrow" id="slots"></div>
  <div class="pool" id="pool"></div>
</section>

<section id="battle" class="hide">
  <div class="arena"><div class="side me" id="sideMe"></div><div class="side foe" id="sideFoe"></div></div>
  <div class="log" id="log"></div>
  <div class="skills" id="skills"></div>
  <button class="big" id="go" style="margin-top:9px">たたかう</button>
</section>

<section id="top" class="hide">
  <div class="picker" id="picker"></div>
  <div class="hero" id="hero"></div>
  <div class="tp" id="tp"></div>
  <div class="setbox" id="setbox"></div>
  <h2 style="font-size:14px">もっている ことば</h2>
  <p class="sub">タップで つける。同じ一族の ことばを そろえると セット効果。</p>
  <div class="inv" id="inv"></div>
</section>

</div>

<script id="kdata" type="application/json">{"cookies":[],"toppings":[],"stats":[],"ety":{}}</script>
<script>
const A='../assets/', $=s=>document.querySelector(s);
let D=JSON.parse(document.getElementById('kdata').textContent);
let CK=D.cookies||[], TOP=D.toppings||[], ST=D.stats||[], ETY=D.ety||{};
const img=c=>A+'chara/'+c.img;
let party=[], gear={}, bag=[], stage=1, tsel=0, bt=null, timer=null;

/* ---------- へんせい ---------- */
function drawTeam(){
  $('#slots').innerHTML=[0,1,2,3,4].map(i=>{
    const c=party[i];
    if(!c) return `<div class="slot"><div class="ro">あき</div></div>`;
    return `<div class="slot on" style="--sc:${c.color}">
      <span class="ps ${c.pos==='前'?'f':''}">${c.pos}</span>
      <img src="${img(c)}" alt=""><div class="jp">${c.jp}</div>
      <div class="ro">${c.role}</div></div>`;
  }).join('');
  $('#pool').innerHTML=CK.map((c,i)=>`
    <button class="pk${party.includes(c)?' on':''}" data-i="${i}">
      <img src="${img(c)}" alt=""><div class="jp">${c.jp}</div>
      <div class="rk">${c.rank}</div><div class="ro">${c.role}${c.pos}</div></button>`).join('');
  $('#rn').textContent=`${party.length}/5 ・ ステージ ${stage}`;
}
$('#pool').addEventListener('click',ev=>{
  const b=ev.target.closest('.pk'); if(!b)return;
  const c=CK[+b.dataset.i], at=party.indexOf(c);
  if(at>=0) party.splice(at,1);
  else if(party.length<5) party.push(c);
  party.sort((a,b2)=>(a.pos==='前'?0:1)-(b2.pos==='前'?0:1));
  drawTeam(); drawTop();
});

/* ---------- トッピング ---------- */
const gearOf=c=>(gear[c.key]=gear[c.key]||[null,null,null,null,null]);
function bonus(c){
  const g=gearOf(c).filter(Boolean);
  const add=ST.map(()=>0);
  g.forEach(w=>w.st.forEach((v,i)=>add[i]+=v));
  const cnt={}; g.forEach(w=>cnt[w.root]=(cnt[w.root]||0)+1);
  const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  let set=0,setName='';
  if(best&&best[1]>=2){ set=best[1]>=5?0.5:best[1]>=3?0.25:0.1;
    setName=(ETY[best[0]]&&ETY[best[0]].jp)||best[0]; }
  return {add,set,setName,n:best?best[1]:0};
}
function drawTop(){
  if(!party.length){ $('#picker').innerHTML='';
    $('#hero').innerHTML='<div class="ro">さきに へんせいを してください</div>';
    $('#tp').innerHTML=''; $('#setbox').innerHTML=''; $('#inv').innerHTML=''; return; }
  tsel=Math.min(tsel,party.length-1);
  const c=party[tsel];
  $('#picker').innerHTML=party.map((p,i)=>
    `<img class="${i===tsel?'on':''}" data-i="${i}" src="${img(p)}" alt="">`).join('');
  $('#hero').style.setProperty('--hc',c.color);
  const b=bonus(c);
  $('#hero').innerHTML=`<img src="${img(c)}" alt="">
    <div><div class="nm">${c.jp}</div>
      <div class="ro">${c.rank} ・ ${c.role}${c.pos} ・ スキル <b>${c.skill.w}</b>(${c.skill.ja})</div></div>`;
  $('#tp').innerHTML=gearOf(c).map((w,i)=>w
    ? `<div class="tslot on" data-s="${i}" style="--tc:${(ETY[w.root]||{}).color||'#888'}">
        <div class="w">${w.w}</div><div class="j">${w.ja||''}</div>
        <div class="e">計${w.sum}</div></div>`
    : `<div class="tslot" data-s="${i}"><div class="e">あき</div></div>`).join('');
  $('#setbox').innerHTML = b.n>=2
    ? `<b>セット効果</b> ── <b>${b.setName}</b> の ことばが ${b.n}こ。
       すべての ちからが <b>+${Math.round(b.set*100)}%</b>`
    : `同じ一族の ことばを 2こ以上 そろえると セット効果(2こ+10% / 3こ+25% / 5こ+50%)`;
  $('#inv').innerHTML=bag.length? bag.map((w,i)=>`
    <button class="iv${w.root===c.key?' mine':''}" data-b="${i}">
      <div class="w">${w.w}</div><div class="j">${w.ja||''}</div>
      <div class="s">計${w.sum} ・ ${(ETY[w.root]||{}).jp||w.root}</div></button>`).join('')
    : '<div class="sub">バトルに かつと 手に入ります</div>';
}
$('#picker').addEventListener('click',ev=>{
  const im=ev.target.closest('img'); if(!im)return; tsel=+im.dataset.i; drawTop(); });
$('#tp').addEventListener('click',ev=>{
  const s=ev.target.closest('.tslot'); if(!s)return;
  const c=party[tsel], g=gearOf(c), i=+s.dataset.s;
  if(g[i]){ bag.push(g[i]); g[i]=null; drawTop(); }});
$('#inv').addEventListener('click',ev=>{
  const b=ev.target.closest('.iv'); if(!b)return;
  const c=party[tsel], g=gearOf(c), i=g.indexOf(null);
  if(i<0) return;
  g[i]=bag.splice(+b.dataset.b,1)[0]; drawTop(); });

/* ---------- バトル(自動進行 + スキルはタップ) ---------- */
function unit(c,foe){
  const b=bonus(c);
  const m=1+b.set;
  return {c,foe,
    hp:Math.round((c.base.hp+b.add[3]*3)*m), max:Math.round((c.base.hp+b.add[3]*3)*m),
    atk:Math.round((c.base.atk+b.add[0])*m), def:c.base.def+b.add[1],
    spd:c.base.spd+b.add[2], cd:0, cdMax:6+Math.round(c.skill.p/6)};
}
function startBattle(){
  if(party.length<1){ log('さきに へんせいを してください'); return; }
  const foes=[];
  for(let i=0;i<Math.min(5,3+Math.floor(stage/2));i++){
    const c=CK[Math.floor(Math.random()*CK.length)];
    const f=unit(c,true);
    const s=1+stage*0.16;
    f.hp=f.max=Math.round(c.base.hp*s); f.atk=Math.round(c.base.atk*s);
    foes.push(f);
  }
  bt={me:party.map(c=>unit(c,false)),foe:foes,t:0,over:false};
  $('#log').innerHTML=''; log(`ステージ ${stage} ── てきが ${foes.length}たい あらわれた`);
  $('#go').disabled=true;
  drawArena(); drawSkills();
  clearInterval(timer); timer=setInterval(tick,650);
}
function alive(a){ return a.filter(u=>u.hp>0); }
function tick(){
  if(!bt||bt.over)return;
  bt.t++;
  bt.me.forEach(u=>{ if(u.hp>0&&u.cd>0)u.cd--; });
  // 自動の通常こうげき。前列がいるあいだ 後列は狙われない
  const hit=(from,to,who)=>{
    const tgt=alive(to).sort((a,b)=>(a.c.pos==='前'?0:1)-(b.c.pos==='前'?0:1))[0];
    if(!tgt)return;
    const d=Math.max(2,Math.round(who.atk*(0.8+Math.random()*0.4))-Math.round(tgt.def*0.4));
    tgt.hp-=d;
    flash(tgt);
    if(tgt.hp<=0){ tgt.hp=0; log(`<b>${tgt.c.jp}</b> は たおれた`); }
  };
  alive(bt.me).forEach(u=>hit(bt.me,bt.foe,u));
  alive(bt.foe).forEach(u=>hit(bt.foe,bt.me,u));
  drawArena(); drawSkills();
  if(!alive(bt.foe).length) finish(true);
  else if(!alive(bt.me).length) finish(false);
}
function useSkill(i){
  const u=bt&&bt.me[i];
  if(!u||u.hp<=0||u.cd>0||bt.over)return;
  u.cd=u.cdMax;
  const sk=u.c.skill;
  const power=Math.round(u.atk*1.8+sk.p*1.4);
  const t=alive(bt.foe);
  if(!t.length)return;
  if(u.c.role==='かいふく'){
    alive(bt.me).forEach(m=>{ m.hp=Math.min(m.max,m.hp+Math.round(power*0.5)); });
    log(`<span class="s">${u.c.jp} の <b>${sk.w}</b>(${sk.ja})! みんなが かいふくした</span>`);
  }else if(u.c.role==='まほう'||u.c.role==='ちえ'){
    t.forEach(f=>{ f.hp-=Math.round(power*0.55); if(f.hp<0)f.hp=0; flash(f); });
    log(`<span class="s">${u.c.jp} の <b>${sk.w}</b>(${sk.ja})! ぜんたいに ダメージ</span>`);
  }else{
    const f=t[0]; f.hp-=power; if(f.hp<0)f.hp=0; flash(f);
    log(`<span class="s">${u.c.jp} の <b>${sk.w}</b>(${sk.ja})! ${f.c.jp}に ${power}</span>`);
  }
  if(sk.b) log(`<span style="opacity:.7">${sk.w} ── ${sk.b}</span>`);
  drawArena(); drawSkills();
  if(!alive(bt.foe).length) finish(true);
}
function finish(win){
  bt.over=true; clearInterval(timer); $('#go').disabled=false;
  if(win){
    stage++;
    const drops=[];
    for(let i=0;i<3;i++){
      const pool=TOP.filter(w=>w.rare<=Math.min(9,3+Math.floor(stage/2)));
      const w=pool[Math.floor(Math.random()*pool.length)];
      if(w){ bag.push(w); drops.push(w); }
    }
    log(`<b>かった!</b> トッピングを ${drops.length}こ 手に入れた: `
      + drops.map(w=>`<b>${w.w}</b>(${w.ja})`).join(' / '));
  }else{
    log(`<b>まけた…</b> トッピングを つけて やりなおそう`);
  }
  $('#rn').textContent=`${party.length}/5 ・ ステージ ${stage}`;
  drawTop();
}
function flash(u){ u._f=1; }
function drawArena(){
  const row=(u)=>`<div class="unit${u.hp<=0?' dead':''}${u._f?' flash':''}">
      <img src="${img(u.c)}" alt="">
      <div class="bar"><div class="nm">${u.c.jp}</div>
        <div class="hp"><u style="width:${Math.max(0,u.hp/u.max*100)}%;
          background:${u.hp/u.max>.4?'var(--ok)':'var(--ng)'}"></u></div></div></div>`;
  $('#sideMe').innerHTML=bt.me.map(row).join('');
  $('#sideFoe').innerHTML=bt.foe.map(row).join('');
  [...bt.me,...bt.foe].forEach(u=>u._f=0);
}
function drawSkills(){
  $('#skills').innerHTML=bt.me.map((u,i)=>`
    <button class="sk${u.cd===0&&u.hp>0?' rdy':''}" data-s="${i}" ${u.hp<=0?'disabled':''}>
      <img src="${img(u.c)}" alt=""><div class="w">${u.c.skill.w}</div>
      ${u.cd>0?`<div class="cd">${u.cd}</div>`:''}</button>`).join('');
}
$('#skills').addEventListener('click',ev=>{
  const b=ev.target.closest('.sk'); if(!b)return; useSkill(+b.dataset.s); });
$('#go').addEventListener('click',startBattle);
function log(h){ const d=document.createElement('div'); d.innerHTML=h;
  $('#log').prepend(d); }

/* ---------- タブ ---------- */
document.querySelector('.top').addEventListener('click',ev=>{
  const b=ev.target.closest('.tab'); if(!b)return;
  const t=b.dataset.t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  ['team','battle','top'].forEach(s=>$('#'+s).classList.toggle('hide',s!==t));
  if(t==='top')drawTop();
  if(t==='battle'&&!bt){ $('#log').innerHTML=''; log('「たたかう」で はじまります。バトルは 自動で すすみ、スキルだけ タップします。'); }
});

(async()=>{
  if(location.protocol!=='file:'){
    try{ const r=await fetch('data/pie/kingdom.json');
      if(r.ok){ const j=await r.json(); if(j.cookies&&j.cookies.length){
        CK=j.cookies;TOP=j.toppings;ST=j.stats;ETY=j.ety;} } }catch(e){}
  }
  if(!CK.length){ $('#team').innerHTML='<h2>データがありません</h2>'
    +'<p class="sub">python3 app/build_kingdom.py を実行してください。</p>'; return; }
  // はじめから3体は くばる
  party=[CK.find(c=>c.pos==='前'),CK.find(c=>c.role==='かいふく'),CK[0]].filter(Boolean);
  party=[...new Set(party)].slice(0,3);
  drawTeam();
})();
</script>
</body>
</html>
