<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ことば合成所 ― エティモリンゴ</title>
<style>
:root{--ink:#3a3040;--soft:#8d8299;--pane:#fffdf9;--line:#e7dcef;--accent:#e8759b;--accent2:#7a6bd8;
  --gold:#f0c14b;--ok:#5ec489;--ng:#d9748c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Hiragino Maru Gothic ProN","Meiryo",system-ui,sans-serif;color:var(--ink);
  background:
   radial-gradient(circle at 12% 10%,#ffe6f2 0 20%,transparent 21%),
   radial-gradient(circle at 88% 14%,#e6ecff 0 18%,transparent 19%),
   linear-gradient(180deg,#fdf6ff,#f2ecff 60%,#e9e4fb);
  display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;color:inherit}
/* ヘッダ */
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:linear-gradient(#fff,#f7effd);border-bottom:3px solid var(--line);box-shadow:0 2px 8px rgba(90,60,120,.08)}
header h1{font-size:17px;letter-spacing:.02em}
header h1 small{font-size:11px;color:var(--soft);margin-left:6px;font-weight:normal}
#gold{margin-left:auto;background:linear-gradient(#fff6d8,#ffe9ae);border:2.5px solid #e0b954;border-radius:14px;
  padding:5px 14px;font-weight:bold;font-size:15px;white-space:nowrap;box-shadow:0 3px 0 rgba(180,140,40,.25)}
.hbtn{background:#fff;border:2.5px solid var(--line);border-radius:12px;padding:6px 12px;font-size:12px;cursor:pointer;
  box-shadow:0 3px 0 rgba(120,90,150,.15)}
.hbtn:active{transform:translateY(2px);box-shadow:none}
/* 本体3ペイン */
#main{flex:1 1 auto;min-height:0;display:flex;gap:10px;padding:10px}
.pane{background:var(--pane);border:3px solid var(--line);border-radius:20px;display:flex;flex-direction:column;
  min-height:0;box-shadow:0 6px 18px rgba(90,60,120,.10)}
#leftPane{flex:0 0 300px}
#midPane{flex:1 1 auto;min-width:0}
#rightPane{flex:0 0 320px}
.pTtl{flex:0 0 auto;padding:8px 12px;font-size:13px;font-weight:bold;color:var(--accent2);
  border-bottom:2px dashed var(--line);display:flex;align-items:center;gap:8px}
.pTtl .cnt{margin-left:auto;font-size:11px;color:var(--soft);font-weight:normal}
/* エティモン一覧 */
#etyList{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;align-content:start}
.ety{background:#fff;border:3px solid var(--line);border-radius:16px;padding:5px 3px 6px;text-align:center;cursor:pointer;
  position:relative;transition:transform .12s,border-color .12s,box-shadow .12s}
.ety:hover{transform:translateY(-2px)}
.ety img{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.ety .nm{font-size:11px;font-weight:bold;line-height:1.15;margin-top:2px}
.ety .rt{font-size:9px;color:var(--soft);word-break:break-all}
.ety.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,117,155,.28),0 8px 14px rgba(232,117,155,.25);
  transform:translateY(-3px)}
.ety.dim{opacity:.25;pointer-events:none;filter:grayscale(1)}
.ety.can{border-color:var(--ok);box-shadow:0 0 0 3px rgba(94,196,137,.22)}
.ety .n{position:absolute;top:-6px;right:-4px;background:var(--accent);color:#fff;border-radius:50%;
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold}
/* 祭壇 */
#altar{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:8px 10px 4px;position:relative;overflow:hidden}
#circle{position:relative;width:min(56%,216px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
#circle::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#f7d9ff,#d9e6ff,#ffe8f2,#f7d9ff);opacity:.55;animation:spin 16s linear infinite}
#circle::after{content:"";position:absolute;inset:9%;border-radius:50%;border:3px dashed rgba(140,110,190,.45)}
@keyframes spin{to{transform:rotate(360deg)}}
#slots{position:relative;display:flex;gap:10px;align-items:center;justify-content:center;z-index:2;flex-wrap:wrap}
.slot{width:76px;height:90px;background:rgba(255,255,255,.92);border:3px solid var(--line);border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.slot.on{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(122,107,216,.25)}
.slot img{width:48px;height:48px;object-fit:contain}
.slot .nm{font-size:11px;font-weight:bold}
.slot .x{position:absolute;top:-8px;right:-8px;background:#fff;border:2px solid var(--line);border-radius:50%;
  width:24px;height:24px;line-height:20px;font-size:13px;cursor:pointer}
.slot.empty{border-style:dashed;color:var(--soft);font-size:12px}
.plus{font-size:26px;color:var(--accent2);font-weight:bold}
#resultLine{margin-top:6px;text-align:center;font-size:12.5px;min-height:20px}
#resultLine b{color:var(--accent2)}
.badNG{color:var(--ng);font-weight:bold}
/* つくれる ことば 一覧 */
#listBar{flex:0 0 auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  padding:6px 10px;border-top:2px dashed var(--line);font-size:11px;color:var(--soft)}
.tgl{background:#fff;border:2px solid var(--line);border-radius:10px;padding:3px 9px;font-size:11px;cursor:pointer;color:var(--soft)}
.tgl.on{border-color:var(--accent);background:#fff2f7;color:var(--ink);font-weight:bold}
#wordList{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 10px 12px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:7px;align-content:start}
.wrow{display:flex;align-items:center;gap:8px;background:#fff;border:2.5px solid var(--line);border-radius:14px;
  padding:6px 8px;cursor:pointer;transition:transform .1s,border-color .1s,box-shadow .1s}
.wrow:hover{transform:translateY(-2px);border-color:var(--accent)}
.wrow .wl{flex:1 1 auto;min-width:0}
.wrow .ww{font-size:15px;font-weight:bold;display:block;line-height:1.15;word-break:break-all}
.wrow .wj{font-size:11px;color:var(--soft);display:block;line-height:1.25}
.wrow .wm{font-size:9.5px;color:#b3a8be}
.wrow .wc{flex:0 0 auto;background:linear-gradient(#fff6d8,#ffe9ae);border:2px solid #e0b954;border-radius:11px;
  padding:5px 9px;font-size:12.5px;font-weight:bold;white-space:nowrap;box-shadow:0 2px 0 rgba(180,140,40,.22)}
.wrow:active{transform:translateY(1px)}
.wrow.poor{opacity:.5;cursor:not-allowed}
.wrow.poor:hover{transform:none;border-color:var(--line)}
.wrow.poor .wc{background:#efecf2;border-color:#cfc7d6;color:#a096ad;box-shadow:none}
.wrow.got{border-color:var(--ok);background:#f5fffa}
.wrow.hl{box-shadow:0 0 0 3px rgba(232,117,155,.4)}
.wrow .gotm{color:var(--ok);font-weight:bold;font-size:9.5px;margin-left:4px}
#emptyMsg{grid-column:1/-1;color:var(--soft);font-size:12px;padding:16px;text-align:center;line-height:1.7}
/* 逆引き */
#revSearch{flex:0 0 auto;padding:8px}
#revSearch input{width:100%;border:2.5px solid var(--line);border-radius:12px;padding:7px 10px;font-size:13px;font-family:inherit}
#revList{flex:1;overflow-y:auto;padding:0 8px 10px}
.rv{background:#fff;border:2px solid var(--line);border-radius:13px;padding:7px 9px;margin-bottom:7px;cursor:pointer}
.rv:hover{border-color:var(--accent)}
.rv .w{font-size:15px;font-weight:bold}
.rv .ja{font-size:11px;color:var(--soft)}
.rv .need{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:4px}
.rv .need span{font-size:10px;background:#f3edfb;border:1px solid var(--line);border-radius:7px;padding:1px 6px}
.rv .need span.have{background:#eafaf0;border-color:var(--ok);color:#2f7a52}
.rv .need span.miss{background:#fdeef2;border-color:var(--ng);color:#a4415c}
.rv .need img{width:18px;height:18px;object-fit:contain;vertical-align:-4px;margin-right:2px}
/* 演出 */
#fx{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;background:rgba(40,26,52,.62)}
#fx.on{display:flex}
#fxIn{position:relative;width:min(92vw,360px);text-align:center}
#fxRing{position:absolute;left:50%;top:50%;width:320px;height:320px;margin:-160px 0 0 -160px;border-radius:50%;
  background:conic-gradient(from 0deg,#fff0,#ffd9f0,#d9e6ff,#fff0);animation:spin 1.1s linear infinite;opacity:.85}
#fxChars{position:relative;display:flex;justify-content:center;gap:10px;height:120px;align-items:center}
#fxChars img{width:88px;height:88px;object-fit:contain;animation:merge .9s ease-in forwards}
@keyframes merge{60%{transform:translateX(var(--mx,0)) scale(1.05)}100%{transform:translateX(0) scale(.2);opacity:0}}
#fxCard{position:relative;margin-top:6px}
#fxCap{color:#fff;font-size:14px;margin-top:10px;text-shadow:0 2px 6px #0008}
/* 図鑑/環境 */
#modal{position:fixed;inset:0;background:rgba(40,26,52,.6);display:none;align-items:center;justify-content:center;z-index:70;padding:14px}
#modal.on{display:flex}
#modalIn{background:var(--pane);border:4px solid var(--line);border-radius:22px;max-width:640px;width:100%;
  max-height:86%;overflow-y:auto;padding:14px}
#modalIn h2{font-size:16px;margin-bottom:8px;color:var(--accent2)}
.envRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.envBtn{background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 12px;font-size:12px;cursor:pointer}
.envBtn.on{border-color:var(--accent);background:#fff2f7}
.dexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
@media(max-width:900px){
  #main{flex-direction:column;overflow-y:auto}
  #leftPane,#rightPane{flex:0 0 auto;max-height:38vh}
  #midPane{min-height:70vh}
  #wordList{grid-template-columns:1fr}
}
.wordCard{position:relative; width:352px; aspect-ratio:63/88; border-radius:16px; text-align:left;
  background:linear-gradient(160deg, color-mix(in srgb,var(--cc,#e8875a) 30%,#f5e9d2), #efe0c4 55%, color-mix(in srgb,var(--cc,#e8875a) 18%,#e9dabb));
  border:3px solid #2e2536; box-shadow:0 14px 30px rgba(30,20,40,.35), inset 0 0 0 2px #fff8;
  padding:12px 13px 11px; overflow:hidden; display:flex; flex-direction:column}
.wordCard::before{content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background:repeating-linear-gradient(115deg, transparent 0 7px, rgba(255,255,255,.16) 7px 8px)}
.wordCard .wcHead{position:relative; display:flex; align-items:center; gap:8px; background:linear-gradient(#fffef8,#f1e6cf);
  border:2px solid #4a3c50; border-radius:9px; padding:5px 10px; box-shadow:0 2px 0 rgba(46,37,54,.25)}
.wordCard .wcEn{font-size:26px; font-weight:900; color:#33283c; letter-spacing:.01em; line-height:1.05; flex:1; min-width:0}
.wordCard .wcJp{font-size:12.5px; font-weight:800; color:#8d8093; display:block; margin-top:1px}
.wordCard .wcClan{width:44px; height:44px; flex:0 0 auto; border-radius:50%; background:#fff;
  border:2.5px solid var(--cc,#e8875a); display:flex; align-items:center; justify-content:center; overflow:hidden}
.wordCard .wcClan img{width:86%; height:86%; object-fit:contain}
.wordCard .wcArt{position:relative; flex:1; min-height:0; margin-top:9px; border:2.5px solid #4a3c50; border-radius:8px;
  background:radial-gradient(circle at 50% 42%, #fffdf2 0 34%, color-mix(in srgb,var(--cc,#e8875a) 32%,#fff) 100%);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  box-shadow:inset 0 0 18px rgba(46,37,54,.15)}
.wordCard .wcArt::before{content:""; position:absolute; inset:-40%; opacity:.35; pointer-events:none;
  background:repeating-conic-gradient(from 0deg, transparent 0 14deg, #ffffff88 14deg 17deg)}
.wordCard .wcArt img{position:relative; max-width:78%; max-height:82%; object-fit:contain; filter:drop-shadow(0 6px 8px rgba(46,37,54,.3))}
.wordCard .wcArt .fallback{font-size:110px; position:relative}
.wordCard .wcRoot{margin-top:7px; font-family:"Shippori Mincho",serif; font-style:italic; font-weight:800; font-size:16px;
  color:#fff; background:linear-gradient(90deg, var(--cc,#e8875a), color-mix(in srgb,var(--cc,#e8875a) 55%,#241f26));
  border:2px solid #4a3c50; border-radius:6px; padding:2px 10px; letter-spacing:.06em}
.wordCard .wcBox{margin-top:7px; background:linear-gradient(#fffdf4,#f6ecd8); border:2px solid #4a3c50; border-radius:8px;
  padding:7px 10px 6px; min-height:74px}
.wordCard .wcEff{font-size:17px; font-weight:900; color:#7a3f2c}
.wordCard .wcDesc{font-size:16px; font-weight:700; color:#4e4254; line-height:1.42; margin-top:3px}
.wordCard .wcStarsRow{display:flex; justify-content:center; align-items:center; gap:2.5px; margin-top:7px;
  color:#c99f3a; font-size:18px; letter-spacing:2px}
.wordCard .wcStarsRow img{width:23px; height:23px; object-fit:contain; filter:drop-shadow(0 1px 0 #fff8)}
.wordCard .wcStarsRow img.off{filter:grayscale(1); opacity:.2}
.wordCard .wcStarsRow .off{color:#00000022}
.wordCard.mini .wcStarsRow{margin-top:4px; gap:1px; font-size:10px}
.wordCard.mini .wcStarsRow img{width:12px; height:12px}
.wordCard .wcFoot{display:flex; align-items:center; justify-content:flex-end; margin-top:5px; padding:0 2px}
.wordCard .wcDef{font-size:19px;font-weight:900;color:#5c4f63;display:block;margin-top:1px}
.wordCard.mini .wcDef{font-size:11px}
.wordCard .wcNo{font-size:10px; font-weight:900; color:#7d7186; letter-spacing:.08em}
.wordCard.rare{border-color:#8a6b1f;
  box-shadow:0 14px 30px rgba(30,20,40,.35), inset 0 0 0 2px #f6d879, 0 0 22px rgba(246,216,121,.35)}
.wordCard.rare .wcHead{background:linear-gradient(#fffbe2,#f3e1a6)}
.wordCard.mini{width:100%; padding:7px 8px 6px; border-width:2px; border-radius:12px}
.wordCard.mini .wcHead{padding:3px 7px; border-radius:6px; gap:5px}
.wordCard.mini .wcEn{font-size:15px}
.wordCard.mini .wcJp{font-size:9.5px}
.wordCard.mini .wcClan{width:26px; height:26px; border-width:2px}
.wordCard.mini .wcArt{margin-top:5px; border-radius:6px}
.wordCard.mini .wcRoot{font-size:9px; margin-top:4px; padding:1px 7px}
.wordCard.mini .wcBox{display:none}
.wordCard.mini .wcFoot{margin-top:4px}
.wordCard.mini .wcNo{font-size:8px}
.wordCard{margin:0 auto; animation:cardIn .65s cubic-bezier(.2,1.3,.4,1) both}
.wordCard::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.65) 46%, rgba(255,255,255,.15) 54%, transparent 66%);
  transform:translateX(-130%); animation:cardSheen 1s ease-out .55s forwards}
@keyframes cardIn{0%{transform:translateY(36px) rotateY(70deg) scale(.7); opacity:0}100%{transform:translateY(0) rotateY(0) scale(1); opacity:1}}
@keyframes cardSheen{to{transform:translateX(130%)}}</style>
</head>
<body>
<header>
  <h1>⚗ ことば合成所<small>エティモン(古代概念)から 英単語を つくる</small></h1>
  <button class="hbtn" id="btnDex">📖 ずかん</button>
  <button class="hbtn" id="btnEnv">⚙ 環境</button>
  <a class="hbtn" href="etymon-explorer.html" style="text-decoration:none">🔍 探索へ</a>
  <div id="gold">🍎 <span id="goldN">0</span></div>
</header>
<div id="main">
  <section class="pane" id="leftPane">
    <div class="pTtl">🐾 もっている エティモン<span class="cnt" id="etyCnt"></span></div>
    <div id="etyList"></div>
  </section>
  <section class="pane" id="midPane">
    <div class="pTtl">✨ 合成の祭壇<span class="cnt">エティモンを えらぶ → ことばを えらぶ</span></div>
    <div id="altar">
      <div id="circle"><div id="slots"></div></div>
      <div id="resultLine"></div>
    </div>
    <div id="listBar">
      <span id="listCnt"></span>
      <span style="margin-left:auto"></span>
      <button class="tgl" id="tSort">やさしい順</button>
      <button class="tgl" id="tNew">未発見だけ</button>
      <button class="tgl" id="tAfford">買えるものだけ</button>
    </div>
    <div id="wordList"></div>
  </section>
  <section class="pane" id="rightPane">
    <div class="pTtl">🔎 逆引き<span class="cnt">この単語は 何と何?</span></div>
    <div id="revSearch"><input id="revQ" type="search" placeholder="単語や意味でさがす(例: preview / 会議)"></div>
    <div id="revList"></div>
  </section>
</div>
<div id="fx"><div id="fxIn"><div id="fxRing"></div><div id="fxChars"></div><div id="fxCard"></div><div id="fxCap"></div></div></div>
<div id="modal"><div id="modalIn"></div></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const A='../assets/';
/* ===== データ ===== */
let ROOTS={},WORDS=[],SOLO={},PAIR={},ART=[];
/* ===== 環境(テスト用プリセット) ===== */
const ENV={
  gold:[['潤沢',5000],['ふつう',800],['少なめ',200],['極少',60]],
  ety :[['ぜんぶ',99],['12体',12],['5体',5],['3体',3]],
};
let S={gold:800,etyN:12,own:[],dex:{},envG:1,envE:1};
try{Object.assign(S,JSON.parse(localStorage.getItem('etymon-fusion-v1')||'{}'));}catch(e){}
const save=()=>localStorage.setItem('etymon-fusion-v1',JSON.stringify(S));
/* ===== ねだん =====
 * ことばは 1語ずつ 直接えらんで つくる。ねだんは レア度から決まる。
 * (レア度1=10 … レア度2288=468) */
const COST=r=>10+Math.round((r||0)/5);
let picked=[], sortDesc=false, onlyNew=false, onlyAfford=false, hl='';
/* ===== 読み込み ===== */
async function load(){
  const [rs,ws]=await Promise.all([
    fetch('data/pie/roots.json').then(r=>r.json()),
    fetch('data/pie/words.json').then(r=>r.json()),
  ]);
  for(const r of rs)ROOTS[r.key]=r;
  WORDS=ws.filter(w=>w.r!=null&&w.ja);
  ART=rs.filter(r=>r.img).sort((a,b)=>b.dict-a.dict);
  for(const w of WORDS){
    const p=w.p;
    if(p.length===1){(SOLO[p[0]]=SOLO[p[0]]||[]).push(w);}
    else if(p.length===2&&p[0]!==p[1]){
      const k=[p[0],p[1]].sort().join('|');
      (PAIR[k]=PAIR[k]||[]).push(w);
    }
  }
  if(!S.own.length)applyEnv();
  renderAll();
}
function applyEnv(){
  const n=ENV.ety[S.envE][1];
  S.own=ART.slice(0,Math.min(n,ART.length)).map(r=>r.key);
  S.gold=ENV.gold[S.envG][1];
  save();
}
/* ===== 合成のプール ===== */
function allFor(keys){
  if(keys.length===1)return (SOLO[keys[0]]||[]).slice().sort((a,b)=>a.r-b.r);
  if(keys.length===2)return (PAIR[[keys[0],keys[1]].sort().join('|')]||[]).slice().sort((a,b)=>a.r-b.r);
  return [];
}
function anyPool(keys){   // その組み合わせで ことばが 実在するか
  if(keys.length===1)return (SOLO[keys[0]]||[]).length;
  if(keys.length===2)return (PAIR[[keys[0],keys[1]].sort().join('|')]||[]).length;
  return 0;
}
/* ===== 描画 ===== */
function renderAll(){renderEty();renderSlots();renderList();renderRev();$('#goldN').textContent=S.gold;}
function renderEty(){
  const list=S.own.map(k=>ROOTS[k]).filter(Boolean);
  $('#etyCnt').textContent=`${list.length}体`;
  $('#etyList').innerHTML=list.map(r=>{
    const sel=picked.includes(r.key);
    let cls='ety'+(sel?' sel':'');
    if(picked.length===1&&!sel){
      cls+= anyPool([picked[0],r.key])? ' can':' dim';
    }
    if(picked.length>=2&&!sel)cls+=' dim';
    return `<div class="${cls}" data-k="${esc(r.key)}">
      ${sel?`<span class="n">${picked.indexOf(r.key)+1}</span>`:''}
      <img src="${A}${esc(r.img)}" onerror="this.style.visibility='hidden'">
      <div class="nm">${esc(r.ja||r.key)}</div>
      <div class="rt">*${esc(r.pie||r.key)}</div></div>`;
  }).join('');
  document.querySelectorAll('.ety').forEach(el=>el.onclick=()=>toggle(el.dataset.k));
}
function toggle(k){
  const i=picked.indexOf(k);
  if(i>=0)picked.splice(i,1);
  else{
    if(picked.length>=2)return;
    if(picked.length===1&&!anyPool([picked[0],k]))return;
    picked.push(k);
  }
  hl='';
  renderAll();
}
function renderSlots(){
  const box=$('#slots');
  const cell=k=>{
    const r=ROOTS[k];
    return `<div class="slot on"><span class="x" data-x="${esc(k)}">✕</span>
      <img src="${A}${esc(r.img)}" onerror="this.style.visibility='hidden'">
      <div class="nm">${esc(r.ja||k)}</div></div>`;
  };
  let h='';
  h+= picked[0]?cell(picked[0]):`<div class="slot empty">えらぶ</div>`;
  h+= `<div class="plus">＋</div>`;
  h+= picked[1]?cell(picked[1]):`<div class="slot empty">(1体でも可)</div>`;
  box.innerHTML=h;
  box.querySelectorAll('.x').forEach(el=>el.onclick=e=>{e.stopPropagation();toggle(el.dataset.x);});
  // 結果予告
  const line=$('#resultLine');
  if(!picked.length){line.innerHTML='<span style="color:var(--soft)">エティモンを えらんでください</span>';return;}
  const all=anyPool(picked);
  if(!all){
    const [a,b]=picked.map(k=>ROOTS[k].ja||k);
    line.innerHTML=`<span class="badNG">「${esc(a)}」×「${esc(b)}」の ことばは 存在しません</span>`;
    return;
  }
  const list=allFor(picked);
  const fresh=list.filter(w=>!S.dex[w.w]).length;
  const buy=list.filter(w=>COST(w.r)<=S.gold).length;
  line.innerHTML=`つくれる ことば <b>${all}</b>語 ／ いま買える <b>${buy}</b>語`
    +(fresh?`　未発見 <b>${fresh}</b>`:'　<span style="color:var(--ok)">ぜんぶ 発見ずみ</span>');
}
/* ===== つくれる ことば 一覧(これが本体。ここから直接えらぶ) ===== */
function renderList(){
  const box=$('#wordList'), bar=$('#listCnt');
  $('#tSort').textContent=sortDesc?'むずかしい順':'やさしい順';
  $('#tNew').classList.toggle('on',onlyNew);
  $('#tAfford').classList.toggle('on',onlyAfford);
  if(!picked.length){
    bar.textContent='';
    box.innerHTML='<div id="emptyMsg">左から エティモン(古代概念)を えらぶと、<br>そこから つくれる 英単語が ここに ぜんぶ 出ます。<br>1体だけでも、2体 くみあわせても つくれます。</div>';
    return;
  }
  let list=allFor(picked);
  if(!list.length){
    bar.textContent='';
    box.innerHTML='<div id="emptyMsg">この 組み合わせから 生まれた ことばは ありません。<br>ほかの エティモンを ためしてください。</div>';
    return;
  }
  const total=list.length;
  if(onlyNew)list=list.filter(w=>!S.dex[w.w]);
  if(onlyAfford)list=list.filter(w=>COST(w.r)<=S.gold);
  if(sortDesc)list=list.slice().reverse();
  bar.innerHTML=`<b style="color:var(--ink)">${list.length}</b> / ${total}語 を表示`;
  if(!list.length){
    box.innerHTML='<div id="emptyMsg">しぼりこみに 合う ことばが ありません。<br>上の しぼりこみを 外してください。</div>';
    return;
  }
  box.innerHTML=list.map(w=>{
    const c=COST(w.r), poor=S.gold<c, got=S.dex[w.w];
    const via=w.g==='G'?'ゲルマン':w.g==='Gr'?'ギリシャ':w.g==='L'?'ロマンス':'';
    return `<div class="wrow${poor?' poor':''}${got?' got':''}${hl===w.w?' hl':''}" data-w="${esc(w.w)}">
      <div class="wl">
        <span class="ww">${esc(w.w)}${got?'<span class="gotm">✓発見ずみ</span>':''}</span>
        <span class="wj">${esc(w.ja)}</span>
        <span class="wm">レア度 ${w.r}${via?' ・ '+via:''}${w.pos?' ・ '+esc(w.pos):''}</span>
      </div>
      <div class="wc">🍎${c}</div></div>`;
  }).join('');
  box.querySelectorAll('.wrow').forEach(el=>el.onclick=()=>make(el.dataset.w));
}
$('#tSort').onclick=()=>{sortDesc=!sortDesc;renderList();};
$('#tNew').onclick=()=>{onlyNew=!onlyNew;renderList();};
$('#tAfford').onclick=()=>{onlyAfford=!onlyAfford;renderList();};
/* ===== 合成(えらんだ 1語を つくる) ===== */
function make(key){
  const w=allFor(picked).find(x=>x.w===key);
  if(!w)return;
  const c=COST(w.r);
  if(S.gold<c)return;
  S.gold-=c;
  $('#goldN').textContent=S.gold;
  const first=!S.dex[w.w];
  S.dex[w.w]=1;hl=w.w;save();
  showFusion(w,first);
}
function showFusion(w,first){
  $('#fxChars').innerHTML=picked.map((k,i)=>{
    const r=ROOTS[k];
    return `<img src="${A}${esc(r.img)}" style="--mx:${i===0?'26px':'-26px'}" onerror="this.style.visibility='hidden'">`;
  }).join('');
  $('#fxCard').innerHTML='';
  $('#fxCap').textContent='';
  $('#fx').classList.add('on');
  setTimeout(()=>{
    $('#fxCard').innerHTML=cardHTML(w);
    $('#fxCap').innerHTML=(first?'✨ はじめての ことば!<br>':'')+
      picked.map(k=>`「${esc(ROOTS[k].ja||k)}」`).join(' ＋ ')+' から うまれた';
    say(w.w);
  },900);
}
$('#fx').onclick=()=>{$('#fx').classList.remove('on');renderAll();};
function say(t){
  if(!('speechSynthesis'in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.95;speechSynthesis.speak(u);
}
/* ===== カード(IP360意匠) ===== */
function cardHTML(w,mini){
  const k=w.p[0],r=ROOTS[k]||{};
  const col=r.color||'#c9a6e8';
  const rr=Math.max(1,Math.min(10,Math.round((w.r||400)/160)+1));
  const stars=Array.from({length:10},(_,i)=>
    `<img src="${A}ui/word_et_star.png" class="${i<rr?'':'off'}" alt="">`).join('');
  const rootLine=w.p.map(x=>`*${esc((ROOTS[x]||{}).pie||x)}「${esc((ROOTS[x]||{}).ja||'')}」`).join(' ＋ ');
  return `<div class="wordCard${mini?' mini':''}${rr>=8?' rare':''}" style="--cc:${col}">
    <div class="wcHead"><div style="flex:1;min-width:0">
      <span class="wcEn">${esc(w.w)}</span><span class="wcDef">${esc(w.ja)}</span></div>
      ${r.img?`<div class="wcClan"><img src="${A}${esc(r.img)}" onerror="this.remove()"></div>`:''}
    </div>
    <div class="wcArt"><div class="fallback">${w.g==='G'?'🌿':w.g==='Gr'?'🏛':'🌹'}</div></div>
    <div class="wcRoot">${rootLine}</div>
    <div class="wcStarsRow">${stars}</div>
    <div class="wcBox"><div class="wcDesc">レア度 ${w.r} ／ ${esc(w.pos||'')} ／ ${w.g==='G'?'ゲルマン':w.g==='L'?'ロマンス':w.g==='Gr'?'ギリシャ':''}</div></div>
    <div class="wcFoot"><div class="wcNo">ETYMO-RINGO</div></div></div>`;
}
/* ===== 逆引き ===== */
let revT=null;
$('#revQ').oninput=()=>{clearTimeout(revT);revT=setTimeout(renderRev,180);};
function renderRev(){
  const q=$('#revQ').value.trim().toLowerCase();
  let list;
  if(q){
    list=WORDS.filter(w=>w.w.toLowerCase().includes(q)||w.ja.includes(q)).slice(0,60);
  }else if(picked.length){
    list=(picked.length===1?(SOLO[picked[0]]||[]):(PAIR[[picked[0],picked[1]].sort().join('|')]||[]))
      .slice().sort((a,b)=>a.r-b.r).slice(0,60);
  }else{
    list=WORDS.filter(w=>w.p.length===2&&w.r<300).slice(0,40);
  }
  $('#revList').innerHTML=list.map(w=>{
    const need=w.p.map(k=>{
      const r=ROOTS[k]||{};
      const have=S.own.includes(k);
      return `<span class="${have?'have':'miss'}">${r.img?`<img src="${A}${esc(r.img)}">`:''}${esc(r.ja||k)}</span>`;
    }).join('<span style="font-size:10px">＋</span>');
    const ok=w.p.every(k=>S.own.includes(k))&&w.p.length<=2;
    return `<div class="rv" data-w="${esc(w.w)}">
      <div class="w">${esc(w.w)} <span style="font-size:10px;color:var(--soft)">レア${w.r}</span>
        ${S.dex[w.w]?'<span style="color:var(--ok);font-size:10px">✓発見</span>':''}</div>
      <div class="ja">${esc(w.ja)}</div>
      <div class="need">${need}${ok?'<span style="border:none;background:none;color:var(--ok)">→ つくれる</span>':''}</div></div>`;
  }).join('')||'<div style="color:var(--soft);font-size:12px;padding:10px">みつかりません</div>';
  document.querySelectorAll('.rv').forEach(el=>el.onclick=()=>{
    const w=WORDS.find(x=>x.w===el.dataset.w);
    if(!w||w.p.length>2)return;
    if(!w.p.every(k=>S.own.includes(k)))return;
    picked=w.p.slice(0,2);
    hl=w.w;onlyNew=false;onlyAfford=false;
    renderAll();
    const el2=$('#wordList').querySelector('.wrow.hl');
    if(el2)el2.scrollIntoView({block:'center'});
  });
}
/* ===== 図鑑・環境 ===== */
$('#btnDex').onclick=()=>{
  const got=Object.keys(S.dex);
  $('#modalIn').innerHTML=`<h2>📖 ずかん ${got.length}語</h2>
    <div class="dexGrid">${got.map(k=>{
      const w=WORDS.find(x=>x.w===k);return w?cardHTML(w,true):'';}).join('')||'<div style="color:var(--soft)">まだ ありません</div>'}</div>
    <div style="text-align:center;margin-top:12px"><button class="hbtn" onclick="closeModal()">とじる</button></div>`;
  $('#modal').classList.add('on');
};
$('#btnEnv').onclick=()=>{
  $('#modalIn').innerHTML=`<h2>⚙ 環境をためす</h2>
    <div style="font-size:12px;color:var(--soft);margin-bottom:8px">資金と 手持ちを 変えて、遊びごたえを 確かめる(進行はリセットされます)</div>
    <div>資金</div><div class="envRow">${ENV.gold.map(([n,v],i)=>
      `<div class="envBtn${S.envG===i?' on':''}" data-g="${i}">${n}<br><b>🍎${v}</b></div>`).join('')}</div>
    <div>もっている エティモン</div><div class="envRow">${ENV.ety.map(([n,v],i)=>
      `<div class="envBtn${S.envE===i?' on':''}" data-e="${i}">${n}</div>`).join('')}</div>
    <div style="text-align:center;margin-top:6px">
      <button class="hbtn" id="envApply" style="border-color:var(--accent)">この環境で はじめる</button>
      <button class="hbtn" onclick="closeModal()">とじる</button></div>`;
  $('#modal').classList.add('on');
  document.querySelectorAll('[data-g]').forEach(el=>el.onclick=()=>{S.envG=+el.dataset.g;$('#btnEnv').onclick();});
  document.querySelectorAll('[data-e]').forEach(el=>el.onclick=()=>{S.envE=+el.dataset.e;$('#btnEnv').onclick();});
  $('#envApply').onclick=()=>{picked=[];hl='';onlyNew=onlyAfford=false;S.dex={};applyEnv();closeModal();renderAll();};
};
window.closeModal=()=>$('#modal').classList.remove('on');
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal();};
load();
</script>
</body>
</html>
