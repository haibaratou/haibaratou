<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>エティモリンゴ タグ判定 試作</title>
<style>
:root{
  --bg:#1a1526; --panel:#241d35; --panel2:#2e2542; --line:#42375e;
  --fg:#f2ecff; --dim:#a99cc4; --acc:#f2a444; --ok:#7cba62; --ng:#e8687f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.7}
.wrap{max-width:900px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:.5px;text-wrap:balance}
h1 small{display:block;font-size:11.5px;font-weight:400;letter-spacing:2.5px;
  color:var(--acc);margin-bottom:5px}
.lead{color:var(--dim);font-size:13.5px;margin:0 0 8px;max-width:62ch}
.how{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--dim);
  margin:0 0 20px;padding-top:10px;border-top:1px solid var(--line)}
.how b{color:var(--fg);font-weight:700}
.how span{white-space:nowrap}

.book{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin-bottom:16px}
.book .bkh{font-size:12.5px;color:var(--dim);margin-bottom:8px}
.book .bkn{color:var(--acc);font-variant-numeric:tabular-nums;margin-left:6px}
.bkl{display:flex;flex-wrap:wrap;gap:4px}
.bk{font-size:11.5px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);
  background:var(--panel2);color:#6d6088}
.bk.on{background:var(--acc);color:#241d35;border-color:var(--acc);font-weight:700}
.bkm{margin-top:10px;font-size:13px;color:var(--fg)}

.modes{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.modes button{padding:8px 16px;text-align:left;line-height:1.35}
.modes button em{display:block;font-style:normal;font-size:11px;color:var(--dim)}
.modes button.on{background:var(--acc);color:#241d35;border-color:var(--acc);font-weight:700}
.modes button.on em{color:#5c4620}

.scene{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;margin-bottom:14px}
.scene .title{font-size:22px;font-weight:700;margin-bottom:2px}
.scene .desc{color:var(--dim);font-size:13.5px;margin-bottom:12px}
.want{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.want .lbl{font-size:12px;color:var(--dim);margin-right:2px}
.pool{font-size:12px;color:var(--dim);margin-top:10px;
  border-top:1px dashed var(--line);padding-top:8px}
.pool b{color:var(--acc);font-weight:700}

.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;
  border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.tag.main{border-color:var(--acc);color:var(--acc)}
.tag.sub{border-color:#5f6f8f;color:#9fb4d6}
.tag.hit{background:var(--acc);color:#241d35;border-color:var(--acc);font-weight:700}
.tag.hit2{background:#3d5170;color:#dbe7fb;border-color:#5f6f8f}

.hand{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 14px}
button:focus-visible,.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){ .card{transition:none} }
.card{width:calc(20% - 8px);min-width:132px;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;padding:9px 10px;cursor:pointer;
  transition:.12s;position:relative}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card.sel{border-color:var(--acc);background:#3a2d1e;transform:translateY(-4px)}
.card .w{font-size:16px;font-weight:700;letter-spacing:.2px;word-break:break-word}
.card .ja{font-size:12px;color:var(--dim);margin-bottom:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .ks{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.card .ks span{font-size:11px;padding:1px 6px;border-radius:5px;
  background:var(--panel2);border:1px solid var(--line)}
.card .ks span.on{background:var(--acc);color:#241d35;border-color:var(--acc);font-weight:700}
.card .p{font-size:10.5px;color:#8d7fae;font-family:ui-monospace,monospace}

.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:0 0 18px}
button{font:inherit;padding:9px 18px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--acc)}
button.go{background:var(--acc);color:#241d35;border-color:var(--acc);font-weight:700}
button:disabled{opacity:.35;cursor:default}
.hint{font-size:12px;color:var(--dim)}

.log{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 16px 12px}
.log:empty{display:none}
.ent{border-bottom:1px dashed var(--line);padding:12px 0}
.ent:last-child{border-bottom:0}
.ent .head{font-weight:700;margin-bottom:4px}
.ent.ok .head{color:var(--ok)} .ent.ng .head{color:var(--ng)}
.ent.sp .head{color:var(--acc)}
.ent .body{font-size:13.5px}
.ent .meta{font-size:12px;color:var(--dim);margin-top:5px}
.ent .meta code{background:var(--panel2);padding:1px 5px;border-radius:4px}

.note{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px 18px;margin-top:18px;font-size:13px;color:var(--dim)}
.note b{color:var(--fg)}

.ex{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px}
.exh{font-size:12px;color:var(--dim);margin-bottom:6px}
.exr{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;
  font-size:13px;padding:3px 0}
.exk{flex:0 0 62px;font-size:11px;text-align:center;padding:1px 0;border-radius:5px;
  background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.exk.sp{border-color:var(--acc);color:var(--acc)}
.exw b{font-weight:700} .exw i{font-style:normal;color:var(--dim);font-size:12px;margin-left:4px}
.exw u{text-decoration:none;color:#8d7fae;font-size:10.5px;
  font-family:ui-monospace,monospace;margin-left:5px}
.exy{font-size:11.5px;color:#8d7fae;margin-left:auto}
@media(max-width:700px){ .card{width:calc(50% - 5px)} .exy{margin-left:0;width:100%} }
</style>
</head>
<body>
<div class="wrap">
<h1><small>ETYMORINGO ─ PROTOTYPE</small>ことばの働きで、場面を解く</h1>
<p class="lead">
  場面が「してほしいこと」を示すので、手札の英単語をぶつけてください。組み合わせると結果が変わります。
  判定のしかたが違う2つを並べてあります ── <b>タグ判定</b>は全カードから、単語の働きだけを見る。
  <b>頭一族イベント</b>は kaput-(頭)から生まれた68語だけを手札にして、素直に当てはまるものを探します。
</p>
<div class="how">
  <span><b>1.</b> 場面が何を欲しがっているか読む</span>
  <span><b>2.</b> 手札を1〜3枚えらぶ</span>
  <span><b>3.</b> 出す</span>
  <span style="color:#8d7fae">外しても手札は減りません</span>
</div>

<div class="modes">
  <button data-m="tag" class="on">タグ判定<em id="mTag">全カードから</em></button>
  <button data-m="kaput">頭一族イベント<em>kaput- の68語だけで</em></button>
</div>

<div id="sceneBox"></div>

<div class="hand" id="hand"></div>

<div class="bar">
  <button class="go" id="play" disabled>出す</button>
  <button id="draw">引き直す</button>
  <button id="next">別の場面へ</button>
  <span class="hint">手札から<b>1〜3枚</b>選んでから</span>
</div>

<div id="book"></div>

<div class="log" id="log"></div>

<div class="note" id="note"></div>
</div>

const DATA = JSON.parse(document.getElementById('cards').textContent);
let CARDS = DATA.cards || [];
const KAPUT = (DATA.clans && DATA.clans['kaput-']) || [];
let MODE = 'tag';
const $ = s => document.querySelector(s);
let scene = null, hand = [], sel = new Set(), deck = [], turn = 0;
let kev = null;

/* 手札は「よく使う語」寄りに引く。レア語ばかり来ると遊べないので */
function pickPool(){ return CARDS.filter(c => c.r <= 1200); }

function drawCard(pool){
  for(let i=0;i<40;i++){
    const c = pool[Math.floor(Math.random()*pool.length)];
    if(c && !hand.some(h=>h.w===c.w && h.p===c.p)) return c;
  }
  return pool[0];
}
function refill(){ const p=pickPool(); while(hand.length<5) hand.push(drawCard(p)); }

/* 場面に1枚も噛まない手札だと空振りしかできない。最低2枚は主タグに
   当たる札を混ぜてから配る(実際のゲームでも配り手が保証する部分) */
function ensurePlayable(s, min=2){
  const want=[...s.want];
  const hits=()=>hand.filter(c=>want.some(t=>c.k.includes(t))).length;
  const pool=CARDS.filter(c=>c.r<=1200 && want.some(t=>c.k.includes(t)));
  if(!pool.length) return;
  let guard=0;
  while(hits()<min && guard++<20){
    const c=pool[Math.floor(Math.random()*pool.length)];
    if(hand.some(h=>h.w===c.w&&h.p===c.p)) continue;
    // 場面に噛まない札のどれかと入れ替える
    const i=hand.findIndex(h=>!want.some(t=>h.k.includes(t)));
    if(i<0) break;
    hand[i]=c;
  }
}
function nextScene(){
  const others = SCENES.filter(s => !scene || s.id !== scene.id);
  scene = others[Math.floor(Math.random()*others.length)];
  refill(); ensurePlayable(scene);
  sel.clear(); render();
}

/* この場面に答えられるカードが全データに何枚 / 何語根あるか */
function poolStat(s){
  const want = [...s.want];
  const hit = CARDS.filter(c => want.some(t => c.k.includes(t)));
  const roots = new Set(hit.map(c=>c.p).filter(Boolean));
  return {n:hit.length, r:roots.size};
}

function tagChip(t, cls){ return `<span class="tag ${cls}">${t} ${TAGNAME[t]||''}</span>`; }

/* 条件タグを満たす実在カードの組を、データから探して見せる。
   「そんな都合のいい単語があるのか」を毎回データで示すため */
const CONCRETE = new Set(['食物','道具','武器','衣','生物','体','自然','場所','建物']);
function findCombo(cond, maxRare){
  const need=[...cond], out=[];
  for(const t of need){
    if(out.some(c=>c.k.includes(t))) continue;
    // 絵になる語(種類が具体物)を先に。無ければ何でも
    let pool=CARDS.filter(c=>c.k.includes(t)&&c.r<=maxRare&&CONCRETE.has(c.s)&&!out.includes(c));
    if(!pool.length) pool=CARDS.filter(c=>c.k.includes(t)&&c.r<=maxRare&&!out.includes(c));
    if(!pool.length) return null;
    pool.sort((a,b)=>a.r-b.r);
    out.push(pool[Math.floor(Math.random()*Math.min(12,pool.length))]);
  }
  return out.length<=3 ? out : null;
}
function examplesHTML(s){
  const rows=[];
  const one=findCombo([...s.want][0], 900);
  if(one) rows.push(['解決', one, `主タグ ${[...s.want][0]}${TAGNAME[[...s.want][0]]} に当たる`]);
  (s.combo||[]).slice(0,2).forEach(c=>{ const f=findCombo(c.cond,1500);
    if(f) rows.push(['コンボ', f, [...c.cond].map(t=>t+TAGNAME[t]).join(' + ')]); });
  (s.alt||[]).slice(0,1).forEach(a=>{ const f=findCombo(a.cond,1500);
    if(f) rows.push(['別の結末', f, [...a.cond].map(t=>t+TAGNAME[t]).join(' + ')]); });
  if(!rows.length) return '';
  return `<div class="ex"><div class="exh">データから拾った実例 ─ この手札が来れば通る</div>`
    + rows.map(([k,cs,why])=>`<div class="exr"><span class="exk ${k==='解決'?'':'sp'}">${k}</span>
        <span class="exw">${cs.map(c=>`<b>${c.w}</b><i>${c.ja}</i><u>${c.p?'*'+c.p:'—'}</u>`).join('＋')}</span>
        <span class="exy">${why}</span></div>`).join('') + `</div>`;
}

function render(){
  const st = poolStat(scene);
  $('#sceneBox').innerHTML = `
    <div class="scene">
      <div class="title">${scene.title}</div>
      <div class="desc">${scene.desc}</div>
      <div class="want"><span class="lbl">ほしい働き</span>
        ${[...scene.want].map(t=>tagChip(t,'main')).join('')}</div>
      <div class="want" style="margin-top:6px"><span class="lbl">効かなくはない</span>
        ${[...scene.sub].map(t=>tagChip(t,'sub')).join('')}</div>
      <div class="pool">この場面に答えられる単語は全データに <b>${st.n.toLocaleString()}語</b>
        ／ その血統は <b>${st.r}語根</b>にまたがる。
        <span style="opacity:.75">──「特定の語根を持っているか」を問うていないので、手札が偏っても詰まない。</span></div>
      ${examplesHTML(scene)}
    </div>`;

  const want = [...scene.want], sub = [...scene.sub];
  $('#hand').innerHTML = hand.map((c,i)=>{
    const ks = [...c.k].map(t=>{
      const on = want.includes(t) ? ' on' : '';
      return `<span class="${on.trim()}">${t}${TAGNAME[t]?' '+TAGNAME[t]:''}</span>`;
    }).join('');
    return `<div class="card${sel.has(i)?' sel':''}" data-i="${i}">
      <div class="w">${c.w}</div><div class="ja">${c.ja||'&nbsp;'}</div>
      <div class="ks">${ks}</div>
      <div class="p">${c.p?'*'+c.p:'—'}</div></div>`;
  }).join('');
  $('#play').disabled = sel.size===0 || sel.size>3;
  $('#note').innerHTML = `
    <b>いま何が起きているか。</b>
    場面は<b>働きタグ</b>だけを見ています。カード下の <code>*語根</code> は判定に一切使わず、
    2枚以上そろったときの<b>共鳴ボーナス</b>にしか効きません。<br>
    だから「その語根を持っていないと解けない」という詰まり方をしない。
    かわりに、同じ場面を <b>salt で解く人</b>と <b>hammer で解く人</b>が出て、結果テキストが変わります。<br>
    カード総数 <b>${CARDS.length.toLocaleString()}枚</b>(働きタグの付いた語)。手札はレア度1200位までから引いています。`;
}

/* ---------- 頭一族モード ----------
   判定はタグではなく語そのもの。上から 別の結末 → コンボ → ユニーク解 → 解決 の順に見る */
/* 判定は素直に。場面の要求に、その語のいまの意味が当てはまれば通る。
   語源は解いたあとに出す ── 解法の理屈にはしない。
   キャベツで腹をふくらませ、資本で通行料を払い、降水で雨を降らせたあとに
   「ぜんぶ同じ *kaput-(頭)だった」と分かる、という順番。 */
const found = new Set();   // 使った語 = 図鑑に載った語

function kDeal(){
  const pick=(pool,n)=>{ const a=[...pool], o=[];
    while(o.length<n && a.length) o.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);
    return o; };
  // 答えを1枚は必ず入れる。持っていない札で詰まるのは面白くない
  const yes=KAPUT.filter(c=>kev.ans.includes(c.w));
  const no =KAPUT.filter(c=>!kev.ans.includes(c.w));
  hand = pick(yes,1).concat(pick(no,5));
  hand.sort(()=>Math.random()-.5);
}
function kNext(){
  const others = KEVENTS.filter(e=>!kev||e.id!==kev.id);
  kev = others[Math.floor(Math.random()*others.length)];
  kDeal(); sel.clear(); kRender();
}

/* 図鑑 ── 使った語が点灯していく。散らばりが見えるのがこのゲームの眼目 */
function bookHTML(){
  const rows = KAPUT.map(c=>`<span class="bk${found.has(c.w)?' on':''}" title="${c.ja}">${c.w}</span>`).join('');
  return `<div class="book"><div class="bkh">頭一族 <b>*kaput-</b> ずかん
      <b class="bkn">${found.size} / ${KAPUT.length}</b></div>
    <div class="bkl">${rows}</div>
    ${found.size>=3?`<div class="bkm">いま点いている ${found.size}語は、ぜんぶ同じ祖先の子です。</div>`:''}</div>`;
}
function kRender(){
  $('#sceneBox').innerHTML = `
    <div class="scene">
      <div class="title">${kev.title}</div>
      <div class="desc">${kev.desc}</div>
      <div class="pool">手札の6枚は、ぜんぶ <b>*kaput-</b>「頭」から生まれた英単語です。
        この場面に効くものを出してください。<span style="opacity:.75">語源は、通ったあとに出ます。</span></div>
    </div>`;
  $('#hand').innerHTML = hand.map((c,i)=>`
    <div class="card${sel.has(i)?' sel':''}" data-i="${i}">
      <div class="w">${c.w}</div><div class="ja">${c.ja||'&nbsp;'}</div>
      <div class="p">*kaput-</div></div>`).join('');
  $('#play').disabled = sel.size===0 || sel.size>3;
  $('#book').innerHTML = bookHTML();
  $('#note').innerHTML = `<b>語源は解法ではありません。</b>
    腹が減ったら <code>cabbage</code>、金がいるなら <code>capital</code>、
    雨がほしいなら <code>precipitation</code> ── 出すのはいまの意味で当てるだけです。
    語源は通ったあとに出ます。<br>
    面白いのは一つ一つではなく<b>散らばりのほう</b>で、キャベツも資本も降水も牛も船長も、
    ぜんぶ <code>*kaput-</code>「頭」の子です。ずかんが埋まるほどその奇妙さが見えます。`;
}
function kPlay(){
  const idx=[...sel].sort((a,b)=>a-b), used=idx.map(i=>hand[i]);
  const hit=used.filter(c=>kev.ans.includes(c.w));
  const names=(hit.length?hit:used).map(c=>`<b>${c.w}</b>(${c.ja})`).join('と');

  let cls='ng', head='効かなかった', extra=[];
  let body=`${names}では、この場面はどうにもならない。`;
  if(hit.length){ cls='ok'; head='解決'; body=kev.okT.replace('{W}',names);
    hit.forEach(c=>{ found.add(c.w);
      extra.push(c.b ? `<b>${c.w}</b> ─ ${c.b}`
                     : `<b>${c.w}</b> ─ ラテン語 caput「頭」から。`); });
  }
  turn++;
  const ent=document.createElement('div'); ent.className='ent '+cls;
  ent.innerHTML=`<div class="head">${turn}. ${kev.title} ─ ${head}</div>
    <div class="body">${body}</div>${extra.length?`<div class="meta">${extra.join('<br>')}</div>`:''}`;
  $('#log').prepend(ent);
  sel.clear();
  if(cls==='ok') kNext(); else kRender();
}

function setMode(m){
  MODE=m; sel.clear(); turn=0; $('#log').innerHTML='';
  document.querySelectorAll('.modes button').forEach(b=>
    b.classList.toggle('on', b.dataset.m===m));
  if(m==='kaput'){ kev=null; kNext(); }
  else { $('#book').innerHTML=''; hand=[]; scene=null; refill(); nextScene(); }
}
document.querySelector('.modes').addEventListener('click', ev=>{
  const b=ev.target.closest('button'); if(b) setMode(b.dataset.m);
});

$('#hand').addEventListener('click', ev=>{
  const el = ev.target.closest('.card'); if(!el) return;
  const i = +el.dataset.i;
  if(sel.has(i)) sel.delete(i); else if(sel.size<3) sel.add(i);
  MODE==='kaput' ? kRender() : render();
});
$('#draw').addEventListener('click', ()=>{
  if(MODE==='kaput'){ kDeal(); sel.clear(); kRender(); return; }
  hand=[]; sel.clear(); refill(); ensurePlayable(scene); render(); });
$('#next').addEventListener('click', ()=> MODE==='kaput' ? kNext() : nextScene());
$('#play').addEventListener('click', ()=> MODE==='kaput' ? kPlay() : play());

function play(){
  const idx=[...sel].sort((a,b)=>a-b), used=idx.map(i=>hand[i]);
  const tags = new Set(); used.forEach(c=>[...c.k].forEach(t=>tags.add(t)));
  const want=[...scene.want].filter(t=>tags.has(t));
  const sub =[...scene.sub ].filter(t=>tags.has(t));
  const names = used.map(c=>`<b>${c.w}</b>(${c.ja})`).join('と');
  const has = s => [...s].every(t=>tags.has(t));

  let cls='ng', head='通じなかった', body=scene.ng.replace('{W}',names), extra=[];
  const alt = (scene.alt||[]).find(a=>has(a.cond));
  const cmb = (scene.combo||[]).find(c=>has(c.cond));
  if(alt){ cls='sp'; head='別の結末'; body=alt.t;
    extra.push(`条件 <code>${[...alt.cond].map(t=>t+TAGNAME[t]).join(' + ')}</code> を満たした`); }
  else if(cmb){ cls='sp'; head='コンボ成立'; body=cmb.t;
    extra.push(`条件 <code>${[...cmb.cond].map(t=>t+TAGNAME[t]).join(' + ')}</code> を満たした`); }
  else if(want.length){ cls='ok'; head='解決'; body=scene.ok.replace('{W}',names); }
  else if(sub.length){ cls='ng'; head='手応えだけ';
    body=`${names}は場面に触れたが、決め手にはならなかった。`; }

  // 語根共鳴:出した札の血統が2枚以上そろった
  const ps={}; used.forEach(c=>{ if(c.p) ps[c.p]=(ps[c.p]||0)+1; });
  const res=Object.entries(ps).filter(([,n])=>n>1);
  if(res.length) extra.push(`<b style="color:var(--acc)">語根共鳴</b> ─ ${res.map(([p,n])=>`*${p} が${n}枚`).join('、')}。同じ祖先の言葉が響きあった`);

  extra.push(`出したタグ <code>${[...tags].map(t=>t+TAGNAME[t]).join(' ')}</code>`
    + (want.length?` ／ 主タグ命中 <code>${want.join('')}</code>`:'')
    + (sub.length?` ／ 副 <code>${sub.join('')}</code>`:''));

  // 報酬:解けたら、使った札と同じ血統のカードが1枚手に入る
  let reward=null;
  if(cls!=='ng'){
    const src=used.filter(c=>c.p);
    if(src.length){
      const p=src[Math.floor(Math.random()*src.length)].p;
      const kin=CARDS.filter(c=>c.p===p && !hand.some(h=>h.w===c.w));
      if(kin.length){ reward=kin[Math.floor(Math.random()*kin.length)];
        extra.push(`報酬 ─ 同じ血統 <code>*${reward.p}</code> から <b>${reward.w}</b>(${reward.ja})が手札に加わった`); }
    }
  }

  turn++;
  const ent=document.createElement('div');
  ent.className='ent '+cls;
  ent.innerHTML=`<div class="head">${turn}. ${scene.title} ─ ${head}</div>
    <div class="body">${body}</div><div class="meta">${extra.join('<br>')}</div>`;
  $('#log').prepend(ent);

  // 通ったときだけ手札を消費する。外したら試し直せるように残す
  if(cls!=='ng'){
    idx.reverse().forEach(i=>hand.splice(i,1));
    if(reward) hand.push(reward);
  }
  sel.clear(); refill();
  if(cls!=='ng') nextScene(); else render();
}

/* http 経由なら実ファイルを読む。file:// なら埋め込みで動く */
(async ()=>{
  if(location.protocol!=='file:'){
    try{
      const r=await fetch('data/pie/game_cards.json');
      if(r.ok){ const j=await r.json(); if(j.cards&&j.cards.length) CARDS=j.cards; }
    }catch(e){}
  }
  if(!CARDS.length){ $('#sceneBox').innerHTML='<div class="scene">カードデータが空です。'
    +'<code>python3 app/build_game_cards.py</code> を実行してください。</div>'; return; }
  document.getElementById('mTag').textContent='全'+CARDS.length.toLocaleString()+'枚から';
  refill(); nextScene();
})();
</script>
</body>
