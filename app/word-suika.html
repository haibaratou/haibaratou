<html lang="ja">

<title>ワードスイカ</title>

</style>
</head>

function drawBody(b){
  ctx.save();ctx.translate(b.x,b.y);ctx.beginPath();ctx.arc(3,6,b.r,0,Math.PI*2);ctx.fillStyle="rgba(41,35,45,.22)";ctx.fill();ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fillStyle=b.color;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle="#29232d";ctx.stroke();
  if(b.word&&b.img&&b.img.complete&&b.img.naturalWidth){ctx.save();ctx.beginPath();ctx.arc(0,0,b.r-6,0,Math.PI*2);ctx.clip();ctx.fillStyle="#fff";ctx.fillRect(-b.r,-b.r,b.r*2,b.r*2);const k=Math.min((b.r*1.72)/b.img.naturalWidth,(b.r*1.72)/b.img.naturalHeight),w=b.img.naturalWidth*k,h=b.img.naturalHeight*k;ctx.drawImage(b.img,-w/2,-h/2,w,h);ctx.restore();ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineJoin="round";ctx.font=`1000 ${Math.max(11,b.r*.3)}px system-ui`;ctx.lineWidth=4;ctx.strokeStyle="rgba(255,255,255,.96)";ctx.strokeText(b.label,0,b.r*.53);ctx.fillStyle="#29232d";ctx.fillText(b.label,0,b.r*.53);ctx.font=`800 ${Math.max(7,b.r*.17)}px system-ui`;const ja=b.ja.length>11?b.ja.slice(0,10)+"…":b.ja;ctx.lineWidth=3;ctx.strokeText(ja,0,b.r*.78);ctx.fillStyle="#594e62";ctx.fillText(ja,0,b.r*.78)}else{ctx.fillStyle="#29232d";ctx.font=`1000 ${b.r*1.05}px system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(b.label,0,1)}ctx.restore();
}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle="rgba(255,255,255,.2)";for(let y=120;y<H;y+=62){ctx.fillRect(0,y,W,1)}ctx.setLineDash([8,8]);ctx.strokeStyle=dangerFrames?"#e94f68":"rgba(41,35,45,.28)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,88);ctx.lineTo(W,88);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle="rgba(41,35,45,.35)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(aimX,0);ctx.lineTo(aimX,Math.min(H,205));ctx.stroke();ctx.globalAlpha=.38;ctx.beginPath();ctx.arc(aimX,61,55,0,Math.PI*2);ctx.fillStyle=colors[(queue[0]?.charCodeAt(0)||0)%colors.length];ctx.fill();ctx.globalAlpha=1;
  bodies.forEach(drawBody);particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1}
function loop(now){const dt=now-last;last=now;if(!over)physics(dt);draw();requestAnimationFrame(loop)}
function gameOver(){if(over)return;over=true;$("#resultTitle").textContent="いっぱい！";$("#result").textContent=`${wordCount}語を完成　${score}点`;$("#over").classList.add("on")}
function gameClear(word){if(over)return;over=true;clearTimeout(finishTimer);finishTimer=setTimeout(()=>{$("#resultTitle").textContent=word.length>=7?"スペシャルクリア！":"6文字クリア！";$("#result").textContent=`${word.toUpperCase()}（${wordInfo.get(word)?.ja||"和訳なし"}） ／ ${score}点`;$("#over").classList.add("on")},650)}
function reset(){clearTimeout(finishTimer);bodies=[];particles=[];queue=[];score=0;wordCount=0;dangerFrames=0;over=false;canDrop=true;scoreEl.textContent=0;wordsEl.textContent=0;$("#over").classList.remove("on");logEl.textContent="6文字以上の英単語を作ればクリア";refillQueue();renderQueue()}
canvas.addEventListener("pointermove",e=>{const r=canvas.getBoundingClientRect();aimX=Math.max(57,Math.min(W-57,e.clientX-r.left))});canvas.addEventListener("pointerdown",e=>{e.preventDefault();const r=canvas.getBoundingClientRect();dropAt(e.clientX-r.left)});$("#reset").onclick=reset;$("#again").onclick=reset;
reset();requestAnimationFrame(t=>{last=t;loop(t)});
</script>
</body>
</html>
