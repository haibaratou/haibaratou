<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>エティモリンゴ ─ ことばの デッキ</title>
<style>
:root{
  --bg:#171226; --bg2:#241a3c; --panel:#2b2145; --panel2:#392c5b; --line:#54427a;
  --fg:#f4efff; --dim:#a898c6; --gold:#f5c542; --ok:#7cd98a; --ng:#ef7f8f;
  --join:#5aa7e8; --core:#f2a444; --word:#b98ce8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(130% 90% at 50% 0%,var(--bg2),var(--bg));color:var(--fg);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;user-select:none;display:flex;flex-direction:column}
.hide{display:none!important}
button{font:inherit;cursor:pointer}

.hud{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:8px 11px;
  background:rgba(255,255,255,.06);border-bottom:2px solid var(--line);font-size:13px}
.hud .hp{color:var(--ng);font-weight:700}
.hud .en{color:var(--gold);font-weight:700;font-size:17px}
.hud .st{margin-left:auto;color:var(--dim)}

.field{flex:1 1 auto;overflow-y:auto;padding:11px 10px 8px;
  display:flex;flex-direction:column}
.foes{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.foe{background:var(--panel);border:3px solid var(--line);border-radius:15px;padding:8px 10px;
  min-width:118px;text-align:center;position:relative}
.foe.dead{opacity:.25;filter:grayscale(1)}
.foe.hit{animation:hit .3s}
@keyframes hit{50%{transform:translateX(-7px);filter:brightness(1.9)}}
.foe .ic{font-size:34px;line-height:1}
.foe .nm{font-size:12.5px;font-weight:700}
.foe .bar{height:8px;background:#1a1330;border-radius:4px;margin-top:4px;overflow:hidden}
.foe .bar u{display:block;height:100%;background:var(--ng);transition:width .3s}
.foe .n{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.foe .intent{position:absolute;top:-11px;left:50%;transform:translateX(-50%);
  background:var(--bg);border:2px solid var(--ng);border-radius:999px;padding:0 9px;
  font-size:11.5px;white-space:nowrap;color:var(--ng)}
.me{text-align:center;margin-bottom:8px}
.me .blk{display:inline-block;background:var(--join);color:#0d2740;border-radius:999px;
  padding:2px 12px;font-size:12.5px;font-weight:700;margin-right:6px}
.me .buf{display:inline-block;background:var(--gold);color:#33280a;border-radius:999px;
  padding:2px 11px;font-size:12px;font-weight:700;margin:0 3px}
.log{background:var(--panel);border:2px solid var(--line);border-radius:11px;padding:7px 11px;
  font-size:12.5px;color:var(--dim);flex:1 1 auto;min-height:90px;
  overflow-y:auto;line-height:1.65}
.log b{color:var(--fg)} .log .g{color:var(--gold)}

/* ---- 手札 ---- */
.hand{flex:0 0 auto;background:#1d1633;border-top:2px solid var(--line);padding:8px 8px 10px;
  display:flex;gap:7px;overflow-x:auto;align-items:stretch;min-height:132px}
.card{flex:0 0 108px;background:var(--panel);border:3px solid var(--cc);border-radius:14px;
  padding:7px 6px;text-align:center;position:relative;display:flex;flex-direction:column}
.card:active{transform:translateY(3px)}
.card.no{opacity:.4}
.card .cost{position:absolute;top:-8px;left:-6px;width:24px;height:24px;border-radius:50%;
  background:var(--gold);color:#33280a;font-size:13px;font-weight:700;line-height:24px}
.card .w{font-size:14px;font-weight:700;line-height:1.15;word-break:break-word}
.card .ja{font-size:10px;color:var(--dim);margin-bottom:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .fx{margin-top:auto;font-size:10.5px;line-height:1.35}
.card .fx div{background:var(--panel2);border-radius:5px;padding:1px 4px;margin-top:2px}
.card .tag{position:absolute;top:3px;right:4px;font-size:8.5px;color:var(--dim)}
.bar2{flex:0 0 auto;display:flex;gap:7px;padding:0 9px 9px;background:#1d1633}
.bar2 button{flex:1;border:2px solid var(--line);background:var(--panel);color:var(--fg);
  border-radius:11px;padding:10px;font-size:14px}
.bar2 .end{background:var(--gold);color:#33280a;border-color:var(--gold);font-weight:700}

/* ---- 画面 ---- */
#over{position:fixed;inset:0;background:rgba(10,6,20,.92);z-index:50;display:none;
  overflow-y:auto;padding:16px 13px 26px}
#over.on{display:block}
.sheet{max-width:520px;margin:0 auto}
.sheet h2{font-size:20px;margin:0 0 4px;text-align:center}
.sheet p.s{color:var(--dim);font-size:12.5px;text-align:center;margin:0 0 14px;line-height:1.7}
.go{width:100%;background:var(--gold);border:0;border-radius:14px;padding:13px;
  font-size:16px;font-weight:700;color:#33280a;box-shadow:0 4px 0 #b8901c;margin-top:12px}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #b8901c}
.go.gh{background:transparent;color:var(--fg);border:2px solid var(--line);box-shadow:none}
.go:disabled{opacity:.35;box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px}
.tk{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 4px;
  text-align:center;position:relative}
.tk.join{border-left:5px solid var(--join)}
.tk.core{border-left:5px solid var(--core)}
.tk.sel{border-color:var(--gold);background:var(--panel2)}
.tk img{width:100%;height:40px;object-fit:contain}
.tk .ic{font-size:24px;line-height:1.5}
.tk .jp{font-size:11.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .fx{font-size:9.5px;color:var(--dim);line-height:1.3}
.born{background:var(--panel2);border:3px solid var(--gold);border-radius:16px;padding:14px;
  text-align:center;margin:12px 0}
.born .w{font-size:30px;font-weight:700}
.born .ja{font-size:15px;color:var(--gold)}
.born .b{font-size:12px;color:var(--dim);margin-top:7px;line-height:1.6;text-align:left}
.born .fx{margin-top:8px;font-size:13px}
.born .fx span{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:2px 9px;margin:0 3px}
</style>
</head>
<body>

<div class="hud">
  <span class="hp" id="hp">♥ 40/40</span>
  <span class="en" id="en">⚡3</span>
  <span id="deckinfo" style="color:var(--dim)"></span>
  <span class="st" id="st"></span>
</div>

<div class="field">
  <div class="foes" id="foes"></div>
  <div class="me" id="meLine"></div>
  <div class="log" id="log"></div>
</div>

<div class="hand" id="hand"></div>
<div class="bar2">
  <button id="deckBtn">デッキ</button>
  <button class="end" id="endBtn">ターン終了</button>
</div>

<div id="over"><div class="sheet" id="sheet"></div></div>

<script id="ddata" type="application/json">{"tokens":{},"cards":{},"mons":[],"pairs":{},"fxname":{}}</script>
<script>
const A='../assets/', $=s=>document.querySelector(s);
let D=JSON.parse(document.getElementById('ddata').textContent);
let TK=D.tokens||{}, CD=D.cards||{}, MON=D.mons||[], PAIR=D.pairs||{}, FXN=D.fxname||{};

/* 開始デッキ = 原始カード。語根トークンそのもの。英単語ですらない */
const START=['bhau-','ed-','kers-2','(s)teg-','gwei-','men-1'];
let deck=[], hand=[], disc=[], bag=[], mons=[], stage=1;
let hp=40,maxhp=40,en=0,block=0,buf={},foes=[],turn=0,busy=false;

const key=(a,b)=>[a,b].sort().join('|');
const tkImg=t=>t.img?`<img src="${A+'chara/'+t.img}" alt="">`
  :`<div class="ic">${t.kind==='つなぎ手'?'🔗':'✦'}</div>`;
const fxTxt=fx=>fx.map(f=>`${FXN[f.k]||f.k}${f.v>1||['atk','def','heal','boost','push'].includes(f.k)?f.v:''}`);

/* カード = トークン or 英単語 */
function mkTok(k){ const t=TK[k]; return {id:'t:'+k,type:'tok',k,w:t.jp,ja:'*'+k,
  cost:t.cost,fx:t.fx,note:t.note||'',kind:t.kind,img:t.img}; }
function mkWord(w){ const c=CD[w]; return {id:'w:'+w,type:'word',w,ja:c.ja,cost:c.cost,
  fx:c.fx,rare:c.rare,b:c.b,from:c.from}; }
const CC=c=>c.type==='word'?'var(--word)':(c.kind==='つなぎ手'?'var(--join)':'var(--core)');

function log(h){ const d=document.createElement('div'); d.innerHTML=h;
  $('#log').prepend(d); }
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

/* ---------- 戦闘 ---------- */
const FOETYPE=[
  {ic:'🐌',nm:'ティースネイル',hp:14,atk:5},
  {ic:'👤',nm:'かげ',hp:18,atk:7},
  {ic:'🕷️',nm:'ことばぐも',hp:12,atk:4},
  {ic:'🗿',nm:'だんまり石',hp:26,atk:6},
];
function startBattle(){
  const n=Math.min(3,1+Math.floor(stage/2));
  foes=Array.from({length:n},()=>{
    const t=FOETYPE[Math.floor(Math.random()*FOETYPE.length)];
    const s=1+stage*0.22;
    return {...t,hp:Math.round(t.hp*s),max:Math.round(t.hp*s),atk:Math.round(t.atk*s),
            weak:0,intent:0};
  });
  disc=[]; deck=shuffle([...bag]); hand=[]; block=0; buf={}; turn=0;
  $('#log').innerHTML=''; log(`ステージ ${stage} ── てきが ${n}たい。`);
  newTurn();
}
function newTurn(){
  turn++; en=3; block=0;
  draw(5);
  foes.forEach(f=>{ if(f.hp>0) f.intent=Math.max(1,Math.round(f.atk*(0.8+Math.random()*0.5))); });
  render();
}
function draw(n){
  for(let i=0;i<n;i++){
    if(!deck.length){ deck=shuffle(disc); disc=[]; }
    if(!deck.length) break;
    hand.push(deck.pop());
  }
}
function render(){
  $('#hp').textContent=`♥ ${hp}/${maxhp}`;
  $('#en').textContent=`⚡${en}`;
  $('#st').textContent=`ステージ ${stage} ・ ターン ${turn}`;
  $('#deckinfo').textContent=`山${deck.length} 捨${disc.length}`;
  $('#foes').innerHTML=foes.map((f,i)=>`
    <div class="foe${f.hp<=0?' dead':''}" data-f="${i}">
      ${f.hp>0?`<div class="intent">🗡 ${f.intent}</div>`:''}
      <div class="ic">${f.ic}</div><div class="nm">${f.nm}</div>
      <div class="bar"><u style="width:${Math.max(0,f.hp/f.max*100)}%"></u></div>
      <div class="n">${Math.max(0,f.hp)}/${f.max}${f.weak?` ・弱${f.weak}`:''}</div></div>`).join('');
  const bs=Object.entries(buf).filter(([,v])=>v>0)
    .map(([k,v])=>`<span class="buf">${FXN[k]||k}${v>1?v:''}</span>`).join('');
  $('#meLine').innerHTML=(block?`<span class="blk">🛡 ${block}</span>`:'')+bs;
  $('#hand').innerHTML=hand.map((c,i)=>`
    <div class="card${c.cost>en?' no':''}" data-c="${i}" style="--cc:${CC(c)}">
      <div class="cost">${c.cost}</div>
      <div class="tag">${c.type==='word'?'★'+c.rare:c.kind}</div>
      <div class="w">${c.w}</div><div class="ja">${c.ja}</div>
      <div class="fx">${fxTxt(c.fx).map(t=>`<div>${t}</div>`).join('')}
        ${c.note?`<div style="color:var(--dim)">${c.note}</div>`:''}</div></div>`).join('');
}
$('#hand').addEventListener('click',ev=>{
  const el=ev.target.closest('.card'); if(!el||busy)return;
  play(+el.dataset.c);
});
function alive(){ return foes.filter(f=>f.hp>0); }
function play(i){
  const c=hand[i]; if(!c||c.cost>en)return;
  en-=c.cost; hand.splice(i,1); disc.push(c);
  const times=buf.thrice?3:buf.twice?2:1;
  const boost=buf.boost||0, all=!!buf.all, pierce=!!buf.pierce;
  buf.twice=buf.thrice=buf.boost=buf.all=buf.pierce=0;
  for(let t=0;t<times;t++){
    c.fx.forEach(f=>{
      const v=f.v+(['atk','def','heal'].includes(f.k)?boost:0);
      if(f.k==='atk'){
        const tg=all?alive():alive().slice(0,1);
        tg.forEach(x=>{ const d=Math.max(1,v-(pierce?0:0));
          x.hp-=d; if(x.hp<0)x.hp=0;
          const el=document.querySelector(`.foe[data-f="${foes.indexOf(x)}"]`);
          if(el)el.classList.add('hit'); });
        log(`<b>${c.w}</b> ── ${all?'ぜんたいに ':''}こうげき ${v}`);
      }
      else if(f.k==='def'){ block+=v; log(`<b>${c.w}</b> ── ぼうぎょ +${v}`); }
      else if(f.k==='heal'){ hp=Math.min(maxhp,hp+v); log(`<b>${c.w}</b> ── かいふく +${v}`); }
      else if(f.k==='draw'){ draw(v); log(`<b>${c.w}</b> ── ${v}枚 引いた`); }
      else if(f.k==='energy'){ en+=v; log(`<b>${c.w}</b> ── ⚡+${v}`); }
      else if(f.k==='weak'){ alive().forEach(x=>x.weak+=v);
        log(`<b>${c.w}</b> ── あいてを 弱らせた(${v})`); }
      else if(f.k==='push'){ const x=alive()[0]; if(x){x.intent=Math.max(0,x.intent-v);
        log(`<b>${c.w}</b> ── ${x.nm}を おしだした`);} }
      else if(f.k==='negate'){ const x=alive()[0]; if(x){x.intent=0;
        log(`<span class="g">${c.w}</span> ── ${x.nm}の 一手を 打ち消した`);} }
      else if(f.k==='again'){ hand.push(disc.pop()); log(`<b>${c.w}</b> ── 手札にもどした`); }
      else if(f.k==='dodge'){ block+=6; log(`<b>${c.w}</b> ── かわす構え`); }
      else if(f.k==='wash'){ alive().forEach(x=>x.weak+=v); log(`<b>${c.w}</b> ── 流した`); }
      else if(f.k==='coin'){ log(`<b>${c.w}</b> ── おかね +${v}`); }
      else if(f.k==='mark'){ buf.boost=(buf.boost||0)+2; log(`<b>${c.w}</b> ── ねらいを つけた`); }
      else { buf[f.k]=(buf[f.k]||0)+f.v;
        log(`<span class="g">${c.w}</span> ── ${FXN[f.k]||f.k}${c.note?' ・'+c.note:''}`); }
    });
  }
  render();
  if(!alive().length) win();
}
$('#endBtn').addEventListener('click',()=>{
  if(busy||!foes.length)return;
  busy=true;
  alive().forEach(f=>{
    let d=Math.max(0,f.intent-f.weak);
    const b=Math.min(block,d); block-=b; d-=b;
    hp-=d;
    if(d>0)log(`${f.nm} の こうげき ── ${d} うけた`);
    else log(`${f.nm} の こうげき ── ふせいだ`);
  });
  disc=disc.concat(hand); hand=[];
  render();
  if(hp<=0){ hp=0; lose(); busy=false; return; }
  busy=false; newTurn();
});

/* ---------- 勝利 → トークン → 合体 ---------- */
/* 報酬のトークンは「いま持っている札と合体できる相手」から配る。
   でないと せっかく集めても 一枚も作れない */
function tokenPool(){
  const own=new Set(bag.filter(c=>c.type==='tok').map(c=>c.k));
  const partners=new Set();
  for(const k in PAIR){
    const [a,b]=k.split('|');
    if(!CD[PAIR[k][0].w]) continue;              // カードにならない組は数えない
    if(own.has(a)&&!own.has(b)) partners.add(b);
    if(own.has(b)&&!own.has(a)) partners.add(a);
  }
  // 仲間にしたエティモンの一族は さらに出やすく
  const mine=mons.flatMap(m=>Object.keys(PAIR).filter(k=>k.split('|').includes(m))
    .flatMap(k=>k.split('|'))).filter(k=>partners.has(k));
  const rest=Object.keys(TK).filter(k=>!own.has(k))
    .sort((a,b)=>TK[b].n-TK[a].n).slice(0,60);
  const pool=[...partners,...mine,...mine];
  return shuffle(pool.length>=3?pool:[...pool,...rest]);
}
function win(){
  stage++;
  const pool=tokenPool().filter(k=>!bag.some(c=>c.id==='t:'+k));
  const got=pool.slice(0,3);
  const newMon=(stage%3===0)?MON.find(m=>!mons.includes(m.key)):null;
  if(newMon)mons.push(newMon.key);
  $('#sheet').innerHTML=`<h2>かった!</h2>
    <p class="s">語根トークンを 手に入れた。2つ 合体させると 英単語カードになる。</p>
    <div class="grid">${got.map(k=>{const t=TK[k];
      return `<div class="tk ${t.kind==='つなぎ手'?'join':'core'}">
        ${tkImg(t)}<div class="jp">${t.jp}</div>
        <div class="fx">${fxTxt(t.fx).join('<br>')}</div></div>`;}).join('')}</div>
    ${newMon?`<div class="born"><div class="w" style="font-size:19px">
      ${newMon.jp} が 仲間になった</div>
      <div class="b">${newMon.note||''}<br>
      これから この一族の トークンが 出やすくなる。</div></div>`:''}
    <button class="go" data-a="take">受けとる</button>`;
  got.forEach(k=>bag.push(mkTok(k)));
  $('#over').classList.add('on');
}
function lose(){
  $('#sheet').innerHTML=`<h2>たおれた…</h2>
    <p class="s">ステージ ${stage} まで。デッキ ${bag.length}枚 /
      英単語カード ${bag.filter(c=>c.type==='word').length}枚</p>
    <button class="go" data-a="restart">はじめから</button>`;
  $('#over').classList.add('on');
}

/* ---------- 合体画面 ---------- */
let fs=[];
function showFuse(){
  const toks=bag.filter(c=>c.type==='tok');
  const t=fs.length===2?key(fs[0],fs[1]):null;
  const hit=t?PAIR[t]:null;
  $('#sheet').innerHTML=`<h2>合体 ── 英単語カードを つくる</h2>
    <p class="s">トークンを 2つ えらぶ。実在する英単語なら カードになる。<br>
      <b style="color:var(--core)">中身</b>どうしは めずらしいが 強い。
      <b style="color:var(--join)">つなぎ手</b>は 相手が多い。</p>
    <div class="grid">${toks.map(c=>`
      <div class="tk ${c.kind==='つなぎ手'?'join':'core'}${fs.includes(c.k)?' sel':''}"
        data-k="${c.k}">${tkImg(TK[c.k])}<div class="jp">${c.w}</div>
        <div class="fx">${fxTxt(c.fx).join('<br>')}</div></div>`).join('')}</div>
    ${fs.length===2?(hit?`<div class="born">
        <div class="ja">${TK[fs[0]].jp} ＋ ${TK[fs[1]].jp} ＝</div>
        <div class="w">${hit[0].w}</div><div class="ja">${hit[0].ja}</div>
        ${CD[hit[0].w]?`<div class="fx">${fxTxt(CD[hit[0].w].fx).map(x=>`<span>${x}</span>`).join('')}
           <span>コスト${CD[hit[0].w].cost}</span></div>`:''}
        ${hit[0].b?`<div class="b">${hit[0].b}</div>`:''}</div>
        <button class="go" data-a="fuse" ${CD[hit[0].w]?'':'disabled'}>この カードを つくる</button>`
      :`<div class="born" style="border-color:var(--line)">
        <div class="ja">${TK[fs[0]].jp} ＋ ${TK[fs[1]].jp}</div>
        <div class="w" style="font-size:19px;color:var(--dim)">この2つの 英単語は 見つかっていない</div></div>`)
      :''}
    <button class="go gh" data-a="close">とじる</button>`;
  $('#over').classList.add('on');
}
$('#over').addEventListener('click',ev=>{
  const tk=ev.target.closest('.tk[data-k]');
  if(tk){ const k=tk.dataset.k, at=fs.indexOf(k);
    if(at>=0)fs.splice(at,1); else if(fs.length<2)fs.push(k); else fs=[fs[1],k];
    showFuse(); return; }
  const b=ev.target.closest('[data-a]'); if(!b)return;
  const a=b.dataset.a;
  if(a==='take'){ $('#over').classList.remove('on'); startBattle(); }
  else if(a==='close'){ fs=[]; $('#over').classList.remove('on'); }
  else if(a==='restart'){ location.reload(); }
  else if(a==='fuse'){
    const hit=PAIR[key(fs[0],fs[1])];
    const w=hit[0].w;
    if(CD[w]&&!bag.some(c=>c.id==='w:'+w)){
      bag.push(mkWord(w));
      // 合体に使ったトークンは 消える
      fs.forEach(k=>{ const i=bag.findIndex(c=>c.id==='t:'+k); if(i>=0)bag.splice(i,1); });
    }
    fs=[]; showFuse();
  }
});
$('#deckBtn').addEventListener('click',showFuse);

(async()=>{
  if(location.protocol!=='file:'){
    try{ const r=await fetch('data/pie/deck.json');
      if(r.ok){ const j=await r.json(); if(j.tokens){TK=j.tokens;CD=j.cards;MON=j.mons;
        PAIR=j.pairs;FXN=j.fxname;} } }catch(e){}
  }
  if(!Object.keys(TK).length){ $('#log').innerHTML='データがありません。'
    +'python3 app/build_deck.py を実行してください。'; return; }
  // 開始デッキ。原始カードだけ。無い語根は よく使う中身の語根で埋める
  const cores=Object.keys(TK).filter(k=>TK[k].kind==='中身')
    .sort((a,b)=>TK[b].n-TK[a].n);
  const st=[];
  START.forEach(k=>{ if(TK[k])st.push(k); });
  for(const k of cores){ if(st.length>=6)break; if(!st.includes(k))st.push(k); }
  bag=st.flatMap(k=>[mkTok(k),mkTok(k)]);   // 各2枚
  startBattle();
})();
</script>
