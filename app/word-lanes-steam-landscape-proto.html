<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10152d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="screen-orientation" content="landscape">
<link rel="manifest" href="wild-wordopia.webmanifest">
<title>Wild Wordopia Steam横画面プロト</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100dvh;background:#35215f;display:flex;align-items:flex-start;justify-content:center;
  font-family:"Arial Rounded MT Bold","Segoe UI Black","Yu Gothic UI","Yu Gothic",sans-serif;overflow-y:auto;overflow-x:hidden;
  color:#556cd5;
}
#game{
  width:min(390px,100vw);height:888px;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 52% 37%,rgba(255,238,123,.55),transparent 18%),
    radial-gradient(circle at 5% 82%,#324979 0 18%,transparent 18.4%),
    radial-gradient(circle at 104% 72%,#495b85 0 16%,transparent 16.4%),
    linear-gradient(180deg,#7da1e8 0%,#d690d2 30%,#ffb36c 55%,#70619a 100%);
  touch-action:pan-y;
}
#game::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 18% 46%,rgba(245,184,80,.42) 0 8%,transparent 8.5%),
    radial-gradient(ellipse at 78% 54%,rgba(62,96,143,.55) 0 12%,transparent 12.5%),
    radial-gradient(ellipse at 45% 92%,rgba(44,80,101,.72) 0 22%,transparent 22.4%);
  opacity:.9;pointer-events:none;
}
.hint{
  position:absolute;left:50%;top:354px;transform:translateX(-50%);width:340px;height:96px;z-index:4;
  border-radius:18px;background:rgba(255,255,255,.95);box-shadow:0 7px 0 rgba(67,77,153,.3),0 14px 24px rgba(44,50,110,.22);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 18px 22px;
  font-size:19px;line-height:1.15;font-weight:950;color:#536bce;cursor:pointer;user-select:none;overflow:hidden;
}
.hintText{display:block;width:100%}
.hint .langBtn{position:absolute;right:10px;bottom:9px;height:27px;min-width:44px;padding:0 10px;border-radius:14px;font-size:12px;box-shadow:0 3px 0 rgba(49,76,175,.35);z-index:2}
.hint.long{font-size:16px;line-height:1.18}.hint.jp{font-size:17px;line-height:1.25}.hint.jp.long{font-size:15px}
.hint:active{transform:translateX(-50%) translateY(3px);box-shadow:0 4px 0 rgba(67,77,153,.3),0 10px 18px rgba(44,50,110,.18)}
.hint.preChoice{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(26px) scale(.45)}
.hint.hintBurst{animation:hintBurst .42s cubic-bezier(.18,1.55,.35,1) both}
.hint.resultMode{pointer-events:none}
.hint.resultMode .hintText{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.hint.resultMode .resultEn{font-size:26px;line-height:1;font-weight:950;letter-spacing:1px;color:#536bd0}
.hint.resultMode .resultJp{font-size:16px;line-height:1.15;font-weight:950;color:#536bd0}
.hint.resultMode .langBtn{display:none}
.hint.hintSwitch{animation:hintSwitch .18s ease-out both}
@keyframes hintSwitch{
  0%{transform:translateX(-50%) scale(1)}
  45%{transform:translateX(-50%) scale(.88)}
  100%{transform:translateX(-50%) scale(1)}
}
@keyframes hintBurst{
  0%{opacity:0;transform:translateX(-50%) translateY(30px) scale(.35) rotate(-3deg)}
  62%{opacity:1;transform:translateX(-50%) translateY(-8px) scale(1.1) rotate(1deg)}
  82%{transform:translateX(-50%) translateY(3px) scale(.97) rotate(0)}
  100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1) rotate(0)}
}
.metaControls{position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:10;display:flex;gap:8px;align-items:center}
.stagePill,.langBtn,.modeBtn{height:32px;border:0;border-radius:16px;background:rgba(255,255,255,.8);color:#536bd0;font-size:14px;font-weight:950;box-shadow:0 4px 0 rgba(49,76,175,.35);padding:0 14px}
.langBtn{cursor:pointer}.langBtn.active{background:linear-gradient(#90e7ff,#54a7ff);color:#133b94}
.modeControls{position:absolute;left:50%;top:82px;transform:translateX(-50%);z-index:10;display:flex;gap:7px}
.modeBtn{min-width:88px;cursor:pointer}.modeBtn.active{background:linear-gradient(#ffe17a,#ff9f30);color:#833f00;box-shadow:0 4px 0 #b75a12}
.levelControls{position:absolute;left:50%;top:124px;transform:translateX(-50%);z-index:10;display:flex;gap:6px}
.levelControls .modeBtn{min-width:68px;padding:0 10px}
.hintControls{position:absolute;left:50%;top:462px;transform:translateX(-50%);z-index:10;display:flex;gap:6px}
.hintBtn{height:34px;border:0;border-radius:17px;background:linear-gradient(#fff,#eef2ff);color:#536bd0;font-size:15px;font-weight:950;box-shadow:0 4px 0 rgba(49,76,175,.45);padding:0 16px;cursor:pointer}
.countControls{position:absolute;left:50%;top:208px;transform:translateX(-50%);z-index:10;display:flex;gap:6px}
.countBtn{width:88px;height:36px;border:0;border-radius:18px;background:rgba(255,255,255,.78);color:#536bd0;font-size:16px;font-weight:950;box-shadow:0 4px 0 rgba(49,76,175,.45);cursor:pointer}
.countBtn.active{background:linear-gradient(#ffe17a,#ff9f30);color:#833f00;box-shadow:0 4px 0 #b75a12}
.countBtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(49,76,175,.45)}
.sideHint{position:absolute;top:288px;width:115px;height:82px;border-radius:18px;background:rgba(255,255,255,.9);opacity:.95;z-index:2}.sideHint.left{left:-86px}.sideHint.right{right:-86px}
.answer{position:absolute;left:50%;top:502px;transform:translateX(-50%);display:flex;gap:5px;z-index:9;min-height:34px}
.answerTile{width:34px;height:34px;border-radius:7px;background:#fff;box-shadow:0 4px 0 #314caf,0 6px 9px rgba(49,56,145,.28);display:flex;align-items:center;justify-content:center;color:#526bd4;font-size:24px;font-weight:950;text-transform:uppercase}
.answerTile.solved{background:linear-gradient(#ff9872,#f06b4f);color:#9a3c2b;box-shadow:0 3px 0 #8b3729}
.board{position:absolute;left:50%;top:702px;transform:translate(-50%,-50%);width:310px;height:310px;z-index:6;touch-action:none}
.laneLayer,.tileLayer,.sparkLayer{position:absolute;inset:0;overflow:visible}
.wordShape{filter:drop-shadow(0 8px 0 var(--shape-shadow));pointer-events:none}
.cell{position:absolute;width:55px;height:55px;border-radius:9px;background:#fff;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;color:#536bd0;font-size:36px;font-weight:950;box-shadow:0 8px 0 #2e45aa,0 12px 13px rgba(42,45,120,.28);z-index:5;user-select:none;letter-spacing:0}
.board.lang-jp .cell:not(.hot):not(.used):not(.autoHint),.board.lang-bi .cell:not(.hot):not(.used):not(.autoHint){font-size:26px}
.jpWordLabel{position:absolute;z-index:14;pointer-events:none;transform:translate(-50%,-50%);max-width:132px;min-width:42px;padding:4px 8px;border-radius:11px;background:rgba(255,255,255,.92);box-shadow:0 3px 0 rgba(35,48,75,.28),0 7px 12px rgba(35,35,79,.16);border:2px solid rgba(35,48,75,.22);color:#26365d;font-size:14px;line-height:1.06;font-weight:950;text-align:center;white-space:normal}
.jpWordLabel .enMini{display:block;margin-top:2px;color:#536bd0;font-size:9px;line-height:1;font-weight:950;letter-spacing:.4px}
.jpWordLabel .countMini{display:block;margin-top:3px;color:#a55b06;font-size:8px;line-height:1;font-weight:950;letter-spacing:.3px}
.board.lang-en .jpWordLabel{display:none}
.board.lang-bi .jpWordLabel{font-size:12px;padding:3px 7px}
.board.lang-jp .jpWordLabel .enMini{display:none}
.board.lang-jp .jpWordLabel .countMini{display:block}
.board.lang-bi .jpWordLabel .countMini{display:none}
.cell.group-0{background:linear-gradient(#ffffff,#eaf2ff)}
.cell.group-1{background:linear-gradient(#fff4c7,#ffd981)}
.cell.group-2{background:linear-gradient(#ffe5ec,#ffc3d0)}
.cell.group-3{background:linear-gradient(#e9fff4,#bdf5d7)}
.cell.used{color:var(--active-text);background:transparent!important;box-shadow:none;z-index:10}
.cell.hot{color:var(--active-text);background:transparent!important;box-shadow:none;z-index:10}
.cell.used.connect-r{border-top-right-radius:0;border-bottom-right-radius:0}
.cell.used.connect-l{border-top-left-radius:0;border-bottom-left-radius:0}
.cell.used.connect-d{border-bottom-left-radius:0;border-bottom-right-radius:0}
.cell.used.connect-u{border-top-left-radius:0;border-top-right-radius:0}
.cell.hot.connect-r{border-top-right-radius:0;border-bottom-right-radius:0}
.cell.hot.connect-l{border-top-left-radius:0;border-bottom-left-radius:0}
.cell.hot.connect-d{border-bottom-left-radius:0;border-bottom-right-radius:0}
.cell.hot.connect-u{border-top-left-radius:0;border-top-right-radius:0}
.cell.bad{animation:badTile .24s ease}
.cell.revealed{background:var(--active-bg)!important;color:var(--active-text);box-shadow:0 8px 0 var(--active-shadow),0 12px 13px rgba(42,45,120,.22);z-index:6}
.cell.autoHint{background:transparent!important;color:var(--active-text);box-shadow:none;z-index:10}
.cell.hintUnrevealed:not(.hot):not(.used):not(.autoHint){background:linear-gradient(#ffffff,#f4f6ff)!important;color:#536bd0;box-shadow:0 8px 0 #2e45aa,0 12px 13px rgba(42,45,120,.28);z-index:5}
.cell.hintFocus:not(.hot):not(.used):not(.autoHint){background:var(--active-bg)!important;color:var(--active-text);box-shadow:0 8px 0 var(--active-shadow),0 12px 13px rgba(42,45,120,.22);z-index:6}
.cell.autoHint.auto-connect-r{border-top-right-radius:0;border-bottom-right-radius:0}
.cell.autoHint.auto-connect-l{border-top-left-radius:0;border-bottom-left-radius:0}
.cell.autoHint.auto-connect-d{border-bottom-left-radius:0;border-bottom-right-radius:0}
.cell.autoHint.auto-connect-u{border-top-left-radius:0;border-top-right-radius:0}
.cell.pulse::after{content:"";position:absolute;inset:-28px;border:4px solid rgba(255,255,255,.7);border-radius:50%;animation:ring .45s ease-out forwards}.cell.pulse::before{content:"";position:absolute;inset:-17px;border:4px solid rgba(255,255,255,.55);border-radius:50%;animation:ring .45s ease-out forwards}
.cell.solvedVanish{pointer-events:none;animation:solvedCellVanish .68s cubic-bezier(.2,.8,.2,1) forwards}
.wordShape.solved.solvedVanish{transform-box:fill-box;transform-origin:center;animation:solvedShapeVanish .68s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes solvedCellVanish{0%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:brightness(1)}28%{opacity:1;transform:translate(-50%,-50%) scale(1.12);filter:brightness(2.35) drop-shadow(0 0 12px #fff)}58%{opacity:.9;transform:translate(-50%,-50%) scale(1.04);filter:brightness(1.65) drop-shadow(0 0 18px rgba(255,255,255,.95))}100%{opacity:0;transform:translate(-50%,-50%) scale(.42);filter:brightness(2.4) blur(2px)}}
@keyframes solvedShapeVanish{0%{opacity:1;transform:scale(1);filter:brightness(1)}28%{opacity:1;transform:scale(1.1);filter:brightness(2.2) drop-shadow(0 0 12px #fff)}58%{opacity:.9;transform:scale(1.03);filter:brightness(1.55) drop-shadow(0 0 20px rgba(255,255,255,.95))}100%{opacity:0;transform:scale(.42);filter:brightness(2.3) blur(2px)}}

.vanishMeaning{position:absolute;z-index:24;pointer-events:none;transform:translate(-50%,-50%) scale(.72);max-width:190px;padding:7px 12px;border-radius:15px;background:rgba(255,255,255,.94);box-shadow:0 4px 0 rgba(49,76,175,.3),0 8px 18px rgba(38,42,100,.24);color:#4d63c7;font-size:18px;line-height:1.1;font-weight:950;text-align:center;white-space:nowrap;opacity:0;animation:vanishMeaningPop 1.05s ease-out forwards}
@keyframes vanishMeaningPop{0%{opacity:0;transform:translate(-50%,-35%) scale(.62)}18%{opacity:1;transform:translate(-50%,-55%) scale(1.08)}72%{opacity:1;transform:translate(-50%,-88%) scale(1)}100%{opacity:0;transform:translate(-50%,-135%) scale(.92)}}
@keyframes ring{from{transform:scale(.5);opacity:1}to{transform:scale(1.25);opacity:0}}
@keyframes badTile{0%,100%{translate:0 0}25%{translate:-5px 0}50%{translate:5px 0}75%{translate:-3px 0}}
.toast{position:absolute;left:50%;top:612px;transform:translateX(-50%) scale(.9);background:#b066ee;color:#7334b7;font-size:34px;font-weight:950;border-radius:26px;padding:29px 58px;z-index:30;opacity:0;pointer-events:none}
.toast.show{animation:toast .9s ease forwards}@keyframes toast{0%{opacity:0;transform:translateX(-50%) scale(.85)}25%,80%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(1.05)}}
.wordBurst{position:absolute;left:50%;top:560px;transform:translateX(-50%) scale(.75);z-index:28;min-width:230px;max-width:330px;padding:10px 22px 12px;border-radius:16px;background:linear-gradient(#fff3a5,#ff9f36);box-shadow:0 6px 0 #b85b14,0 13px 20px rgba(65,38,12,.25);text-align:center;opacity:0;pointer-events:none}
.wordBurst.show{animation:wordPop 1.15s ease forwards}.wordBurst .en{font-size:34px;line-height:1;font-weight:950;color:#8b3e00;text-shadow:0 2px 0 rgba(255,255,255,.55);letter-spacing:1px}.wordBurst .jp{margin-top:7px;font-size:15px;line-height:1.15;font-weight:950;color:#5a2b05}
@keyframes wordPop{0%{opacity:0;transform:translateX(-50%) translateY(18px) scale(.65)}18%,78%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-10px) scale(1.08)}}
.finish{position:absolute;inset:0;z-index:25;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,255,255,.1);backdrop-filter:blur(1px)}
.finish.show{display:flex;animation:fadein .3s ease}.finish .big{position:absolute;left:50%;top:702px;transform:translate(-50%,-50%);width:310px;height:310px;filter:brightness(1.8);opacity:.95}.reward{position:absolute;inset:0;z-index:31;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,236,210,.45)}
.reward.show{display:flex}.rewardTitle{background:#b46af0;color:#743bb8;border-radius:28px;padding:32px 58px;font-size:32px;font-weight:950}.spark{position:absolute;width:12px;height:12px;background:white;transform:rotate(45deg);box-shadow:0 0 14px white;animation:sparkPop 1.2s ease forwards}.doneNote{margin-top:28px;background:rgba(255,255,255,.88);border-radius:14px;padding:14px 22px;font-size:20px;font-weight:950;color:#536bd0;box-shadow:0 5px 12px rgba(80,70,160,.2)}@keyframes sparkPop{0%{opacity:0;transform:translate(0,20px) rotate(45deg) scale(.4)}25%,80%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(45deg) scale(1)}}@keyframes fadein{from{opacity:0}to{opacity:1}}
#game.clearing .hint,#game.clearing .sideHint{display:none}
#game.clearing .countControls,#game.clearing .metaControls,#game.clearing .modeControls,#game.clearing .levelControls,#game.clearing .hintControls{display:none}

/* ===================== バトル（上段） ===================== */
#battle{position:absolute;left:0;top:0;width:100%;height:268px;z-index:8;overflow:hidden;
  background:linear-gradient(180deg,#bfe4ff 0%,#e2f4ff 44%,#cdedb4 45%,#a4da8b 100%);
  border-bottom:4px solid #2b2b46}
.platform{position:absolute;border-radius:50%;background:rgba(70,124,60,.32)}
.platform.e{right:14px;top:112px;width:148px;height:32px}
.platform.a{left:12px;bottom:62px;width:136px;height:28px;background:rgba(70,124,60,.4)}
.enemySprite{position:absolute;right:38px;top:42px;font-size:64px;line-height:1;z-index:2;
  filter:drop-shadow(0 6px 0 rgba(40,70,40,.25));transition:opacity .35s,transform .35s}
.enemySprite.down{opacity:0;transform:translateY(26px) scale(.4)}
.allySprite{position:absolute;left:42px;bottom:84px;font-size:56px;line-height:1;z-index:2;transform:scaleX(-1);
  filter:drop-shadow(0 6px 0 rgba(40,70,40,.25))}
.battleBox{position:absolute;background:#fffef6;border:3px solid #2b2b46;border-radius:9px;box-shadow:0 3px 0 #2b2b46;padding:7px 10px;z-index:3}
.enemyBox{left:10px;top:10px;width:192px}
.allyBox{right:10px;bottom:60px;width:192px}
.ebName{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:950;color:#28284a}
.ebLv{font-size:11px;color:#7a7a9a}
.hpRow{display:flex;align-items:center;gap:5px;margin-top:5px}
.hpLabel{font-size:10px;font-weight:950;color:#c9a01f;letter-spacing:1px}
.hpBar{flex:1;height:9px;border-radius:5px;background:#dcdcdc;border:2px solid #2b2b46;overflow:hidden}
.hpBar i{display:block;height:100%;width:100%;background:linear-gradient(#7df08a,#2fcf57);transition:width .35s}
.hpBar i.mid{background:linear-gradient(#ffe07a,#f5b62f)}
.hpBar i.low{background:linear-gradient(#ff9c8a,#ef5b46)}
.hpNum{font-size:11px;font-weight:950;color:#44446a;min-width:46px;text-align:right}
.gaugeRow{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:10px;font-weight:950;color:#8a4ab0}
.pips{display:flex;gap:3px}
.pip{width:9px;height:9px;border-radius:50%;border:2px solid #8a4ab0;background:transparent}
.pip.on{background:#b266ee}
.msgBox{position:absolute;left:0;right:0;bottom:0;height:54px;background:#fffef6;border-top:4px solid #2b2b46;
  padding:7px 12px;font-size:13px;font-weight:950;color:#28284a;line-height:1.35;z-index:4;display:flex;align-items:center}
.killPill{position:absolute;right:10px;top:10px;background:#2b2b46;color:#ffe07a;border-radius:11px;font-size:11px;font-weight:950;padding:4px 10px;z-index:5}
@keyframes sprShake{0%,100%{translate:0 0}25%{translate:-7px 0}50%{translate:6px 0}75%{translate:-4px 0}}
.shakeFx{animation:sprShake .32s ease}
@keyframes lungeA{0%,100%{margin-left:0}40%{margin-left:26px}}
.allySprite.lunge{animation:lungeA .3s ease}
@keyframes lungeE{0%,100%{margin-right:0}40%{margin-right:26px}}
.enemySprite.lunge{animation:lungeE .3s ease}
.dmgFloat{position:absolute;z-index:6;font-size:20px;font-weight:950;color:#e23b3b;text-shadow:0 2px 0 #fff;
  animation:dmgUp .72s ease forwards;pointer-events:none}
.dmgFloat.heal{color:#1faf52}
@keyframes dmgUp{0%{opacity:0;transform:translateY(8px) scale(.7)}25%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-26px) scale(1)}}
.party{position:absolute;left:50%;top:276px;transform:translateX(-50%);width:374px;display:flex;gap:6px;z-index:8}
.pmChip{flex:1;background:rgba(255,255,255,.93);border-radius:12px;padding:6px 7px;box-shadow:0 4px 0 rgba(49,76,175,.3);border:2px solid transparent;min-width:0}
.pmChip.active{border-color:#ffb030;box-shadow:0 4px 0 #b75a12}
.pmChip.dead{filter:grayscale(1);opacity:.5}
.pmTop{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:950;color:#3c3c66;white-space:nowrap;overflow:hidden}
.pmDot{width:9px;height:9px;border-radius:3px;flex:none}
.pmHp{height:6px;border-radius:3px;background:#e3e3ee;margin-top:4px;overflow:hidden}
.pmHp i{display:block;height:100%;background:linear-gradient(#7df08a,#2fcf57)}
.pmPips{display:flex;gap:2px;margin-top:4px}
.pmPips .pip{width:7px;height:7px;border-width:1.5px}
.hintActor{position:absolute;left:12px;top:-13px;display:none;align-items:center;gap:3px;background:#fff;border-radius:12px;
  padding:3px 10px;font-size:12px;font-weight:950;color:#3c3c66;box-shadow:0 3px 0 rgba(49,76,175,.3);z-index:3}
.defeat{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(30,20,50,.55)}
.defeat.show{display:flex}
.defeatBox{background:#fff;border-radius:20px;padding:26px 36px;display:flex;flex-direction:column;gap:16px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.defeatTitle{font-size:24px;font-weight:950;color:#536bd0}
#game.clearing #battle,#game.clearing .party{filter:saturate(.9)}

/* ===== Root-battle / modern monster-RPG UI ===== */
#game{height:900px;background:
 radial-gradient(circle at 72% 18%,rgba(255,255,255,.72),transparent 18%),
 linear-gradient(180deg,#72b8f5 0%,#dff5ff 28%,#bfe29e 29%,#86bd72 49%,#7868ad 50%,#4d3e78 100%)}
#battle{height:258px;border:0;border-radius:0 0 28px 28px;box-shadow:0 10px 28px rgba(27,30,78,.28);background:
 radial-gradient(circle at 72% 18%,rgba(255,255,255,.75),transparent 19%),
 linear-gradient(180deg,#95d2ff 0%,#e8f8ff 45%,#caecb0 46%,#86c673 100%)}
#battle::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(29,53,78,.15));pointer-events:none}
.msgBox{display:none}

/* ===================== POKEMON POLISH ===================== */
/* --- 情報プレート: 斜めカットのポケモン風ネームプレート --- */
.battleBox{border:0;background:transparent;box-shadow:none;padding:9px 15px 10px;isolation:isolate}
.battleBox::before{content:"";position:absolute;inset:0;z-index:-1;border:3px solid #24324d;border-radius:13px;
  background:linear-gradient(180deg,#ffffff,#eef2fb);box-shadow:0 5px 0 #24324d,0 10px 16px rgba(33,42,75,.18)}
.enemyBox::before{transform:skewX(-6deg)}
.allyBox::before{transform:skewX(6deg)}
.enemyBox{left:12px;top:14px;width:198px}
.allyBox{right:12px;bottom:56px;width:202px}
.ebName{font-size:14px;color:#24324d;gap:6px}
.ebLv{background:#24324d;color:#ffe989;border-radius:9px;padding:2px 8px;font-size:10px;font-weight:950}
.rootChip{display:inline-flex;align-items:center;border-radius:9px;padding:2px 8px;font-size:9.5px;font-weight:950;
  color:#33334f;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6),0 1px 0 rgba(36,50,77,.25);white-space:nowrap}
.gaugeRow,.pips,.pip{display:none!important}

/* --- HPバー: ラウンドキャップ＋ダメージトレイル --- */
.hpBar{position:relative;height:12px;border-radius:7px;border:2px solid #24324d;background:#d7dbe8;
  box-shadow:inset 0 2px 3px rgba(30,30,80,.22)}
.hpBar i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:5px}
.hpBar i.trail{background:#fff;transition:width .55s ease .32s}
#enemyHpFill,#allyHpFill{transition:width .16s ease;z-index:1}
.hpBar::after{content:"";position:absolute;left:0;right:0;top:0;height:42%;border-radius:5px 5px 0 0;
  background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none;z-index:2}

/* --- 待機モーション（呼吸） --- */
.enemySprite{animation:idleE 2.8s ease-in-out infinite}
@keyframes idleE{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.allySprite{animation:idleA 2.3s ease-in-out infinite}
@keyframes idleA{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-4px)}}
.enemySprite.down{animation:none}

/* --- 強攻撃チャージの前兆（技ゲージの代替表現） --- */
.enemySprite.charging{animation:chargeIdle 1s ease-in-out infinite}
@keyframes chargeIdle{
  0%,100%{transform:translateY(0);filter:drop-shadow(0 6px 0 rgba(40,70,40,.25)) drop-shadow(0 0 6px rgba(255,90,80,.55))}
  50%{transform:translateY(-5px);filter:drop-shadow(0 6px 0 rgba(40,70,40,.25)) drop-shadow(0 0 16px rgba(255,70,60,.95)) brightness(1.12)}}

/* --- 敵KO: 白フラッシュ→沈んで消滅 --- */
.enemySprite.ko{animation:koEnemy .8s ease-in forwards}
@keyframes koEnemy{
  0%{transform:translateY(0);filter:brightness(1);opacity:1}
  16%{filter:brightness(3.2) drop-shadow(0 0 18px #fff);transform:translateY(-3px)}
  34%{filter:brightness(2.2);transform:translateY(0)}
  100%{transform:translateY(38px) scale(.25);filter:brightness(2.6) blur(2px);opacity:0}}

/* --- 味方KO: グレースケールでぺたんと沈む --- */
.allySprite.koAlly{animation:koAlly .7s ease-in forwards}
@keyframes koAlly{
  0%{transform:scaleX(-1) translateY(0);filter:grayscale(0);opacity:1}
  30%{filter:grayscale(1) brightness(.85)}
  100%{transform:scaleX(-1) translateY(30px) scale(.55);filter:grayscale(1) brightness(.7);opacity:.0}}

/* --- 新しい敵の登場: 右からスライド＋着地バウンド --- */
.enemySprite.enter{animation:enemyEnter .6s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes enemyEnter{
  0%{transform:translate(150px,-20px);opacity:0}
  55%{transform:translate(0,5px);opacity:1}
  75%{transform:translate(0,-6px)}
  100%{transform:translate(0,0)}}
.enemyBox.plateIn{animation:plateInL .42s ease .12s both}
@keyframes plateInL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}

/* --- 交代: ダッシュアウト→ダッシュイン＋着地リング --- */
.allySprite.dashOut{animation:dashOut .21s ease-in forwards}
@keyframes dashOut{to{transform:scaleX(-1) translateX(120px);opacity:0}}
.allySprite.dashIn{animation:dashIn .42s cubic-bezier(.2,1.35,.4,1) both}
@keyframes dashIn{
  0%{transform:scaleX(-1) translateX(120px);opacity:0}
  60%{transform:scaleX(-1) translateX(-8px);opacity:1}
  100%{transform:scaleX(-1) translateX(0)}}
.allyBox.plateOutR{animation:plateOutR .18s ease-in forwards}
@keyframes plateOutR{to{opacity:0;transform:translateX(44px)}}
.allyBox.plateInR{animation:plateInR .34s ease both}
@keyframes plateInR{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
.ringFx{position:absolute;left:82px;top:192px;width:16px;height:16px;border:4px solid #ffd76a;border-radius:50%;
  transform:translate(-50%,-50%);z-index:6;pointer-events:none;animation:ringPop .52s ease-out forwards}
@keyframes ringPop{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(-50%,-50%) scale(5.5);opacity:0}}

/* --- 盤面カラーウェーブ（交代で盤面ごと替わったことを明示） --- */
.boardWave{position:absolute;inset:-10px;z-index:14;border-radius:22px;pointer-events:none;
  transform:translateX(-115%);animation:waveSweep .6s ease forwards}
@keyframes waveSweep{to{transform:translateX(115%)}}

/* --- 土煙・画面フラッシュ・マイクロシェイク・ダメージ数字 --- */
.dust{position:absolute;width:13px;height:13px;border-radius:50%;z-index:5;pointer-events:none;
  background:radial-gradient(circle,#fff 0 40%,#e8e2d2 70%,transparent 75%);animation:dustPop .62s ease-out forwards}
@keyframes dustPop{0%{opacity:0;transform:translate(0,0) scale(.5)}25%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),-26px) scale(1.5)}}
.screenFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:26}
.screenFlash.show{animation:scrFlash .32s ease-out}
@keyframes scrFlash{0%{opacity:0}18%{opacity:.85}100%{opacity:0}}
#battle.hitShake{animation:battleShake .24s ease}
@keyframes battleShake{25%{translate:-5px 1px}50%{translate:4px -1px}75%{translate:-2px 0}}
.dmgFloat{font-size:22px;text-shadow:0 2px 0 #fff,0 4px 8px rgba(120,20,20,.25)}
.dmgFloat.big{font-size:31px;color:#ff8f1f;text-shadow:0 2px 0 #fff,0 0 12px rgba(255,170,40,.8);animation-duration:.66s}
.killPill.bounce{animation:winBounce .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes winBounce{0%{transform:scale(1)}35%{transform:scale(1.35) rotate(-4deg)}100%{transform:scale(1)}}

/* --- パーティチップ: アクティブマーカー▼ / KO✕ --- */
.pmChip{position:relative;overflow:visible}
.pmChip.active::after{content:'▼';position:absolute;top:-16px;left:50%;transform:translateX(-50%);

function generatePuzzle(count){
  // 5×5固定。スマホで触りやすいタイルサイズを優先する。
  const gridSize=5;
  const totalCells=gridSize*gridSize;
  let best=null,bestFill=0;
  for(let attempt=0;attempt<240;attempt++){
    const candidate=buildPackedBoard(gridSize);
    if(!candidate)continue;
    if(!boardFitsGrid(candidate,gridSize))continue;
    if(!normalWordRegionsPlayable(candidate))continue;
    if(!skillEventuallyCompletable(candidate))continue;
    const fill=candidate.cells.length/totalCells;
    if(fill>bestFill){best=candidate;bestFill=fill;}
    if(fill>=0.82)break;
  }
  if(!best)throw new Error('Unable to generate a packed 5x5 board');
  return applyCellPalettes(best);
}

function randomSkillSplitIndexes(len){
  const counts=len>=3?[3,2]:[2];
  for(const fragmentCount of shuffle(counts.slice())){
    const cuts=shuffle(Array.from({length:len-1},(_,i)=>i+1)).slice(0,fragmentCount-1).sort((a,b)=>a-b);
    if(cuts.length===fragmentCount-1)return cuts;
  }

}

function randomThreeFragmentLayout(gridSize){
  if(gridSize<5)return null;
  const shapes=[
    {path:[{gx:0,gy:0},{gx:2,gy:0},{gx:2,gy:2}],blockers:[{gx:1,gy:0},{gx:2,gy:1}]},
    {path:[{gx:4,gy:0},{gx:2,gy:0},{gx:2,gy:2}],blockers:[{gx:3,gy:0},{gx:2,gy:1}]},
    {path:[{gx:0,gy:4},{gx:2,gy:4},{gx:2,gy:2}],blockers:[{gx:1,gy:4},{gx:2,gy:3}]},
    {path:[{gx:4,gy:4},{gx:2,gy:4},{gx:2,gy:2}],blockers:[{gx:3,gy:4},{gx:2,gy:3}]},
    {path:[{gx:1,gy:0},{gx:3,gy:0},{gx:3,gy:2}],blockers:[{gx:2,gy:0},{gx:3,gy:1}]},
    {path:[{gx:3,gy:4},{gx:1,gy:4},{gx:1,gy:2}],blockers:[{gx:2,gy:4},{gx:1,gy:3}]}

function randomSkillLayout(gridSize,skillLetters){
  const len=skillLetters.length;
  if(len<2)return null;
  if(len===3&&Math.random()<.5){
    const three=randomThreeFragmentLayout(gridSize);
    if(three)return three;
  }
  const directions=[
    {dx:1,dy:0,name:'right'},
    {dx:-1,dy:0,name:'left'}
  ];
  const splits=shuffle(Array.from({length:len-1},(_,i)=>i+1));
  const wideGaps=Array.from({length:gridSize-2},(_,i)=>i+1).filter(g=>g>=2).sort((a,b)=>b-a);
  const fallbackGaps=[1];
  let fallback=null;
  for(const gapPool of [wideGaps,fallbackGaps]){
    if(!gapPool.length)continue;
    for(let attempt=0;attempt<260;attempt++){
      const splitIndexes=(attempt<splits.length&&Math.random()<.45)
        ? [splits[attempt%splits.length]]
        : randomSkillSplitIndexes(len);
      const fragmentLengths=[];
      let cursor=0;
      splitIndexes.concat(len).forEach(cut=>{fragmentLengths.push(cut-cursor);cursor=cut});
      const starts=shuffle(allGridCells(gridSize));
      for(const start of starts){
        for(const dir of shuffle(directions.slice())){
          const path=[],blockers=[],gaps=[];
          let reserved=new Set();
          let previousEnd=null;
          let failed=false;
          for(let fi=0;fi<fragmentLengths.length;fi++){
            const gap=fi===0?0:shuffle(gapPool.slice())[0];
            const fragmentStart=fi===0?start:{gx:previousEnd.gx+dir.dx*(gap+1),gy:previousEnd.gy};
            if(fragmentStart.gx<0||fragmentStart.gy<0||fragmentStart.gx>=gridSize||fragmentStart.gy>=gridSize){failed=true;break}
            if(reserved.has(gridCellKey(fragmentStart))){failed=true;break}
            if(fi>0){
              for(let k=1;k<=gap;k++){
                const b={gx:previousEnd.gx+dir.dx*k,gy:previousEnd.gy};
                if(b.gx<0||b.gy<0||b.gx>=gridSize||b.gy>=gridSize||reserved.has(gridCellKey(b))){failed=true;break}
                blockers.push(b);
                reserved.add(gridCellKey(b));

            if(!fragment){failed=true;break}
            fragment.forEach(p=>reserved.add(gridCellKey(p)));

            if(fi>0)gaps.push(gap);
          }
          if(!failed&&path.length===len){
            const nonLine=new Set(path.map(p=>p.gx)).size>1&&new Set(path.map(p=>p.gy)).size>1;
            const candidate={path,splitIndexes,blockers,gaps,axis:dir.name};
            if(nonLine||len<3)return candidate;
            if(!fallback)fallback=candidate;
          }
        }
      }
    }
  }
  return fallback;
}

  return null;
}
function makeRegionGrid(width=6,height=6){
  width=Math.max(4,Math.min(6,width));
  height=Math.max(4,Math.min(6,height));
  const cellSize=width>=6?45:width===5?54:66;
  const gap=width>=6?4:5;
  const step=cellSize+gap;
  currentCellSize=cellSize;currentHitRadius=cellSize/2+4;currentNeighborThreshold=step+5;
  return {width,height,step,x0:(310-(width-1)*step)/2,y0:(310-(height-1)*step)/2};
}

function pickWords(count,gridSize=4){
  const actor=party[activeAlly]||WILD_DEFS[activeAlly]||WILD_DEFS[0];
  const state=getWildDeckState(activeAlly,actor);
  const maxLetters=gridSize*gridSize;
  const skillMax=gridSize-1;

  // Every board contains exactly one root-matched skill card.
  // The remaining cards are unrelated normal-attack cards.
  for(let attempt=0;attempt<100;attempt++){
    const picked=[];
    let total=0;
    const skill=drawDeckWord(state,'skill',picked,Math.min(skillMax,maxLetters-total));
    if(!skill)continue;
    picked.push({...skill,cardType:'skill'});
    total+=maxLanguageLength(skill);

    while(picked.length<count){
      const normal=drawDeckWord(state,'normal',picked,maxLetters-total);
      if(!normal)break;
      picked.push({...normal,cardType:'normal'});
      total+=maxLanguageLength(normal);
    }
    if(picked.length===count)return shuffle(picked);
  }

  // Absolute fallback: preserve one skill card even if filters are tight.
  const source=filteredWordBank().filter(w=>maxLanguageLength(w)<=Math.min(8,maxLetters));
  const skill=source.find(w=>wordMatchesRoot(actor,w)&&maxLanguageLength(w)<=skillMax)||source.find(w=>maxLanguageLength(w)<=skillMax)||source[0];
  const normals=source.filter(w=>!wordMatchesRoot(actor,w)&&w.word!==skill?.word).slice(0,Math.max(0,count-1));
  return shuffle([{...skill,cardType:'skill'},...normals.map(w=>({...w,cardType:'normal'}))]).slice(0,count);
}

const EXTRA_PLAYABLE_WORDS=[
  {word:'BAT',parts:['bat'],en:'A small flying mammal active at night','hintJp':'夜に飛ぶ小さな哺乳類','wordJp':'コウモリ',freq:1800}
];
const ALLOWED_TWO_LETTER_WORDS=new Set(['NO','GO','UP','IN','ON','TO','WE','ME','HE','IT','IS','AS','AM','AN','AT','BY','OR','OF']);
const DISALLOWED_SHORT_WORDS=new Set(['NA']);
function playableWordBank(){
  const byWord=new Map();
  [...EXTRA_PLAYABLE_WORDS,...wordBank].forEach(w=>{
    const word=String(w.word||'').toUpperCase().replace(/[^A-Z]/g,'');
    if(!word||DISALLOWED_SHORT_WORDS.has(word))return;
    if(word.length<2)return;
    if(word.length===2&&!ALLOWED_TWO_LETTER_WORDS.has(word))return;
    if(!byWord.has(word))byWord.set(word,{...w,word});
  });
  return [...byWord.values()];
}
function getWildDeckState(index,actor){
  const key=`${langMode}:${index}:${difficultyLevel}:${hardMode?'hard':'standard'}`;
  const source=filteredWordBank().filter(w=>maxLanguageLength(w)<=8);
  const rootSkillSource=source.filter(w=>wordMatchesRoot(actor,w)&&maxLanguageLength(w)>=2&&maxLanguageLength(w)<=4);
  const skillSource=rootSkillSource.length?rootSkillSource:source.filter(w=>maxLanguageLength(w)>=2&&maxLanguageLength(w)<=4);
  const normalSource=source.filter(w=>!wordMatchesRoot(actor,w));
  let state=wildDecks[key];
  if(!state||state.skillSourceSize!==skillSource.length||state.normalSourceSize!==normalSource.length){
    state=wildDecks[key]={
      skill:shuffle(skillSource.slice()),
      normal:shuffle(normalSource.slice()),
      skillSource,
      normalSource,
      skillSourceSize:skillSource.length,
      normalSourceSize:normalSource.length
    };
  }
  return state;
}

function drawDeckWord(state,type,picked,remainingLetters){
  const source=type==='skill'?state.skillSource:state.normalSource;
  let deck=state[type];
  let guard=0;
  while(guard<Math.max(20,source.length*2)){
    if(!deck.length){
      deck=state[type]=shuffle(source.slice());
    }
    const next=deck.pop();
    guard++;
    if(!next)continue;
    const len=maxLanguageLength(next);
    if(len>remainingLetters)continue;
    if(picked.some(w=>hasWordOverlap(w.word,next.word)))continue;
    return next;
  }
  return source.find(next=>maxLanguageLength(next)<=remainingLetters&&!picked.some(w=>hasWordOverlap(w.word,next.word)))||null;
}
function hasWordOverlap(a,b){
  return a===b||a.includes(b)||b.includes(a);
}

function filteredWordBank(){
  const bank=playableWordBank();
  const filtered=hardMode
    ? bank.filter(w=>w.freq>=3000&&w.freq<=9999)
    : bank.filter(w=>w.freq>=0&&w.freq<=2000&&String(w.word||'').length<=6);
  return filtered.length?filtered:bank;
}

function rowToWord(row){

  const parts=partsText.split(/[-\s]+/).map(p=>p.replace(/[^A-Za-z]/g,'').toLowerCase()).filter(Boolean);

function parseCsv(text){
  const lines=[];let row=[],cell='',quote=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch==='"'&&quote&&next==='"'){cell+='"';i++;continue}
    if(ch==='"'){quote=!quote;continue}
    if(ch===','&&!quote){row.push(cell);cell='';continue}
    if((ch==='\n'||ch==='\r')&&!quote){
      if(ch==='\r'&&next==='\n')i++;
      row.push(cell);cell='';
      if(row.some(v=>v.trim()))lines.push(row);
      row=[];continue;
    }
    cell+=ch;
  }
  row.push(cell);
  if(row.some(v=>v.trim()))lines.push(row);
  const headers=lines.shift().map(h=>h.trim().toLowerCase());
  return lines.map(cols=>Object.fromEntries(headers.map((h,i)=>[h,cols[i]||''])));
}

function findRandomWalk(total,cols,rows){
  const maxTries=900;
  for(let i=0;i<maxTries;i++){
    const start={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)};
    const result=extendWalk([start],new Set([keyOf(start)]),total,cols,rows);
    if(result&&hasEnoughTurns(result,total)) return result;
  }
  return snakeWalk(total,cols,rows);
}

function extendWalk(path,seen,total,cols,rows){
  if(path.length===total) return path.slice();
  const last=path[path.length-1];
  const nexts=neighbors(last,cols,rows)
    .filter(p=>!seen.has(keyOf(p)))
    .map(p=>Object.assign(p,{score:neighbors(p,cols,rows).filter(n=>!seen.has(keyOf(n))).length+Math.random()}))
    .sort((a,b)=>a.score-b.score);
  for(const n of nexts){
    seen.add(keyOf(n));path.push({x:n.x,y:n.y});
    const out=extendWalk(path,seen,total,cols,rows);
    if(out) return out;
    path.pop();seen.delete(keyOf(n));
  }
  return null;
}

function neighbors(p,cols,rows){
  return shuffle([{x:p.x+1,y:p.y},{x:p.x-1,y:p.y},{x:p.x,y:p.y+1},{x:p.x,y:p.y-1}])
    .filter(n=>n.x>=0&&n.x<cols&&n.y>=0&&n.y<rows);
}

function hasEnoughTurns(path,total){
  if(total<4) return true;
  let turns=0;
  for(let i=2;i<path.length;i++){
    const a=path[i-2],b=path[i-1],c=path[i];
    if((b.x-a.x)!==(c.x-b.x)||(b.y-a.y)!==(c.y-b.y)) turns++;
  }
  return turns>=Math.min(2,total-2);
}

function snakeWalk(total,cols,rows){
  const rowsList=[...Array(rows)].map((_,y)=>y);
  if(Math.random()<.5) rowsList.reverse();
  const path=[];
  rowsList.forEach((y,ri)=>{
    const xs=[...Array(cols)].map((_,x)=>x);
    if(ri%2) xs.reverse();
    xs.forEach(x=>path.push({x,y}));
  });
  if(Math.random()<.5) path.reverse();
  return path.slice(0,total);
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function keyOf(p){return `${p.x},${p.y}`;}
function isPalindrome(text){return text===[...text].reverse().join('')}

function findConfusableAnswerRoutes(src){
  const conflicts=[];
  src.words.forEach(w=>{
    const allowed=new Set([w.path.join(',')]);
    if(isPalindrome(w.word))allowed.add([...w.path].reverse().join(','));
    const routes=findRoutesForWord(src.cells,w.word);
    const extra=routes.find(route=>!allowed.has(route.join(',')));
    if(extra)conflicts.push({word:w.word,route:extra,path:w.path});
  });
  return conflicts;
}

function findRoutesForWord(srcCells,word){
  const routes=[];
  const letters=[...word];
  const byLetter=srcCells.filter(c=>c.l===letters[0]);
  byLetter.forEach(start=>walkWordRoute(start,[start.id],1,new Set([start.id])));
  return routes;

  function walkWordRoute(cell,path,index,seen){
    if(index===letters.length){routes.push(path.slice());return;}
    srcCells.forEach(next=>{
      if(seen.has(next.id)||next.l!==letters[index]||!areRouteNeighbors(cell,next))return;
      seen.add(next.id);path.push(next.id);
      walkWordRoute(next,path,index+1,seen);
      path.pop();seen.delete(next.id);
    });
  }
}

function areRouteNeighbors(a,b){
  const dx=Math.abs(a.x-b.x),dy=Math.abs(a.y-b.y);
  return (dx>0&&dy===0&&dx<=currentNeighborThreshold)||(dy>0&&dx===0&&dy<=currentNeighborThreshold);
}

function unlockAudio(){
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
}
function playSe(type='tap'){
  try{
    unlockAudio();
    const now=audioCtx.currentTime;
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    const data={
      tap:[520,0.035,0.045],
      join:[720,0.045,0.055],
      hint:[880,0.05,0.06],
      ok:[660,0.08,0.09],
      miss:[180,0.09,0.08]
    }[type]||[520,0.04,0.04];
    osc.type=type==='miss'?'sawtooth':'sine';
    osc.frequency.setValueAtTime(data[0],now);
    if(type==='ok')osc.frequency.exponentialRampToValueAtTime(980,now+data[1]);
    gain.gain.setValueAtTime(data[2],now);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+data[1]);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);osc.stop(now+data[1]+0.02);
  }catch(e){}
}
function startZoneMusic(){
  try{
    unlockAudio();
    if(!audioCtx||zoneMusicOsc)return;
    const now=audioCtx.currentTime;
    zoneMusicOsc=audioCtx.createOscillator();
    zoneMusicGain=audioCtx.createGain();
    zoneMusicOsc.type='square';
    zoneMusicGain.gain.setValueAtTime(0.0001,now);
    zoneMusicGain.gain.exponentialRampToValueAtTime(0.035,now+.08);
    zoneMusicOsc.frequency.setValueAtTime(392,now);
    zoneMusicOsc.connect(zoneMusicGain).connect(audioCtx.destination);
    zoneMusicOsc.start(now);
    const notes=[392,523,659,784,659,523];
    let i=0;
    zoneMusicTimer=setInterval(()=>{
      if(!audioCtx||!zoneMusicOsc)return;
      const t=audioCtx.currentTime;
      zoneMusicOsc.frequency.setTargetAtTime(notes[i++%notes.length],t,.025);
    },155);
  }catch(e){}
}
function stopZoneMusic(){
  if(zoneMusicTimer){clearInterval(zoneMusicTimer);zoneMusicTimer=null}
  try{
    if(zoneMusicGain&&audioCtx){
      const now=audioCtx.currentTime;
      zoneMusicGain.gain.setTargetAtTime(0.0001,now,.045);
      zoneMusicOsc?.stop(now+.18);
    }
  }catch(e){}
  zoneMusicOsc=null;zoneMusicGain=null;
}

function unlockSpeech(){
  if(!('speechSynthesis' in window)||speechUnlocked)return;
  speechUnlocked=true;
  try{
    speechSynthesis.resume();
    speechSynthesis.getVoices();
    const warmup=new SpeechSynthesisUtterance(' ');
    warmup.volume=0;
    warmup.lang='en-US';
    speechSynthesis.speak(warmup);
  }catch(e){}
}
function speakWord(word){
  if(!('speechSynthesis' in window))return;
  unlockSpeech();
  const requestId=++speechRequestId;
  const text=String(word||'').toLowerCase();
  let started=false;

  const attempt=(delay,resetQueue=false)=>{
    setTimeout(()=>{
      if(requestId!==speechRequestId||started)return;
      try{
        speechSynthesis.resume();
        if(resetQueue)speechSynthesis.cancel();
        const voices=speechSynthesis.getVoices();
        const isEnglish=v=>/^en/i.test(v.lang||'');
        englishVoice=voices.find(v=>/child|kid|girl|young|junior|amy|ivy|salli|joanna|samantha|victoria|zira/i.test(v.name)&&isEnglish(v))
          ||voices.find(v=>/female|woman|google us english/i.test(v.name)&&isEnglish(v))
          ||voices.find(isEnglish)
          ||null;
        const u=new SpeechSynthesisUtterance(text);
        u.lang='en-US';u.rate=.9;u.pitch=1.35;u.volume=1;
        if(englishVoice)u.voice=englishVoice;
        u.onstart=()=>{started=true;};
        speechSynthesis.speak(u);
      }catch(e){}
    },delay);
  };

  attempt(40,true);
  attempt(450,true);
  attempt(1200,true);
}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{
  englishVoice=null;
  speechSynthesis.resume();

function boardPoint(x,y){
  const r=board.getBoundingClientRect();
  // 盤面は310pxの論理座標をスマホ幅いっぱいに拡大している。
  // タッチ位置を論理座標へ戻し、見た目と判定を完全に一致させる。
  return {x:(x-r.left)*(310/r.width),y:(y-r.top)*(310/r.height)};
}
function cellAtPoint(x,y){
  const p=boardPoint(x,y);
  let best=null,dist=999;
  for(const c of cells){
    if(c.inactive)continue;
    if(solved.has(words[c.wordIndex]?.word))continue;
    const d=Math.hypot(c.x-p.x,c.y-p.y);
    if(d<currentHitRadius&&d<dist){best=c;dist=d}
  }
  return best;
}
function pointSegmentDistance(p,a,b){
  const dx=b.x-a.x,dy=b.y-a.y;
  const length2=dx*dx+dy*dy;
  if(!length2)return Math.hypot(p.x-a.x,p.y-a.y);
  const t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/length2));
  return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));
}
function autoHintWordAtPoint(x,y){
  const p=boardPoint(x,y);
  let best=null,bestDistance=Infinity;
  words.forEach((w,wordIndex)=>{
    if(solved.has(w.word))return;
    const length=autoHintLength(w);
    if(!length)return;
    const ids=w.path.slice(0,length);
    let distance=Infinity;
    ids.forEach(id=>{
      const c=cellById[id];
      distance=Math.min(distance,Math.hypot(c.x-p.x,c.y-p.y));
    });
    for(let i=1;i<ids.length;i++){
      distance=Math.min(distance,pointSegmentDistance(p,cellById[ids[i-1]],cellById[ids[i]]));
    }
    // 文字タイルと文字間の連結部をまとめて、一枚のブロックとして判定する。
    if(distance<=currentHitRadius+1&&distance<bestDistance){
      best={wordIndex,word:w,length};
      bestDistance=distance;
    }
  });
  return best;
}
function beginFromAutoHint(hit){
  const target=hit.word;
  const prefix=target.path.slice(0,hit.length);
  current=hit.wordIndex;
  reviewWordIndex=null;
  updateHint();
  selected.push(...prefix);
  prefix.forEach(id=>document.getElementById('cell-'+id)?.classList.add('hot'));
  updateActiveCells();
  setAnswer(selected.map(id=>cellById[id].l).join(''));
  drawActive();
  playSe('tap');
}
function start(e){
  unlockSpeech();
  hideMistakeHint();
  lastTraceFeedbackId=null;
  const p=e.touches?e.touches[0]:e;
  const c=cellAtPoint(p.clientX,p.clientY);
  if(c)showTappedWordInfo(c.wordIndex);
  const el=c?document.getElementById('cell-'+c.id):null;
  if(c&&el?.classList.contains('used')){
    if(e.cancelable)e.preventDefault();
    dragging=false;selected=[];
    reviewWordIndex=c.wordIndex;
    current=c.wordIndex;
    updateHint();
    playSe('tap');
    speakWord(words[c.wordIndex].word);
    return;
  }
  const autoHintHit=autoHintWordAtPoint(p.clientX,p.clientY);
  // 別の単語の文字タイルを直接触っている場合は、近くのヒント結合部より
  // そのタイルを優先する。頭文字ヒント使用後も他の単語をロックしない。
  const shouldBeginFromAutoHint=autoHintHit&&(!c||c.wordIndex===autoHintHit.wordIndex);
  if(shouldBeginFromAutoHint){
    if(e.cancelable)e.preventDefault();
    dragging=true;selected=[];clearActive();
    beginFromAutoHint(autoHintHit);
    return;
  }
  reviewWordIndex=null;
  dragging=true;selected=[];clearActive();pick(e);
}
function move(e){
  if(!dragging)return;

}
function traceMergedLetterFeedback(e){
  const p=e.touches?e.touches[0]:e;
  const c=cellAtPoint(p.clientX,p.clientY);
  if(!c||!selected.includes(c.id)||c.id===lastTraceFeedbackId)return;
  lastTraceFeedbackId=c.id;
  playSe('join');
  try{if(navigator.vibrate)navigator.vibrate(9)}catch(err){}
}
function end(){
  if(!dragging)return;
  dragging=false;
  const key=selected.join(',');
  const w=valid[key];
  if(w&&!solved.has(w.word)){
    const solvedPath=selected.slice();
    clearActive();
    solve(w);
    preserveSolvedShape(solvedPath);
    selected=[];setAnswer('');
  }else{
    const failedIds=selected.slice();
    const target=failedIds.length?words[cellById[failedIds[0]]?.wordIndex]:null;
    failSelection(failedIds,target);
    selected=[];
  }
}
function pick(e){
  if(e.cancelable)e.preventDefault();
  const p=e.touches?e.touches[0]:e;
  const c=cellAtPoint(p.clientX,p.clientY);if(!c)return;
  showTappedWordInfo(c.wordIndex);
  if(document.getElementById('cell-'+c.id).classList.contains('used'))return;

  if(!selected.length){
    current=c.wordIndex;
    initialChoiceMade=true;
    updateHint();

  }

  if(selected.at(-1)===c.id)return;
  if(selected.includes(c.id))return;
  if(!isAllowedNext(c.id))return;
  selected.push(c.id);document.getElementById('cell-'+c.id).classList.add('hot','pulse');
  lastTraceFeedbackId=c.id;
  playSe(selected.length>1?'join':'tap');
  updateActiveCells();
  setAnswer(selected.map(id=>cellById[id].l).join(''));drawActive();
}

function isAllowedNext(id){
  if(!selected.length)return true;

  // 生成済みの正解ルートを最優先する。
  // 画面拡大や端数丸めで中心間距離が閾値を少し超えても、
  // 正解語の次文字なら必ず接続可能にする。
  const exactWord=words.find(w=>pathAllowsNext(w.path,id)||(isPalindrome(w.word)&&pathAllowsNext([...w.path].reverse(),id)));
  if(exactWord){
    if(exactWord.cardType!=='skill')return true;
    const a=cellById[selected.at(-1)],b=cellById[id];
    return gridAdjacent(a,b);
  }

  const a=cellById[selected.at(-1)],b=cellById[id];
  if(!a||!b)return false;
  const dx=Math.abs(a.x-b.x),dy=Math.abs(a.y-b.y);
  return (dx>0&&dy===0&&dx<=currentNeighborThreshold)||(dy>0&&dx===0&&dy<=currentNeighborThreshold);
}
function pathAllowsNext(path,id){
  if(selected.length>=path.length)return false;
  for(let i=0;i<selected.length;i++)if(path[i]!==selected[i])return false;
  return path[selected.length]===id;
}

function activeRegionGroups(removed=solved){
  const map=new Map();
  cells.forEach(c=>{
    if(c.inactive)return;
    const w=words[c.wordIndex];if(!w||removed.has(w.word)||removed.has(c.wordIndex))return;
    if(!map.has(c.regionId))map.set(c.regionId,[]);map.get(c.regionId).push(c);
  });
  return [...map.values()];
}
function simulateRigidPhysics(simCells,removedIndexes,grid){
  const active=simCells.filter(c=>!removedIndexes.has(c.wordIndex));
  const skill=words.find(w=>w.cardType==='skill');
  if(skill)autoJoinSkillCells(active,skill,grid);

function occupiedLineIndexes(active,axis,grid){
  const limit=axis==='x'?grid.width:grid.height;
  const used=new Set(active.map(c=>axis==='x'?c.gx:c.gy));
  return [...Array(limit).keys()].filter(i=>used.has(i));
}
function internalGapLineMap(indexes){
  const map=new Map();
  if(!indexes.length)return map;

  // 端の空白は無視する。
  // 最初に使われているラインはその位置に固定し、
  // その後ろにある「内部の完全空白ライン」だけを詰める。
  const sorted=[...indexes].sort((a,b)=>a-b);
  const anchor=sorted[0];
  sorted.forEach((oldIndex,i)=>map.set(oldIndex,anchor+i));
  return map;
}
function collapseOnlyFullEmptyLines(active,grid){
  if(!active.length)return;

  const occupiedCols=occupiedLineIndexes(active,'x',grid);
  const occupiedRows=occupiedLineIndexes(active,'y',grid);

  // 左右端・上下端の空白は全体移動の理由にしない。
  // 途中に完全空白ラインがある場合のみ、その先のラインを詰める。
  const colMap=internalGapLineMap(occupiedCols);
  const rowMap=internalGapLineMap(occupiedRows);

  active.forEach(c=>{
    if(colMap.has(c.gx))c.gx=colMap.get(c.gx);
    if(rowMap.has(c.gy))c.gy=rowMap.get(c.gy);
  });
}
function compactRigidLayoutToCenter(active,grid){
  // 互換用の関数名は残すが、常時中央収束は行わない。
  collapseOnlyFullEmptyLines(active,grid);
}
function assertRigidRegionShapesBeforeAfter(before,active){
  const byRegion=new Map();
  active.forEach(c=>{if(!byRegion.has(c.regionId))byRegion.set(c.regionId,[]);byRegion.get(c.regionId).push(c)});
  for(const [regionId,group] of byRegion){
    const old=before.get(regionId);if(!old)continue;
    const minX=Math.min(...group.map(c=>c.gx)),minY=Math.min(...group.map(c=>c.gy));
    const normalized=group.map(c=>`${c.gx-minX},${c.gy-minY}`).sort().join('|');
    if(normalized!==old)throw new Error(`Rigid region shape changed: ${regionId}`);
  }
}
function snapshotRigidShapes(active){
  const out=new Map(),ids=[...new Set(active.map(c=>c.regionId))];
  ids.forEach(id=>{
    const group=active.filter(c=>c.regionId===id);
    const minX=Math.min(...group.map(c=>c.gx)),minY=Math.min(...group.map(c=>c.gy));
    out.set(id,group.map(c=>`${c.gx-minX},${c.gy-minY}`).sort().join('|'));
  });
  return out;
}
function autoJoinSkillCells(active,skill,grid){
  if(!skill||skill.cardType!=='skill')return false;
  const byId=Object.fromEntries(active.map(c=>[c.id,c]));
  const splitIndexes=(skill.splitIndexes&&skill.splitIndexes.length?skill.splitIndexes:[skill.splitIndex]).filter(n=>Number.isFinite(n)&&n>0&&n<skill.path.length).sort((a,b)=>a-b);
  if(!splitIndexes.length)return false;
  const cuts=[0,...splitIndexes,skill.path.length];
  let movedAny=false;
  for(let fi=0;fi<cuts.length-2;fi++){
    const leftIds=skill.path.slice(cuts[fi],cuts[fi+1]);
    const rightIds=skill.path.slice(cuts[fi+1],cuts[fi+2]);
    if(!leftIds.length||!rightIds.length)continue;
    const latest=Object.fromEntries(active.map(c=>[c.id,c]));
    const leftEnd=latest[leftIds[leftIds.length-1]];
    const rightStart=latest[rightIds[0]];
    if(!leftEnd||!rightStart)continue;
    const dx=rightStart.gx-leftEnd.gx;
    const dy=rightStart.gy-leftEnd.gy;
    if(Math.abs(dx)+Math.abs(dy)<=1)continue;
    const horizontal=dy===0;
    const vertical=dx===0;
    if(!horizontal&&!vertical)continue;
    const stepX=horizontal?(dx>0?1:-1):0;
    const stepY=vertical?(dy>0?1:-1):0;
    const leftGroup=leftIds.map(id=>latest[id]).filter(Boolean);
    const rightGroup=rightIds.map(id=>latest[id]).filter(Boolean);
    if(leftGroup.length!==leftIds.length||rightGroup.length!==rightIds.length)continue;
    const movedLeft=moveSkillGroupOneStep(leftGroup,active,stepX,stepY,grid);
    const afterLeft=Object.fromEntries(active.map(c=>[c.id,c]));
    const a=afterLeft[leftIds[leftIds.length-1]],b=afterLeft[rightIds[0]];
    const closed=a&&b&&Math.abs(b.gx-a.gx)+Math.abs(b.gy-a.gy)<=1;
    const movedRight=closed?false:moveSkillGroupOneStep(rightGroup,active,-stepX,-stepY,grid);
    if(movedLeft||movedRight)movedAny=true;
  }
  return movedAny;
}
function moveSkillGroupOneStep(group,active,dx,dy,grid){
  if(!group.length||(dx===0&&dy===0))return false;
  const own=new Set(group.map(c=>c.id));
  const occupied=new Set(active.filter(c=>!own.has(c.id)).map(c=>`${c.gx},${c.gy}`));
  for(const c of group){
    const nx=c.gx+dx,ny=c.gy+dy;
    if(nx<0||nx>=grid.width||ny<0||ny>=grid.height)return false;
    if(occupied.has(`${nx},${ny}`))return false;
  }
  group.forEach(c=>{c.gx+=dx;c.gy+=dy});
  return true;
}
function rigidGroupsForActive(active){
  const map=new Map();
  active.forEach(c=>{
    if(!map.has(c.regionId))map.set(c.regionId,[]);
    map.get(c.regionId).push(c);
  });
  return [...map.values()];
}
function gravityPassForRigidGroups(rigid,all,grid){
  let movedPass=false,guard=0,moved=true;
  while(moved&&guard++<60){
    moved=false;
    rigid.sort((a,b)=>Math.max(...b.map(c=>c.gy))-Math.max(...a.map(c=>c.gy)));
    for(const g of rigid){
      if(!g.length)continue;
      const own=new Set(g.map(c=>c.id));
      const others=new Set(all.filter(c=>!own.has(c.id)).map(c=>`${c.gx},${c.gy}`));
      let can=true;
      for(const c of g){
        const ny=c.gy+1;
        if(ny>=grid.height||others.has(`${c.gx},${ny}`)){can=false;break}
      }
      if(can){g.forEach(c=>{c.gy+=1});moved=true;movedPass=true}
    }
  }
  return movedPass;
}
function settleSimulatedSkill(active,skill,grid){
  const rigid=rigidGroupsForActive(active);
  for(let i=0;i<24;i++){
    const fellBefore=gravityPassForRigidGroups(rigid,active,grid);
    let pulled=false;
    for(let p=0;p<12;p++){
      if(!autoJoinSkillCells(active,skill,grid))break;
      pulled=true;
    }
    const fellAfter=gravityPassForRigidGroups(rigid,active,grid);
    if(!fellBefore&&!pulled&&!fellAfter)break;
  }
}
function tryAutoJoinSkillFragments(){
  const skill=words.find(w=>w.cardType==='skill'&&!solved.has(w.word));
  if(!skill)return false;
  const active=activeRegionGroups().flat();

  cellById=Object.fromEntries(cells.map(c=>[c.id,c]));
  lanes.innerHTML='';clearActive();renderAutoHints();updateHint();updateRootMatchHighlights();

function settleBoardWithGravity(){
  const groups=activeRegionGroups();
  if(!groups.length)return false;
  // 単語ごとの領域は剛体。順序は「自然落下完了 -> 横方向の中央寄せ -> 再落下」に固定する。
  const rigid=groups.slice();
  const all=rigid.flat();
  const skill=words.find(w=>w.cardType==='skill'&&!solved.has(w.word));
  let movedAny=false;

  const runCycle=(remaining=8)=>{
    if(remaining<=0){saveActiveWildBoard();return}
    const fellBefore=gravityPassForRigidGroups(rigid,all,regionGrid);
    if(fellBefore){
      movedAny=true;
      applySettledPositions(all,360);
      setTimeout(()=>runPull(remaining),360);
      return;
    }
    runPull(remaining);
  };

  const runPull=(remaining)=>{
    let pulled=false;
    if(skill){
      for(let p=0;p<12;p++){
        if(!autoJoinSkillCells(all,skill,regionGrid))break;
        pulled=true;
      }
    }
    if(pulled){
      movedAny=true;
      applySettledPositions(all,320);
      setTimeout(()=>runCycle(remaining-1),320);
      return;
    }
    saveActiveWildBoard();
  };

  runCycle();
  return movedAny;
}

  solved.add(w.word);setAnswer(w.path.map(id=>cellById[id]?.l||'').join(''),true);
  playSe('ok');speakWord(w.word);
  w.path.forEach(id=>document.getElementById('cell-'+id)?.classList.add('used'));
  renderAutoHints();current=(words.indexOf(w)+1)%words.length;
  setTimeout(()=>{if(epoch===puzzleEpoch)vanishSolvedWord(w,epoch)},30);
  setTimeout(()=>{if(epoch===puzzleEpoch)setAnswer('')},650);
  const remaining=words.filter(x=>!solved.has(x.word));
  if(remaining.length===1){current=words.indexOf(remaining[0]);reviewWordIndex=null;updateHint();}
  updateRootMatchHighlights();
  saveActiveWildBoard();
  if(remaining.length)setTimeout(()=>{if(epoch===puzzleEpoch)settleBoardWithGravity()},720);
  if(!remaining.length)setTimeout(()=>{
    if(epoch!==puzzleEpoch)return;
    clearActiveWildBoard();
    stageIndex++;
    loadPuzzle(puzzleCount);
  },720);
}

function mixCssColors(a,b,t){
  const ca=parseCssColor(a),cb=parseCssColor(b);
  const mix=(x,y)=>Math.round(x+(y-x)*t);
  return `rgb(${mix(ca[0],cb[0])},${mix(ca[1],cb[1])},${mix(ca[2],cb[2])})`;
}
function parseCssColor(value){
  if(value.startsWith('#')){
    const n=parseInt(value.slice(1),16);
    return [(n>>16)&255,(n>>8)&255,n&255];
  }
  const m=value.match(/\d+(?:\.\d+)?/g);
  return m?[Number(m[0]),Number(m[1]),Number(m[2])]:[71,118,241];
}
function shapePathForIds(ids,radius=8){
  const rects=[];
  const half=currentCellSize/2;
  ids.forEach(id=>{
    const c=cellById[id];
    rects.push([c.x-half,c.y-half,c.x+half,c.y+half]);
  });
  for(let i=1;i<ids.length;i++){
    const a=cellById[ids[i-1]],b=cellById[ids[i]];
    if(a.y===b.y)rects.push([Math.min(a.x,b.x)+half,a.y-half,Math.max(a.x,b.x)-half,a.y+half]);
    else rects.push([a.x-half,Math.min(a.y,b.y)+half,a.x+half,Math.max(a.y,b.y)-half]);
  }
  return outlinePath(rects,radius);
}
function outlinePath(rects,radius=0){
  const edges=new Map();
  const add=(a,b)=>{
    const key=a.join(',')+'|'+b.join(','),rev=b.join(',')+'|'+a.join(',');
    if(edges.has(rev))edges.delete(rev);else edges.set(key,{a,b});
  };
  rects.filter(r=>r[2]>r[0]&&r[3]>r[1]).forEach(([x1,y1,x2,y2])=>{
    add([x1,y1],[x2,y1]);add([x2,y1],[x2,y2]);add([x2,y2],[x1,y2]);add([x1,y2],[x1,y1]);
  });
  const byStart=new Map();
  edges.forEach(e=>{
    const k=e.a.join(',');
    if(!byStart.has(k))byStart.set(k,[]);
    byStart.get(k).push(e);
  });
  const parts=[];
  while(edges.size){
    const first=edges.values().next().value;
    const start=first.a.join(',');
    let e=first,points=[e.a];
    while(e){
      edges.delete(e.a.join(',')+'|'+e.b.join(','));
      points.push(e.b);
      const nexts=(byStart.get(e.b.join(','))||[]).filter(n=>edges.has(n.a.join(',')+'|'+n.b.join(',')));
      e=nexts[0];
      if(!e||e.a.join(',')===start)break;
    }
    if(points.length>1&&points.at(-1).join(',')===points[0].join(','))points.pop();
    parts.push(radius?roundedLoop(points,radius):points.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join('')+'Z');
  }
  return parts.join('');
}
function roundedLoop(points,r){
  if(points.length<3)return '';
  const len=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  const pointToward=(from,to,d)=>{
    const l=len(from,to)||1;
    return [from[0]+(to[0]-from[0])*d/l,from[1]+(to[1]-from[1])*d/l];
  };
  let d='';
  for(let i=0;i<points.length;i++){
    const prev=points[(i-1+points.length)%points.length],cur=points[i],next=points[(i+1)%points.length];
    const straight=(prev[0]===cur[0]&&cur[0]===next[0])||(prev[1]===cur[1]&&cur[1]===next[1]);
    if(straight){
      if(!d)d=`M${cur[0]} ${cur[1]}`;else d+=`L${cur[0]} ${cur[1]}`;
      continue;
    }
    const rr=Math.min(r,len(cur,prev)/2,len(cur,next)/2);
    const a=pointToward(cur,prev,rr),b=pointToward(cur,next,rr);
    if(!d)d=`M${a[0]} ${a[1]}`;else d+=`L${a[0]} ${a[1]}`;
    d+=`Q${cur[0]} ${cur[1]} ${b[0]} ${b[1]}`;
  }
  return d+'Z';
}

async function runTurn(w){
  if(defeated||!enemies.some(e=>e.hp>0))return;
  const len=w.word.length;
  const isSkill=w.cardType==='skill';
  const pSpd=PLAYER.spd/len;
  setNarrative(isSkill?'SKILL CARD':'WORD FOUND',definitionLine(w));
  await sleep(430);
  await absorbWordToZone(w,isSkill);
  if(zoneActive){
    if(isSkill)await playSkillBurst(w);
    await flyLetterAttack(w,isSkill);
    if(!enemies.some(e=>e.hp>0)){await nextWave();return}
    return;
  }
  // 攻撃カウントを進め、行動予定の敵を確定
  const due=[];
  enemies.forEach(e=>{if(e.hp>0){e.count--;if(e.count<=0)due.push(e)}});
  updateEnemyUI();
  const pre=due.filter(e=>e.spd/5>pSpd);
  const post=due.filter(e=>e.spd/5<=pSpd);
  if(due.length){
    const fastest=due.reduce((a,b)=>a.spd>b.spd?a:b);
    const first=pre.length?`${pre[0].name}が先制！`:'こちらが先手！';
    await say(`速度判定: YOU ${PLAYER.spd}÷${len}文字=${fmt1(pSpd)} ／ ${fastest.name} ${fastest.spd}÷5=${fmt1(fastest.spd/5)} → ${first}`,520);
  }
  for(const e of pre){await enemyAttack(e);if(defeated)return}
  await say('ブロックの力が ゾーンゲージに たまった！',360);
  for(const e of post){if(e.hp>0){await enemyAttack(e);if(defeated)return}}
}

  for(let i=0;i<w.path.length;i++){
    const cell=cellById[w.path[i]];
    if(cell)launchLetterToZone(cell,isSkill);
    addZone(isSkill?2:1);

  }

async function flyLetterAttack(w,isSkill){
  const mult=isSkill?2.2:1;
  const aliveIdxs=()=>enemies.map((e,i)=>e.hp>0?i:-1).filter(i=>i>=0);
  await say(isSkill
    ?`必殺カード「${w.word}」！ 全体に ${w.path.length}連撃！`
    :`「${w.word}」で攻撃！ ${w.path.length}文字 → ${w.path.length}連撃！`,420);
  await playAllyAttackFx();
  await sleep(120);
  let total=0,n=0;
  for(let i=0;i<w.path.length;i++){
    const alive=aliveIdxs();
    if(!alive.length)break;
    const t=isSkill?alive[n%alive.length]:validTarget();
    n++;
    if(t<0)break;
    await sleep(95);
    const e=enemies[t];
    const dmg=calcDmg(PLAYER.atk*mult,e.def);
    e.hp=Math.max(0,e.hp-dmg);
    total+=dmg;
    hitEnemyFx(t,dmg,isSkill);
    updateEnemyUI();
    if(e.hp<=0)await enemyKO(t);
    await sleep(60);
  }
  await sleep(300);
  await say(`あわせて ${total} ダメージ！`,460);
}

let skillActorTurn=0;
function getSkillActorPool(){
  return (party&&party.length?party:WILD_DEFS).slice(0,Math.max(1,Math.min(3,puzzleCount||3)));
}
function pickSkillActor(){
  const roster=getSkillActorPool();
  const idx=skillActorTurn%roster.length;
  skillActorTurn=(skillActorTurn+1)%9999;
  activeAlly=idx;
  return {actor:roster[idx], actorIndex:idx};
}
function wordMatchesRoot(actor,w){
  const word=(w?.word||'').toUpperCase();
  return !!actor&&Array.isArray(actor.keywords)&&actor.keywords.some(k=>word===k||word.includes(k));
}
function moveNameFor(actor,w){
  const moves=actor?.moves&&actor.moves.length?actor.moves:['スペシャルバースト'];
  const seed=((w?.word||'').length + (w?.freq||0))%moves.length;
  return moves[seed];
}
function buildPickPool(count,gridSize){
  const maxLetters=gridSize*gridSize;
  const skillMax=Math.min(4,gridSize-1,maxLetters);
  const source=shuffle(filteredWordBank().filter(w=>maxLanguageLength(w)<=Math.min(8,maxLetters)).slice());
  const {actor,actorIndex}=pickSkillActor();
  const skillCandidates=source.filter(w=>wordMatchesRoot(actor,w)&&maxLanguageLength(w)>=2&&maxLanguageLength(w)<=skillMax);
  const fallbackCandidates=source.filter(w=>maxLanguageLength(w)>=2&&maxLanguageLength(w)<=skillMax);
  const skillBase=(skillCandidates[0]||fallbackCandidates[0]||source[0]);
  if(!skillBase)return [];
  const picked=[{...skillBase,cardType:'skill',actorIndex,skillName:moveNameFor(actor,skillBase)}];
  let total=maxLanguageLength(skillBase);
  for(const cand of source){
    if(picked.length>=count)break;
    if(cand.word===skillBase.word)continue;
    const len=maxLanguageLength(cand);
    if(total+len>maxLetters)continue;
    if(picked.some(w=>hasWordOverlap(w.word,cand.word)))continue;
    picked.push({...cand,cardType:'normal'});
    total+=len;
  }
  return picked.slice(0,count);
}
function pickWords(count,gridSize=4){
  for(let attempt=0;attempt<30;attempt++){
    const picked=buildPickPool(count,gridSize);
    if(picked.length===count)return picked;
  }
  return buildPickPool(count,gridSize);
}

    : `Trigger Word: ${w.word} / ${(w.en||'Special word').split(/[.!?]/)[0]}`;

}

/* ===== Steam / landscape behaviour layer ===== */
const LANDSCAPE_BOARD_W=880;
const LANDSCAPE_BOARD_H=330;
const LANDSCAPE_COLS=9;
const LANDSCAPE_ROWS=3;
let keyboardBuffer='';
let landscapeSpawnAnimating=false;
function publishLandscapeState(){
  document.documentElement.dataset.landscapeWords=JSON.stringify(words.map(w=>({word:w.word,path:w.path.length,solved:solved.has(w.word),jp:w.jp})));
  document.documentElement.dataset.landscapeRemaining=JSON.stringify(words.filter(w=>!solved.has(w.word)).map(w=>w.word));
}
function moveRigidGroupIfFree(group,all,dx,dy,grid){
  if(!group.length||(dx===0&&dy===0))return false;
  const own=new Set(group.map(c=>c.id));
  const occupied=new Set(all.filter(c=>!own.has(c.id)).map(c=>gridKey(c.gx,c.gy)));
  for(const c of group){
    const nx=c.gx+dx,ny=c.gy+dy;
    if(nx<0||nx>=grid.width||ny<0||ny>=grid.height)return false;
    if(occupied.has(gridKey(nx,ny)))return false;
  }
  group.forEach(c=>{c.gx+=dx;c.gy+=dy});
  return true;
}
function compactRigidGroupsTowardCenter(rigid,all,grid){
  let movedAny=false;
  for(let guard=0;guard<40;guard++){
    let moved=false;
    const ordered=rigid.slice().sort((a,b)=>{
      const ca=a.reduce((s,c)=>s+c.gx,0)/a.length;
      const cb=b.reduce((s,c)=>s+c.gx,0)/b.length;
      return Math.abs(cb-(grid.width-1)/2)-Math.abs(ca-(grid.width-1)/2);
    });
    for(const group of ordered){
      const center=group.reduce((s,c)=>s+c.gx,0)/group.length;
      const target=(grid.width-1)/2;
      const dir=center<target?1:center>target?-1:0;
      if(dir&&moveRigidGroupIfFree(group,all,dir,0,grid)){
        moved=true;
        movedAny=true;
      }
    }
    if(!moved)break;
  }
  return movedAny;
}
function settleLandscapeInitial(src){
  const grid=src.grid;
  const active=src.cells.filter(c=>!c.inactive);
  const rigid=rigidGroupsForActive(active);
  for(let i=0;i<12;i++){
    const fellA=gravityPassForRigidGroups(rigid,active,grid);
    const centered=compactRigidGroupsTowardCenter(rigid,active,grid);
    const fellB=gravityPassForRigidGroups(rigid,active,grid);
    if(!fellA&&!centered&&!fellB)break;
  }
  active.forEach(c=>{
    const pos=gridToPixel(c.gx,c.gy,grid);
    c.x=pos.x;c.y=pos.y;
  });
  return src;
}

function makeRegionGrid(width=LANDSCAPE_COLS,height=LANDSCAPE_ROWS){
  width=Math.max(3,Math.min(9,width));
  height=Math.max(1,Math.min(3,height));
  const cellSize=84;
  const gap=10;
  const step=cellSize+gap;
  currentCellSize=cellSize;
  currentHitRadius=cellSize/2+8;
  currentNeighborThreshold=step+7;
  return {
    width,
    height,
    step,
    x0:Math.round((LANDSCAPE_BOARD_W-(width-1)*step)/2),
    y0:Math.round(LANDSCAPE_BOARD_H-cellSize/2-(height-1)*step)
  };
}
function gridToPixel(gx,gy,grid=regionGrid){
  return {x:Math.round(grid.x0+gx*grid.step),y:Math.round(grid.y0+gy*grid.step)};
}
function deriveRegionGrid(){
  return makeRegionGrid(LANDSCAPE_COLS,LANDSCAPE_ROWS);
}
function boardPoint(x,y){
  const r=board.getBoundingClientRect();
  return {x:(x-r.left)*(LANDSCAPE_BOARD_W/r.width),y:(y-r.top)*(LANDSCAPE_BOARD_H/r.height)};
}
function landscapeWordLen(w){return modeLettersFor(w).length}
function chooseLandscapeWords(){
  const actor=party[activeAlly]||WILD_DEFS[activeAlly]||WILD_DEFS[0];
  const source=shuffle(filteredWordBank()
    .filter(w=>landscapeWordLen(w)>=2&&landscapeWordLen(w)<=8)
    .map(w=>({...w})));
  const skill=source.find(w=>wordMatchesRoot(actor,w)&&landscapeWordLen(w)>=2&&landscapeWordLen(w)<=6)
    || source.find(w=>landscapeWordLen(w)>=2&&landscapeWordLen(w)<=5)
    || source[0];
  const picked=[];
  if(skill)picked.push({...skill,cardType:'skill',actorIndex:activeAlly,skillName:moveNameFor(actor,skill)});
  for(const w of source){
    if(picked.length>=5)break;
    if(!w||picked.some(p=>p.word===w.word))continue;
    const len=landscapeWordLen(w);
    const used=picked.reduce((sum,p)=>sum+landscapeWordLen(p),0);
    if(used+len>24)continue;
    picked.push({...w,cardType:'normal'});
  }
  return picked;
}
function gridKey(gx,gy){return `${gx},${gy}`}
function freeLandscapeCells(occupied){
  const out=[];
  for(let gy=0;gy<LANDSCAPE_ROWS;gy++){
    for(let gx=0;gx<LANDSCAPE_COLS;gx++){
      if(!occupied.has(gridKey(gx,gy)))out.push({gx,gy});
    }
  }
  return shuffle(out);
}
function randomLandscapeSkillLayout(len){
  const gap=Math.random()<.55?1:2;
  const split=Math.max(1,Math.min(len-1,1+Math.floor(Math.random()*(len-1))));
  const leftLen=split;
  const rightLen=len-split;
  const layouts=[];
  for(const dir of shuffle([{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}])){
    const total=len+gap;
    if(dir.dx!==0&&total>LANDSCAPE_COLS)continue;
    if(dir.dy!==0&&total>LANDSCAPE_ROWS)continue;
    for(let attempt=0;attempt<80;attempt++){
      const start={
        gx:Math.floor(Math.random()*LANDSCAPE_COLS),
        gy:Math.floor(Math.random()*LANDSCAPE_ROWS)
      };
      const path=[],blockers=[];
      let ok=true;
      for(let i=0;i<leftLen;i++)path.push({gx:start.gx+dir.dx*i,gy:start.gy+dir.dy*i});
      const afterLeft={gx:start.gx+dir.dx*leftLen,gy:start.gy+dir.dy*leftLen};
      for(let g=0;g<gap;g++)blockers.push({gx:afterLeft.gx+dir.dx*g,gy:afterLeft.gy+dir.dy*g});
      const rightStart={gx:afterLeft.gx+dir.dx*gap,gy:afterLeft.gy+dir.dy*gap};
      for(let i=0;i<rightLen;i++)path.push({gx:rightStart.gx+dir.dx*i,gy:rightStart.gy+dir.dy*i});
      for(const p of [...path,...blockers]){
        if(p.gx<0||p.gx>=LANDSCAPE_COLS||p.gy<0||p.gy>=LANDSCAPE_ROWS){ok=false;break}
      }
      const uniq=new Set([...path,...blockers].map(p=>gridKey(p.gx,p.gy)));
      if(ok&&uniq.size===path.length+blockers.length)layouts.push({path,blockers,splitIndexes:[split],gap,axis:dir.dx?'horizontal':'vertical'});
    }
  }
  return shuffle(layouts)[0]||null;
}
function placeLandscapeWord(def,wordCounter,pathCells,outCells,outWords,extra={}){
  const grid=regionGrid;
  const letters=lettersFor(def);
  const path=[];
  pathCells.forEach((p,li)=>{
    const item=letters[li];
    const id=`p${puzzleEpoch}_w${wordCounter}_${li}`;
    const pos=gridToPixel(p.gx,p.gy,grid);
    outCells.push({
      id,
      l:displayLetter(item.letter),
      slotIndex:li,
      gx:p.gx,
      gy:p.gy,
      x:pos.x,
      y:pos.y,
      wordIndex:wordCounter,
      syllableGroup:item.group,
      group:0,
      bg:null,
      regionId:extra.regionIdForSlot?extra.regionIdForSlot(li):`word:${wordCounter}`,
      fragmentIndex:extra.fragmentIndexForSlot?extra.fragmentIndexForSlot(li):null,
      fragmentEnd:extra.fragmentEndSlots?extra.fragmentEndSlots.has(li):false
    });
    path.push(id);
  });
  outWords.push({
    word:def.word,
    parts:[...def.parts],
    path,
    fullPath:[...path],
    en:def.en,
    jp:def.hintJp||def.jp,
    wordJp:def.wordJp,
    freq:def.freq,
    cardType:def.cardType||'normal',
    actorIndex:def.actorIndex,
    skillName:def.skillName,
    splitIndex:extra.splitIndexes?.[0],
    splitIndexes:extra.splitIndexes,
    skillAxis:extra.axis,
    skillGaps:extra.gaps
  });
}
function packLandscapeWords(defs){
  const grid=makeRegionGrid(LANDSCAPE_COLS,LANDSCAPE_ROWS);
  regionGrid=cloneBoardStateValue(grid);
  const cellsOut=[],wordsOut=[];
  const occupied=new Set();
  let wordCounter=0;
  const picked=defs.slice();
  const skillDef=picked.find(w=>w.cardType==='skill')||picked[0];
  if(!skillDef)return null;
  const skillLetters=lettersFor(skillDef);
  const skillLayout=randomLandscapeSkillLayout(skillLetters.length);
  if(!skillLayout)return null;
  const splitIndexes=skillLayout.splitIndexes;
  const splitEnds=new Set(splitIndexes.concat(skillLetters.length).map(i=>i-1));
  placeLandscapeWord(skillDef,wordCounter,skillLayout.path,cellsOut,wordsOut,{
    splitIndexes,
    axis:skillLayout.axis,
    gaps:[skillLayout.gap],
    regionIdForSlot:li=>`skill:${wordCounter}:${fragmentIndexForSlot(li,splitIndexes)}`,
    fragmentIndexForSlot:li=>fragmentIndexForSlot(li,splitIndexes),
    fragmentEndSlots:splitEnds
  });
  skillLayout.path.forEach(p=>occupied.add(gridKey(p.gx,p.gy)));
  wordCounter++;

  const normals=shuffle(picked.filter(w=>w!==skillDef&&w.word!==skillDef.word));
  let blockerQueue=skillLayout.blockers.slice();
  for(const def of normals){
    const len=lettersFor(def).length;
    if(len<1||len>8)continue;
    const mustInclude=blockerQueue[0]||null;
    const pathCells=findFreeConnectedPath(LANDSCAPE_COLS,LANDSCAPE_ROWS,len,occupied,mustInclude);
    if(!pathCells)continue;
    placeLandscapeWord(def,wordCounter,pathCells,cellsOut,wordsOut);
    pathCells.forEach(p=>occupied.add(gridKey(p.gx,p.gy)));
    blockerQueue=blockerQueue.filter(b=>!pathCells.some(p=>p.gx===b.gx&&p.gy===b.gy));
    wordCounter++;
    if(wordsOut.length>=5)break;
  }
  if(blockerQueue.length)return null;
  const src=applyCellPalettes({cells:cellsOut,words:wordsOut,grid:cloneBoardStateValue(grid)});
  if(!normalWordRegionsPlayable(src))return null;
  if(!skillEventuallyCompletable(src))return null;
  return stampFullPaths(settleLandscapeInitial(src));
}
function generatePuzzle(){
  for(let attempt=0;attempt<160;attempt++){
    const packed=packLandscapeWords(chooseLandscapeWords());
    if(packed&&packed.words.length>=3)return packed;
  }
  throw new Error('Unable to generate a landscape 10x3 board');
}
function updateMobileViewport(){
  const game=document.getElementById('game');
  const gameRect=game.getBoundingClientRect();
  const baseScale=Math.min((gameRect.width||1280)/1280,(gameRect.height||720)/720);
  const boardScale=Math.max(.62,Math.min(1,baseScale));
  game.style.setProperty('--board-scale',String(boardScale));
  game.style.setProperty('--battle-h','720px');
  lanes.setAttribute('viewBox',`0 0 ${LANDSCAPE_BOARD_W} ${LANDSCAPE_BOARD_H}`);
}
function resetKeyboardBuffer(){
  keyboardBuffer='';
  setAnswer('');
}
function collapseBoardForChange(){
  return new Promise(resolve=>{
    const live=[...document.querySelectorAll('.cell')];
    if(!live.length){resolve();return}
    board.classList.add('collapsing');
    live.forEach((el,i)=>{
      el.style.animationDelay=`${Math.min(180,i*12)}ms`;
    });
    playSe('miss');
    setTimeout(()=>{
      board.classList.remove('collapsing');
      resolve();
    },560);
  });
}
function handleKeyboardInput(e){
  if(document.getElementById('benchPanel')?.classList.contains('open'))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const key=e.key;
  if(/^[a-zA-Z]$/.test(key)){
    e.preventDefault();
    keyboardBuffer=(keyboardBuffer+key.toUpperCase()).slice(0,12);
    setAnswer(keyboardBuffer);
    const prefix=words.find(w=>!solved.has(w.word)&&w.word.startsWith(keyboardBuffer));
    if(prefix){
      const idx=words.indexOf(prefix);
      current=idx;
      showTappedWordInfo(idx);
    }
    const exact=words.find(w=>!solved.has(w.word)&&w.word===keyboardBuffer);
    if(exact){
      const solvedPath=exact.path.slice();
      clearActive();
      solve(exact);
      preserveSolvedShape(solvedPath);
      keyboardBuffer='';
      publishLandscapeState();
      setTimeout(()=>setAnswer(''),240);
    }
    return;
  }
  if(key==='Backspace'){
    e.preventDefault();
    keyboardBuffer=keyboardBuffer.slice(0,-1);
    setAnswer(keyboardBuffer);
    return;
  }
  if(key==='Escape'){
    e.preventDefault();
    resetKeyboardBuffer();
  }
}
function renderBenchPanel(){
  const list=document.getElementById('benchList');
  if(!list)return;
  list.innerHTML='';
  party.forEach((actor,i)=>{
    const hp=actor.hp??actor.maxHp??PLAYER.maxHp;
    const max=actor.maxHp??PLAYER.maxHp;
    const card=document.createElement('button');
    card.type='button';
    card.className='benchCard'+(i===activeAlly?' active':'')+(hp<=0?' dead':'');
    card.innerHTML=`
      <div class="benchFace">${actor.face||'🙂'}</div>
      <div><span class="benchName">${actor.name}</span><span class="benchLv">Lv${actor.lv||7+i}</span></div>
      <div class="benchHpText">HP ${hp} / ${max}</div>
      <div class="benchHpBar"><i style="width:${Math.max(0,Math.min(100,hp/max*100))}%"></i></div>
      <div class="benchMove">${(actor.moves||[]).slice(0,2).join(' / ')}</div>
    `;
    card.addEventListener('click',async()=>{
      if(i!==activeAlly)await switchAlly(i);
      closeBenchPanel();
    });
    list.appendChild(card);
  });
}
function openBenchPanel(){
  renderBenchPanel();
  const panel=document.getElementById('benchPanel');
  panel?.classList.add('open');
  panel?.setAttribute('aria-hidden','false');
}
function closeBenchPanel(){
  const panel=document.getElementById('benchPanel');
  panel?.classList.remove('open');
  panel?.setAttribute('aria-hidden','true');
}
function setupLandscapeUi(){
  puzzleCount=3;
  document.getElementById('switchOpenBtn')?.addEventListener('click',e=>{e.stopPropagation();openBenchPanel();});
  document.getElementById('benchCloseBtn')?.addEventListener('click',closeBenchPanel);
  document.getElementById('benchCloseShade')?.addEventListener('click',closeBenchPanel);
  window.addEventListener('keydown',handleKeyboardInput);
  window.__landscapeProto={
    words:()=>words.map(w=>({word:w.word,path:w.path.length,solved:solved.has(w.word),jp:w.jp})),
    solved:word=>solved.has(word),
    remaining:()=>words.filter(w=>!solved.has(w.word)).map(w=>w.word)
  };
  lanes.setAttribute('viewBox',`0 0 ${LANDSCAPE_BOARD_W} ${LANDSCAPE_BOARD_H}`);
}
const baseLandscapeLoadPuzzle=loadPuzzle;
loadPuzzle=function(count){
  landscapeSpawnAnimating=true;
  const result=baseLandscapeLoadPuzzle(count);
  setTimeout(()=>{landscapeSpawnAnimating=false},760);
  resetKeyboardBuffer();
  const wordInfo=document.getElementById('wordInfoText');
  if(wordInfo)wordInfo.textContent='';
  document.getElementById('wordInfoBar')?.classList.remove('show');
  publishLandscapeState();
  return result;
};
async function init(){
  setupLandscapeUi();
  updateMobileViewport();
  await loadWordBank();
  initBattle();
  loadPuzzle(puzzleCount);
}
init();
