const TSUMIKI_THEME=['どうぶつ','くだもの','やさい','のみもの','いえ','かぐ'];
const TZ_EMOJI={CAT:'🐱',BIRD:'🐦',DOG:'🐶',BANANA:'🍌',ORANGE:'🍊',APPLE:'🍎',CARROT:'🥕',ONION:'🧅',POTATO:'🥔',JUICE:'🧃',TEA:'🍵',WATER:'💧',MILK:'🥛',ROOM:'🛏️',HOME:'🏠',HOUSE:'🏡',DOOR:'🚪',SOFA:'🛋️',CHAIR:'🪑',TABLE:'🍽️'};
const TZ_PALETTE=['#ff8fb0','#7ecb6f','#b48ff2','#ffb74d','#5db4ff','#ff8a80','#4dd0c4','#f06292','#9ccc65','#ba9df5','#ffa726','#64b5f6','#ef9a9a'];
const tzColor=ch=>TZ_PALETTE[(ch.charCodeAt(0)-65)%TZ_PALETTE.length];
let tsumikiCleared=0;
function initTsumiki(host,onFinish){
  function levelSelect(){
    host.innerHTML=`<div class="mg-quiz" style="gap:10px">
      <div class="mg-prompt"><b>🧱 積木くずし</b>　文字をタップ → 上のハコへ。同じ文字3つでハコ完成！<br>対応ハコがない文字は「まちあい」へ（あふれたら失敗）。ブロックには英単語がかくれてる…</div>
      <div class="tz-levels">${[1,2,3,4,5,6].map(n=>{
        const locked=n>tsumikiCleared+1;
        return `<button class="tz-lv ${locked?'lk':''} ${n<=tsumikiCleared?'cl':''}" data-n="${n}" ${locked?'disabled':''}>${n<=tsumikiCleared?'⭐ ':''}Lv.${n}<span>${TSUMIKI_THEME[n-1]}${locked?' 🔒':''}</span></button>`;
      }).join('')}</div>
      <div class="mg-prompt" style="font-size:10px">原作：後藤 制作「char-screw」より移植（レベルデータ原作準拠）</div>
    </div>`;
    [...host.querySelectorAll('.tz-lv:not(.lk)')].forEach(b=>b.addEventListener('click',()=>play(+b.dataset.n)));
  }
  function play(n){
    const L=TSUMIKI_LEVELS[n];
    const cols=L.meta.width, pending=L.meta.pending, visN=L.meta.boxDef;
    const boxes=L.boxes.map(b=>({order:b[0],ch:b[1],slot:b[2],count:0,completed:false})).sort((a,b)=>a.order-b.order);
    const blocks=L.blocks.map((b,i)=>({id:i,x:b[0],y:b[1],sx:b[2],sy:b[3],chars:b[4].split(''),word:b[4],removed:false}));
    const rows=Math.max(...blocks.map(b=>b.y+b.sy-1));
    let buffer=[], overFlag=null;
    const visBoxes=()=>boxes.filter(b=>!b.completed).slice(0,visN);
    function drain(){ let moved=true; while(moved){ moved=false;
      for(let i=0;i<buffer.length;i++){ const bx=visBoxes().find(b=>b.ch===buffer[i]&&b.count<b.slot);
        if(bx){ bx.count++; buffer.splice(i,1); if(bx.count>=bx.slot) bx.completed=true; moved=true; break; } } } }
    function gravity(){ const canFall=b=>{ const below=b.y+b.sy; if(below>rows) return false;
        for(const o of blocks){ if(o.removed||o===b) continue;
          for(let c=b.x;c<b.x+b.sx;c++){ if(c>=o.x&&c<o.x+o.sx&&below>=o.y&&below<o.y+o.sy) return false; } } return true; };
      let moved=true; while(moved){ moved=false;
        blocks.filter(b=>!b.removed).sort((a,b)=>b.y-a.y).forEach(b=>{ if(canFall(b)){ b.y++; moved=true; } }); } }
    function tap(bi,ci){
      if(overFlag) return;
      const blk=blocks[bi]; const ch=blk.chars[ci]; if(ch===undefined) return;
      blk.chars.splice(ci,1);
      const bx=visBoxes().find(b=>b.ch===ch&&b.count<b.slot);
      if(bx){ bx.count++; if(bx.count>=bx.slot){ bx.completed=true; drain(); } }
      else { buffer.push(ch); if(buffer.length>pending){ overFlag='lose'; } }
      if(!blk.chars.length){ blk.removed=true; gravity(); }
      if(boxes.every(b=>b.completed)) overFlag='win';
      draw();
    }
    function draw(){
      const availW=(host.clientWidth||348)-24;
      const cell=Math.max(28,Math.floor(availW/cols));
      const fw=cols*cell, fh=rows*cell;
      const boxHTML=visBoxes().map(b=>{
        const c=tzColor(b.ch);
        return `<div class="tz-box ${b.count?'pulse':''}">${[...Array(b.slot)].map((_,k)=>`<span class="bch3 ${k<b.count?'':'dim'}" style="color:${c}">${b.ch}</span>`).join('')}</div>`;
      }).join('');
      const bufHTML=`<span class="blbl">まちあい</span>`
        +buffer.map(ch=>`<span class="bch2" style="color:${tzColor(ch)}">${ch}</span>`).join('')
        +[...Array(Math.max(0,pending-buffer.length))].map(()=>'<span class="bdot"></span>').join('');
      const blkHTML=blocks.filter(b=>!b.removed).map(b=>{
        const bw=b.sx*cell-6, bh=b.sy*cell-6;
        const emoji=(b.word.length>2&&b.sy>=2&&TZ_EMOJI[b.word])?`<div class="tzi" style="font-size:${Math.min(44,Math.floor(bh*0.42))}px">${TZ_EMOJI[b.word]}</div>`:'';
        const fs=Math.max(9,Math.min(Math.floor(bh*(emoji?0.3:0.62)),Math.floor((bw-6)/Math.max(1,b.chars.length)*1.15)));
        const chars=b.chars.map((c,ci)=>`<button class="tch" data-b="${b.id}" data-c="${ci}" style="color:${tzColor(c)};font-size:${fs}px">${c}</button>`).join('');
        return `<div class="tz-block" style="left:${(b.x-1)*cell+3}px;top:${(b.y-1)*cell+3}px;width:${bw}px;height:${bh}px">${emoji}<div class="tzl">${chars}</div></div>`;
      }).join('');
      const doneN=boxes.filter(b=>b.completed).length;
      host.innerHTML=`<div class="mg-quiz" style="gap:8px">
        <div class="tz-wrap">
          <div class="tz-lvhud"><span class="chip2">Lv.${n} ${TSUMIKI_THEME[n-1]}</span><span class="chip2">ハコ ${doneN}/${boxes.length}</span></div>
          <div class="tz-top">${boxHTML}</div>
          <div class="tz-buf">${bufHTML}</div>
          <div class="tz-field" style="width:${fw}px;height:${fh}px">${blkHTML}</div>
        </div>
        <button class="mg-btn js-quit" style="max-width:180px;background:var(--panel2);border:1px solid var(--line)">← レベル選択</button>
        <div class="mg-over ${overFlag?'':'hidden'} js-tover"><h3>${overFlag==='win'?'🎉 レベルクリア！':'💥 まちあいが あふれた…'}</h3><p class="js-tp"></p><button class="mg-btn recv js-trecv" style="display:${overFlag==='win'?'block':'none'}"></button><button class="mg-btn js-tnext"></button></div>
      </div>`;
      [...host.querySelectorAll('.tch')].forEach(el=>el.addEventListener('click',()=>tap(+el.dataset.b,+el.dataset.c)));
      host.querySelector('.js-quit').addEventListener('click',levelSelect);
      if(overFlag==='win'){
        tsumikiCleared=Math.max(tsumikiCleared,n);
        const exp=30+n*15+(pending-buffer.length)*5;
        host.querySelector('.js-tp').textContent='のこり まちあい '+(pending-buffer.length)+' 枠ボーナス！';
        const rb=host.querySelector('.js-trecv'); rb.textContent='🎁 経験値 +'+exp+' を受け取ってもどる'; rb.onclick=()=>onFinish(exp);
        const nx=host.querySelector('.js-tnext');
        if(n<6){ nx.textContent='▶ 次のレベルへ（+'+exp+'は自動受取）'; nx.onclick=()=>{ expPool+=exp; toast('🎁 経験値 +'+exp); play(n+1); }; }
        else { nx.textContent='🏆 全レベル制覇！ レベル選択へ'; nx.onclick=levelSelect; }
      } else if(overFlag==='lose'){
        host.querySelector('.js-tp').textContent='対応するハコが出てから 文字を外そう';
        const nx=host.querySelector('.js-tnext'); nx.textContent='↻ リトライ'; nx.onclick=()=>play(n);
      }
    }
    overFlag=null; draw();
  }
  levelSelect();
  return null;
}

// ===== ⑦ へびのともぐい（後藤さん原作 snake_eat の移植・英単語化アレンジ）=====
// 原作ルール準拠：頭をドラッグで1マスずつ移動（体がついてくる）。頭が「他のヘビのしっぽ」に重なると食べて合体。
// 英単語アレンジ（後藤指示）：各ヘビに1文字。C が A を食べると「CA」→ さらに T で「CAT」。
// 最後の1匹になって英単語が完成するとクリア→ その単語が辞典でアンロックされる。
// 食べられるのは「合体後の文字列がターゲット単語の先頭と一致」する時だけ（＝順番パズル）。
const SNAKE_LEVELS=[
  {word:'VIEW',ja:'眺め',cols:6,rows:6,walls:[[2,0],[3,0],[2,5]],snakes:[
    {s:'V',cells:[[1,2],[0,2]]},{s:'I',cells:[[3,2],[4,2]]},{s:'E',cells:[[1,4],[0,4]]},{s:'W',cells:[[4,4],[5,4]]}]},
  {word:'PORT',ja:'港',cols:6,rows:6,walls:[[1,3],[4,3],[3,1]],snakes:[
    {s:'P',cells:[[0,0],[0,1]]},{s:'O',cells:[[5,0],[5,1]]},{s:'R',cells:[[2,3],[2,4],[2,5]]},{s:'T',cells:[[5,5],[4,5]]}]},
  {word:'IDEA',ja:'考え',cols:6,rows:6,walls:[[2,2],[3,2],[2,3],[3,3]],snakes:[
    {s:'I',cells:[[0,2],[0,3]]},{s:'D',cells:[[3,0],[4,0]]},{s:'E',cells:[[5,3],[5,4]]},{s:'A',cells:[[1,5],[2,5],[3,5]]}]},
];
const SN_COLORS=['#8f7be8','#4bd6b0','#e0654a','#e5b53b','#5db4ff'];
function initSnake(host,onFinish){
  let timers=[];
  const later=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t);return t;};
  function levelSelect(){
    host.innerHTML=`<div class="mg-quiz" style="gap:10px">
      <div class="mg-prompt"><b>🐍 へびのともぐい</b>　頭をドラッグして移動。あたまが 相手の<b>しっぽ</b>にふれると たべて合体！<br>文字がつながって<b>英単語が完成</b>したらクリア → 辞典にアンロック！</div>
      <div class="tz-levels">${SNAKE_LEVELS.map((L,i)=>`<button class="tz-lv" data-n="${i}">Lv.${i+1}<span>${'？'.repeat(L.word.length)}（${L.word.length}文字）</span></button>`).join('')}</div>
      <div class="mg-prompt" style="font-size:10px">原作：後藤 制作「snake_eat（へびのともぐい）」より移植・英単語アレンジ</div>
    </div>`;
    [...host.querySelectorAll('.tz-lv')].forEach(b=>b.addEventListener('click',()=>play(+b.dataset.n)));
  }
  function play(idx){
    const L=SNAKE_LEVELS[idx], cols=L.cols, rows=L.rows, target=L.word;
    const snakes=L.snakes.map((s,i)=>({id:i,str:s.s,color:SN_COLORS[i%SN_COLORS.length],body:s.cells.map(c=>({x:c[0],y:c[1]})),el:[],removed:false}));
    const walls=L.walls.map(c=>({x:c[0],y:c[1]}));
    let eating=false, drag=null, lastStep=0, won=false;
    const availW=(host.clientWidth||348)-24;
    const cell=Math.max(34,Math.floor(availW/cols));
    host.innerHTML=`<div class="mg-quiz" style="gap:8px">
      <div class="sn-wrap">
        <div class="sn-hud"><span class="chip2">Lv.${idx+1}</span><span class="chip2">この単語をつくろう</span></div>
        <div class="sn-target js-tgt"></div>
        <div class="sn-field js-fld" style="width:${cols*cell}px;height:${rows*cell}px"></div>
        <div class="sn-msg js-smsg">あたまを ドラッグしてうごかそう</div>
      </div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="mg-btn js-reset" style="max-width:140px;background:var(--panel2);border:1px solid var(--line)">↻ リセット</button>
        <button class="mg-btn js-quit" style="max-width:160px;background:var(--panel2);border:1px solid var(--line)">← レベル選択</button>
      </div>
      <div class="mg-over hidden js-sover"><h3>🎉 単語が生まれた！</h3><p class="js-sp"></p><button class="mg-btn recv js-srecv"></button><button class="mg-btn js-snext"></button></div>
    </div>`;
    const fld=host.querySelector('.js-fld');
    const msg=t=>{host.querySelector('.js-smsg').textContent=t;};
    walls.forEach(wl=>{ const d=document.createElement('div'); d.className='sn-wall';
      d.style.cssText=`left:${wl.x*cell+3}px;top:${wl.y*cell+3}px;width:${cell-6}px;height:${cell-6}px`; fld.appendChild(d); });
    const isWall=(x,y)=>x<0||y<0||x>=cols||y>=rows||walls.some(w=>w.x===x&&w.y===y);
    const snakeAt=(x,y)=>{ for(const s of snakes){ if(s.removed) continue;
      for(let i=0;i<s.body.length;i++){ if(s.body[i].x===x&&s.body[i].y===y) return {s,i}; } } return null; };
    function drawTarget(){
      const merged=snakes.filter(s=>!s.removed).reduce((a,b)=>a.str.length>=b.str.length?a:b,{str:''});
      const got=target.startsWith(merged.str)?merged.str.length:1;
      host.querySelector('.js-tgt').innerHTML=target.split('').map((c,i)=>`<span class="tslot ${i<got&&merged.str.length>1?'f':''}">${c}</span>`).join('');
    }
    function sync(s){
      if(s.removed){ s.el.forEach(e=>e.remove()); s.el=[]; return; }
      while(s.el.length<s.body.length){ const d=document.createElement('div'); d.className='sn-seg'; fld.appendChild(d); s.el.push(d); }
      while(s.el.length>s.body.length){ s.el.pop().remove(); }
      s.body.forEach((b,i)=>{ const d=s.el[i];
        d.className='sn-seg'+(i===0?' head':'');
        d.dataset.sid=s.id;
        d.style.left=(b.x*cell+3)+'px'; d.style.top=(b.y*cell+3)+'px';
        d.style.width=(cell-6)+'px'; d.style.height=(cell-6)+'px';
        d.style.background=s.color; d.style.fontSize=Math.floor(cell*0.42)+'px';
        d.innerHTML=(i===0?'<span class="eyes"><i></i><i></i></span>':'')+(s.str[i]||'');
      });
    }
    function checkWin(){
      const alive=snakes.filter(s=>!s.removed);
      if(alive.length===1&&alive[0].str===target){
        won=true;
        const o=host.querySelector('.js-sover'); o.classList.remove('hidden');
        achieve('snakeWord',{word:target});
        const exp=50+idx*20;
        host.querySelector('.js-sp').textContent='「'+target+'（'+L.ja+'）」が誕生！ 辞典にアンロックされた！';
        const rb=host.querySelector('.js-srecv'); rb.textContent='🎁 経験値 +'+exp+' を受け取ってもどる'; rb.onclick=()=>onFinish(exp);
        const nx=host.querySelector('.js-snext');
        if(idx<SNAKE_LEVELS.length-1){ nx.textContent='▶ 次のレベルへ（+'+exp+'は自動受取）'; nx.onclick=()=>{ expPool+=exp; toast('🎁 経験値 +'+exp); play(idx+1); }; }
        else { nx.textContent='🏆 ぜんぶクリア！ レベル選択へ'; nx.onclick=levelSelect; }
      }
    }
    function startEat(eater,prey){
      eating=true; drag=null;
      const iv=setInterval(()=>{
        if(prey.body.length){
          const tl=prey.body.pop();
          eater.body.unshift({x:tl.x,y:tl.y});
          sync(prey); sync(eater);
        } else {
          clearInterval(iv);
          prey.removed=true; sync(prey);
          eater.str=eater.str+prey.str;
          eating=false; sync(eater); drawTarget();
          msg('「'+eater.str+'」になった！');
          checkWin();
        }
      },110);
      timers.push(iv);
    }
    function tryStep(s,fx,fy){
      if(eating||won||s.removed) return;
      const h=s.body[0];
      const dx=fx-h.x, dy=fy-h.y;
      if(Math.abs(dx)<0.5&&Math.abs(dy)<0.5) return;
      const cands=[];
      if(Math.abs(dx)>=Math.abs(dy)){ if(dx)cands.push([Math.sign(dx),0]); if(dy)cands.push([0,Math.sign(dy)]); }
      else { if(dy)cands.push([0,Math.sign(dy)]); if(dx)cands.push([Math.sign(dx),0]); }
      for(const [cx,cy] of cands){
        const nx=h.x+cx, ny=h.y+cy;
        if(isWall(nx,ny)) continue;
        const occ=snakeAt(nx,ny);
        if(occ&&occ.s!==s&&occ.i===occ.s.body.length-1){
          if(target.startsWith(s.str+occ.s.str)){ startEat(s,occ.s); return; }
          const hd=s.el[0]; if(hd){ hd.classList.remove('shake'); void hd.offsetWidth; hd.classList.add('shake'); }
          msg('じゅんばんが ちがうみたい…（'+s.str+'+'+occ.s.str+'）'); continue;
        }
        if(occ){ if(!(occ.s===s&&occ.i===s.body.length-1)) continue; }
        s.body=[{x:nx,y:ny},...s.body.slice(0,-1)];
        sync(s); return;
      }
    }
    fld.addEventListener('pointerdown',e=>{
      if(eating||won) return;
      const r=fld.getBoundingClientRect();
      const gx=Math.floor((e.clientX-r.left)/cell), gy=Math.floor((e.clientY-r.top)/cell);
      const occ=snakeAt(gx,gy);
      if(occ&&occ.i===0){ drag=occ.s; fld.setPointerCapture(e.pointerId); }
      else if(!occ&&!isWall(gx,gy)){
        // タップ移動fallback：隣にあたまが居るヘビをその方向へ1歩
        for(const s of snakes){ if(s.removed) continue; const h=s.body[0];
          if(Math.abs(h.x-gx)+Math.abs(h.y-gy)===1){ tryStep(s,gx,gy); break; } }
      } else if(occ&&occ.i===occ.s.body.length-1){
        // しっぽタップ：隣のあたまから食べに行く
        for(const s of snakes){ if(s.removed||s===occ.s) continue; const h=s.body[0];
          if(Math.abs(h.x-gx)+Math.abs(h.y-gy)===1){ tryStep(s,gx,gy); break; } }
      }
    });
    fld.addEventListener('pointermove',e=>{
      if(!drag||eating||won) return;
      const now=Date.now(); if(now-lastStep<90) return; lastStep=now;
      const r=fld.getBoundingClientRect();
      tryStep(drag,(e.clientX-r.left)/cell-0.5,(e.clientY-r.top)/cell-0.5);
    });
    fld.addEventListener('pointerup',()=>{ drag=null; });
    host.querySelector('.js-reset').addEventListener('click',()=>play(idx));
    host.querySelector('.js-quit').addEventListener('click',levelSelect);
    snakes.forEach(sync); drawTarget();
    host._snDebug={snakes,tryStep,target:()=>target};
  }
  levelSelect();
  return ()=>timers.forEach(t=>{clearTimeout(t);clearInterval(t);});
}

// ===== v2.4 ホームキャラのスワイプ・カルーセル（左右見切れ・ループ）=====
let caroSwiped=false;
function caroShift(dir){ const len=Math.max(1,deckMembers().length); heroPos=(heroPos+dir+len)%len; talkIdx=0; renderHome(); }
function heroSwipeInit(){
  const c=document.querySelector('.js-caro'); if(!c) return;
  let sx=null;
  c.addEventListener('pointerdown',e=>{ sx=e.clientX; caroSwiped=false; });
  c.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null;
    if(Math.abs(dx)>40){ caroSwiped=true; caroShift(dx<0?1:-1); } });
}

I18N.sort((a,b)=>b[0].length-a[0].length);
function i18nText(t){
  let s=t;
  for(const [a,b] of I18N){ if(s.includes(a)) s=s.split(a).join(b); }
  s=s.replace(/あと(\d\d:\d\d)/g,'$1 left').replace(/あと(\d+)日/g,'$1d left').replace(/(\d+) \/ (\d+) 語/g,'$1 / $2 words').replace(/(\d+)語/g,'$1 words').replace(/(\d+)件/g,'$1');
  return s;
}
function localizeTree(root){
  if(LANG!=='en'||!root) return;
  if(root.nodeType===3){ const t=i18nText(root.nodeValue); if(t!==root.nodeValue) root.nodeValue=t; return; }
  if(root.nodeType!==1) return;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let nd; while(nd=tw.nextNode()){
    if(!/[぀-ヿ一-鿿]/.test(nd.nodeValue)) continue;
    const t=i18nText(nd.nodeValue);
    if(t!==nd.nodeValue) nd.nodeValue=t;
  }
}
new MutationObserver(muts=>{
  if(LANG!=='en') return;
  muts.forEach(m=>{
    if(m.type==='characterData'){ localizeTree(m.target); }
    m.addedNodes&&m.addedNodes.forEach(n=>localizeTree(n));
  });
}).observe(document.body,{childList:true,subtree:true,characterData:true});

// ===== ⑧ 掃除機（後藤さん原作 cleanup の移植・英単語化アレンジ）=====
// 原作＝ルンバをドラッグして部屋のゴミを吸うTHREE.js製3D。プロトは2Dトップビューで移植（ネット不要制約）。
// アレンジ（後藤指示）：ゴミ＝アルファベット1文字。吸うと上部トレイへ→ターゲット単語の文字が
// そろうと単語成立して消える→ノルマ数の単語を成立させればクリア。dict対象語は辞典アンロック。
const VAC_LEVELS=[
  {name:'リビング',targets:[{w:'CAT',ja:'ねこ'},{w:'VISUAL',ja:'視覚の',dict:true}],decoys:'BZK'},
  {name:'キッチン',targets:[{w:'DOG',ja:'いぬ'},{w:'DICTATE',ja:'書き取らせる',dict:true}],decoys:'QWX'},
  {name:'ガレージ',targets:[{w:'SUN',ja:'たいよう'},{w:'PORTABLE',ja:'持ち運べる',dict:true}],decoys:'JVY'},
];
const VC_TRAY_MAX=8;
function initVacuum(host,onFinish){
  let raf=null, timers=[];
  function levelSelect(){
    host.innerHTML=`<div class="mg-quiz" style="gap:10px">
      <div class="mg-prompt"><b>🧹 掃除機</b>　ルンバをドラッグして 文字ゴミをすいこもう。<br>単語の文字がそろうと <b>単語成立→消える</b>！ ノルマの単語をぜんぶ作ればクリア</div>
      <div class="tz-levels">${VAC_LEVELS.map((L,i)=>`<button class="tz-lv" data-n="${i}">Lv.${i+1}<span>${L.name}</span></button>`).join('')}</div>
      <div class="mg-prompt" style="font-size:10px">原作：後藤 制作「cleanup」より移植（3D→2Dトップビュー）・英単語アレンジ</div>
    </div>`;
    [...host.querySelectorAll('.tz-lv')].forEach(b=>b.addEventListener('click',()=>play(+b.dataset.n)));
  }
  function play(idx){
    const L=VAC_LEVELS[idx];
    const targets=L.targets.map(t=>({...t,done:false}));
    let tray=[], over=false, rx=50, ry=60, tx=rx, ty=ry, on=false;
    const availW=(host.clientWidth||348)-24, RW=availW, RH=290;
    const letters=[];
    const pool=targets.flatMap(t=>t.w.split('')).concat(L.decoys.split(''));
    host.innerHTML=`<div class="mg-quiz" style="gap:8px">
      <div class="vc-wrap">
        <div class="sn-hud" style="margin-bottom:6px"><span class="chip2">Lv.${idx+1} ${L.name}</span><span class="chip2">ノルマ <span class="js-quota">0</span>/${targets.length} 単語</span></div>
        <div class="vc-words js-words"></div>
        <div class="vc-tray js-tray"></div>
        <div class="vc-room js-room" style="width:${RW}px;height:${RH}px"><div class="vc-roomba js-roomba"></div></div>
        <div class="vc-msg js-vmsg">ルンバを ドラッグして そうじ開始！</div>
      </div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="mg-btn js-dump" style="max-width:170px;background:var(--panel2);border:1px solid var(--line)">🗑 トレイの最後の1文字をすてる</button>
        <button class="mg-btn js-quit" style="max-width:140px;background:var(--panel2);border:1px solid var(--line)">← レベル選択</button>
      </div>
      <div class="mg-over hidden js-vover"><h3>🎉 おそうじ完了！</h3><p class="js-vp"></p><button class="mg-btn recv js-vrecv"></button><button class="mg-btn js-vnext"></button></div>
    </div>`;
    const room=host.querySelector('.js-room'), roomba=host.querySelector('.js-roomba');
    const msg=t=>{host.querySelector('.js-vmsg').textContent=t;};
    pool.forEach((ch,i)=>{
      const d=document.createElement('div'); d.className='vc-trash'; d.textContent=ch;
      d.style.background=tzColor(ch);
      const x=20+Math.random()*(RW-70), y=20+Math.random()*(RH-70);
      d.style.left=x+'px'; d.style.top=y+'px';
      d.style.transform='rotate('+((Math.random()*30-15)|0)+'deg)';
      room.appendChild(d);
      letters.push({ch,x,y,el:d,gone:false});
    });
    function drawWords(){
      host.querySelector('.js-words').innerHTML=targets.map(t=>{
        const have={}; tray.forEach(c=>have[c]=(have[c]||0)+1);
        const wl=t.w.split('').map(c=>{ if(t.done) return c; if(have[c]>0){have[c]--; return '<b>'+c+'</b>';} return '<i>'+c+'</i>'; }).join('');
        return `<span class="vc-word ${t.done?'done2':''}">${t.done?'✓ ':''}<span class="wl">${wl}</span><span class="wj">${t.ja}</span></span>`;
      }).join('');
      host.querySelector('.js-quota').textContent=targets.filter(t=>t.done).length;
    }
    function drawTray(){
      host.querySelector('.js-tray').innerHTML=[...Array(VC_TRAY_MAX)].map((_,k)=>
        `<span class="ts ${tray[k]?'f':''}" style="${tray[k]?'color:'+tzColor(tray[k]):''}">${tray[k]||''}</span>`).join('');
    }
    function tryComplete(){
      for(const t of targets){
        if(t.done) continue;
        const have={}; tray.forEach(c=>have[c]=(have[c]||0)+1);
        if(t.w.split('').every(c=>{ if(have[c]>0){have[c]--; return true;} return false; })){
          t.w.split('').forEach(c=>{ tray.splice(tray.indexOf(c),1); });
          t.done=true;
          msg('✨ 「'+t.w+'（'+t.ja+'）」成立！');
          celebrate();
          if(t.dict) achieve('vacuum',{word:t.w});
          drawWords(); drawTray();
          if(targets.every(x=>x.done)) win();
          return;
        }
      }
    }
    function suck(l){
      if(l.gone||over) return;
      if(tray.length>=VC_TRAY_MAX){ msg('トレイが いっぱい！ 単語をそろえるか すてよう'); return; }
      l.gone=true; l.el.classList.add('sucked');
      timers.push(setTimeout(()=>l.el.remove(),260));
      tray.push(l.ch); drawTray(); drawWords(); tryComplete();
    }
    function win(){
      over=true;
      const o=host.querySelector('.js-vover'); o.classList.remove('hidden');
      const exp=40+idx*15+(VC_TRAY_MAX-tray.length)*3;
      host.querySelector('.js-vp').textContent='ノルマ '+targets.length+' 単語 達成！'+(targets.some(t=>t.dict)?' 辞典もアンロック！':'');
      const rb=host.querySelector('.js-vrecv'); rb.textContent='🎁 経験値 +'+exp+' を受け取ってもどる'; rb.onclick=()=>onFinish(exp);
      const nx=host.querySelector('.js-vnext');
      if(idx<VAC_LEVELS.length-1){ nx.textContent='▶ 次のレベルへ（+'+exp+'は自動受取）'; nx.onclick=()=>{ expPool+=exp; toast('🎁 経験値 +'+exp); play(idx+1); }; }
      else { nx.textContent='🏆 ぜんぶクリア！ レベル選択へ'; nx.onclick=levelSelect; }
    }
    // ルンバ操作＆吸引ループ
    room.addEventListener('pointerdown',e=>{ on=true; roomba.classList.add('on');
      const r=room.getBoundingClientRect(); tx=e.clientX-r.left; ty=e.clientY-r.top; room.setPointerCapture(e.pointerId); });
    room.addEventListener('pointermove',e=>{ if(!on) return;
      const r=room.getBoundingClientRect(); tx=e.clientX-r.left; ty=e.clientY-r.top; });
    room.addEventListener('pointerup',()=>{ on=false; roomba.classList.remove('on'); });
    function loop(){
      rx+=(tx-rx)*0.18; ry+=(ty-ry)*0.18;
      rx=Math.max(28,Math.min(RW-28,rx)); ry=Math.max(28,Math.min(RH-28,ry));
      roomba.style.left=(rx-28)+'px'; roomba.style.top=(ry-28)+'px';
      if(on&&!over){
        letters.forEach(l=>{
          if(l.gone) return;
          const dx=rx-(l.x+15), dy=ry-(l.y+15), d=Math.hypot(dx,dy);
          if(d<70){ l.x+=dx*0.22; l.y+=dy*0.22; l.el.style.left=l.x+'px'; l.el.style.top=l.y+'px'; if(d<26) suck(l); }
        });
      }
      raf=requestAnimationFrame(loop);
    }
    if(raf) cancelAnimationFrame(raf);
    loop();
    host.querySelector('.js-dump').addEventListener('click',()=>{ if(tray.length){ const c=tray.pop(); msg('「'+c+'」を すてた'); drawTray(); drawWords(); } });
    host.querySelector('.js-quit').addEventListener('click',()=>{ if(raf) cancelAnimationFrame(raf); levelSelect(); });
    drawWords(); drawTray();
    host._vcDebug={suck:(ch)=>{ const l=letters.find(x=>!x.gone&&x.ch===ch); if(l) suck(l); },targets,trayRef:()=>tray};
  }
  levelSelect();
  return ()=>{ if(raf) cancelAnimationFrame(raf); timers.forEach(clearTimeout); };
}

// 合う出口からしか脱出できない（単語→カテゴリ/語根の知識がパズルの鍵）。脱出語は辞典アンロック。

    {w:'',x:2,y:0,sx:1,sy:2},{w:'',x:4,y:4,sx:1,sy:2}]},
  {cols:6,rows:6,theme:'語根3つ',exits:[
    {edge:'n',pos:2,w:2,label:'AUD',ja:'聞く',color:'#4dd0c4'},
    {edge:'s',pos:2,w:2,label:'DICT',ja:'言う',color:'#f06292'},

function initBlockEscape(host,onFinish){

  const later=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t);return t;};
  function levelSelect(){
    host.innerHTML=`<div class="mg-quiz" style="gap:10px">
      <div class="mg-prompt"><b>🧊 ブロック脱出</b>　単語ブロックをスライドして、<b>意味の合う出口</b>から脱出させよう。<br>DOG は ANIMAL の出口、PORTER は PORT（運ぶ）の出口…！ 脱出した語は辞典にアンロック</div>
      <div class="tz-levels">${BE_LEVELS.map((L,i)=>`<button class="tz-lv" data-n="${i}">Lv.${i+1}<span>${L.theme}</span></button>`).join('')}</div>
      <div class="mg-prompt" style="font-size:10px">原作：後藤 制作「Block Escape」より移植（3D→2D）・英単語アレンジ</div>
    </div>`;
    [...host.querySelectorAll('.tz-lv')].forEach(b=>b.addEventListener('click',()=>play(+b.dataset.n)));
  }
  function play(idx){
    const L=BE_LEVELS[idx], cols=L.cols, rows=L.rows;
    const blocks=L.blocks.map((b,i)=>({...b,id:i,gone:false,el:null}));
    let drag=null, over=false, lastStep=0;
    const availW=(host.clientWidth||348)-24;
    const EX=34; // 出口帯の厚み
    const cell=Math.max(30,Math.floor((availW-EX*2)/cols));
    const FW=cols*cell, FH=rows*cell;
    const wordBlocks=blocks.filter(b=>b.w);
    host.innerHTML=`<div class="mg-quiz" style="gap:8px">
      <div class="be-wrap">
        <div class="sn-hud" style="margin-bottom:6px"><span class="chip2">Lv.${idx+1} ${L.theme}</span></div>
        <div class="be-left js-left"></div>
        <div class="be-outer js-outer" style="width:${FW+EX*2}px;height:${FH+EX*2}px">
          <div class="be-field js-fld" style="left:${EX}px;top:${EX}px;width:${FW}px;height:${FH}px"></div>
        </div>
        <div class="be-msg js-bmsg">ブロックをドラッグ → 合う出口へ！</div>
      </div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="mg-btn js-reset" style="max-width:130px;background:var(--panel2);border:1px solid var(--line)">↻ リセット</button>
        <button class="mg-btn js-quit" style="max-width:150px;background:var(--panel2);border:1px solid var(--line)">← レベル選択</button>
      </div>
      <div class="mg-over hidden js-bover"><h3>🎉 全ブロック脱出！</h3><p class="js-bp"></p><button class="mg-btn recv js-brecv"></button><button class="mg-btn js-bnext"></button></div>
    </div>`;
    const outer=host.querySelector('.js-outer');
    const msg=t=>{host.querySelector('.js-bmsg').textContent=t;};
    // 出口帯
    L.exits.forEach(ex=>{
      const d=document.createElement('div'); d.className='be-exit'; d.style.background=ex.color;
      const along=ex.w*cell-4;
      if(ex.edge==='n'){ d.style.cssText+=`left:${EX+ex.pos*cell+2}px;top:2px;width:${along}px;height:${EX-6}px`; }
      if(ex.edge==='s'){ d.style.cssText+=`left:${EX+ex.pos*cell+2}px;bottom:2px;width:${along}px;height:${EX-6}px`; }
      if(ex.edge==='w'){ d.style.cssText+=`top:${EX+ex.pos*cell+2}px;left:2px;height:${along}px;width:${EX-6}px`; }
      if(ex.edge==='e'){ d.style.cssText+=`top:${EX+ex.pos*cell+2}px;right:2px;height:${along}px;width:${EX-6}px`; }
      d.innerHTML=`<span class="xl">${ex.label}</span><span class="xj">${ex.ja}</span>`;
      outer.appendChild(d);
    });
    const occ=(x,y,ex)=>blocks.some(b=>!b.gone&&b!==ex&&x>=b.x&&x<b.x+b.sx&&y>=b.y&&y<b.y+b.sy);
    function canMove(b,dx,dy){
      for(let i=0;i<b.sx;i++)for(let j=0;j<b.sy;j++){
        const nx=b.x+i+dx, ny=b.y+j+dy;
        if(nx<0||ny<0||nx>=cols||ny>=rows) return 'edge';
        if(occ(nx,ny,b)) return false;
      }
      return true;
    }
    function gateFor(b,dx,dy){
      // 盤外へ押した時、進行方向の辺で全セルを覆う出口を探す
      const edge=dx===1?'e':dx===-1?'w':dy===1?'s':'n';
      for(const ex of L.exits){
        if(ex.edge!==edge) continue;
        const span=(edge==='n'||edge==='s')?[b.x,b.x+b.sx-1]:[b.y,b.y+b.sy-1];
        if(span[0]>=ex.pos&&span[1]<ex.pos+ex.w) return ex;
      }
      return null;
    }
    function sync(b){
      if(!b.el){ const d=document.createElement('div'); d.className='be-block'+(b.w?'':' gray');
        if(b.w){ const c=L.exits.find(e=>e.label===b.cat); d.style.background='linear-gradient(180deg,'+((c&&c.color)||'#5db4ff')+',rgba(0,0,0,.25)) '+((c&&c.color)||'#5db4ff'); }
        d.dataset.id=b.id; host.querySelector('.js-fld').appendChild(d); b.el=d; }
      const bw=b.sx*cell-8, bh=b.sy*cell-8;
      b.el.style.left=(b.x*cell+4)+'px'; b.el.style.top=(b.y*cell+4)+'px';
      b.el.style.width=bw+'px'; b.el.style.height=bh+'px';
      if(b.w) b.el.style.fontSize=Math.max(9,Math.min(Math.floor(bh*0.5),Math.floor((bw-6)/b.w.length*1.5)))+'px';
      b.el.textContent=b.w||'';
    }
    function left(){ const n=wordBlocks.filter(b=>!b.gone).length;
      host.querySelector('.js-left').textContent='のこり '+n+' ブロック'; return n; }
    function escape(b,ex,dx,dy){
      b.gone=true;
      b.el.classList.add('escaping');
      b.el.style.left=(parseFloat(b.el.style.left)+dx*cell*1.6)+'px';
      b.el.style.top=(parseFloat(b.el.style.top)+dy*cell*1.6)+'px';
      later(()=>b.el.remove(),420);
      msg('🎉 「'+b.w+'」が '+ex.label+'（'+ex.ja+'）から脱出！');
      if(b.dict) achieve('blockEscape',{word:b.w});
      if(!left()) win();
    }
    function step(b,dx,dy){
      if(over||b.gone) return;
      const r=canMove(b,dx,dy);
      if(r===true){ b.x+=dx; b.y+=dy; sync(b); return true; }
      if(r==='edge'&&b.w){
        const ex=gateFor(b,dx,dy);
        if(ex){
          if(ex.label===b.cat){ escape(b,ex,dx,dy); return true; }
          b.el.classList.remove('shake'); void b.el.offsetWidth; b.el.classList.add('shake');
          msg('「'+b.w+'」は '+ex.label+'（'+ex.ja+'）じゃないみたい…');
        }
      }
      return false;
    }
    function win(){
      over=true;
      const o=host.querySelector('.js-bover'); o.classList.remove('hidden');
      const exp=45+idx*20;
      host.querySelector('.js-bp').textContent='全単語が 正しい出口から脱出！'+(wordBlocks.some(b=>b.dict)?' 辞典もアンロック！':'');
      const rb=host.querySelector('.js-brecv'); rb.textContent='🎁 経験値 +'+exp+' を受け取ってもどる'; rb.onclick=()=>onFinish(exp);
      const nx=host.querySelector('.js-bnext');
      if(idx<BE_LEVELS.length-1){ nx.textContent='▶ 次のレベルへ（+'+exp+'は自動受取）'; nx.onclick=()=>{ expPool+=exp; toast('🎁 経験値 +'+exp); play(idx+1); }; }
      else { nx.textContent='🏆 ぜんぶクリア！ レベル選択へ'; nx.onclick=levelSelect; }
    }
    const fld=host.querySelector('.js-fld');
    fld.addEventListener('pointerdown',e=>{
      if(over) return;
      const t=e.target.closest('.be-block'); if(!t) return;
      const b=blocks[+t.dataset.id]; if(b.gone) return;
      drag=b; fld.setPointerCapture(e.pointerId);
    });
    fld.addEventListener('pointermove',e=>{
      if(!drag||over) return;
      const now=Date.now(); if(now-lastStep<80) return;
      const r=fld.getBoundingClientRect();
      const fx=(e.clientX-r.left)/cell-0.5, fy=(e.clientY-r.top)/cell-0.5;
      const cx=drag.x+(drag.sx-1)/2, cy=drag.y+(drag.sy-1)/2;
      const dx=fx-cx, dy=fy-cy;
      if(Math.abs(dx)<0.6&&Math.abs(dy)<0.6) return;
      lastStep=now;
      if(Math.abs(dx)>=Math.abs(dy)) step(drag,Math.sign(dx),0)||step(drag,0,Math.sign(dy));
      else step(drag,0,Math.sign(dy))||step(drag,Math.sign(dx),0);
    });
    fld.addEventListener('pointerup',()=>{ drag=null; });
    host.querySelector('.js-reset').addEventListener('click',()=>play(idx));
    host.querySelector('.js-quit').addEventListener('click',levelSelect);
    blocks.forEach(sync); left();
    host._beDebug={blocks,step};
  }
  levelSelect();
  return ()=>timers.forEach(clearTimeout);
}

// ===== v2.8 デッキ（最大5デッキ・各4体・一般的ソシャゲ編成UI準拠）=====
const DECKS=[
  {name:'デッキ1',members:[0,1,2,3]},
  {name:'デッキ2',members:[]},
  {name:'デッキ3',members:[]},
  {name:'デッキ4',members:[]},
  {name:'デッキ5',members:[]},
];
let activeDeck=0, heroPos=0, editDeck=0;
function deckMembers(){ return DECKS[activeDeck].members.filter(i=>WILDS[i]); }
function deckParty(){ const m=deckMembers().map(i=>WILDS[i]); return m.length?m:WILDS.slice(0,3); }
function renderDeck(){
  const rows=DECKS.map((d,k)=>{
    const slots=[0,1,2,3].map(s=>{ const wd=WILDS[d.members[s]];
      return wd?`<span class="dk-slot f">${wildArt(wd.art,'',wd.color)}</span>`:'<span class="dk-slot"></span>'; }).join('');
    return `<button class="dk-row ${k===activeDeck?'on':''}" onclick="openDeck(${k})">
      <span class="dk-name">${d.name}${k===activeDeck?'<b class="dk-use">✓ 使用中</b>':''}</span>
      <span class="dk-slots">${slots}</span>
      <span class="db-arr">›</span></button>`;
  }).join('');
  const v=document.createElement('div'); v.className='view';
  v.innerHTML=`<div class="mode" style="--mc:var(--accent)">
    <div class="sc-top" style="padding:0"><button class="mg-back" onclick="go('home')">← ホーム</button><span class="sc-title">🃏 デッキ</span></div>
    <div class="ph" style="padding:8px 14px;font-size:11px">デッキは最大5つ。タップして編成をかえよう。バトル・格闘場には<b>使用中デッキの先頭3体</b>が出撃！</div>
    <div style="display:flex;flex-direction:column;gap:9px">${rows}</div>
  </div>`;
  swap(v);
}
function openDeck(k){ editDeck=k; go('deckedit'); }
function renderDeckEdit(){
  const d=DECKS[editDeck];
  const slots=[0,1,2,3].map(s=>{
    const wi=d.members[s], wd=WILDS[wi];
    if(wd) return `<button class="de-slot f" onclick="deckRemove(${s})">${wildArt(wd.art,'',wd.color)}<span class="den">${wd.name}</span><span class="dex2">✕ はずす</span></button>`;
    return `<button class="de-slot"><span class="dplus">＋</span><span style="font-size:9px">した から えらぶ</span></button>`;
  }).join('');
  const cards=WILDS.map((wd,i)=>{
    const inThis=d.members.includes(i);
    return `<button class="de-card ${inThis?'inuse':''}" onclick="deckToggle(${i})">
      ${inThis?'<span class="intag">編成中</span>':''}
      ${wildArt(wd.art,'',wd.color)}<span class="dcn">${wd.name}</span><span class="dcl">Lv.${wd.lv}${wd.stars?' ★'+wd.stars:''}</span></button>`;
  }).join('');
  const isActive=editDeck===activeDeck, empty=d.members.length===0;
  const v=document.createElement('div'); v.className='view';
  v.innerHTML=`<div class="mode" style="--mc:var(--accent)">
    <div class="sc-top" style="padding:0"><button class="mg-back" onclick="go('deck')">← デッキ一覧</button><span class="sc-title">🃏 ${d.name} の編成</span></div>
    <div class="de-slots">${slots}</div>
    <button class="mg-btn ${isActive||empty?'':'recv'}" style="max-width:240px;margin:2px auto" ${isActive||empty?'disabled':''} onclick="deckUse()">${isActive?'✓ 使用中のデッキ':(empty?'ワイルドを編成しよう':'▶ このデッキを使う')}</button>
    <div class="ph" style="padding:8px 14px;font-size:11px"><div class="pt">所持ワイルド（${WILDS.length}体）</div>タップで編成に追加。もういちどタップで はずす。</div>
    <div class="de-grid">${cards}</div>
  </div>`;
  swap(v);
}
function deckRemove(s){ DECKS[editDeck].members.splice(s,1); renderDeckEdit(); }
function deckToggle(i){
  const d=DECKS[editDeck];
  const p=d.members.indexOf(i);
  if(p>=0){ d.members.splice(p,1); }
  else { if(d.members.length>=4){ toast('デッキは4体まで！ スロットをタップして はずそう'); return; } d.members.push(i); }
  renderDeckEdit();
}
function deckUse(){ if(!DECKS[editDeck].members.length) return; activeDeck=editDeck; heroPos=0; toast('✓ '+DECKS[editDeck].name+' を使用中にした！'); renderDeckEdit(); }

// init
go('home');
</script>
