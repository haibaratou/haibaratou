<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wild Wordopia プロト v2（縦・Fable版）</title>
<style>
  :root{
    --bg:#0e1020; --frame:#14162a; --panel:#1c1f38; --panel2:#262a4a; --line:#333a63;
    --text:#eef0f7; --muted:#9aa1c2; --accent:#7c5cff; --accent2:#4bd6b0; --gold:#e5b53b;
    --story:#e5b53b; --garden:#9ac65a; --exp:#4b8ef0; --train:#e0654a; --dict:#4bd6b0; --settings:#9aa1c2;
    --sky1:#3a4aa0; --sky2:#7c5cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#07070d;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 10px;font-size:14px;line-height:1.5;-webkit-user-select:none;user-select:none}

  /* phone frame (portrait) */
  .phone{width:390px;max-width:96vw;height:800px;max-height:88vh;background:var(--frame);border:1px solid var(--line);
    border-radius:30px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55)}
  .statusbar{height:30px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:11px;color:var(--muted);background:rgba(0,0,0,.25)}
  .statusbar .sb-r{margin-left:auto;display:flex;gap:10px;align-items:center}
  .stage{flex:1;position:relative;overflow:hidden}
  .view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;animation:fade .2s ease}
  .view.noscroll{overflow:hidden}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* resource chips */
  .res{display:inline-flex;align-items:center;gap:3px;background:rgba(255,255,255,.06);padding:2px 8px;border-radius:999px;font-variant-numeric:tabular-nums}

  /* ===== HOME ===== */
  .home{height:100%;display:flex;flex-direction:column;position:relative;
    background:radial-gradient(120% 80% at 50% 0%, #2a2f66 0%, #14162a 60%, #0e1020 100%)}
  .home-top{display:flex;align-items:center;gap:8px;padding:10px 14px}
  .lvl-badge{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}
  .lvl-badge b{color:var(--gold)}
  .home-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:6px}
  .hero-name{position:absolute;top:6px;left:50%;transform:translateX(-50%);text-align:center}
  .hero-name .nm{font-size:20px;font-weight:800;letter-spacing:.04em}
  .hero-name .sub{font-size:11px;color:var(--accent2)}
  .hero-svg{width:66%;max-width:250px;filter:drop-shadow(0 14px 26px rgba(0,0,0,.5))}
  .hero-bubble{position:absolute;top:64px;right:36px;background:#fff;color:#222;border-radius:12px;padding:6px 10px;font-size:11px;font-weight:700;max-width:140px}
  .hero-bubble::after{content:'';position:absolute;left:-6px;bottom:8px;border:6px solid transparent;border-right-color:#fff}
  .home-cta{margin:0 16px 8px;background:linear-gradient(135deg,var(--gold),#f2a33c);color:#3a2b00;border:none;border-radius:14px;
    padding:14px;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px rgba(229,181,59,.3)}
  .party{display:flex;gap:8px;justify-content:center;padding:0 14px 12px}
  .party .slot{width:48px;height:48px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;cursor:pointer;transition:.12s}
  .party .slot:hover{border-color:var(--accent2)}
  .party .slot.active{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(75,214,176,.4)}
  .party .slot.add{color:var(--muted)}
  .party .slot .plv{position:absolute;bottom:-2px;right:-2px;font-size:8px;background:var(--accent);color:#fff;border-radius:6px;padding:0 3px}

  /* ===== generic mode page ===== */
  .mode{min-height:100%;padding:14px 14px 18px;display:flex;flex-direction:column;gap:12px}
  .mode-head{display:flex;align-items:center;gap:8px}
  .mode-head .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--panel2);border:1px solid var(--mc,#7c5cff)}
  .mode-head h2{font-size:18px}
  .mode-head .badge{margin-left:auto;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  .ph{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);font-size:12px;background:rgba(255,255,255,.02);line-height:1.7}
  .ph .pt{color:var(--text);font-weight:700;font-size:13px;margin-bottom:6px}

  /* story sugoroku */
  .path{display:flex;flex-direction:column;gap:0;position:relative;padding:6px 0}
  .node{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:14px;position:relative}
  .node .connector{position:absolute;left:29px;top:-20px;width:3px;height:24px;background:var(--line)}
  .node:first-child .connector{display:none}
  .node .dot{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:20px;
    border:3px solid var(--line);background:var(--panel2);position:relative;z-index:1}
  .node.cleared .dot{border-color:var(--accent2);background:rgba(75,214,176,.18)}
  .node.current .dot{border-color:var(--gold);background:rgba(229,181,59,.2);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,181,59,.5)}50%{box-shadow:0 0 0 7px rgba(229,181,59,0)}}
  .node.locked{opacity:.5}
  .node .body{flex:1}
  .node .kind{font-size:10px;font-weight:800;letter-spacing:.05em}
  .node.battle .kind{color:var(--train)} .node.story .kind{color:var(--gold)}
  .node .ttl{font-size:14px;font-weight:700;margin-top:1px}
  .node .go{font-size:11px;font-weight:800;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:4px 10px;cursor:pointer}
  .node.locked .go, .node.cleared .go{display:none}
  .node .done{font-size:11px;color:var(--accent2);font-weight:700}
  .node.current .done, .node.locked .done{display:none}
  .node.locked .lockicon{font-size:12px;color:var(--muted)}

  /* dict grid */
  .dict-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .droot{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2)}
  .droot.locked{opacity:.55;text-align:center;color:var(--muted)}
  .droot .r{font-family:ui-monospace,monospace;font-weight:800;font-size:16px;color:var(--dict)}
  .droot .m{font-size:11px;color:var(--muted)}
  .droot .ws{font-size:11px;margin-top:6px;line-height:1.6}
  .dict-note{font-size:11px;color:var(--muted);text-align:center}
  button.droot{cursor:pointer;font-family:inherit;text-align:left;width:100%}
  button.droot:hover{border-color:var(--dict)}
  .dwlist{display:flex;flex-direction:column;gap:6px}
  .dw{display:flex;align-items:baseline;gap:10px;background:var(--panelB);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
  .dw-en{font-weight:800;font-size:15px}
  .dw-ja{color:var(--muted);font-size:12px}

  /* ===== 辞典 ブラッシュアップ ===== */
  .dict-goal{background:linear-gradient(135deg,#26324a,#1c1f38);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .dg-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
  .dg-top b{color:var(--dict)}
  .dg-bar{height:10px;background:#20263f;border-radius:999px;overflow:hidden;margin:8px 0 4px;border:1px solid var(--line)}
  .dg-fill{height:100%;background:linear-gradient(90deg,var(--dict),var(--gold))}
  .dg-next{font-size:11px;color:var(--gold2)}
  .dict-sortbar{display:flex;gap:8px}
  .dsort{flex:1;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}
  .dsort.on{background:var(--dict);color:#08120e;border-color:var(--dict)}
  .dcat{margin-bottom:6px}
  .dcat-head{display:flex;align-items:baseline;gap:8px;padding:0 2px}
  .dcat-r{font-family:ui-monospace,monospace;font-weight:800;color:var(--dict);font-size:15px}
  .dcat-m{font-size:12px;color:var(--muted)}
  .dcat-rate{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .dcat-bar{height:5px;background:#20263f;border-radius:999px;overflow:hidden;margin:4px 0 8px}
  .dcat-bar>div{height:100%;background:var(--dict)}
  .dpage{background:#fbfaf5;border:1px solid #d9d5c6;border-radius:10px;padding:4px 12px;color:#2a2620}
  .dentry{padding:9px 2px;border-bottom:1px solid #e6e2d4;width:100%;text-align:left;display:block}
  .dentry:last-child{border-bottom:none}
  button.dentry{font:inherit;cursor:pointer}
  .d-head{display:flex;align-items:baseline;gap:8px}
  .d-word{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:18px;color:#1c1a15}
  .d-ipa{font-size:12px;color:#6b6555;font-family:Georgia,serif}
  .d-pos{font-size:11px;color:#8a8470;font-style:italic}
  .d-ja{font-size:13px;color:#3a352b;margin-top:2px}
  .d-ety{font-size:11px;color:#8a7f5a;margin-top:2px}
  .d-ety b{color:#6b5a1e}
  .dentry.locked{background:#eeebdf;border:1px dashed #c9c3b0;border-radius:8px;margin:5px 0}
  .dentry.locked .d-word{color:#b8b09a;letter-spacing:3px}
  .d-lock{margin-left:auto;font-size:12px}
  .d-hint{font-size:11px;color:#9a7b2f;margin-top:3px;font-weight:700}

  /* ===== footer tab bar ===== */
  .tabbar{flex:0 0 auto;height:66px;display:flex;align-items:stretch;background:var(--panel);border-top:1px solid var(--line);position:relative}
  .tabbar button{flex:1;background:none;border:none;color:var(--muted);cursor:pointer;font-size:9px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.12s;padding-top:6px}
  .tabbar button .ti{font-size:19px;line-height:1}
  .tabbar button.active{color:var(--mc,var(--accent))}
  .tabbar button.active .ti{transform:translateY(-1px)}
  .tabbar button:not(.home-btn).active::before{content:'';position:absolute;top:0;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--mc,var(--accent))}
  .tabbar .home-btn{flex:0 0 74px;position:relative}
  .tabbar .home-btn .hbtn{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),#5b8cff);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;
    box-shadow:0 6px 16px rgba(124,92,255,.5);border:3px solid var(--frame);transition:.12s}
  .tabbar .home-btn.active .hbtn{background:linear-gradient(135deg,var(--gold),#f2a33c);box-shadow:0 6px 16px rgba(229,181,59,.5)}
  .tabbar .home-btn span.lbl{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted)}
  .tabbar .home-btn.active span.lbl{color:var(--gold)}

  /* ===== 育成 ===== */
  :root{ --ok:#4bd6b0; --ng:#e0654a; --gold2:#e5b53b; --panelB:#262a4a; --screen2:#262a4a; --affix:#8b93b8; --screen:#1c1f38; }
  .exp-pool{background:linear-gradient(135deg,#3a2f66,#262a4a);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;text-align:center;font-weight:700}
  .exp-pool b{color:var(--gold);font-size:20px;font-variant-numeric:tabular-nums}
  .mg-launch-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mg-launch{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);cursor:pointer}
  .mg-launch:hover{border-color:var(--train)}
  .mg-launch .gi{font-size:24px}.mg-launch .gl{font-size:12px;font-weight:700}
  .mg-launch .gp{font-size:10px;color:var(--train);font-weight:800}
  .wtabs{display:flex;gap:6px}
  .wtab{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:20px;cursor:pointer}
  .wtab.active{border-color:var(--train);background:rgba(224,101,74,.15)}
  .wcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2)}
  .wname{font-weight:800;font-size:15px}.wname .wfam{font-size:11px;color:var(--muted);font-weight:500}
  .stats{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .strow{display:flex;align-items:center;gap:10px}
  .strow .sk{width:74px;font-size:12px;color:var(--muted)}
  .strow .sv{font-weight:800;font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
  .strow .splus{margin-left:auto;width:30px;height:26px;border-radius:8px;border:1px solid var(--train);background:rgba(224,101,74,.14);color:var(--train);font-weight:800;cursor:pointer}
  .strow .splus:disabled{opacity:.35;cursor:default}

  /* game host inside 育成 */
  .mgwrap{display:flex;flex-direction:column;height:100%}
  .mg-topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .mg-back{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
  .mg-title{font-weight:700;font-size:13px}
  .mg-host2{position:relative;flex:1;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
  .mg-hud{display:flex;gap:6px;justify-content:flex-end}
  .mg-hud .chip{background:var(--screen);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:11px;font-variant-numeric:tabular-nums;color:var(--text)}
  .mg-hud .chip b{color:var(--gold2)}
  .mg-prompt{color:var(--muted);font-size:12px;text-align:center}.mg-prompt b{color:var(--text)}
  .mg-btn{display:block;width:100%;max-width:260px;margin:6px auto 0;padding:11px;border:none;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;background:linear-gradient(135deg,var(--accent),#5b8cff);color:#fff}
  .mg-btn.recv{background:linear-gradient(135deg,var(--gold),#f2a33c);color:#3a2b00}
  .mg-over{position:absolute;inset:0;background:rgba(14,16,32,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;gap:6px;z-index:5}
  .mg-over.hidden{display:none}
  .mg-over h3{font-size:20px}.mg-over p{color:var(--muted);font-size:12px;max-width:300px}
  .mg-list{width:100%;max-width:300px;text-align:left;max-height:110px;overflow:auto;margin-top:2px}
  .mg-list .ri{font-size:11px;padding:4px 0;border-bottom:1px dashed var(--line)}.mg-list .ri .rt{color:var(--ok);font-weight:800;font-family:ui-monospace,monospace}
  /* slice */
  .mg-slice{position:relative;display:flex;flex-direction:column;gap:8px;flex:1}
  .mg-slice .timer{height:6px;background:var(--panelB);border-radius:999px;overflow:hidden}
  .mg-slice .timer>div{height:100%;background:linear-gradient(90deg,var(--ok),var(--gold2));width:100%}
  .mg-slice .js-band{text-align:center;font-size:11px;color:var(--gold2)}
  .mg-slice .board{flex:1;display:flex;align-items:center;justify-content:center;min-height:100px}
  .mg-slice .word{display:flex;position:relative}
  .mg-slice .tile{width:30px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;background:var(--panelB);border:2px solid var(--line);border-radius:7px}
  .mg-slice .tile.root{border-color:var(--ok)}
  .mg-slice .gap{width:12px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
  .mg-slice .gap::before{content:'';width:3px;height:48px;background:transparent;border-radius:2px}
  .mg-slice .gap:hover::before{background:rgba(124,92,255,.55)}
  .mg-slice .gap.slash::before{background:var(--gold2);box-shadow:0 0 8px var(--gold2)}
  .mg-slice .word.cut .part{transition:.25s cubic-bezier(.3,1.3,.5,1)}
  .mg-slice .word.cut .left{transform:translateX(-12px) rotate(-4deg)}
  .mg-slice .word.cut .right{transform:translateX(12px) rotate(4deg)}
  .mg-slice .reveal{min-height:56px;text-align:center;opacity:0;transition:.2s}
  .mg-slice .reveal.show{opacity:1}
  .mg-slice .reveal .judge{font-weight:800;font-size:13px}
  .mg-slice .reveal .judge.ok{color:var(--ok)}.mg-slice .reveal .judge.ng{color:var(--ng)}
  .mg-slice .reveal .split{font-size:18px;font-weight:800;margin-top:2px}
  .mg-slice .reveal .split .r{color:var(--ok)}.mg-slice .reveal .split .a{color:var(--affix)}
  .mg-slice .reveal .mean{font-size:11px;color:var(--muted);margin-top:3px}.mg-slice .reveal .mean .rw{color:var(--ok);font-weight:700}
  /* pair */
  .mg-pair{position:relative;display:flex;flex-direction:column;gap:8px;flex:1}
  .mg-pair .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .mg-pair .cell{aspect-ratio:3/4;perspective:600px;cursor:pointer}
  .mg-pair .inner{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
  .mg-pair .cell.flip .inner{transform:rotateY(180deg)}
  .mg-pair .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;text-align:center;border:2px solid var(--line)}
  .mg-pair .back{background:linear-gradient(135deg,#2a2f52,#1c2140);color:var(--accent);font-size:20px;font-weight:800}
  .mg-pair .front{background:var(--panelB);transform:rotateY(180deg)}
  .mg-pair .front .en{font-size:11px;font-weight:800;line-height:1.05;word-break:break-all}
  .mg-pair .front .ja{font-size:9px;color:var(--muted);margin-top:2px}
  .mg-pair .cell.matched .front{border-color:var(--ok);background:rgba(75,214,176,.12)}
  .mg-pair .cell.bad .front{border-color:var(--gold2)}
  .mg-pair .reveal{min-height:48px;background:var(--panelB);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center;opacity:.55}
  .mg-pair .reveal.hit{opacity:1;border-color:var(--ok)}
  .mg-pair .reveal .r1{font-weight:800;font-size:14px}.mg-pair .reveal .r1 .root{color:var(--ok)}
  .mg-pair .reveal .r2{font-size:11px;color:var(--muted);margin-top:3px}.mg-pair .reveal .r2 b{color:var(--text)}
  /* quiz + ngram */
  .mg-quiz,.mg-ngram{position:relative;display:flex;flex-direction:column;gap:10px;flex:1}
  .q-text{font-size:15px;font-weight:700;text-align:center;background:var(--panelB);border:1px solid var(--line);border-radius:12px;padding:14px 12px}
  .q-choices{display:flex;flex-direction:column;gap:8px}
  .ng-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .choice{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--screen2);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;text-align:left;word-break:break-all}
  .ng-choices .choice{text-align:center;font-size:15px;font-weight:800}
  .choice:hover{border-color:var(--accent)}
  .choice.locked{cursor:default}
  .choice.ok{border-color:var(--ok);background:rgba(75,214,176,.15)}
  .choice.ng{border-color:var(--ng);background:rgba(224,101,74,.15)}
  .ng-chart{background:var(--panelB);border:1px solid var(--line);border-radius:12px;padding:8px}
  .ng-chart:empty{display:none}
  .ng-legend{display:flex;gap:14px;justify-content:center;font-size:11px;font-weight:700;margin-top:2px}
  .q-exp{font-size:12px;text-align:center;min-height:28px;opacity:0;transition:.2s;color:var(--muted)}
  .q-exp.show{opacity:1}.q-exp.ok{color:var(--ok)}.q-exp.ng{color:var(--gold2)}

  /* ===== 物語：会話シーン＆バトル ===== */
  .story-scene{height:100%;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,#2a2f66,#0e1020)}
  .sc-top{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:0 0 auto}
  .sc-title{font-weight:700;font-size:13px}
  .sc-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:120px}
  .sc-box{margin:0 12px 16px;background:rgba(18,20,40,.92);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:104px;cursor:pointer}
  .sc-who{color:var(--accent2);font-weight:800;font-size:13px;min-height:16px}
  .sc-txt{font-size:14px;margin-top:4px;line-height:1.7}
  .sc-next{text-align:right;font-size:11px;color:var(--muted);margin-top:8px}
  .battle{height:100%;display:flex;flex-direction:column;position:relative;background:radial-gradient(120% 70% at 50% 0%,#3a2a4a,#0e1020)}
  .bt-arena{display:flex;align-items:center;justify-content:space-around;padding:14px 12px 6px;flex:0 0 auto}
  .bt-side{display:flex;flex-direction:column;align-items:center;gap:4px;width:120px}
  .bt-ico{font-size:40px}
  .bt-nm{font-size:11px;font-weight:700;text-align:center}
  .bt-vs{font-weight:800;color:var(--muted)}
  .hpbar{width:100%;height:8px;background:#20263f;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .hpfill{height:100%;width:100%;background:linear-gradient(90deg,#e0654a,#e5b53b);transition:width .3s}
  .hpfill.ally{background:linear-gradient(90deg,#4bd6b0,#4b8ef0)}
  .bt-msg{text-align:center;font-size:13px;font-weight:700;min-height:22px;padding:6px}
  .bt-word{display:flex;gap:6px;justify-content:center;padding:6px;flex-wrap:wrap}
  .bt-word .slot{width:28px;height:38px;border-bottom:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--muted)}
  .bt-word .slot.filled{color:var(--accent2);border-color:var(--accent2)}
  .bt-tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 14px;align-content:flex-start;flex:1;overflow-y:auto}
  .bt-tray .ltile{width:44px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:22px;font-weight:800;cursor:pointer}
  .bt-tray .ltile.used{opacity:.28}
  .bt-tray .ltile.shake{animation:shake .3s}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* ===== 遠征 ===== */
  .area-list{display:flex;flex-direction:column;gap:8px}
  .area{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);cursor:pointer;text-align:left;width:100%}
  .area:hover{border-color:var(--exp)}
  .a-ico{font-size:26px}
  .a-body{flex:1;display:flex;flex-direction:column;min-width:0}
  .a-nm{font-weight:800;font-size:14px}
  .a-boss{font-size:9px;background:var(--train);color:#fff;padding:1px 5px;border-radius:6px}
  .a-th{font-size:11px;color:var(--muted)}
  .a-go{color:var(--muted)}
  .pchips{display:flex;flex-wrap:wrap;gap:8px}
  .pchip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);cursor:pointer;font-size:20px;min-width:76px}
  .pchip.on{border-color:var(--exp);background:rgba(75,142,240,.16)}
  .pchip .pl{font-size:11px;font-weight:700}
  .pchip .pp{font-size:10px;color:var(--muted)}
  .exp-prog{height:12px;background:#20263f;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .exp-progfill{height:100%;width:0;background:linear-gradient(90deg,var(--exp),var(--accent2));transition:width .14s linear}
  .exp-log{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .logline{background:var(--panelB);border:1px solid var(--line);border-left:3px solid var(--exp);border-radius:8px;padding:8px 10px;font-size:13px}

  /* ===== 箱庭 ===== */
  .gslots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .gslot{aspect-ratio:1/1;border-radius:12px;border:1px dashed var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;color:var(--muted);cursor:pointer;gap:2px}
  .gslot .gl{font-size:10px}
  .gslot.producing{border-style:solid;border-color:var(--garden);animation:pulseG 1.2s infinite}
  @keyframes pulseG{0%,100%{opacity:.55}50%{opacity:1}}
  .gslot.ready{border-style:solid;border-color:var(--gold);color:var(--gold)}
  .gpick{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
  .gpick-t{font-size:12px;font-weight:700;margin-bottom:8px}
  .gpick-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .gpick-b{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);cursor:pointer;font-size:22px}
  .gpick-b span{font-size:10px}.gpick-b .gr{font-size:9px;color:var(--muted)}
  .ggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .gitem{aspect-ratio:1/1;border:1px solid var(--line);border-radius:10px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px}
  .gitem .gtag{font-size:8px;color:var(--muted);margin-top:2px}

  /* ===== v2: キャラ・演出・トースト ===== */
  .hero-svg{animation:idlebob 2.6s ease-in-out infinite}
  @keyframes idlebob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .mini-svg{width:38px;height:38px;display:block;pointer-events:none}
  .mid-svg{width:88px;height:88px;display:block;pointer-events:none}
  .party .slot,.wtab{padding:2px}
  .pchip .mini-svg{width:34px;height:34px}
  .home-ground{position:absolute;left:-10%;right:-10%;bottom:-6px;height:64px;background:radial-gradient(60% 100% at 50% 100%, #2c3157 0%, transparent 75%);pointer-events:none}
  .home-stars{position:absolute;inset:0;pointer-events:none;opacity:.7}
  .toast{position:absolute;top:40px;left:50%;transform:translateX(-50%) translateY(-8px);max-width:86%;background:rgba(20,22,42,.96);border:1px solid var(--accent2);color:var(--text);
    border-radius:12px;padding:9px 14px;font-size:12px;font-weight:700;z-index:60;opacity:0;transition:.25s;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .burst{position:absolute;left:50%;top:45%;z-index:55;pointer-events:none}
  .burst i{position:absolute;width:9px;height:9px;border-radius:2px;animation:bpop .8s ease-out forwards}
  @keyframes bpop{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(300deg);opacity:0}}
  @keyframes statflash{0%{background:rgba(229,181,59,.45)}100%{background:transparent}}
  .strow.flash{animation:statflash .7s ease-out;border-radius:8px}
  .view{animation:viewin .28s cubic-bezier(.2,.8,.3,1)}
  @keyframes viewin{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
  .tabbar button:active .ti{transform:scale(1.25)}
  .tabbar button .ti{transition:transform .15s}

  /* 物語：語源の発見演出 */
  .sc-box.etym{border-color:var(--gold);background:linear-gradient(160deg,rgba(60,48,10,.95),rgba(24,22,14,.95));animation:etymglow 1.6s ease-in-out infinite}
  @keyframes etymglow{0%,100%{box-shadow:0 0 0 0 rgba(229,181,59,.0)}50%{box-shadow:0 0 22px 2px rgba(229,181,59,.35)}}
  .sc-etyband{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:#3a2b00;background:linear-gradient(135deg,var(--gold),#f2c95c);border-radius:999px;padding:2px 10px;margin-bottom:5px}
  .sc-stage .stage-art{width:46%;max-width:170px;transition:.25s;filter:drop-shadow(0 12px 22px rgba(0,0,0,.45))}
  .sc-stage .stage-art.pop{animation:artpop .3s ease}
  @keyframes artpop{0%{transform:scale(.92)}60%{transform:scale(1.05)}100%{transform:scale(1)}}

  /* ===== v2 バトル ===== */
  .bt-side .mid-svg{filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
  .bt-side.lunge-l{animation:lungeL .4s ease}
  .bt-side.lunge-r{animation:lungeR .4s ease}
  @keyframes lungeL{30%{transform:translateX(26px)}}
  @keyframes lungeR{30%{transform:translateX(-26px)}}
  .bt-side.hurt{animation:hurt .35s ease}
  @keyframes hurt{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .dmgfloat{position:absolute;font-weight:900;font-size:20px;color:#ffd76b;text-shadow:0 2px 6px rgba(0,0,0,.7);animation:dmgf 1s ease-out forwards;pointer-events:none;z-index:20}
  .dmgfloat.tome{color:#ff8f7a}
  @keyframes dmgf{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-42px);opacity:0}}
  .chargebar{margin:0 14px;height:12px;background:#20263f;border:1px solid var(--line);border-radius:999px;overflow:hidden;position:relative}
  .chargefill{height:100%;width:0;background:linear-gradient(90deg,#7c5cff,#4bd6b0,#e5b53b);transition:width .3s}
  .chargelbl{text-align:center;font-size:9px;color:var(--muted);margin:2px 0 0}
  .battle.zone{animation:zoneglow 1s ease-in-out infinite}
  @keyframes zoneglow{0%,100%{box-shadow:inset 0 0 40px rgba(229,181,59,.15)}50%{box-shadow:inset 0 0 70px rgba(229,181,59,.4)}}
  .zonebadge{position:absolute;top:86px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--gold),#f2a33c);color:#3a2b00;font-weight:900;font-size:13px;
    border-radius:999px;padding:4px 16px;z-index:15;animation:zbpulse .7s ease-in-out infinite;display:none}
  .battle.zone .zonebadge{display:block}
  @keyframes zbpulse{50%{transform:translateX(-50%) scale(1.08)}}
  .wordpicks{display:flex;flex-direction:column;gap:8px;padding:8px 14px;flex:1;overflow-y:auto}
  .wpick{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:10px 12px;cursor:pointer;color:var(--text);text-align:left}
  .wpick:hover{border-color:var(--gold)}
  .wpick .wja{font-weight:800;font-size:14px;flex:1}
  .wpick .wlen{display:flex;gap:2px}
  .wpick .wlen i{width:7px;height:12px;border-radius:2px;background:var(--accent)}
  .wpick .wtag{font-size:9px;font-weight:800;border-radius:6px;padding:2px 6px}
  .wpick .wtag.fast{background:rgba(75,214,176,.18);color:var(--accent2)}
  .wpick .wtag.heavy{background:rgba(229,181,59,.18);color:var(--gold)}
  .traceboard{flex:1;position:relative;margin:4px 14px 10px;border:1px dashed var(--line);border-radius:14px;background:rgba(255,255,255,.02);touch-action:none}
  .tnode{position:absolute;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--panel2);color:var(--text);
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;transform:translate(-50%,-50%);transition:.12s;cursor:pointer}
  .tnode.done{border-color:var(--accent2);background:rgba(75,214,176,.25);color:var(--accent2);transform:translate(-50%,-50%) scale(1.12)}
  .tnode.nexthint{animation:pulse 1.2s infinite}
  .tracesvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .tracesvg polyline{fill:none;stroke:#4bd6b0;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.85;filter:drop-shadow(0 0 6px rgba(75,214,176,.8))}
  .bt-help{font-size:10px;color:var(--muted);text-align:center;padding:0 14px 6px}

  /* ===== v2 ことば錬金ラボ ===== */
  .mg-alch{position:relative;display:flex;flex-direction:column;gap:8px;flex:1}
  .al-target{text-align:center;background:var(--panelB);border:1px solid var(--gold);border-radius:12px;padding:10px}
  .al-target .tt{font-size:11px;color:var(--gold)}
  .al-target .tv{font-size:17px;font-weight:900}
  .al-shelf{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .al-shelf .sh-t{width:100%;text-align:center;font-size:10px;color:var(--muted)}
  .al-block{border:2px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);padding:6px 9px;cursor:pointer;text-align:center;min-width:64px}
  .al-block .be{font-weight:900;font-size:14px;font-family:ui-monospace,monospace}
  .al-block .bj{font-size:9px;color:var(--muted)}
  .al-block.pre .be{color:#8b93b8}.al-block.rt .be{color:var(--ok)}
  .al-block.sel{border-color:var(--gold);background:rgba(229,181,59,.15);transform:translateY(-3px)}
  .al-block:disabled{opacity:.4;cursor:default}
  .al-pot{display:flex;align-items:center;justify-content:center;gap:8px;min-height:78px;position:relative}
  .al-formula{font-size:16px;font-weight:900;font-family:ui-monospace,monospace;display:flex;align-items:center;gap:6px}
  .al-formula .fpre{color:#8b93b8}.al-formula .frt{color:var(--ok)}.al-formula .fq{color:var(--muted)}
  .al-result{min-height:76px;text-align:center;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--panelB)}
  .al-result .rw{font-size:19px;font-weight:900;letter-spacing:.04em}
  .al-result.win{border-color:var(--ok);animation:artpop .35s ease}
  .al-result.lucky{border-color:var(--gold);animation:artpop .35s ease}
  .al-result.fizz{border-color:var(--ng)}
  .al-result .rs{font-size:11px;color:var(--muted);margin-top:2px}
  .al-result .rs b{color:var(--gold2)}

  /* ===== v2 設定 ===== */
  .set-card{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:12px 14px}
  .set-card .st{font-size:11px;color:var(--muted);font-weight:800;margin-bottom:8px;letter-spacing:.06em}
  .set-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .set-row:last-child{border-bottom:none}
  .set-row .sl{flex:1;font-size:13px}
  .set-row .sd{font-size:10px;color:var(--muted)}
  .sw{width:44px;height:24px;border-radius:999px;background:#20263f;border:1px solid var(--line);position:relative;cursor:pointer;transition:.15s;flex:0 0 auto}
  .sw::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#9aa1c2;transition:.15s}
  .sw.on{background:rgba(75,214,176,.35);border-color:var(--accent2)}
  .sw.on::after{left:22px;background:var(--accent2)}
  .set-danger{width:100%;padding:10px;border:1px solid var(--ng);color:var(--ng);background:rgba(224,101,74,.08);border-radius:10px;font-weight:800;cursor:pointer;font-size:12px}

  /* 辞典：新規アンロック演出 */
  @keyframes newun{0%{background:rgba(229,181,59,.5)}100%{background:transparent}}
  .dentry.newun{animation:newun 1.6s ease-out}

  /* ===== v2.1: ホーム左サイドアイコン ===== */
  .side-icons{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:10px;z-index:6}
  .side-icons.right{top:56px}
  .side-btn{width:54px;height:54px;border-radius:16px;background:rgba(20,22,42,.85);border:1px solid var(--line);color:var(--text);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;transition:.12s}
  .side-btn:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .side-btn .si{font-size:20px;line-height:1}
  .side-btn .sl2{font-size:8px;color:var(--muted);font-weight:700}
  .side-btn.big{width:66px;height:66px;border-radius:20px;border-color:#4a4f80}
  .side-btn.big .si{font-size:29px}
  .side-btn.big .sl2{font-size:9.5px;color:var(--text)}

  /* ===== v2.1: カメラ ===== */
  .cam-frame{position:relative;margin:0 14px;flex:1;min-height:220px;border-radius:16px;border:1px solid var(--line);overflow:hidden;
    background:radial-gradient(120% 100% at 50% 0%,#1a2038,#0a0c18);display:flex;align-items:center;justify-content:center}
  .cam-frame::before{content:'';position:absolute;inset:12px;border:2px dashed rgba(154,161,194,.4);border-radius:12px;pointer-events:none}
  .cam-obj{font-size:72px;animation:idlebob 2.4s ease-in-out infinite}
  .cam-scanline{position:absolute;left:6px;right:6px;height:3px;top:0;background:linear-gradient(90deg,transparent,#4bd6b0,transparent);animation:scanmove .9s linear infinite;display:none}
  .cam-frame.scanning .cam-scanline{display:block}
  @keyframes scanmove{0%{top:4%}100%{top:96%}}
  .cam-tag{position:absolute;top:14px;left:16px;font-size:10px;font-weight:800;color:#4bd6b0;background:rgba(0,0,0,.4);border-radius:6px;padding:2px 8px}
  .cam-shutter{width:68px;height:68px;border-radius:50%;background:#fff;border:6px solid #6a7099;margin:12px auto 4px;cursor:pointer;flex:0 0 auto;transition:.1s}
  .cam-shutter:active{transform:scale(.92)}
  .cam-shutter:disabled{opacity:.4}
  .cam-res{border:1px solid var(--gold);border-radius:14px;background:var(--panel2);padding:12px;text-align:center;animation:artpop .35s ease}
  .cam-res .cr-line{font-size:12px;color:var(--muted)}
  .cam-res .cr-line b{color:var(--accent2)}
  .cam-res .cr-get{font-size:16px;font-weight:900;margin-top:4px}
  .cam-res .cr-star{font-size:13px;color:var(--gold);font-weight:800}
  .flash-white{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
  .flash-white.go{animation:camflash .4s ease-out}
  @keyframes camflash{0%{opacity:.95}100%{opacity:0}}

  /* ===== v2.1: お絵かき ===== */
  .draw-stage{position:relative;margin:0 14px;border-radius:14px;overflow:hidden;background:#fbfaf5;border:1px solid var(--line)}
  .draw-under{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.30;pointer-events:none}
  .draw-under svg{width:78%;height:auto}
  .draw-stage canvas{position:relative;display:block;width:100%;touch-action:none;cursor:crosshair}
  .draw-tools{display:flex;gap:7px;align-items:center;padding:0 14px;flex-wrap:wrap}
  .dt-color{width:27px;height:27px;border-radius:50%;border:2px solid var(--line);cursor:pointer;flex:0 0 auto}
  .dt-color.on{box-shadow:0 0 0 3px rgba(124,92,255,.7)}
  .dt-btn{padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);font-size:11px;font-weight:700;cursor:pointer}
  .dt-btn.on{border-color:var(--accent2);color:var(--accent2)}
  .draw-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px}
  .dg-cell{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fbfaf5;aspect-ratio:1/1}
  .dg-cell .dg-under{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.3}
  .dg-cell .dg-under svg{width:80%;height:auto}
  .dg-cell img{position:relative;width:100%;height:100%;object-fit:cover}
  .dg-cell .dg-name{position:absolute;bottom:0;left:0;right:0;font-size:9px;font-weight:800;color:#fff;background:rgba(0,0,0,.5);padding:1px 4px}

  /* ===== v2.1: 格闘場（PvP）===== */
  .ar-row{display:flex;gap:10px;justify-content:center;padding:4px 0}
  .ar-unit{width:78px;text-align:center;position:relative;transition:.2s}
  .ar-unit .mini-svg{margin:0 auto}
  .ar-unit .ar-nm{font-size:9px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ar-unit.ko{opacity:.28;filter:grayscale(1)}
  .ar-unit.front::after{content:'▲';position:absolute;left:50%;transform:translateX(-50%);bottom:-14px;color:var(--gold);font-size:10px}
  .ar-unit.hurt{animation:hurt .35s ease}
  .ar-vsbar{display:flex;align-items:center;gap:8px;justify-content:center;font-size:11px;color:var(--muted);font-weight:800}
  .ar-vsbar .vs{color:var(--train);font-size:14px}
  .spin{width:44px;height:44px;border:5px solid var(--line);border-top-color:var(--accent2);border-radius:50%;animation:rot 1s linear infinite;margin:14px auto}
  @keyframes rot{to{transform:rotate(360deg)}}
  .ar-timer{height:7px;background:#20263f;border-radius:999px;overflow:hidden;margin:0 14px}
  .ar-timer>div{height:100%;background:linear-gradient(90deg,var(--ok),var(--gold2));width:100%}
  .ar-speed{font-size:10px;color:var(--gold);text-align:center;font-weight:800;min-height:14px}

  /* ===== v2.2: ミッション & プレゼント ===== */
  .side-icons.right{left:auto;right:10px}
  .side-btn{position:relative}
  .side-badge{position:absolute;top:-5px;right:-5px;background:#e0654a;color:#fff;font-size:9px;font-weight:800;border-radius:999px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--frame)}
  .mtabs{display:flex;gap:6px}
  .mtab{flex:1;padding:8px 2px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--muted);font-size:10.5px;font-weight:800;cursor:pointer}
  .mtab.on{background:var(--gold);color:#3a2b00;border-color:var(--gold)}
  .mlist{display:flex;flex-direction:column;gap:9px}
  .mcard{position:relative;display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:11px 12px}
  .mcard.donem{opacity:.78;border-color:var(--accent2)}
  .m-main{flex:1;min-width:0}
  .m-title{font-size:12.5px;font-weight:700}
  .m-bar{height:8px;background:#20263f;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin-top:5px}
  .m-bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .mcard.donem .m-bar>div{background:var(--accent2)}
  .m-num{font-size:10px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .m-right{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto;min-width:52px}
  .m-reward{font-size:19px;line-height:1;text-align:center}
  .m-reward span{display:block;font-size:9px;color:var(--gold);font-weight:800;margin-top:1px}
  .m-time{font-size:9px;color:var(--train);font-weight:800;background:rgba(224,101,74,.12);border-radius:6px;padding:1px 6px;font-variant-numeric:tabular-nums}
  .m-stamp{position:absolute;right:10px;top:-8px;background:var(--accent2);color:#08120e;font-size:9px;font-weight:900;border-radius:999px;padding:2px 8px}
  .pr-head{display:flex;align-items:center;gap:8px}
  .pr-all{margin-left:auto;padding:8px 12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--gold),#f2a33c);color:#3a2b00;font-weight:800;font-size:12px;cursor:pointer}
  .pr-all:disabled{opacity:.4;cursor:default}
  .plist{display:flex;flex-direction:column;gap:8px}
  .pcard{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:10px 12px;cursor:pointer;width:100%;text-align:left;color:var(--text);font-family:inherit;transition:.15s}
  .pcard:hover{border-color:var(--gold)}
  .pcard .pi{font-size:24px;flex:0 0 auto}
  .pcard .pb{flex:1;min-width:0}
  .pcard .pl2{font-size:13px;font-weight:800}
  .pcard .pr2{font-size:10px;color:var(--muted);margin-top:1px}
  .pcard .pstate{font-size:10px;font-weight:800;color:var(--gold);flex:0 0 auto;text-align:center}
  .pcard.claimed{opacity:.45;cursor:default}
  .pcard.claimed:hover{border-color:var(--line)}
  .pcard.claimed .pstate{color:var(--accent2)}

  /* ===== v2.3: ホームのセリフ吹き出し（EN/JA切替）===== */
  .talk-bubble{position:relative;margin:0 16px 8px;background:#fff;color:#222;border:none;border-radius:16px;padding:12px 14px 8px;
    font-size:13.5px;font-weight:700;cursor:pointer;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35);font-family:inherit;line-height:1.55;width:auto}
  .talk-bubble::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);border:9px solid transparent;border-bottom-color:#fff;border-top:none}
  .talk-bubble .tb-word{color:#e0654a}
  .talk-bubble .tb-meta{display:flex;justify-content:center;gap:12px;font-size:9px;color:#a09884;font-weight:700;margin-top:5px}
  .talk-bubble.pop{animation:artpop .25s ease}
  .js-heroTap{cursor:pointer;display:flex;justify-content:center;width:100%}

  /* ===== v2.3: ⑥積木くずし（char-screw移植）===== */
  .tz-levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .tz-lv{padding:12px 4px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);font-weight:800;font-size:13px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;font-family:inherit}
  .tz-lv span{font-size:9px;color:var(--muted);font-weight:700}
  .tz-lv.cl{border-color:var(--gold)}
  .tz-lv.lk{opacity:.4;cursor:default}
  /* 積木くずし：ポップ調（プレイ動画トンマナ準拠：白タイル×パステル文字×絵文字） */
  .tz-wrap{background:linear-gradient(180deg,#f7fbff 0%,#dcecff 60%,#cfe4ff 100%);border-radius:16px;padding:10px 6px;margin:0 -4px}
  .tz-top{display:flex;gap:5px;justify-content:center;min-height:52px;flex-wrap:wrap}
  .tz-box{border:none;border-radius:12px;padding:5px 7px;text-align:center;background:#fff;box-shadow:0 3px 8px rgba(80,110,180,.25);display:flex;gap:2px;align-items:center}
  .tz-box .bch3{font-size:16px;font-weight:900;line-height:1.2;width:16px;border-radius:5px}
  .tz-box .bch3.dim{opacity:.22}
  .tz-box.pulse{animation:artpop .3s ease}
  .tz-buf{display:flex;gap:4px;justify-content:center;align-items:center;min-height:26px}
  .tz-buf .blbl{font-size:9px;color:#7d90b5;font-weight:800;margin-right:3px}
  .tz-buf .bch2{font-size:17px;font-weight:900;line-height:1}
  .tz-buf .bdot{width:9px;height:9px;border-radius:50%;background:#b9cbe8}
  .tz-field{position:relative;margin:0 auto}
  .tz-block{position:absolute;border:none;border-radius:12px;background:#fff;box-shadow:0 4px 10px rgba(80,110,180,.28);
    display:flex;flex-direction:column;flex-wrap:nowrap;align-items:center;justify-content:center;gap:0;padding:2px;transition:top .25s ease;overflow:hidden}
  .tz-block .tzi{line-height:1;pointer-events:none}
  .tz-block .tzl{display:flex;flex-wrap:nowrap;justify-content:center;align-items:center;white-space:nowrap;max-width:100%}
  .tz-block .tch{background:none;border:none;font-weight:900;cursor:pointer;line-height:1.15;font-family:inherit;padding:0 1px;transition:transform .1s}
  .tz-block .tch:hover{transform:scale(1.25)}
  .tz-lvhud{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
  .tz-lvhud .chip2{background:#fff;box-shadow:0 2px 6px rgba(80,110,180,.2);border-radius:999px;padding:3px 12px;font-size:11px;font-weight:800;color:#5a76a8}

  /* ===== v2.3: ⑦へびのともぐい（snake_eat移植・原作の空色トンマナ）===== */
  .sn-wrap{background:linear-gradient(180deg,#aeb6ff,#9ea9ff);border-radius:16px;padding:10px 6px;margin:0 -4px}
  .sn-hud{display:flex;gap:6px;justify-content:center;margin-bottom:8px;align-items:center;flex-wrap:wrap}
  .sn-hud .chip2{background:rgba(255,255,255,.92);box-shadow:0 2px 6px rgba(60,70,140,.3);border-radius:999px;padding:3px 12px;font-size:11px;font-weight:800;color:#4a55a8}
  .sn-target{display:flex;gap:4px;justify-content:center;margin-bottom:8px}
  .sn-target .tslot{width:28px;height:32px;border-radius:8px;background:rgba(255,255,255,.32);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:rgba(255,255,255,.85)}
  .sn-target .tslot.f{background:#fff;color:#e0654a;box-shadow:0 2px 6px rgba(60,70,140,.35)}
  .sn-field{position:relative;margin:0 auto;border-radius:12px;background:rgba(255,255,255,.15);touch-action:none}
  .sn-wall{position:absolute;background:#6d76c9;border-radius:8px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22)}
  .sn-seg{position:absolute;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;
    transition:left .12s linear,top .12s linear;text-shadow:0 1px 3px rgba(0,0,0,.35);z-index:2}
  .sn-seg.head{border-radius:15px;box-shadow:0 3px 8px rgba(0,0,0,.3);z-index:3;cursor:grab}
  .sn-seg .eyes{position:absolute;top:12%;display:flex;gap:18%;width:56%;justify-content:center;pointer-events:none}
  .sn-seg .eyes i{width:30%;aspect-ratio:1;background:#fff;border-radius:50%;position:relative}
  .sn-seg .eyes i::after{content:'';position:absolute;inset:30%;background:#222;border-radius:50%}
  .sn-seg.shake{animation:shake .3s}
  .sn-msg{text-align:center;font-size:11px;font-weight:800;color:#fff;min-height:16px;margin-top:7px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .lang-sw{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(0,0,0,.3)}
  .lang-sw button{border:none;background:none;color:var(--muted);font-size:11px;font-weight:800;padding:4px 11px;cursor:pointer;font-family:inherit}
  .lang-sw button.on{background:var(--accent2);color:#08120e}
  .caro{position:relative;width:100%;display:flex;align-items:center;justify-content:center}
  .caro-side{position:absolute;top:50%;transform:translateY(-50%);width:31%;opacity:.5;filter:brightness(.72) saturate(.8);cursor:pointer;z-index:1}
  .caro-side svg{width:100%;height:auto}
  .caro-side.left{left:-13%}
  .caro-side.right{right:-13%}

  /* ===== v2.5: ワイルド図鑑 ===== */
  .dex-btn{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:800;color:var(--text);cursor:pointer;font-family:inherit}
  .dex-btn:hover{border-color:var(--accent2)}
  .dex-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  .dex-card{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit;color:var(--text);transition:.12s}
  .dex-card:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .dex-card .dno{position:absolute;top:5px;left:8px;font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:800}
  .dex-card .dstar{position:absolute;top:4px;right:7px;font-size:9px;color:var(--gold);font-weight:800}
  .dex-card .dart{width:56px;height:56px}
  .dex-card .dart svg{width:100%;height:100%}
  .dex-card.un .dart svg{filter:brightness(0) opacity(.75)}
  .dex-card .dq{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#3d4370;background:radial-gradient(circle at 50% 42%, #262a4a 55%, transparent 56%)}
  .dex-card .dnm{font-size:11.5px;font-weight:800}
  .dex-card.un .dnm{color:var(--muted);letter-spacing:2px}
  .dex-card .dcat2{font-size:8.5px;font-weight:800;border-radius:6px;padding:1px 7px;background:rgba(75,214,176,.14);color:var(--accent2)}
  .dex-card.un .dcat2{background:rgba(255,255,255,.06);color:var(--muted)}
  .dex-pop{position:absolute;inset:0;background:rgba(7,7,14,.78);z-index:40;display:flex;align-items:center;justify-content:center;padding:22px}
  .dex-popcard{width:100%;max-width:300px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 16px;text-align:center;animation:artpop .25s ease;position:relative}
  .dex-popcard .pp-no{font-size:10px;color:var(--muted);font-weight:800}
  .dex-popcard .pp-art{width:130px;height:130px;margin:4px auto}
  .dex-popcard .pp-art svg{width:100%;height:100%}
  .dex-popcard.un .pp-art svg{filter:brightness(0) opacity(.8)}
  .dex-popcard .pp-nm{font-size:18px;font-weight:900}
  .dex-popcard .pp-fam{font-size:11px;color:var(--accent2);margin-top:1px}
  .dex-popcard .pp-desc{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.7;text-align:left}
  .dex-popcard .pp-stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}
  .dex-popcard .pp-stats span{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px;font-size:10.5px;font-weight:700}
  .dex-popcard .pp-hint{margin-top:10px;font-size:11px;color:var(--gold);font-weight:800;background:rgba(229,181,59,.1);border:1px dashed var(--gold);border-radius:10px;padding:8px}
  .dex-popcard .pp-close{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer}

  /* ===== v2.6: ⑧掃除機（cleanup移植・英単語化）===== */
  .vc-wrap{background:linear-gradient(180deg,#2b2b36,#1a1a22);border-radius:16px;padding:10px 6px;margin:0 -4px}
  .vc-words{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
  .vc-word{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:4px 8px;display:flex;gap:2px;align-items:baseline}
  .vc-word.done2{border-color:var(--ok);background:rgba(75,214,176,.14)}
  .vc-word .wl{font-weight:900;font-size:14px;letter-spacing:1px}
  .vc-word .wl i{font-style:normal;color:#6a7099}
  .vc-word .wl b{color:#ffd76b}
  .vc-word .wj{font-size:9px;color:var(--muted)}
  .vc-word.done2 .wl,.vc-word.done2 .wl b{color:var(--ok)}
  .vc-tray{display:flex;gap:4px;justify-content:center;align-items:center;margin-bottom:6px}
  .vc-tray .ts{width:30px;height:34px;border:1px dashed rgba(255,255,255,.25);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;background:rgba(255,255,255,.05)}
  .vc-tray .ts.f{border-style:solid;border-color:#ffd76b;color:#ffd76b}
  .vc-room{position:relative;margin:0 auto;border-radius:14px;overflow:hidden;touch-action:none;
    background:linear-gradient(135deg,#8a6b4f,#75593f);box-shadow:inset 0 0 30px rgba(0,0,0,.4)}
  .vc-room::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.12) 46px 48px)}
  .vc-trash{position:absolute;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:16px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);box-shadow:0 2px 5px rgba(0,0,0,.35);z-index:2}
  .vc-trash.sucked{animation:vcsuck .25s ease-in forwards}
  @keyframes vcsuck{to{transform:scale(.1) rotate(240deg);opacity:0}}
  .vc-roomba{position:absolute;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3c3c48,#191921);
    border:3px solid #4b4b5c;z-index:5;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;box-shadow:0 4px 10px rgba(0,0,0,.5)}
  .vc-roomba::after{content:'';width:18px;height:18px;border-radius:50%;background:#4bd6b0;box-shadow:0 0 8px #4bd6b0}
  .vc-roomba.on{box-shadow:0 0 0 12px rgba(75,214,176,.12),0 4px 10px rgba(0,0,0,.5)}
  .vc-msg{text-align:center;font-size:11px;font-weight:800;color:#cfd6ff;min-height:15px;margin-top:6px}

  /* ===== v2.6: ⑨ブロック脱出（Block Escape移植・英単語化）===== */
  .be-wrap{background:linear-gradient(180deg,#151530,#0a0a18);border-radius:16px;padding:14px 6px;margin:0 -4px}
  .be-outer{position:relative;margin:0 auto}
  .be-field{position:absolute;border-radius:8px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 24px rgba(0,0,0,.5)}
  .be-exit{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;z-index:1;gap:0}
  .be-exit .xl{font-weight:900;font-size:11px;letter-spacing:.5px;color:#fff;line-height:1.1}
  .be-exit .xj{font-size:8px;color:rgba(255,255,255,.85);font-weight:700}
  .be-block{position:absolute;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.5);cursor:grab;z-index:3;transition:left .1s linear,top .1s linear;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),0 3px 8px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden}
  .be-block.gray{background:#3c3f52;cursor:grab}
  .be-block.escaping{transition:left .4s ease-in,top .4s ease-in,opacity .4s;opacity:0;z-index:1}
  .be-block.shake{animation:shake .3s}
  .be-msg{text-align:center;font-size:11px;font-weight:800;color:#cfd6ff;min-height:16px;margin-top:8px}
  .be-left{text-align:center;font-size:12px;font-weight:900;color:#ffd700;margin-bottom:8px}

  /* ===== v2.7: 格闘場ランク＆抽選リール ===== */
  .ar-rank{display:flex;align-items:center;gap:12px;border:1px solid var(--gold);border-radius:14px;background:linear-gradient(135deg,#2e2a18,#1c1f38);padding:10px 14px}
  .ar-rank .ri{font-size:32px;line-height:1}
  .ar-rank .rb{flex:1;min-width:0}
  .ar-rank .rn{font-weight:900;font-size:15px;color:var(--gold)}
  .ar-rank .rp{font-size:10px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}
  .ar-rankbar{height:8px;background:#20263f;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin-top:5px}
  .ar-rankbar>div{height:100%;background:linear-gradient(90deg,var(--gold),#f2a33c)}
  .ar-record{font-size:10px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
  .ar-record b{color:var(--accent2)}
  .reel-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0}
  .reel-title{font-size:13px;font-weight:900;color:var(--gold)}
  .reel{width:210px;height:62px;border:3px solid var(--gold);border-radius:14px;background:#0d0f22;overflow:hidden;position:relative;box-shadow:0 6px 20px rgba(229,181,59,.25)}
  .reel::after{content:'';position:absolute;inset:0;box-shadow:inset 0 14px 14px rgba(0,0,0,.6),inset 0 -14px 14px rgba(0,0,0,.6);pointer-events:none}
  .reel-strip{will-change:transform}
  .reel-item{height:62px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:900;font-size:15px;color:var(--text)}
  .reel-item .gi2{font-size:24px}
  .reel.hit{animation:artpop .35s ease}
  .ar-gamechip{display:inline-flex;align-items:center;gap:5px;background:rgba(229,181,59,.14);border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:2px 10px;font-size:10px;font-weight:900}

  /* ===== v2.7: バトルリザルト＆ワイルド入手演出 ===== */
  .result-pop{position:absolute;inset:0;background:rgba(7,7,14,.82);z-index:45;display:flex;align-items:center;justify-content:center;padding:20px}
  .result-card{width:100%;max-width:300px;background:var(--panel);border:2px solid var(--gold);border-radius:18px;padding:16px;text-align:center;animation:artpop .3s ease}
  .result-card h3{font-size:19px;color:var(--gold)}
  .result-rows{margin:10px 0;display:flex;flex-direction:column;gap:6px}
  .result-row{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;animation:viewin .4s ease both}
  .result-row .ric{font-size:20px}
  .result-row .rval{margin-left:auto;color:var(--gold);font-weight:900}
  .result-row.wildrow{border-color:var(--accent2);background:rgba(75,214,176,.1)}
  .wg-pop{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(7,7,14,.9);overflow:hidden;cursor:pointer}
  .wg-rays{position:absolute;width:600px;height:600px;background:conic-gradient(from 0deg,rgba(229,181,59,.35) 0deg 12deg,transparent 12deg 30deg,rgba(229,181,59,.35) 30deg 42deg,transparent 42deg 60deg,rgba(229,181,59,.35) 60deg 72deg,transparent 72deg 90deg,rgba(229,181,59,.35) 90deg 102deg,transparent 102deg 120deg,rgba(229,181,59,.35) 120deg 132deg,transparent 132deg 150deg,rgba(229,181,59,.35) 150deg 162deg,transparent 162deg 180deg,rgba(229,181,59,.35) 180deg 192deg,transparent 192deg 210deg,rgba(229,181,59,.35) 210deg 222deg,transparent 222deg 240deg,rgba(229,181,59,.35) 240deg 252deg,transparent 252deg 270deg,rgba(229,181,59,.35) 270deg 282deg,transparent 282deg 300deg,rgba(229,181,59,.35) 300deg 312deg,transparent 312deg 330deg,rgba(229,181,59,.35) 330deg 342deg,transparent 342deg 360deg);border-radius:50%;animation:rot 9s linear infinite}
  .wg-body{position:relative;text-align:center;animation:wgin .55s cubic-bezier(.2,1.6,.4,1) both}

const recentUn=new Set();
function toast(t){ const st=document.getElementById('stage'); let el=st.querySelector('.toast'); if(!el){ el=document.createElement('div'); el.className='toast'; st.appendChild(el); } el.textContent=t; requestAnimationFrame(()=>el.classList.add('show')); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),2600); }
function celebrate(){ const st=document.getElementById('stage'); const b=document.createElement('div'); b.className='burst'; const cols=['#e5b53b','#4bd6b0','#7c5cff','#e0654a','#ffffff'];
  for(let k=0;k<14;k++){ const i=document.createElement('i'); const a=Math.PI*2*k/14; const d=60+Math.random()*55; i.style.setProperty('--dx',(Math.cos(a)*d).toFixed(0)+'px'); i.style.setProperty('--dy',(Math.sin(a)*d).toFixed(0)+'px'); i.style.background=cols[k%cols.length]; b.appendChild(i); }
  st.appendChild(b); setTimeout(()=>b.remove(),900); }
function condMet(c,ev,d){ if(!c||c.ev!==ev) return false; d=d||{};
  if(c.root){ const rs=[].concat(c.root); if(!rs.includes(d.root)) return false; }
  if(c.name&&c.name!==d.name) return false;
  if(c.item&&c.item!==d.item) return false;
  if(c.word&&c.word!==d.word) return false;
  if(c.i!==undefined&&c.i!==d.i) return false;
  return true; }
function achieve(ev,detail){
  missionProgress(ev);
  const got=[];
  DICT.forEach(c=>{
    if(c.hidden&&condMet(c.cond,ev,detail)){ Object.assign(c,{root:c.reveal.root,mean:c.reveal.mean,words:c.reveal.words,hidden:false}); c.words.forEach(w=>{ if(w.un) recentUn.add(w.en); }); got.push('新語根 '+c.root+'（'+c.mean+'）発見！'); }
    if(!c.hidden) c.words.forEach(w=>{ if(!w.un&&condMet(w.cond,ev,detail)){ w.un=true; recentUn.add(w.en); got.push(w.en); } });
  });
  if(got.length){ toast('📚 辞典アンロック！ '+got.join(' / ')); celebrate(); if(mode==='dict') renderDict(); }
}

function startBattle(i){
  const n=STORY[i];
  const eparty=n.eparty||[{n:(n.enemy||{}).name||'？？？',art:(n.enemy||{}).art||'noise',hp:(n.enemy||{}).hp||90,atk:(n.enemy||{}).atk||10}];
  const mine=deckParty().slice(0,3).map(w=>({w,hp:80,max:80}));
  const opps=eparty.map(p=>({p,hp:p.hp,max:p.hp}));
  let mFront=0, oFront=0;
  let charge=0, zone=false, combo=0, lastW='', busy=false, timers=[];
  const later=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t);return t;};
  const v=document.createElement('div'); v.className='view';
  v.innerHTML=`<div class="battle js-battle">
    <div class="zonebadge">⚡ ゾーン！ 反撃なしで攻めまくれ</div>
    <div class="sc-top"><button class="mg-back" onclick="go('story')">← にげる</button><span class="sc-title">${n.title}</span></div>
    <div class="ar-row js-orow" style="padding:2px 0 0"></div>
    <div class="ar-vsbar"><span class="vs">VS</span></div>
    <div class="ar-row js-mrow" style="padding-bottom:4px"></div>
    <div class="chargebar"><div class="chargefill js-charge"></div></div>
    <div class="chargelbl">ながい単語ほどチャージ大。MAXで⚡ゾーン（10秒 一方的に攻撃）</div>
    <div class="bt-msg js-msg"></div>
    <div class="js-play" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
    <div class="mg-over hidden js-bover"><h3 class="js-bt"></h3><p class="js-bp"></p><button class="mg-btn js-bbtn"></button></div>
  </div>`;
  swap(v);
  currentCleanup=()=>timers.forEach(clearTimeout);
  const q=s=>v.querySelector(s);
  const msg=t=>{q('.js-msg').textContent=t;};
  function rows(){
    q('.js-orow').innerHTML=opps.map((o,k)=>`<div class="ar-unit ${o.hp<=0?'ko':''} ${k===oFront&&o.hp>0?'front':''}" data-o="${k}">${enemyArtSVG(o.p.art,'mini-svg')}<div class="ar-nm">${o.p.n}</div><div class="hpbar"><div class="hpfill" style="width:${Math.max(0,o.hp/o.max*100)}%"></div></div></div>`).join('');
    q('.js-mrow').innerHTML=mine.map((m,k)=>`<div class="ar-unit ${m.hp<=0?'ko':''} ${k===mFront&&m.hp>0?'front':''}" data-m="${k}">${wildArt(m.w.art,'mini-svg',m.w.color)}<div class="ar-nm">${m.w.name}</div><div class="hpbar"><div class="hpfill ally" style="width:${Math.max(0,m.hp/m.max*100)}%"></div></div></div>`).join('');
  }
  function bars(){ q('.js-charge').style.width=Math.min(100,charge)+'%'; }
  function hitFx(sel,dmg,toMe){ const el=q(sel); if(!el) return;
    el.classList.remove('hurt'); void el.offsetWidth; el.classList.add('hurt');
    const d=document.createElement('div'); d.className='dmgfloat'+(toMe?' tome':''); d.textContent='-'+dmg; d.style.left='22%'; d.style.top='0';
    el.appendChild(d); later(()=>d.remove(),1000); }
  // --- フェーズ1: わざ（単語ブロック）をえらぶ ---
  function pickPhase(){
    busy=false;
    msg('わざ（単語）をえらぼう！');
    const pool=n.words.filter(w=>w.w!==lastW);
    const picks=pool.slice().sort(()=>Math.random()-.5).slice(0,Math.min(3,pool.length));
    q('.js-play').innerHTML=`<div class="wordpicks">${picks.map((w,k)=>{
      const tag=w.w.length<=4?'<span class="wtag fast">⚡はやい・かわしやすい</span>':(w.w.length>=6?'<span class="wtag heavy">💥ちから・チャージ大</span>':'');
      return `<button class="wpick" data-k="${k}"><span class="wja">${w.ja}</span><span class="wlen">${'<i></i>'.repeat(w.w.length)}</span>${tag}</button>`;
    }).join('')}</div><div class="bt-help">短い単語＝先手＆反撃をかわしやすい ／ 長い単語＝大ダメージ＆チャージ大（でも先手を取られやすい）</div>`;
    [...q('.js-play').querySelectorAll('.wpick')].forEach(b=>b.addEventListener('click',()=>{ if(busy)return; busy=true; tracePhase(picks[+b.dataset.k]); }));
  }
  // --- フェーズ2: 一筆なぞりで つづる ---
  function tracePhase(word){
    const W=word.w;
    q('.js-play').innerHTML=`<div class="bt-msg" style="min-height:0;padding:2px">「${word.ja}」＝ <b>${W.length}文字</b> を一筆でなぞろう！</div>
      <div class="traceboard js-board"><svg class="tracesvg js-tsvg"><polyline class="js-tline" points=""/></svg></div>
      <div class="bt-help">最初の文字から順に、指でなぞる（タップでもOK）</div>`;
    const board=q('.js-board');
    const nodes=[];
    later(()=>{
      const bw=board.clientWidth, bh=board.clientHeight;
      W.split('').forEach((ch,k)=>{
        const el=document.createElement('div'); el.className='tnode'; el.textContent=ch; el.dataset.i=k;
        const t=W.length===1?0.5:k/(W.length-1);
        const x=bw*0.14+(bw*0.72)*t + (Math.random()*14-7);
        const y=bh*(k%2===0?0.30:0.68) + (Math.random()*16-8);
        el.style.left=x+'px'; el.style.top=y+'px';
        board.appendChild(el); nodes.push({el,x,y});
      });
      let next=0, tracing=false;
      const line=q('.js-tline'); const pts=[];
      function mark(k){ nodes[k].el.classList.add('done'); pts.push(nodes[k].x+','+nodes[k].y); line.setAttribute('points',pts.join(' ')); next=k+1; hint();
        if(next>=W.length){ tracing=false; later(()=>resolveAttack(word),220); } }
      function hint(){ nodes.forEach((nd,k)=>nd.el.classList.toggle('nexthint',k===next)); }
      function hitNode(cx,cy){ const r=board.getBoundingClientRect(); const x=cx-r.left, y=cy-r.top;
        for(let k=0;k<nodes.length;k++){ const dx=nodes[k].x-x, dy=nodes[k].y-y; if(dx*dx+dy*dy<28*28) return k; } return -1; }
      board.addEventListener('pointerdown',e=>{ const k=hitNode(e.clientX,e.clientY); if(k===next){ tracing=true; board.setPointerCapture(e.pointerId); mark(k); } else if(k>=0){ nodes[k].el.classList.add('nexthint'); } });
      board.addEventListener('pointermove',e=>{ if(!tracing||next>=W.length)return; const k=hitNode(e.clientX,e.clientY); if(k===next) mark(k); });
      board.addEventListener('pointerup',()=>{ if(next<W.length&&next>0){ /* とちゅうで離した→タップ継続OK */ tracing=false; } });
      board.addEventListener('click',e=>{ const k=hitNode(e.clientX,e.clientY); if(k===next) mark(k); });
      hint();
    },30);
  }
  // --- フェーズ3: 攻撃解決（前衛どうしのダメージ応酬・前衛KOで次のキャラが前に）---
  function resolveAttack(word){
    const W=word.w, len=W.length;
    lastW=W;
    const dmg=Math.round((10*len+combo*6)*(zone?1.5:1));
    const preempt=!zone && len>=7 && Math.random()<.45;
    const attack=()=>{
      const o=opps[oFront];
      o.hp-=dmg; combo++; if(!zone) charge=Math.min(100,charge+len*9);
      rows(); bars(); hitFx('[data-o="'+oFront+'"]',dmg);
      msg('「'+W+'」（'+word.ja+'）でこうげき！ '+(zone?'⚡':'')+'-'+dmg+(combo>1?'　'+combo+'コンボ！':''));
      if(o.hp<=0){
        if(opps.every(x=>x.hp<=0)){ later(()=>over(true),650); return; }
        oFront=opps.findIndex(x=>x.hp>0); rows();
        msg(o.p.n+' をたおした！ つぎは '+opps[oFront].p.n+'！');
      }
      if(!zone && charge>=100){ later(enterZone,650); return; }
      if(zone||preempt){ later(pickPhase,750); return; }
      if(len<=4 && Math.random()<.5){ later(()=>{ msg(mine[mFront].w.name+'は すばやく身をかわした！'); later(pickPhase,650); },550); }
      else later(()=>enemyHit(opps[oFront].p.n+'の反撃！',pickPhase),650);
    };
    if(preempt){ enemyHit('先手を取られた！',()=>later(attack,300)); }
    else attack();
  }
  function enemyHit(label,then){
    const o=opps[oFront]; if(!o||o.hp<=0){ then&&then(); return; }
    later(()=>{
      const m=mine[mFront];
      m.hp-=o.p.atk; rows(); bars(); hitFx('[data-m="'+mFront+'"]',o.p.atk,true);
      msg(label+' '+m.w.name+'に -'+o.p.atk);
      if(m.hp<=0){
        if(mine.every(x=>x.hp<=0)){ later(()=>over(false),650); return; }
        mFront=mine.findIndex(x=>x.hp>0); rows();
        msg(m.w.name+'が たおれた…！ '+mine[mFront].w.name+'が 前へ！');
      }
      later(then,700);
    },200);
  }
  // --- ゾーン ---
  function enterZone(){ zone=true; q('.js-battle').classList.add('zone'); msg('⚡ チャージMAX！ ゾーン突入！！'); combo=Math.max(combo,2);
    const t0=Date.now();
    const iv=setInterval(()=>{ const left=Math.max(0,1-(Date.now()-t0)/10000); q('.js-charge').style.width=(left*100)+'%';
      if(left<=0){ clearInterval(iv); zone=false; charge=0; q('.js-battle').classList.remove('zone'); bars(); if(!busy) msg('ゾーン終了。わざをえらぼう'); } },100);
    timers.push(iv);
    later(pickPhase,700);
  }
  function over(win){ if(currentCleanup){currentCleanup();}
    if(!win){
      const o=q('.js-bover'); o.classList.remove('hidden');
      q('.js-bt').textContent='💥 敗北…';
      q('.js-bp').textContent='単語のえらび方を変えて、もう一度いどもう';
      const b=q('.js-bbtn'); b.textContent='↻ リトライ'; b.onclick=()=>startBattle(i);
      return;
    }
    resultWindow();
  }
  // --- 勝利リザルト：経験値＋アイテム、まれにワイルドドロップ（敵が仲間に）---
  function resultWindow(){
    const exp=45+i*5; expPool+=exp; achieve('battleWin');
    const items=[]; const pool=BATTLE_ITEMS.slice();
    for(let k=0;k<2;k++){ const it=pool.splice(Math.random()*pool.length|0,1)[0]; items.push(it);
      if(it.type==='coin') RES.coin+=it.qty; else if(it.type==='gem') RES.gem+=it.qty; }
    updateRes();
    const dropOk=n.drop&&NEW_WILDS[n.drop]&&!WILDS.some(x=>x.art===n.drop)&&Math.random()<(n.dropRate||0.3);
    const show=(wd)=>{
      const st=document.getElementById('stage');
      const pop=document.createElement('div'); pop.className='result-pop';
      const rowsH=[
        `<div class="result-row" style="animation-delay:.05s"><span class="ric">✨</span>経験値<span class="rval">+${exp}</span></div>`,
        ...items.map((it,k)=>`<div class="result-row" style="animation-delay:${.2+k*.15}s"><span class="ric">${it.icon}</span>${it.label}<span class="rval">GET</span></div>`),
        wd?`<div class="result-row wildrow" style="animation-delay:.55s"><span class="ric">🐾</span><b>${wd.name}</b> が なかまに！<span class="rval">RARE!</span></div>`:'',
      ].join('');
      pop.innerHTML=`<div class="result-card"><h3>🏆 RESULT</h3>
        <div style="font-size:11px;color:var(--muted)">${n.title} クリア！</div>
        <div class="result-rows">${rowsH}</div>
        <button class="mg-btn recv" style="max-width:220px;margin:4px auto 0">▶ マップへすすむ</button></div>`;
      pop.querySelector('button').addEventListener('click',()=>{ pop.remove(); celebrate(); clearNode(i); });
      st.appendChild(pop);
    };
    if(dropOk){
      const wd=Object.assign({stars:0},NEW_WILDS[n.drop]); WILDS.push(wd);
      wildGetCutscene(wd,()=>show(wd));
    } else show(null);
  }
  rows(); bars(); pickPhase();
  v._btDebug={forceWin:()=>over(true),forceLose:()=>over(false),mine,opps};
}

function dictEntry(w,root){
  if(w.un){
    const ety=w.ety?`語源: ${w.ety.replace(/([a-z]+)（/i,'<b>$1</b>（')}`:`語源: <b>${root}</b>（${(DICT.find(c=>c.root===root)||{}).mean||''}）の仲間`;
    return `<div class="dentry${recentUn.has(w.en)?' newun':''}">
      <div class="d-head"><span class="d-word">${w.en}</span><span class="d-ipa">${w.ipa}</span><span class="d-pos">${w.pos}</span></div>
      <div class="d-ja">${w.ja}</div>
      <div class="d-ety">${ety}</div>
    </div>`;
  }
  return `<button class="dentry locked" onclick="go('${w.go}')">
    <div class="d-head"><span class="d-word">？？？</span><span class="d-lock">🔒</span></div>
    <div class="d-hint">🎯 ${w.hint} ▶</div>
  </button>`;
}
function renderDict(){
  const all=DICT.flatMap(c=>c.words);
  const total=all.length, un=all.filter(w=>w.un).length, pct=Math.round(un/total*100);
  const MIL=[{n:8,t:'見習い語源学者'},{n:16,t:'言葉の探究者'},{n:24,t:'語源の賢者'},{n:total,t:'語源マスター'}];
  const next=MIL.find(m=>un<m.n);
  let body;
  if(dictSort==='abc'){
    const rootOf={}; DICT.forEach(c=>c.words.forEach(w=>{ if(!rootOf[w.en]) rootOf[w.en]=c.root; }));
    const sorted=[...all].filter(w=>w.en!=='？？？').sort((a,b)=>a.en.localeCompare(b.en));
    const locked=all.filter(w=>w.en==='？？？');
    body=`<div class="dpage">${sorted.map(w=>dictEntry(w,rootOf[w.en])).join('')}${locked.map(w=>dictEntry(w,'')).join('')}</div>`;
  } else {
    body=DICT.map(c=>{
      const cu=c.words.filter(w=>w.un).length, ct=c.words.length, cp=Math.round(cu/ct*100);
      return `<div class="dcat">
        <div class="dcat-head"><span class="dcat-r">${c.root}</span><span class="dcat-m">＝${c.mean}</span><span class="dcat-rate">${cu}/${ct}・${cp}%</span></div>
        <div class="dcat-bar"><div style="width:${cp}%"></div></div>
        <div class="dpage">${c.words.map(w=>dictEntry(w,c.root)).join('')}</div>
      </div>`;
    }).join('');
  }
  const v=document.createElement('div'); v.className='view';
  v.innerHTML=`<div class="mode" style="--mc:var(--dict)">
    ${modeHead('dict','コレクション')}
    <div class="dict-goal">
      <div class="dg-top"><span>📚 辞典コンプリート</span><b>${un} / ${total} 語（${pct}%）</b></div>
      <div class="dg-bar"><div class="dg-fill" style="width:${pct}%"></div></div>
      <div class="dg-next">${next?('次の称号「'+next.t+'」まで あと '+(next.n-un)+' 語'):'🎉 語源マスター達成！'}</div>
    </div>
    <div class="dict-sortbar">
      <button class="dsort ${dictSort==='cat'?'on':''}" onclick="setDictSort('cat')">カテゴリ別（語根）</button>
      <button class="dsort ${dictSort==='abc'?'on':''}" onclick="setDictSort('abc')">ABC順</button>
    </div>
    ${body}
  </div>`;
  swap(v);
  setTimeout(()=>recentUn.clear(),50);
}
function setDictSort(s){ dictSort=s; renderDict(); }

function go(m){
  if(currentCleanup){ try{ currentCleanup(); }catch(e){} currentCleanup=null; }
  mode=m;
  if(m==='home') renderHome();
  else if(m==='story') renderStory();
  else if(m==='dict') renderDict();
  else if(m==='training') renderTraining();
  else if(m==='expedition') renderExpedition();
  else if(m==='garden') renderGarden();
  else if(m==='settings') renderSettings();
  else if(m==='camera') renderCamera();
  else if(m==='draw') renderDraw();
  else if(m==='arena') renderArena();
  else if(m==='missions') renderMissions();
  else if(m==='presents') renderPresents();
  else if(m==='dex') renderDex();

  if(expSel.length<1) return;

  let queue=[],idx=0,score=0,tries=0,found=new Set(),selP=null,selR=null,busy=false;

  function pickP(i,b){ if(busy)return; selP=i; [...q('.js-pres').querySelectorAll('.al-block')].forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); formula(); tryFuse(); }
  function pickR(i,b){ if(busy)return; selR=i; [...q('.js-roots').querySelectorAll('.al-block')].forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); formula(); tryFuse(); }

  function renderRound(){ tries=0; busy=false; clearSel(); const t=queue[idx];

    const res=q('.js-res'); res.className='al-result js-res'; res.innerHTML='<div class="rs">接頭辞＋語根 ＝ ひとつの単語。いみの足し算で当てよう</div>'; hud(); }
  function start(){ queue=sh(Object.values(ALCH_WORDS)).slice(0,QN); idx=0; score=0; found=new Set();
    q('.js-start').classList.add('hidden'); q('.js-result').classList.add('hidden'); buildShelves(); renderRound(); }
  function nextRound(){ idx++; if(idx>=QN){ result(); return; } renderRound(); }

    q('.js-result').classList.remove('hidden'); }
  q('.js-go').addEventListener('click',start);
  q('.js-again').addEventListener('click',start);
  q('.js-next').addEventListener('click',nextRound);
  return null;
}

function initCanvas(v,w){
  const cv=v.querySelector('.js-cv'); if(!cv) return;
  setTimeout(()=>{ cv.width=cv.clientWidth||330; cv.height=300; redraw(); },20);
  const ctx=cv.getContext?cv.getContext('2d'):null;
  let color='#3a3560', size=4, eraser=false, strokes=[], cur=null;
  function redraw(){ if(!ctx) return; ctx.clearRect(0,0,cv.width,cv.height);
    strokes.forEach(s=>{ ctx.globalCompositeOperation=s.e?'destination-out':'source-over';
      ctx.strokeStyle=s.c; ctx.lineWidth=s.s; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath(); s.p.forEach((pt,i)=>i?ctx.lineTo(pt[0],pt[1]):ctx.moveTo(pt[0],pt[1])); ctx.stroke(); });
    ctx.globalCompositeOperation='source-over'; }
  function pos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
  cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); cur={c:color,s:eraser?18:size,e:eraser,p:[pos(e)]}; strokes.push(cur); redraw(); });
  cv.addEventListener('pointermove',e=>{ if(!cur) return; cur.p.push(pos(e)); redraw(); });
  cv.addEventListener('pointerup',()=>{ cur=null; });
  [...v.querySelectorAll('.dt-color')].forEach(el=>el.addEventListener('click',()=>{ eraser=false; color=el.dataset.c;
    [...v.querySelectorAll('.dt-color')].forEach(x=>x.classList.remove('on')); el.classList.add('on'); v.querySelector('.js-eraser').classList.remove('on'); }));
  v.querySelector('.js-eraser').addEventListener('click',function(){ eraser=!eraser; this.classList.toggle('on',eraser); });
  v.querySelector('.js-fat').addEventListener('click',function(){ size=size===4?10:4; this.classList.toggle('on',size===10); });
  v.querySelector('.js-undo').addEventListener('click',()=>{ strokes.pop(); redraw(); });
  v.querySelector('.js-done').addEventListener('click',()=>{
    let img=''; try{ img=cv.toDataURL(); }catch(e){}
    DRAWINGS.unshift({art:w.art,color:w.color,name:w.name+' #'+(DRAWINGS.length+1),img});
    achieve('drawReg');
    toast('🌍 図鑑に登録！ 世界のプレイヤーに共有された（モック）'); celebrate(); renderDraw();
  });
}

function rankInfo(p){ let t=RANK_TIERS[0]; RANK_TIERS.forEach(x=>{ if(p>=x.min) t=x; }); const next=RANK_TIERS[RANK_TIERS.indexOf(t)+1]||null; return {t,next,prog:next?Math.round((p-t.min)/(next.min-t.min)*100):100}; }
// --- 全9ミニゲームのPvP早押しルール（各ゲームの体験を1問数秒の対戦形式に変換。1試合1〜2分）---
const ARENA_NGQ=[{a:'computer',b:'typewriter',ans:'computer'},{a:'email',b:'telegram',ans:'email'},{a:'internet',b:'radio',ans:'internet'},{a:'online',b:'offline',ans:'online'}];
const ARENA_SLICEQ=[{w:'REPORT',cut:2},{w:'SUPPORT',cut:3},{w:'INSPECT',cut:2},{w:'PREDICT',cut:3},{w:'TRANSPORT',cut:5},{w:'DESCRIBE',cut:2}];
const shA=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pkA=a=>a[Math.random()*a.length|0];
const AZ26='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const ARENA_GENS={
  quiz(){ const r=pkA(ARENA_ROOTS); if(Math.random()<.5){ const means=[...new Set(ARENA_ROOTS.map(x=>x.mean))].filter(m=>m!==r.mean); return {q:'❓ 語根「'+r.root+'」の意味は？',ch:shA([r.mean,...shA(means).slice(0,3)]),a:r.mean}; } const o=pkA(ARENA_ROOTS.filter(x=>x.root!==r.root)); const ow=pkA(o.words); return {q:'❓ 「'+r.root+'（'+r.mean+'）」の仲間でないのは？',ch:shA([...shA(r.words).slice(0,3),ow]),a:ow}; },
  slice(){ const d=pkA(ARENA_SLICEQ); const mk=c=>d.w.slice(0,c)+' | '+d.w.slice(c); const wrong=[1,2,3,4,5,6].filter(c=>c!==d.cut&&c<d.w.length); return {q:'🔪 「'+d.w+'」を語根で正しく切ると？',ch:shA([mk(d.cut),...shA(wrong).slice(0,3).map(mk)]),a:mk(d.cut)}; },
  pair(){ const r=pkA(ARENA_ROOTS); const ws=shA(r.words); const others=shA(ARENA_ROOTS.filter(x=>x!==r)).slice(0,3).map(x=>pkA(x.words)); return {q:'🃏 「'+ws[0]+'」と同じ根っこの単語は？',ch:shA([ws[1],...others]),a:ws[1]}; },
  ngram(){ const p=pkA(ARENA_NGQ); return {q:'📈 2019年ごろ、本の中でより多く使われたのは？',ch:shA([p.a,p.b]),a:p.ans}; },
  alch(){ const keys=Object.keys(ALCH_WORDS); const k=pkA(keys); const e=ALCH_WORDS[k]; const pr=k.split('+'); const pj=(ALCH_PRE.find(x=>x.p===pr[0])||{}).ja||''; const rj=(ALCH_ROOT.find(x=>x.r===pr[1])||{}).ja||''; const others=shA(keys.filter(x=>x!==k)).slice(0,3).map(x=>ALCH_WORDS[x].w); return {q:'⚗️ '+pr[0]+'（'+pj+'）+ '+pr[1]+'（'+rj+'）= ?',ch:shA([e.w,...others]),a:e.w}; },

  }
  function genQ(){ return (ARENA_GENS[gid]||ARENA_GENS.quiz)(); }
  function judge(){
    const ms=mine.reduce((s,m)=>s+Math.max(0,m.hp),0), os=opps.reduce((s,o)=>s+Math.max(0,o.hp),0);
