<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#dff7ff">
<title>ひとつなぎ英単語</title>
<style>
:root{--ink:#25212b;--paper:#fffdf5;--blue:#66c5ee;--yellow:#ffd653;--red:#f15f78;--green:#55c99a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171622;color:var(--ink);font-family:"M PLUS Rounded 1c","Yu Gothic",system-ui,sans-serif;overscroll-behavior:none}
body{display:grid;place-items:center}
.game{width:min(100vw,760px);height:100dvh;min-height:520px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--paper);overflow:hidden}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 12px 9px;background:linear-gradient(180deg,#effcff,#bcecff);border-bottom:4px solid var(--ink)}
.brand{min-width:0}.brand h1{margin:0;font-size:clamp(22px,5vw,31px);line-height:1;font-weight:1000}.brand p{margin:5px 0 0;color:#536875;font-size:11px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:6px}.stat{min-width:62px;text-align:center;background:#fff;border:3px solid var(--ink);border-radius:13px;padding:3px 7px;box-shadow:0 4px 0 #25212b30}.stat small{display:block;font-size:9px;font-weight:900;color:#786f7b}.stat b{font-size:18px}
.boardWrap{position:relative;min-height:0;overflow:hidden;background:radial-gradient(circle at 22% 14%,#ffffff90 0 6%,transparent 7%),linear-gradient(180deg,#dff7ff 0%,#e8f8df 58%,#fff0b5 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.message{position:absolute;left:50%;top:10px;z-index:2;transform:translateX(-50%);max-width:calc(100% - 20px);padding:7px 13px;border:3px solid var(--ink);border-radius:999px;background:#fff;font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;box-shadow:0 4px 0 #25212b25}.message.good{background:#dffff0}.message.bad{background:#ffe1e7}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px max(9px,env(safe-area-inset-bottom));border-top:4px solid var(--ink);background:#fffaf0}.help{min-width:0}.help b{display:block;font-size:13px}.help span{display:block;margin-top:2px;color:#766c78;font-size:10px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{appearance:none;border:3px solid var(--ink);border-radius:13px;background:#fff;color:var(--ink);font:inherit;font-weight:1000;padding:9px 12px;box-shadow:0 4px 0 #25212b35;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 1px 0 #25212b35}
@media(max-width:430px){.game{min-height:480px}.top{padding-left:8px;padding-right:8px}.brand p{max-width:210px}.stat{min-width:52px;padding-inline:4px}.stat:nth-child(2){display:none}}
</style>
</head>
<body>
<main class="game">
  <header class="top">
    <div class="brand"><h1>ひとつなぎ英単語</h1><p>遮るボールがない直線だけをつなげる</p></div>
    <div class="stats"><div class="stat"><small>WORDS</small><b id="wordCount">0</b></div><div class="stat"><small>LONGEST</small><b id="longest">0</b></div></div>
  </header>
  <section class="boardWrap" id="boardWrap">
    <canvas id="board" aria-label="英単語ボールをつなぐ盤面"></canvas>
    <div class="message" id="message">ボールからボールへ、指でひとつなぎ</div>
  </section>
  <footer class="bottom">
    <div class="help"><b>順番はバラバラでもOK</b><span id="dictState">語源データベースを準備中…</span></div>
    <button id="reset" type="button">↻ やりなおす</button>
  </footer>
</main>
<script>
const FALLBACK_INFO={
  an:"一つの",and:"〜と",ant:"アリ",at:"〜に",ate:"食べた",be:"である",bed:"ベッド",bee:"ハチ",
  best:"最良の",cat:"ネコ",do:"する",dog:"イヌ",ear:"耳",eat:"食べる",far:"遠い",first:"第一の",
  go:"行く",hat:"帽子",he:"彼は",hear:"聞く",heart:"心",in:"中に",it:"それは",know:"知る",
  me:"私を",no:"いいえ",on:"上に",one:"一つ",or:"または",our:"私たちの",out:"外へ",rat:"ネズミ",
  read:"読む",red:"赤い",see:"見る",star:"星",tea:"茶",the:"その",there:"そこに",time:"時間",
  to:"〜へ",way:"道",we:"私たちは",well:"よく",word:"言葉",work:"仕事"
};
const FALLBACK=Object.keys(FALLBACK_INFO);
const $=s=>document.querySelector(s),canvas=$("#board"),ctx=canvas.getContext("2d"),wrap=$("#boardWrap");
const message=$("#message"),dictState=$("#dictState"),wordCountEl=$("#wordCount"),longestEl=$("#longest");
const colors=["#ffd653","#74caed","#f292aa","#8ed4a7","#c1a5e8","#f5a36c"];
const signature=s=>[...String(s).toLowerCase().replace(/[^a-z]/g,"")].sort().join("");
const shuffle=a=>{for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let W=1,H=1,dpr=1,baseR=28,bodies=[],selected=[],pointer=null,blocked=null,nextId=1,lastFrame=performance.now();
let wordBySignature=new Map(),wordInfo=new Map(),wordCount=0,longest=0,messageTimer=0,started=false;
let physicsAwake=true,stillFrames=0,physicsUntil=0;

function setDictionary(entries,source){
  const best=new Map();
  entries.forEach((entry,index)=>{
    const w=String(typeof entry==="string"?entry:entry.w||"").toLowerCase();
    if(!/^[a-z]{2,12}$/.test(w))return;
    const ja=typeof entry==="string"?(FALLBACK_INFO[w]||""):String(entry.ja||"");
    const r=typeof entry==="string"?index+1:(Number(entry.r)||9999);
    if(!best.has(w)||r<best.get(w).r)best.set(w,{w,ja,r});
  });
  wordBySignature=new Map();wordInfo=new Map();
  [...best.values()].sort((a,b)=>a.r-b.r).forEach(x=>{
    wordInfo.set(x.w,x);
    const sig=signature(x.w);
    if(!wordBySignature.has(sig))wordBySignature.set(sig,x.w);
  });
  dictState.textContent=`${source} ${best.size}語`;
}
setDictionary(FALLBACK,"内蔵辞書");
fetch("data/pie/words.json").then(r=>r.ok?r.json():Promise.reject()).then(rows=>{
  setDictionary(rows,"語源データベース");
}).catch(()=>{});

function resize(){
  const r=wrap.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(2,devicePixelRatio||1);
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!started&&W>100&&H>100){started=true;reset()}
  else if(started)wakePhysics();
}
new ResizeObserver(resize).observe(wrap);resize();

function bodyRadius(raw,isWord){return isWord?Math.min(baseR*1.9,baseR*(1+Math.max(1,raw.length-1)*.11)):baseR}
function addBody(letters,x,y,word=""){
  const raw=String(letters).toLowerCase(),isWord=!!word;
  const r=bodyRadius(raw,isWord);
  const info=wordInfo.get(word)||{};
  const b={id:nextId++,letters:raw,word,ja:info.ja||"",x,y,r,
    vx:(Math.random()-.5)*18,vy:0,color:colors[(raw.charCodeAt(0)+raw.length)%colors.length],pulse:0};
  bodies.push(b);return b;
}
function wakePhysics(){physicsAwake=true;stillFrames=0;physicsUntil=performance.now()+1800}
function reset(){
  selected=[];pointer=null;blocked=null;bodies=[];nextId=1;wordCount=0;longest=0;
  wordCountEl.textContent="0";longestEl.textContent="0";
  baseR=Math.max(20,Math.min(31,W/12.5));
  const initialWords=shuffle(["an","at","in","on","to","we","he","one","the","cat","dog","red"]);
  /* 円は長方形の面積を100%埋められない。充填限界を超えて作ると、
     解決不能なめり込みを毎フレーム押し戻し続けて荒ぶるため、密度に余裕を持たせる。 */
  let occupied=0,targetArea=W*Math.max(240,H-45)*.74;
  const specs=initialWords.slice(0,Math.max(6,Math.min(10,Math.floor(W/70))))
    .map(w=>({letters:w,word:w}));
  specs.forEach(s=>{const r=bodyRadius(s.letters,true);occupied+=Math.PI*r*r});
  const common="etaoinshrdlucmfwypvbgkjqx";
  let i=0;
  while(occupied<targetArea&&i<220){
    const ch=common[Math.floor(Math.random()*common.length)];
    specs.push({letters:ch,word:""});occupied+=Math.PI*baseR*baseR;i++;
  }
  shuffle(specs).forEach((s,i)=>addBody(s.letters,
    baseR+Math.random()*Math.max(1,W-baseR*2),-baseR-(i%18)*18-Math.floor(i/18)*58,s.word));
  /* 初回表示ではすでに積まれている。物理計算だけを先に進め、規則的な格子を作らない。 */
  wakePhysics();
  for(let n=0;n<900;n++)physicsStep(1/60,true);
  relaxBodies(36);
  bodies.forEach(b=>{b.vx=0;b.vy=0});physicsAwake=false;stillFrames=0;
  lastFrame=performance.now();
  say("ボールからボールへ、指でひとつなぎ","");
}
function hitBody(x,y){
  let best=null,dist=Infinity;
  for(const b of bodies){const d=Math.hypot(x-b.x,y-b.y);if(d<=b.r+8&&d<dist){best=b;dist=d}}
  return best;
}
function pointSegmentDistance(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,len=dx*dx+dy*dy;
  const t=len?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/len)):0;
  return Math.hypot(px-(ax+dx*t),py-(ay+dy*t));
}
function lineBlocker(a,b){
  if(!a||!b)return null;
  let nearest=null,best=Infinity;
  for(const o of bodies){
    if(o===a||o===b)continue;
    const d=pointSegmentDistance(o.x,o.y,a.x,a.y,b.x,b.y);
    if(d<o.r+4){
      const along=Math.hypot(o.x-a.x,o.y-a.y);
      if(along<best){nearest=o;best=along}
    }
  }
  return nearest;
}
function trySelect(candidate){
  if(!candidate||selected.includes(candidate))return;
  const from=selected[selected.length-1],wall=lineBlocker(from,candidate);
  if(wall){
    blocked={from,to:candidate,wall,until:performance.now()+300};wall.pulse=performance.now()+300;
    say(`${wall.word?wall.word.toUpperCase():wall.letters.toUpperCase()} が間をふさいでいる`,"bad");
    return;
  }
  selected.push(candidate);blocked=null;candidate.pulse=performance.now()+180;
}
function mergeSelection(){
  if(selected.length<2){selected=[];pointer=null;return}
  const letters=selected.map(b=>b.letters).join("");
  const word=wordBySignature.get(signature(letters));
  if(!word){
    selected.forEach(b=>b.pulse=performance.now()+420);
    say(`${letters.toUpperCase()} は英単語にならない`,"bad");selected=[];pointer=null;return;
  }
  const chosen=new Set(selected),weight=selected.reduce((s,b)=>s+b.r*b.r,0);
  const x=selected.reduce((s,b)=>s+b.x*b.r*b.r,0)/weight,y=selected.reduce((s,b)=>s+b.y*b.r*b.r,0)/weight;
  bodies=bodies.filter(b=>!chosen.has(b));
  const made=addBody(word,x,y,word);made.pulse=performance.now()+700;made.vy=-36;wakePhysics();
  wordCount++;longest=Math.max(longest,word.length);wordCountEl.textContent=wordCount;longestEl.textContent=longest;
  say(`${selected.map(b=>b.word?b.word.toUpperCase():b.letters.toUpperCase()).join(" + ")} → ${word.toUpperCase()}${made.ja?`（${made.ja}）`:""}`,"good");
  selected=[];pointer=null;blocked=null;
}
function keepInside(b){
  const floor=H-4;
  if(b.x<b.r+3){b.x=b.r+3;if(b.vx<0)b.vx=0}
  if(b.x>W-b.r-3){b.x=W-b.r-3;if(b.vx>0)b.vx=0}
  if(b.y>floor-b.r){b.y=floor-b.r;if(b.vy>0)b.vy=0;b.vx*=.82}
}
function relaxBodies(passes=16){
  for(let pass=0;pass<passes;pass++){
    let moved=false;
    for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){
      const a=bodies[i],b=bodies[j];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r+1;
      if(d>=min)continue;
      if(d<.001){dx=((a.id+b.id)%2?.01:-.01);dy=-.01;d=Math.hypot(dx,dy)}
      const nx=dx/d,ny=dy/d,overlap=min-d,ma=a.r*a.r,mb=b.r*b.r,total=ma+mb;
      a.x-=nx*overlap*mb/total;a.y-=ny*overlap*mb/total;
      b.x+=nx*overlap*ma/total;b.y+=ny*overlap*ma/total;moved=true;
    }
    bodies.forEach(keepInside);
    if(!moved)break;
  }
}
function physicsStep(dt,prewarm=false){
  const gravity=980;
  if(!prewarm)bodies.forEach(b=>{b.stepX=b.x;b.stepY=b.y});
  bodies.forEach(b=>{
    b.vy+=gravity*dt;b.vx*=.985;b.vy*=.996;b.x+=b.vx*dt;b.y+=b.vy*dt;
  });
  for(let pass=0;pass<10;pass++){
    for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){
      const a=bodies[i],b=bodies[j];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r+1;
      if(d>=min)continue;if(d<.01){dx=.1;dy=-.1;d=Math.hypot(dx,dy)}
      const nx=dx/d,ny=dy/d,overlap=min-d,ma=a.r*a.r,mb=b.r*b.r,total=ma+mb;
      a.x-=nx*overlap*mb/total;a.y-=ny*overlap*mb/total;b.x+=nx*overlap*ma/total;b.y+=ny*overlap*ma/total;
      const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      /* 反発させず、接近方向の速度だけを消す。積み上がった球が永久に跳ね続けない。 */
      if(rel<0){const impulse=-rel;a.vx-=nx*impulse*mb/total;a.vy-=ny*impulse*mb/total;b.vx+=nx*impulse*ma/total;b.vy+=ny*impulse*ma/total}
    }
    bodies.forEach(keepInside);
  }
  if(prewarm)return;
  /* 積み重なった球には重力ぶんの内部速度が残り得るため、速度値ではなく
     実際の画面上の移動量で静止を決める。見た目が止まったら計算も止める。 */
  const maxMove=bodies.reduce((m,b)=>Math.max(m,Math.hypot(b.x-b.stepX,b.y-b.stepY)),0);
  if(maxMove<.035)stillFrames++;else stillFrames=0;
  if(stillFrames>28||performance.now()>=physicsUntil){
    relaxBodies(36);bodies.forEach(b=>{b.vx=0;b.vy=0});physicsAwake=false;stillFrames=0
  }
}
function say(text,kind){
  clearTimeout(messageTimer);message.textContent=text;message.className=`message${kind?" "+kind:""}`;
  messageTimer=setTimeout(()=>{message.className="message"},900);
}
function drawBall(b,now){
  const active=selected.includes(b),pulse=now<b.pulse?1+.07*Math.sin((b.pulse-now)*.05):1;
  ctx.save();ctx.translate(b.x,b.y);ctx.scale(pulse,pulse);
  ctx.beginPath();ctx.arc(3,5,b.r,0,Math.PI*2);ctx.fillStyle="#25212b2d";ctx.fill();
  ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fillStyle=b.word?"#fff":b.color;ctx.fill();ctx.lineWidth=active?6:4;ctx.strokeStyle=active?"#20ae77":"#25212b";ctx.stroke();
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=varInk();
  if(b.word){
    const size=Math.max(11,Math.min(b.r*.43,b.r*1.45/Math.max(2,b.word.length)*2.6));ctx.font=`1000 ${size}px system-ui`;ctx.fillText(b.word.toUpperCase(),0,b.ja?-5:0);
    if(b.ja){ctx.font=`800 ${Math.max(8,b.r*.19)}px system-ui`;const ja=b.ja.length>9?b.ja.slice(0,8)+"…":b.ja;ctx.fillStyle="#625769";ctx.fillText(ja,0,b.r*.42)}
  }else{ctx.font=`1000 ${b.r*1.05}px system-ui`;ctx.fillText(b.letters.toUpperCase(),0,1)}
  ctx.restore();
}
function varInk(){return "#25212b"}
function drawScene(now){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle="#ffffff99";ctx.lineWidth=1;for(let y=72;y<H;y+=66){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  if(selected.length){
    ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=9;ctx.strokeStyle="#55c99a";ctx.beginPath();ctx.moveTo(selected[0].x,selected[0].y);
    selected.slice(1).forEach(b=>ctx.lineTo(b.x,b.y));
    if(pointer){const last=selected[selected.length-1],ghost={x:pointer.x,y:pointer.y,r:0};ctx.strokeStyle=lineBlocker(last,ghost)?"#f15f78":"#55c99a";ctx.lineTo(pointer.x,pointer.y)}ctx.stroke();
  }
  if(blocked&&now<blocked.until){ctx.strokeStyle="#f15f78";ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(blocked.from.x,blocked.from.y);ctx.lineTo(blocked.to.x,blocked.to.y);ctx.stroke()}else if(blocked)blocked=null;
  bodies.forEach(b=>drawBall(b,now));
}
function loop(now){
  const dt=Math.min(.033,Math.max(0,(now-lastFrame)/1000));lastFrame=now;
  if(!selected.length&&physicsAwake)physicsStep(dt);
  drawScene(now);requestAnimationFrame(loop);
}
function localPoint(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener("pointerdown",e=>{
  e.preventDefault();const p=localPoint(e),b=hitBody(p.x,p.y);if(!b)return;
  canvas.setPointerCapture?.(e.pointerId);selected=[b];pointer=p;b.pulse=performance.now()+180;
});
canvas.addEventListener("pointermove",e=>{
  if(!selected.length)return;pointer=localPoint(e);trySelect(hitBody(pointer.x,pointer.y));
});
canvas.addEventListener("pointerup",e=>{if(!selected.length)return;pointer=localPoint(e);trySelect(hitBody(pointer.x,pointer.y));mergeSelection()});
canvas.addEventListener("pointercancel",()=>{selected=[];pointer=null;blocked=null});
$("#reset").addEventListener("click",reset);
requestAnimationFrame(t=>{lastFrame=t;loop(t)});
</script>
</body>
</html>
