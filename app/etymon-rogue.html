<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>エティモリンゴ ことばの工房旅（プロトタイプ9）</title>
<!--
  ============================================================================
  エティモリンゴ:ことばの工房旅(プロトタイプ7)
  ============================================================================
  Nanbara の発明:<b>「名詞は場に出るだけ。根源動詞と組み合わせて 初めて世界が動く」</b>。

    ・jet を出す        → ジェットが 画面に あらわれる<b>だけ</b>
    ・のる → とぶ       → ジェットに乗って とびたち、谷でも川でも門でも 一気にこえる
    ・cabbage を出す    → キャベツが ころんと あらわれるだけ
    ・なげる            → けものに ぶつける /  たべる → 自分の おやつ /  わたす → 贈りもの
  同じ名詞が動詞しだいで 何通りにも働く = <b>無限の回答</b>。

  ■ ものの理(ことわり)
    ・名詞には<b>受動的な性質</b>だけがある。ランタンは出せば ひかる(だから
      きり・やみは 出すだけで晴れる)。はしは かかる。ジェットは<b>とばない</b>
      (とぶには のる が要る)。「現れるだけ」と「性質」の線引きが 納得の芯。
    ・動詞は<b>ワイルドが演じる</b>。なげる=投げるの一族(yē-)、わたす=与える(dō-)、
      みる=見る(weid-)、うたう=話す(bhā-)。jet も 実は yē-の子(噴き出す=投げ出す)。
      使った動詞・出したものの祖先が<b>旅の仲間</b>に ならんでいく。
    ・cabbage はDB外だが roots.csv の蘊蓄どおり kaput-(頭)の子として手登録。

  ■ クイズにしない決めごと(前作から継続)
    正解は無限(場面ごとに複数ルート+とんち)。失敗は存在しない ―
    かみあわない組み合わせは 芝居で受け止める(石に のる、ジェットを かじる…)。
    ライフも数値も無い。判定は 手書きの (動詞×もの×場面) 規則だけ。

  画面は 1920x1080 固定キャンバス + scale(箱庭と同じ)。
  ============================================================================
-->
<style>
:root{
  --ink:#241f26; --soft:#6f6673; --line:#e3d9cc; --paper:#fffdf8;
  --ok:#2f7a52; --ng:#a4415c; --gold:#b8860b;
  --hp:#e0455f; --enemy:#7f5aa0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#141019}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}
#wrap{position:fixed;inset:0;overflow:hidden}
button{font-family:inherit;cursor:pointer}
#app{position:absolute;left:50%;top:50%;width:1920px;height:1080px;
  transform:translate(-50%,-50%) scale(1);transform-origin:center center;
  background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#2f2833;color:#fff}
header h1{font-size:15px;font-weight:900;letter-spacing:.03em;white-space:nowrap}
header .sp{flex:1}
.hbtn{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.3);color:#fff;
  border-radius:9px;padding:4px 9px;font-size:11.5px;font-weight:bold;text-decoration:none;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.26)}
#trail{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900}
#trail .nd{padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.12);opacity:.55}
#trail .nd.cur{opacity:1;background:#ffd23e;color:#241f26}
#trail .nd.done{opacity:1;background:rgba(124,186,98,.85);color:#fff}

/* ===== 戦場 ===== */
#field{position:relative;flex:1 1 auto;overflow:hidden;background:#bfe3f5}
#bg{position:absolute;inset:0;background-repeat:repeat-x;background-size:auto 100%;background-position:0 bottom}
#field.night #bg{filter:brightness(.55) saturate(.8) hue-rotate(-15deg)}
#foeBox{position:absolute;right:430px;bottom:10px;height:300px;width:auto;cursor:pointer;transition:transform .15s}
#foeBox img{height:100%;width:auto;display:block;
  filter:brightness(.58) sepia(1) hue-rotate(228deg) saturate(2.3) contrast(1.05)
  drop-shadow(0 8px 6px rgba(30,20,40,.45))}
/* 困難(trial)は敵ではない。青く沈めて「自然のもの」に見せる */
#foeBox.trial img{filter:brightness(.75) sepia(1) hue-rotate(160deg) saturate(2.6) contrast(1.02)
  drop-shadow(0 8px 6px rgba(20,40,60,.45))}
#foeBox.hit{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
#foeBox.lunge{animation:lunge .34s ease-in-out}
@keyframes lunge{0%,100%{transform:translateX(0) scale(1)}45%{transform:translateX(-34px) scale(1.1)}}
#foeBox.sleeping::after{content:"💤";position:absolute;right:-6px;top:-4px;font-size:26px;
  animation:zzz 1.6s ease-in-out infinite}
@keyframes zzz{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-10px);opacity:1}}
#foeBox.down{animation:downFall 1.1s cubic-bezier(.4,0,.7,1) forwards}
#foeBox.down img{animation:downImg 1.1s ease-in forwards}
@keyframes downFall{0%{transform:rotate(0) translateY(0)}30%{transform:rotate(6deg) translateY(4px)}
  100%{transform:rotate(78deg) translateY(46px)}}
@keyframes downImg{0%{opacity:1}100%{filter:grayscale(1) brightness(.45);opacity:.25}}
#foeBox.asc{animation:ascend 2.1s cubic-bezier(.3,.7,.4,1) forwards}
#foeBox.asc img{animation:ascendImg 2.1s ease-out forwards}
@keyframes ascend{0%{transform:translateY(0) scale(1)}18%{transform:translateY(6px) scale(1.05,.94)}
  100%{transform:translateY(-70px) scale(1.02)}}
@keyframes ascendImg{0%{opacity:1}35%{filter:none;opacity:1}
  100%{filter:brightness(1.5) drop-shadow(0 0 40px #ffe98a);opacity:0}}
.halo{position:absolute;left:50%;top:44%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
  border:4px solid #ffe98a;pointer-events:none;z-index:14;animation:halo 1.5s ease-out forwards}
@keyframes halo{0%{transform:scale(.4);opacity:0}20%{opacity:.95}100%{transform:scale(13);opacity:0;border-width:1px}}
.sparkle{position:absolute;font-size:26px;pointer-events:none;z-index:15;animation:spk 1.6s ease-out forwards}
@keyframes spk{0%{transform:translate(0,0) scale(.4);opacity:0}25%{opacity:1}
  100%{transform:translate(var(--dx),-120px) scale(1.1);opacity:0}}
#flash{position:absolute;inset:0;pointer-events:none;z-index:18;opacity:0}
#flash.asc{animation:flashAsc 1.6s ease-out forwards;
  background:radial-gradient(circle at 72% 52%,#fff8dc 0%,#ffd23e55 38%,transparent 70%)}
#flash.down{animation:flashDown .55s ease-out forwards;
  background:radial-gradient(circle at 72% 52%,#ff4d6a 0%,#8b0f2288 45%,transparent 75%)}
@keyframes flashAsc{0%{opacity:0}22%{opacity:.85}100%{opacity:0}}
@keyframes flashDown{0%{opacity:0}10%{opacity:.9}100%{opacity:0}}
#field.quake{animation:quake .5s}
@keyframes quake{0%,100%{transform:translate(0,0)}15%{transform:translate(-9px,4px)}
  35%{transform:translate(8px,-5px)}55%{transform:translate(-6px,-3px)}78%{transform:translate(4px,3px)}}
#slash{position:absolute;inset:0;pointer-events:none;z-index:16;opacity:0}
#slash.on{animation:slashA .38s ease-out}
@keyframes slashA{0%{opacity:0}25%{opacity:.85;background:linear-gradient(105deg,transparent 42%,#fff 47%,#ffd23e 50%,#fff 53%,transparent 58%)}
  100%{opacity:0}}
#foeMeta{position:absolute;top:10px;right:430px;z-index:12;width:330px;
  display:flex;flex-direction:column;gap:3px;align-items:stretch;pointer-events:none}
#foeTag{text-align:center;font-size:11.5px;font-weight:900;color:#fff;
  background:rgba(30,20,40,.72);border-radius:8px;padding:3px 9px;line-height:1.35}
#foeHp{position:relative;height:20px;border-radius:99px;background:rgba(0,0,0,.5);overflow:hidden;
  border:2px solid rgba(255,255,255,.45)}
#foeHp em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#foeHp i{display:block;height:100%;border-radius:99px;transition:width .3s;
  background:linear-gradient(90deg,#b79ad6,#7f5aa0)}
#foeHp.trial i{background:linear-gradient(90deg,#7ec8e8,#3a7fb5)}
#foeInt{text-align:center;font-size:12px;font-weight:900;color:#ffd7d7;line-height:1.2}
#foeInt span{background:rgba(60,18,26,.82);border:1.5px solid #ff9db4;border-radius:8px;padding:2px 8px}
#foeInt b{font-size:15px;color:#fff}
#heroBox{position:absolute;left:430px;bottom:6px;height:250px;width:auto;cursor:pointer;transition:transform .15s}
#heroBox.hit{animation:shake .32s}
#heroBox.flinch{animation:flinch .42s ease-out}
@keyframes flinch{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(-16px) rotate(-5deg)}
  55%{transform:translateX(8px) rotate(3deg)}100%{transform:translateX(0) rotate(0)}}
#heroBox img{height:100%;width:auto;display:block;transform:scaleX(-1);
  filter:drop-shadow(0 8px 6px rgba(30,20,40,.4))}
#foeBox .drop,#heroBox .drop{position:absolute;inset:-8px;border:3px dashed transparent;border-radius:16px;
  transition:.12s;pointer-events:none}
#foeBox.zon .drop,#heroBox.zon .drop{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.12)}
#foeBox.hot .drop,#heroBox.hot .drop{border-color:#ffd23e;background:rgba(255,210,62,.28);
  box-shadow:0 0 22px rgba(255,210,62,.6)}
#myBars{position:absolute;left:8px;bottom:6px;width:240px;background:rgba(30,22,38,.62);
  border:1.5px solid rgba(255,255,255,.32);border-radius:12px;padding:6px 9px;z-index:9}
#myBars .grow{display:flex;align-items:center;gap:5px;margin-bottom:2px}
.gname{font-size:10.5px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap}
.gnum{font-size:10.5px;font-weight:800;color:#fff;opacity:.9;font-variant-numeric:tabular-nums;margin-left:auto}
.bar{flex:1;height:9px;border-radius:99px;background:rgba(0,0,0,.5);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .3s;background:linear-gradient(90deg,#ff9db4,var(--hp))}
.bar.warn{animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
#myNum .gd{color:#9fd0ff;margin-left:6px}
.pop{position:absolute;z-index:30;font-size:24px;font-weight:900;pointer-events:none;
  -webkit-text-stroke:5px #fff;paint-order:stroke fill;animation:popUp 1.05s ease-out forwards;white-space:nowrap}
.pop.dmg{color:var(--hp)} .pop.heal{color:var(--ok)} .pop.sat{color:#f2a444}
@keyframes popUp{0%{transform:translateY(0) scale(.55);opacity:0}14%{opacity:1}
  100%{transform:translateY(-72px) scale(1.06);opacity:0}}

/* ===== 吹き出し ===== */
#bubble{position:relative;width:1160px;margin:10px auto 0;background:rgba(255,253,246,.98);
  border:3px solid #2e2536;border-radius:16px;padding:9px 15px 10px;
  box-shadow:0 5px 0 rgba(30,20,40,.3);height:120px;z-index:14;flex:0 0 auto;
  display:flex;align-items:center;transition:opacity .2s}
#bubble::after{content:"";position:absolute;left:50%;margin-left:-11px;bottom:-14px;width:0;height:0;
  border:11px solid transparent;border-top-color:#2e2536;border-bottom:0}
#bubble .btxt{width:100%;max-height:100%;overflow:hidden;font-size:21px;font-weight:800;line-height:1.6;
  color:#241f26;white-space:pre-wrap}
#bubble .btxt b{color:#a4415c}
#bubble.calm{background:#f3fbf4;border-color:#2f7a52;box-shadow:0 5px 0 rgba(47,122,82,.35)}
#bubble.calm::after{border-top-color:#2f7a52}
#bubble .cur{display:inline-block;width:.6em;animation:blink .7s steps(1) infinite}
#bubble .nx{position:absolute;right:12px;bottom:6px;font-size:15px;color:#a4415c;animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ===== メッセージ欄 ===== */
#msg{flex:0 0 auto;height:104px;overflow-y:auto;overscroll-behavior:contain;
  background:#1d1822;color:#f4eee6;border-top:3px solid #0f0c14;
  padding:10px 20px 11px;font-size:19px;line-height:1.7;position:relative}
#msg .wrap{text-align:left;width:1160px;margin:0 auto}
#msg .ln{padding:1px 0}
#msg .ln b{color:#ffd23e}
#msg .ln.crit{color:#ffe98a;font-weight:bold}
#msg .ln.bad{color:#ff9db4}
#msg .nx{position:absolute;right:14px;bottom:8px;font-size:16px;color:#ffd23e;animation:blink .9s steps(1) infinite}

/* ===== 手札 ===== */
#handWrap{background:
  linear-gradient(rgba(255,235,200,.10),rgba(30,12,0,.22)),
  repeating-linear-gradient(90deg,#8a6440 0 178px,#7d5a39 178px 184px,#916b45 184px 366px,#7a5836 366px 372px),
  #8a6440;
  padding:6px 9px 4px;display:flex;flex-direction:column;gap:4px;
  position:relative;overflow:visible;z-index:30;flex:0 0 auto}
#hand{display:flex;align-items:flex-end;justify-content:center;height:332px;pointer-events:none;
  position:relative;z-index:40}
#handBar{display:flex;align-items:center;gap:10px;padding:0 6px 2px}
#handBar .note{font-size:12.5px;font-weight:900;color:#ffe9c9;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#handBar .sp{flex:1}
#btnReload{background:#fff3dd;border:2.5px solid #4a3c50;border-radius:11px;padding:6px 14px;
  font-size:13px;font-weight:900;color:#241f26;box-shadow:0 3px 0 rgba(46,37,54,.4)}
#deckN{font-size:12px;font-weight:900;color:#ffe9c9;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.handCard{position:relative;flex:0 0 286px;width:286px;height:330px;cursor:grab;
  touch-action:none;user-select:none;pointer-events:auto;z-index:1}
.handCard:active{cursor:grabbing}
.handCard .hcInner{position:absolute;left:50%;bottom:0;width:352px;margin-left:-176px;
  transform-origin:50% 100%;transition:transform .16s ease,filter .16s ease}
.handCard:hover,.handCard.dragging{z-index:9000}
.handCard:hover .hcInner{filter:drop-shadow(0 16px 12px rgba(20,14,28,.4))}
.handCard.dragging .hcInner{opacity:.28}
/* 錬成できる相手。ドラッグ中、実在の単語が生まれる札が金色に光る */
.handCard.mate .hcInner{filter:drop-shadow(0 0 18px #ffd23e) drop-shadow(0 0 6px #ffd23e)}
.handCard.mateHot .hcInner{filter:drop-shadow(0 0 26px #ff9a3d) drop-shadow(0 0 10px #ffd23e) brightness(1.08)}
.dragGhost{position:fixed;left:0;top:0;width:352px;z-index:9000;pointer-events:none;transform-origin:50% 50%;
  filter:drop-shadow(0 18px 16px rgba(20,14,28,.45))}

/* ===== 語根カード =====
   対話戦闘の wordCard と同じ紙・同じ枠。中身は語根キャラが主役。
     上段   … 数値ジェム(右上)
     顔     … キャラ 150px。その下に意味の札
     つづり … 英語での姿(vid / spect / re- / com- …)。錬成の手がかり
     ★     … レア度(派生語が少ない語根ほど強い) */
.rootCard{position:relative;width:352px;aspect-ratio:63/88;border-radius:16px;text-align:left;
  background:linear-gradient(160deg,color-mix(in srgb,var(--cc,#e8875a) 30%,#f5e9d2),#efe0c4 55%,
    color-mix(in srgb,var(--cc,#e8875a) 18%,#e9dabb));
  border:3px solid #2e2536;box-shadow:0 14px 30px rgba(30,20,40,.35),inset 0 0 0 2px #fff8;
  padding:12px 13px 11px;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.rootCard::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(115deg,transparent 0 7px,rgba(255,255,255,.16) 7px 8px)}
/* 修飾語根(接頭辞)は角にリボンを出して「前につく札」と分かるように */
.rootCard .modRibbon{position:absolute;left:-34px;top:20px;transform:rotate(-45deg);z-index:3;
  background:#7a6bd8;color:#fff;font-size:15px;font-weight:900;padding:3px 40px;
  box-shadow:0 2px 4px rgba(30,20,40,.35);letter-spacing:.06em}
.rootCard .gem{position:absolute;right:10px;top:10px;z-index:4;width:104px;height:104px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  border:5px solid #fff;box-shadow:0 5px 10px rgba(30,20,40,.45),inset 0 0 0 3px rgba(255,255,255,.35);
  color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4)}
.rootCard .gem i{font-style:normal;font-size:34px;line-height:1}
.rootCard .gem b{font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.rootCard .gem.a{background:radial-gradient(circle at 50% 35%,#ff8f6d,#c94f3d 78%)}
.rootCard .gem.g{background:radial-gradient(circle at 50% 35%,#7fb8ef,#3c6fb4 78%)}
.rootCard .gem.h{background:radial-gradient(circle at 50% 35%,#8fd99a,#3f9058 78%)}
.rootCard .gem.d{background:radial-gradient(circle at 50% 35%,#d9b3f0,#8a55c2 78%)}
.rootCard .gem.m{background:radial-gradient(circle at 50% 35%,#ffd982,#c98f2e 78%)}
.rootCard .face{margin-top:16px;width:195px;height:195px;border-radius:50%;background:#fffdf6;
  border:6px solid var(--cc,#e8875a);box-shadow:0 5px 10px rgba(30,20,40,.4);overflow:hidden;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.rootCard .face img{width:92%;height:92%;object-fit:contain;display:block}
.rootCard .meaning{margin-top:-16px;z-index:2;font-size:30px;font-weight:900;color:#fff;
  background:color-mix(in srgb,var(--cc,#e8875a) 62%,#241f26);border:3px solid #fff;
  border-radius:99px;padding:2px 18px;line-height:1.3;white-space:nowrap;
  box-shadow:0 3px 6px rgba(30,20,40,.45)}
/* 英語でのつづり。錬成の答え合わせはこの字面で起きる(re-+vid=review) */
.rootCard .sp{margin-top:10px;font-size:38px;font-weight:900;color:#4a3c50;letter-spacing:.03em;
  line-height:1.1;text-align:center}
.rootCard .sp small{display:block;font-size:14px;font-weight:800;color:#8d8299;letter-spacing:.02em}
.rootCard .hint{margin-top:auto;font-size:16.5px;font-weight:800;color:#5d5266;text-align:center;
  line-height:1.35;padding:0 6px}
.rootCard .stars{margin-top:6px;display:flex;gap:2px}
.rootCard .stars img{width:26px;height:26px}
.rootCard .stars img.off{filter:grayscale(1) opacity(.3)}

/* ===== 錬成された単語カード ===== */
.forgeCard{position:relative;width:352px;aspect-ratio:63/88;border-radius:16px;text-align:left;
  background:linear-gradient(160deg,#fff3d6,#f7e7bd 55%,#eeda9e);
  border:3px solid #8a6a1c;box-shadow:0 14px 30px rgba(30,20,40,.35),inset 0 0 0 2px #fff8,
    0 0 18px rgba(240,193,79,.5);
  padding:12px 13px 11px;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.forgeCard::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:repeating-linear-gradient(115deg,transparent 0 7px,rgba(255,255,255,.2) 7px 8px)}
.forgeCard .gem{position:absolute;right:10px;top:10px;z-index:4;width:104px;height:104px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:5px solid #fff;box-shadow:0 5px 10px rgba(30,20,40,.45);color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4)}
.forgeCard .gem i{font-style:normal;font-size:34px;line-height:1}
.forgeCard .gem b{font-size:34px;line-height:1.05}
.forgeCard .gem.a{background:radial-gradient(circle at 50% 35%,#ff8f6d,#c94f3d 78%)}
.forgeCard .gem.g{background:radial-gradient(circle at 50% 35%,#7fb8ef,#3c6fb4 78%)}
.forgeCard .gem.h{background:radial-gradient(circle at 50% 35%,#8fd99a,#3f9058 78%)}
.forgeCard .recipe{margin-top:8px;align-self:flex-start;display:flex;align-items:center;gap:5px}
.forgeCard .recipe .rc{width:56px;height:56px;border-radius:50%;background:#fffdf6;overflow:hidden;
  border:3px solid var(--c1,#e8875a);display:flex;align-items:center;justify-content:center}
.forgeCard .recipe .rc img{width:90%;height:90%;object-fit:contain}
.forgeCard .recipe em{font-style:normal;font-weight:900;font-size:22px;color:#8a6a1c}
.forgeCard .wicon{margin-top:8px;width:120px;height:120px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,#fff 0 40%,#ffedb8 100%);
  border:3px solid #8a6a1c;border-radius:14px;overflow:hidden}

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A='../assets/';
const dict=o=>Object.assign(Object.create(null),o||{});
let seed=(Math.random()*1e9)|0;
function rnd(){seed^=seed<<13;seed>>>=0;seed^=seed>>17;seed^=seed<<5;seed>>>=0;return seed/4294967296;}
const ri=n=>Math.floor(rnd()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

const CLAN=new Set(['kaput-','anə-','bhā-2','gwei-','oi-no-','reg-','weid-','yē-',
  'mori-','men-1','dō-','genu-1','per1','kom']);

/* ===========================================================================
   もの(名詞)。<b>場に出るだけ</b>。cat が受動的な性質。
     food=たべられる / ride=のれる(fly付きは空をとべる) / light=ひかる /
     music=ならせる / comfort=あたたかい / misc=ただの もの
   anc は祖先(14語根にいるときだけ)。jaFix はDBの語義が固いときの表示。
   =========================================================================== */
const ITEMS=dict({
  /* ==== 召喚できるのは<b>エティモペディア収録語だけ</b> ====
     memo は words.csv の語源メモそのまま。となえるたびに まめちしきが出る。
     絵は図鑑の図版(assets/word/)。辞典が そのまま「召喚の書」になる。
     person:1 は<b>ひと</b>。ものは受動だが、ひとは召喚すると自分の意思で動く。 */
  jet:    {cat:'ride', fly:1, em:'🛩', anc:'yē-', jaFix:'ジェット機',
           memo:'フランス語 jeter(投げる)から。空に投げ出されるもの'},
  cabbage:{cat:'food', em:'🥬', anc:'kaput-', jaFix:'キャベツ', noDb:1,
           memo:'昔のフランスの人もキャベツを見て「頭じゃん」と思った'},
  cap:    {cat:'wear', em:'🧢', anc:'kaput-',
           memo:'「頭」そのものではなく「頭にのせるもの」へ横すべり'},
  telephone:{cat:'voice', em:'☎', anc:'bhā-2',
           memo:'tele(遠く)+phone(声)。とおくの こえ'},
  smartphone:{cat:'voice', em:'📱', anc:'bhā-2', jaFix:'スマートフォン', noDb:1,
           memo:'かしこい“声”の板。一皮むくと5000年前の“声”の祖先がいる'},
  fable:  {cat:'book', em:'📖', anc:'bhā-2',
           memo:'「語られるもの」。文字より先に、ことばは話されるものだった'},
  video:  {cat:'see', em:'📺', anc:'weid-',
           memo:'ラテン語で「私は見る」。audio は「私は聞く」'},
  animal: {cat:'animal', em:'🐾', anc:'anə-',
           memo:'「息をするもの」。古代人による動物の定義'},
  zoo:    {cat:'place', em:'🦁', anc:'gwei-',
           memo:'zoological garden(生きもの学の庭)の頭だけが残った省略形'},
  rule:   {cat:'stick', em:'📏', anc:'reg-',
           memo:'まっすぐな棒 → ものさし → ルール。定規(ruler)と同じことば'},
  captain:{cat:'person', person:1, em:'⚓', anc:'kaput-',
           memo:'集団の「頭」に立つ人。船長・機長・キャプテン'},

   共通の物理。場面が拾わなかった組み合わせも、かならず何かが起きる
   =========================================================================== */
function globalResolve(ev,S){
  if(ev.k==='person')
    return {line:`「${ev.w}」が あらわれたが、ここでは やることが なさそうだ。かたを すくめて さっていった。`};
  if(ev.k==='summon'){
    const c=it(ev).cat;
    if(c==='food')return {line:`「${ev.w}」が ころんと あらわれた。うまそうだ。`};
    if(c==='ride')return {line:`「${ev.w}」が あらわれた。<b>のって みるか?</b>`};
    if(c==='voice')return {line:`「${ev.w}」が あらわれた。とおくへ こえを とどける どうぐだ。`};
    if(c==='book')return {line:`「${ev.w}」が あらわれた。だれかに <b>わたす</b>と よさそうだ。`};
    if(c==='see')return {line:`「${ev.w}」が あらわれた。<b>みる</b>と くみあわせられそうだ。`};
    if(c==='wear')return {line:`「${ev.w}」を ちょこんと かぶってみた。にあっている。`};
    if(c==='stick')return {line:`「${ev.w}」が あらわれた。まっすぐで じょうぶそうだ。`};
    return {line:`「${ev.w}」が あらわれた。……あらわれた だけだ。`};
  }
  const v=ev.v, tgt=ev.it, c=tgt?it2(tgt).cat:'';
  if(v==='ride'){
    if(c==='ride')return {mount:tgt, line:`「${tgt}」に またがった。${it2(tgt).fly?'<b>とべそうだ。</b>':'すすめそうだ。'}`};
    if(tgt)return {line:`「${tgt}」に のろうとして、ずるっと すべった。のるものじゃない。`};
    return {line:'のるものが ない。えいっと 空気に またがって みた。……むなしい。'};
  }
  if(v==='fly'){
    if(S.mounted&&it2(S.mounted).fly)return {line:`${S.mounted}が とびあがった!`};
    if(S.mounted)return {line:`「${S.mounted}」は とべない。ヒヒーンと ないた気がする。`};
    return {line:'ぴょんと はねてみた。とべては いない。'};
  }
  if(v==='eat'){
    if(c==='food')return {eat:1, consume:tgt, line:`「${tgt}」を もぐもぐ。……おいしい。`};
    if(tgt)return {consume:0, line:`「${tgt}」を かじってみた。……かたい。やめよう。`};
    return {line:'たべるものが ない。おなかが グウと なった。'};
  }
  if(v==='throw'){
    if(tgt)return {consume:tgt, line:`「${tgt}」を ぽーんと なげた。……なげただけだった。`};
    return {line:'なにも もっていないので、えいっと 空気を なげた。'};
  }
  if(v==='give'){
    if(tgt)return {line:`「${tgt}」を さしだしたが、うけとる あいてが いない。`};
    return {line:'わたすものが ない。'};
  }
  if(v==='look')return {line:'あたりを じっくり 見た。'};
  if(v==='sing')return {line:'ふんふん〜と うたってみた。いい きぶんだ。'};
  return {line:'なにも おこらなかった。'};
}

let ROOTS=dict(), WBY=dict();
const rec=w=>WBY[String(w||'').toLowerCase()]||dict();
const rootJa=k=>(ROOTS[k]&&ROOTS[k].ja)||k;
const jaOf=w=>ITEMS[w]&&ITEMS[w].jaFix?ITEMS[w].jaFix:(rec(w).ja||'');
const ancOf=w=>{
  if(ITEMS[w]&&ITEMS[w].anc)return ITEMS[w].anc;
  return ((rec(w).p||[]).find(k=>CLAN.has(k)))||'';
};
async function load(){
  const [rt,words]=await Promise.all([
    fetch('data/pie/roots.json').then(r=>r.json()),
    fetch('data/pie/words.json').then(r=>r.json()),
  ]);
  rt.forEach(r=>{ROOTS[r.key]=r;});
  const seen=new Set();
  for(const x of words){
    const k=x.w.toLowerCase();
    if(seen.has(k))continue; seen.add(k); WBY[k]=x;
  }
}

/* ===========================================================================
   手札。その場面の解き筋(kit)を1つ選んで必ず入れ、のこりは いろいろ。
   =========================================================================== */
function buildHand(sc){
  const kit=sc.kits[ri(sc.kits.length)].slice();
  const inHand=new Set(kit);
  const nouns=shuffle(Object.keys(ITEMS).filter(w=>!inHand.has(w))).slice(0,3);
  const verbs=shuffle(Object.keys(VERBS).filter(v=>!inHand.has(v))).slice(0,2);
  return shuffle([...kit,...nouns,...verbs]).slice(0,8);
}

const POW=6, PACKS=3;
let S=null;
function newRun(){
  S={si:0, sc:SCENES[0], hand:[], items:[], mounted:'', party:[], recap:[], over:0, mi:0, log:[],
     pow:POW, packs:PACKS, stars:[]};
  $('#over').classList.remove('on');
  enterScene(0);
}
function enterScene(i){
  const sc=SCENES[i];
  clearTimers(); clearInterval(typeTimer); typeTimer=null; pending=null; pendingPanel='msg';
  $('#bubble').className=''; $('#btxt').innerHTML='';
  S.si=i; S.sc=sc; S.mi=0; S.log=[]; S.items=[]; S.mounted='';
  S.pow=POW;
  S.hand=buildHand(sc);
  say(`【${esc(sc.ttl)}】 ${esc(sc.goal)}。`);
  bubble(sc.text);
  render();
}
/* ===== メッセージ ===== */
let typeTimer=null, pendingPanel='msg', pending=null, busy=false, timers=[];
function later(fn,ms){const id=setTimeout(fn,ms);timers.push(id);return id;}
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function say(h,cls){S.log.push({h,cls:cls||''});paintMsg();}
function newTurn(){S.log=[];paintMsg();}
function paintMsg(){
  const el=$('#msg'); if(!el)return;
  el.innerHTML='<div class="wrap">'+S.log.map(l=>`<div class="ln ${l.cls||''}">${l.h}</div>`).join('')+'</div>'
    +(pending&&pendingPanel==='msg'?'<span class="nx">▼</span>':'');
  requestAnimationFrame(()=>{el.scrollTop=el.scrollHeight;});
}
function sayType(text,cls,done){
  const raw=String(text||'');
  const bub=$('#bubble'), tx=$('#btxt');
  bub.className=cls||'';
  clearInterval(typeTimer);
  const parts=raw.split(/(<[^>]+>)/g);
  const plain=parts.filter(p=>!p.startsWith('<')).join('');
  let n=0;
  const paint=()=>{
    let left=n,out='';
    for(const p of parts){
      if(p.startsWith('<')){out+=p;continue;}
      if(left<=0)continue;
      out+=p.slice(0,left); left-=p.length;
    }
    tx.innerHTML=out+(n<plain.length?'<span class="cur">▌</span>':'')
      +(n>=plain.length&&pending&&pendingPanel==='bubble'?'<span class="nx">▼</span>':'');
  };
  paint();
  typeTimer=setInterval(()=>{
    n++; paint();
    if(n>=plain.length){clearInterval(typeTimer);typeTimer=null;if(done)setTimeout(done,180);}
  },26);
}
const bubble=(t,c)=>sayType(t,c);
function bubbleThen(text,cls,done){
  sayType(text,cls,()=>{pending=done;pendingPanel='bubble';
    const tx=$('#btxt'); if(tx&&!tx.querySelector('.nx'))tx.insertAdjacentHTML('beforeend','<span class="nx">▼</span>');});
}

   =========================================================================== */
function pickTarget(v){
  // 動詞の対象は場のものから自動で選ぶ。のる=のりもの優先/たべる・わたす=たべもの優先
  const pref=v==='ride'?'ride':v==='eat'?'food':v==='give'?'food':'';
  if(pref){const m=[...S.items].reverse().find(w=>it2(w).cat===pref); if(m)return m;}
  return S.items[S.items.length-1]||'';
}
function useCard(idx){
  if(!S||S.over||busy)return;
  const w=S.hand[idx]; if(!w)return;
  const sc=S.sc;
  S.hand.splice(idx,1);
  newTurn(); busy=true;
  S.pow--;
  let ev;
  if(VERBS[w]){
    const tgt=pickTarget(w);
    ev={k:'verb', v:w, it:tgt};
    say(`<b>${esc(VERBS[w].ja)}</b>${tgt?`（「${esc(tgt)}」に）`:''}!`);
    // ワイルドの演者。動詞に一族がいれば 顔を出す
    const ck=VERBS[w].clan;
    if(ck)joinParty(ck,`${rootJa(ck)}`);
  }else if(ITEMS[w]&&ITEMS[w].person){
    ev={k:'person', w};
    say(`<b>${esc(w)}</b>（${esc(jaOf(w))}）を よんだ。`);
    if(ITEMS[w].memo)say(`📖 ${esc(ITEMS[w].memo)}`);
    const ck=ancOf(w);
    if(ck)joinParty(ck,`${rootJa(ck)}`);
  }else{
    ev={k:'summon', w};
    say(`<b>${esc(w)}</b>（${esc(jaOf(w))}）を となえた。`);
    if(ITEMS[w]&&ITEMS[w].memo)say(`📖 ${esc(ITEMS[w].memo)}`);
    if(!S.items.includes(w))S.items.push(w);
    if(S.items.length>3)S.items.shift();
    const ck=ancOf(w);
    if(ck)joinParty(ck,`${rootJa(ck)}`);
  }
  const r=sc.resolve(ev,S)||globalResolve(ev,S);
  if(r.mount)S.mounted=r.mount;
  if(r.consume)S.items=S.items.filter(x=>x!==r.consume);
  if(ev.k==='summon'&&S.sc.img){const fb=$('#foeBox');
    fb.classList.remove('hop','wiggle'); void fb.offsetWidth; fb.classList.add('wiggle');}
  if(r.clear){
    const st=S.pow>=4?3:S.pow>=2?2:1;
    S.stars.push(st);
    S.recap.push({scene:sc.ttl, how:r.line.replace(/<[^>]+>/g,''), st});
    say(`のこりの力 ✨${S.pow} → <b>${'★'.repeat(st)}</b>`,'crit');
    sparkle();
    say('<b>みちが ひらけた!</b>','crit');
    bubbleThen(r.line,'calm',()=>{
      busy=false;
      if(S.si>=SCENES.length-1){S.over=1;showEnd();return;}
      enterScene(S.si+1);
    });
    render(); return;
  }
  bubble(r.line||sc.miss[S.mi++%sc.miss.length]);
  later(()=>{busy=false;
    if(S.pow<=0){packDrop();return;}
    if(S.hand.length<4)S.hand.push(...buildHand(S.sc).slice(0,4-S.hand.length+2));
    render();},900);
  render();
}
/* ことばの力が尽きた。にもつを ひとつ落として 力を くみなおす */
function packDrop(){
  S.packs--;
  if(S.packs<=0){
    S.over=2; render();
    say('<b>にもつを ぜんぶ 落としてしまった……。</b>','bad');
    later(()=>showFail(),900);
    return;
  }
  S.pow=POW;
  say(`<b>ことばの力が つきた!</b> あわてて にもつを ひとつ 落としてしまった（のこり🎒${S.packs}）。ひとやすみして 力を くみなおす。`,'bad');
  toast('🎒 にもつを ひとつ 落とした…');
  S.hand=buildHand(S.sc);
  render();
}
function toast(t){
  const d=document.createElement('div');
  d.textContent=t;
  d.style.cssText='position:fixed;left:50%;bottom:30%;transform:translateX(-50%);z-index:9500;'+
    'background:rgba(30,22,38,.92);color:#fff;font-weight:bold;font-size:14px;padding:8px 16px;border-radius:12px';
  document.body.appendChild(d); setTimeout(()=>d.remove(),1600);
}
function showFail(){
  $('#ovT').textContent='🎒 にもつが つきた…';
  $('#ovP').innerHTML=`ことばの力（✨）は 1回 となえるたびに へる。<br>
    ためすのは 楽しい。でも <b>どの くみあわせで 決めにいくか</b>を きめてから 動くと、力は もつ。<br>
    じぶんの 最短の 解きかたを さがそう。`;
  $('#ovDex').innerHTML='';
  $('#over .box').className='box dead';
  $('#ovBtn').textContent='もういちど 旅に出る';
  $('#ovBtn').onclick=()=>newRun();
  $('#over').classList.add('on');
}
function joinParty(k,label){
  if(!k||S.party.includes(k))return;
  S.party.push(k);
}
function reload(){
  if(!S||S.over||busy)return;
  newTurn();
  S.hand=buildHand(S.sc);
  say('ことばぶくろを あさりなおした。');
  render();
}
function showEnd(){
  const rows=S.recap.map(u=>`<div class="dw"><b>${'★'.repeat(u.st||1).padEnd(3,'☆')} ${esc(u.scene)}</b><span>${esc(u.how)}</span></div>`).join('');
  const total=S.stars.reduce((a,b)=>a+b,0);
  const party=S.party.map(k=>{const r=ROOTS[k]||{};
    return `<span style="display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-weight:900">
      <span style="width:52px;height:52px;border-radius:50%;overflow:hidden;background:#fffdf6;border:3px solid ${esc(r.color||'#8a7c96')};display:inline-flex;align-items:center;justify-content:center">
      ${r.img?`<img src="${A}${esc(r.img)}" style="width:90%;height:90%;object-fit:contain">`:''}</span>${esc(rootJa(k))}</span>`;}).join('');
  $('#ovT').textContent=`🏮 あかりの まちに ついた!　★${total} / ${SCENES.length*3}`;
  $('#ovP').innerHTML=`ものと 根源どうしの くみあわせが みちを ひらいた。<br>
    ${total===SCENES.length*3?'<b>ぜんぶ ★★★! むだのない 美しい旅だった。</b>':'力を 余して 解くほど ★が ふえる。もっと 短い くみあわせも あるはず。'}<br><br>`
    +(party?`<b>旅で ちからを かした 一族</b><br>${party}<br><br>`:'')
    +`<b>こんかいの 解きかた</b>（べつの くみあわせでも 解ける）`;
  $('#ovDex').innerHTML=rows;
  $('#over .box').className='box clear';
  $('#ovBtn').textContent='もういちど（べつの くみあわせで）';
  $('#ovBtn').onclick=()=>newRun();
  $('#over').classList.add('on');
}

/* ===========================================================================
   カード
   =========================================================================== */
function cardHTML(w){
  if(VERBS[w]){
    const v=VERBS[w], r=v.clan?ROOTS[v.clan]:null;
    return `<div class="verbCard">
      <span class="face">${r&&r.img?`<img src="${A}${esc(r.img)}">`:`<i>${v.em}</i>`}</span>
      <span class="vj">${esc(v.ja)}</span>
      ${r?`<span style="margin-top:8px;font-size:17px;font-weight:900;color:#5b4aa8">「${esc(rootJa(v.clan))}」の一族が 演じる</span>`:''}
      <span class="eff">${esc(v.hint)}</span>
    </div>`;
  }
  const t=ITEMS[w]||{em:'❔'};
  const art=`<img src="${A}word/${encodeURIComponent(w)}.png" alt="" style="width:170px;height:170px;object-fit:contain;margin-top:auto"
    onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'em',textContent:'${t.em}'}))">`;
  return `<div class="wordCard2 thingCard" style="--cc:${t.person?'#b49ad7':'#c9a86a'}">
    ${t.person?'<span style="position:absolute;left:12px;top:10px;background:#7a6bd8;color:#fff;font-size:16px;font-weight:900;border-radius:99px;padding:2px 12px">ひと</span>':''}
    ${art}
    <span class="wEn"${w.length>=11?' style="font-size:34px"':''}>${esc(w)}</span>
    <span class="wJa" style="font-size:26px">${esc(jaOf(w))}</span>
    <span class="eff" style="margin-top:auto;font-size:18px;opacity:.75">${t.person?'よぶと 自分の意思で うごく':'となえると 場に あらわれる'}</span>
  </div>`;
}

/* ===========================================================================
   描画
   =========================================================================== */
function trailHTML(){
  return SCENES.map((sc,i)=>{
    const cls=i<S.si||(i===S.si&&S.over)?'done':i===S.si?'cur':'';
    return `<span class="nd ${cls}">${i+1}</span>`;
  }).join('')+`<span class="nd ${S.over?'done':''}">🏮</span>`;
}
function render(){
  if(!S)return;
  const sc=S.sc;
  $('#trail').innerHTML=trailHTML();
  $('#mood').innerHTML=(S.party.length?'<span class="plabel">であった一族</span>':'')
    +S.party.map(k=>{const r=ROOTS[k]||{};
      return `<span class="pf" title="${esc(rootJa(k))}">${r.img?`<img src="${A}${esc(r.img)}">`:''}</span>`;}).join('');
  $('#foeTag').innerHTML=`【${esc(sc.ttl)}】<br><span style="opacity:.9;font-weight:800;font-size:12px">${esc(sc.goal)}</span>`;
  const img=$('#foeImg');
  if(sc.img){img.style.display='';
    const src=A+sc.img;
    if(img.getAttribute('src')!==src){img.src=src;
      img.onerror=function(){this.onerror=null;this.style.display='none';};}
  }else img.style.display='none';
  $('#bg').style.backgroundImage=`url(${A}${sc.bg})`;
  $('#field').classList.toggle('night',!!sc.night);
  const hi=$('#heroImg');
  if(hi.getAttribute('src')!==A+'player/wordopia-player.png'){
    hi.src=A+'player/wordopia-player.png';
    hi.onerror=function(){this.onerror=null;this.src=A+'chara/T_ch_kaput_head.png';};}
  $('#fieldItems').innerHTML=S.items.map(w=>{const t=it2(w);
    return `<span class="fitem"><img src="${A}word/${encodeURIComponent(w)}.png" alt=""
      style="width:76px;height:76px;object-fit:contain"
      onerror="this.replaceWith(Object.assign(document.createElement('i'),{textContent:'${t.em}'}))">
      <b>${esc(w)}</b><em>${esc(jaOf(w))}</em></span>`;}).join('');
  const mt=$('#mount');
  if(S.mounted){mt.style.display='block';mt.textContent=`${it2(S.mounted).em} ${S.mounted}に のっている`;}
  else mt.style.display='none';
  paintMsg();
  $('#btnReload').textContent='🔄 ことばぶくろを あさる（力は へらない）';
  $('#deckN').innerHTML=`ばめん ${S.si+1}/${SCENES.length}　<b style="color:#ffe98a">${'✨'.repeat(Math.max(0,S.pow))}${'・'.repeat(Math.max(0,POW-S.pow))}</b>　${'🎒'.repeat(S.packs)}`;
  $('#hand').innerHTML=S.hand.map((w,i)=>
    `<div class="handCard" data-i="${i}"><div class="hcInner">${cardHTML(w)}</div></div>`).join('');
  fanHand();
}
function sparkle(){
  const f=$('#field');
  for(let i=0;i<7;i++){
    const s=document.createElement('div'); s.className='sparkle'; s.textContent='✧';
    s.style.left=(f.clientWidth*0.55+(i-3)*40)+'px'; s.style.top=(f.clientHeight*0.45)+'px';
    s.style.setProperty('--dx',((i-3)*22)+'px');
    s.style.animationDelay=(i*60)+'ms';
    f.appendChild(s); setTimeout(()=>s.remove(),1800+i*60);
  }
}

/* ===== 手札とドラッグ ===== */
let fanSc=.66;
function fitHand(){
  const n=S?S.hand.length:0;
  const w=Math.min(286,Math.floor(1700/Math.max(1,n)));
  document.querySelectorAll('#hand .handCard').forEach(c=>{
    c.style.flex=`0 0 ${w}px`; c.style.width=w+'px'; c.style.height='330px';
  });
}
function fanT(i,c){const d=i-c;
  return `translateY(${-Math.abs(d)*13}px) rotate(${d*4.5}deg) scale(${fanSc})`;}
function fanHand(){
  fitHand();
  const cs=[...document.querySelectorAll('#hand .handCard')];
  const c=(cs.length-1)/2;
  cs.forEach((el,i)=>{
    const inner=el.querySelector('.hcInner');
    inner.style.transform=fanT(i,c);
    el.onpointerenter=()=>{inner.style.transform=`translateY(-96px) rotate(0deg) scale(.82)`;};
    el.onpointerleave=()=>{inner.style.transform=fanT(i,c);};
    el.addEventListener('pointerdown',ev=>startDrag(ev,el));
  });
}
function zoneAt(x,y){
  const b=$('#field').getBoundingClientRect();
  return (x>=b.left&&x<=b.right&&y>=b.top&&y<=b.bottom);
}
function startDrag(e,card){
  if(e.button!==undefined&&e.button!==0)return;
  const i=+card.dataset.i;
  if(!S||S.over||busy||!S.hand[i])return;
  e.preventDefault();
  card.classList.add('dragging');
  const ghost=document.createElement('div');
  ghost.className='dragGhost';
  ghost.innerHTML=cardHTML(S.hand[i]);
  document.body.appendChild(ghost);
  const start={x:e.clientX,y:e.clientY};
  const toLocal=(cx,cy)=>{const r=$('#app').getBoundingClientRect();
    const k=r.width/1920; return {x:(cx-r.left)/k,y:(cy-r.top)/k};};
  const aim=$('#aim'), path=$('#aimPath');
  const a0=toLocal(start.x,start.y);
  aim.classList.add('on');
  const move=ev=>{
    ghost.style.transform=`translate(${ev.clientX}px,${ev.clientY}px) translate(-50%,-56%) scale(.42)`;
    const z=zoneAt(ev.clientX,ev.clientY);
    const a1=toLocal(ev.clientX,ev.clientY);
    const cx=(a0.x+a1.x)/2, cy=Math.min(a0.y,a1.y)-Math.abs(a1.x-a0.x)*.28-90;
    path.setAttribute('d',`M${a0.x.toFixed(0)},${a0.y.toFixed(0)} Q${cx.toFixed(0)},${cy.toFixed(0)} ${a1.x.toFixed(0)},${a1.y.toFixed(0)}`);
    aim.classList.toggle('hit',!!z);
  };
  const cleanup=()=>{
    card.classList.remove('dragging'); ghost.remove();
    aim.classList.remove('on','hit'); path.removeAttribute('d');
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',up);
    window.removeEventListener('pointercancel',cleanup);
  };
  const up=ev=>{
    const z=zoneAt(ev.clientX,ev.clientY);
    cleanup();
    if(z)useCard(i);
  };
  move(e);
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up,{once:true});
  window.addEventListener('pointercancel',cleanup,{once:true});
}

/* ===== 起動 ===== */
const fitStage=()=>{
  const vw=(window.visualViewport&&visualViewport.width)||innerWidth;
  const vh=(window.visualViewport&&visualViewport.height)||innerHeight;
  $('#app').style.transform=`translate(-50%,-50%) scale(${Math.min(vw/1920,vh/1080)})`;
};
addEventListener('resize',fitStage);
addEventListener('orientationchange',fitStage);
if(window.visualViewport)visualViewport.addEventListener('resize',fitStage);

async function boot(){
  fitStage();
  try{ await load(); }
  catch(e){
    $('#msg').innerHTML='<div class="wrap"><div class="ln bad">データが読めない。http経由で開くこと'+
      '（python3 -m http.server 8000 → localhost:8000/app/etymon-rogue.html）</div></div>';
    return;
  }
  $('#btnReload').onclick=reload;
  $('#btnRetry').onclick=()=>newRun();
  const go=ev=>{if(!pending)return;
    const fn=pending;pending=null;fn();};
  addEventListener('pointerdown',ev=>{
    if(ev.target.closest('.handCard,#btnReload,#btnRetry,#over'))return;
    go(ev);
  });
  newRun();
}
window.G={get S(){return S;},SCENES,ITEMS,VERBS,useCard,newRun,enterScene,
  get waiting(){return !!pending;}, get busy(){return busy;},
  set busyOff(v){busy=false;}};
boot();
</script>
