<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>エティモリンゴ:打つバトル</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#141019; --panel:#1e1826; --line:#332b40; --ink:#f2eef7; --dim:#9c92ab;
  --hot:#ffd166; --bad:#ff5d73; --good:#5ddba1;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;user-select:none}
#app{height:100%;display:flex;flex-direction:column}

/* ---- 上: 敵 ---- */
#top{flex:0 0 auto;position:relative;display:flex;align-items:center;justify-content:center;
  min-height:clamp(150px,26vh,230px);padding:6px 14px;
  background:radial-gradient(120% 100% at 50% 0%,#241c2e 0%,#141019 72%)}
#foes{display:flex;justify-content:center;align-items:center;gap:clamp(10px,3vw,56px)}
.foe{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  padding:6px 12px;border-radius:14px;border:2px solid transparent;min-width:124px;
  transition:border-color .12s}
.foe.on{border-color:var(--hot);background:#ffd1660f}
.foe.dead{opacity:.16;pointer-events:none;filter:grayscale(1)}
.foe .body{font-size:clamp(34px,8vh,74px);line-height:1;position:relative;
  filter:drop-shadow(0 5px 10px #0009)}
.foe.hurt{animation:shake .28s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.foe .nm{font-size:11px;color:var(--dim)}
.foe .st{font-size:11px;padding:1px 8px;border-radius:99px;background:#3a2f47;
  border:1px solid var(--line);white-space:nowrap}
.foe.on .st{background:var(--hot);color:#241c2e;font-weight:700;border-color:var(--hot)}
.foe .ct{position:absolute;right:-6px;top:-4px;min-width:24px;height:24px;border-radius:99px;
  background:var(--bad);color:#fff;font-size:13px;font-weight:800;display:flex;
  align-items:center;justify-content:center;border:2px solid #141019}
.foe .ct.soon{background:#fff;color:var(--bad)}
.hp{width:100%;height:7px;border-radius:99px;background:#3a2f47;overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff8a5c,#ff5d73);
  transition:width .3s}
.foe .num{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}

/* ---- 中央: パーティー ---- */
#mid{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:7px 14px;background:linear-gradient(180deg,#1b1524,#181321);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#party{display:flex;gap:clamp(6px,1.4vw,14px)}
.mem{width:clamp(36px,6.6vh,58px);aspect-ratio:1;border-radius:12px;overflow:hidden;
  border:2px solid var(--line);background:#2a2334}
.mem img{width:100%;height:100%;object-fit:cover}
.mem.fire{animation:pop .34s}
@keyframes pop{40%{transform:translateY(-11px) scale(1.16)}}
#hpline{display:flex;align-items:center;gap:10px;width:min(760px,100%)}
#hpline .bar{flex:1 1 auto;height:13px;border-radius:99px;background:#3a2f47;overflow:hidden}
#hpline .bar i{display:block;height:100%;
  background:linear-gradient(90deg,#5ddba1,#39b98a);transition:width .3s}
#hpline .n{font-size:11px;color:var(--dim);white-space:nowrap;
  font-variant-numeric:tabular-nums}
#hpline .ch{font-size:11px;color:var(--hot);font-weight:700;min-width:60px;text-align:right}

#cutin{position:absolute;left:14px;top:10px;display:flex;align-items:center;gap:8px;
  opacity:0;transform:translateX(-24px);pointer-events:none;transition:.16s}
#cutin.on{opacity:1;transform:none}
#cutin img{width:clamp(52px,10vh,88px);height:clamp(52px,10vh,88px);object-fit:cover;
  border-radius:12px;border:2px solid var(--hot);background:#2a2334}
#cutin .tx b{display:block;font-size:clamp(15px,2.4vh,21px);letter-spacing:.05em}
#cutin .tx s{display:block;font-size:11px;color:var(--dim);text-decoration:none}
#pop{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dmg{position:absolute;font-weight:800;font-size:clamp(19px,3.4vh,32px);
  text-shadow:0 2px 6px #000;animation:rise .85s forwards}
.dmg.w{color:var(--hot)}
@keyframes rise{to{transform:translateY(-58px);opacity:0}}
#log{position:absolute;right:14px;top:8px;width:min(30vw,330px);font-size:11px;
  line-height:1.45;color:var(--dim);text-align:right;pointer-events:none}
#log b{color:var(--ink)}

/* ---- 下: 手札 + 入力 ---- */
#bottom{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;
  gap:8px;padding:10px 14px 12px;background:#181321}
#hand{flex:1 1 auto;min-height:0;display:flex;gap:clamp(6px,1.2vw,16px);
  justify-content:center;flex-wrap:nowrap}
.card{width:clamp(120px,15.5vw,214px);border-radius:14px;background:var(--panel);
  border:2px solid var(--line);padding:8px 8px 7px;display:flex;flex-direction:column;
  align-items:center;gap:4px;position:relative;transition:.12s;cursor:pointer;
  overflow:hidden}
.card.hit{border-color:var(--hot);background:#ffd16612;transform:translateY(-6px)}
.card.used{opacity:0;transform:scale(.8);pointer-events:none}
.card.weak{box-shadow:0 0 0 2px #ffd16655}
.card .pic{flex:1 1 auto;min-height:44px;width:100%;object-fit:contain;
  filter:drop-shadow(0 2px 4px #0007)}
.card .ja{flex:0 0 auto;font-size:clamp(11px,1.7vh,14px);line-height:1.2;text-align:center;
  color:var(--ink)}
.card .root{flex:0 0 auto;font-size:10px;color:var(--hot);opacity:.85}
.card .ety{flex:0 0 auto;font-size:9.5px;line-height:1.35;color:var(--dim);text-align:center;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .slots{flex:0 0 auto;font-family:ui-monospace,monospace;
  font-size:clamp(13px,2.3vh,21px);letter-spacing:.2em;font-weight:800;color:#6b6079;
  white-space:nowrap;padding:1px 0}
.card .slots em{font-style:normal;color:var(--hot)}
.card .slots u{text-decoration:none;color:var(--ink)}
.card .tag{position:absolute;left:5px;top:5px;font-size:12px;background:#141019cc;
  border-radius:99px;padding:1px 5px;border:1px solid var(--line)}
.card .fam{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:99px;
  border:2px solid var(--line);overflow:hidden;background:#2a2334}
.card .fam img{width:100%;height:100%;object-fit:cover}
.card .hint{flex:0 0 auto;font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);
  background:#241d2f;color:var(--dim);cursor:pointer}
.card .hint:hover{border-color:var(--hot);color:var(--ink)}

#inputrow{flex:0 0 auto;display:flex;gap:8px;align-items:center;width:min(760px,100%)}
#typed{flex:1 1 auto;text-align:center;font-size:clamp(15px,2.4vh,22px);letter-spacing:.24em;
  text-transform:uppercase;padding:9px 10px;border-radius:11px;border:2px solid var(--line);
  background:#241d2f;color:var(--hot);font-weight:800;font-family:ui-monospace,monospace}
#typed:focus{outline:none;border-color:var(--hot)}
#typed::placeholder{color:#6b6079;letter-spacing:0;font-weight:400;text-transform:none;
  font-family:inherit}
button{font-family:inherit;font-weight:700;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);border-radius:10px;cursor:pointer;padding:9px 14px;font-size:12px;
  transition:.12s}
button:hover{background:#2a2334;border-color:var(--hot)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,#typed:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
#kb{display:none;flex-direction:column;gap:4px;align-items:center}
#kb.on{display:flex}
#kb .r{display:flex;gap:4px}
#kb button{padding:8px 0;width:clamp(26px,3.3vw,42px);font-size:13px;border-radius:7px}

/* ---- オーバーレイ ---- */
#ov{position:absolute;inset:0;background:#100d15f5;display:flex;align-items:center;
  justify-content:center;z-index:20;padding:18px;overflow:auto}
#ov.off{display:none}
.sheet{width:min(1000px,100%);text-align:center}
.sheet h1{font-size:clamp(20px,3.6vh,30px);margin-bottom:4px}
.sheet p{color:var(--dim);font-size:13px;line-height:1.7;margin-bottom:12px}
#pick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;
  max-height:40vh;overflow:auto;padding:2px}
.pk{width:clamp(76px,8.4vw,104px);padding:6px;border-radius:11px;background:var(--panel);
  border:2px solid var(--line);cursor:pointer}
.pk.on{border-color:var(--hot);background:#ffd1660f}
.pk img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#2a2334}
.pk b{display:block;font-size:12px;margin-top:4px}
.pk s{display:block;font-size:10px;color:var(--dim);text-decoration:none}
.row{display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:10px;
  flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 16px}
.seg button.on{background:var(--hot);color:#241c2e}
#go{padding:11px 44px;font-size:15px;background:var(--hot);color:#241c2e;border-color:var(--hot)}
#go:disabled{background:var(--panel);color:var(--dim)}
.help{font-size:11px;color:#6b6079;line-height:1.8;max-width:680px;margin:10px auto 0;
  text-align:left;border-top:1px solid var(--line);padding-top:9px}
.help b{color:var(--dim)}
table.h{margin:6px 0;border-collapse:collapse;font-size:11px}
table.h td{padding:1px 12px 1px 0;color:#6b6079}
#dexlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0;
  max-height:40vh;overflow:auto}
.dx{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px;
  font-size:11px;text-align:left;width:196px;display:flex;gap:7px}
.dx img{width:40px;height:40px;object-fit:contain;flex:0 0 auto}
.dx b{font-size:13px;display:block;letter-spacing:.03em}
.dx s{display:block;color:var(--dim);text-decoration:none;margin-top:2px;line-height:1.35}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{
  animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="log"></div>
    <div id="foes"></div>
    <div id="cutin"><img alt=""><div class="tx"><b></b><s></s></div></div>
    <div id="pop"></div>
  </div>
  <div id="mid">
    <div id="party"></div>
    <div id="hpline"><span class="n" id="hpn"></span><div class="bar"><i></i></div>
      <span class="ch" id="chain"></span></div>
  </div>
  <div id="bottom">
    <div id="hand"></div>
    <div id="inputrow">
      <input id="typed" placeholder="意味と語源を見て英語を打つ" autocomplete="off"
             autocapitalize="off" spellcheck="false">
      <button id="kbtoggle">⌨</button>
    </div>
    <div id="kb"></div>
  </div>
  <div id="ov"><div class="sheet" id="ovc"></div></div>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const CHDIR='../assets/chara/', WDIR='../assets/word/';
const CH=n=>(self.__IMG&&self.__IMG[n])||CHDIR+n;
const WI=n=>(self.__WIMG&&self.__WIMG[n])||WDIR+n;
const SLOT=['#ff8a5c','#63c7ff','#ffd166','#8de08a'];

// 意味・語根・語源は最初から見せる。絵だけでは語を特定できないし、
// 語源を隠したらエティモリンゴである意味が無い。
// 伏せるのは綴りだけ。ヒントを開けるほど威力が落ちる
const HINT=[
  {n:'',        mul:1.00},
  {n:'頭文字',  mul:0.70},
  {n:'前半',    mul:0.45},
  {n:'全部',    mul:0.25},
];
const TAGICON={見:'👁',光:'✨',水:'💧',冷:'❄',音:'🔊',話:'💬',壊:'💥',切:'✂',
  集:'🔗',結:'🪢',食:'🍽',生:'🌱',掴:'✊',引:'🪝',知:'📖',飛:'🪶',浮:'🎈',
  打:'👊',押:'🫸',癒:'💗',守:'🛡',覆:'🧢',金:'🪙',動:'🏃',回:'🌀',運:'📦',
  楽:'🎵',温:'🔥',火:'🔥',闇:'🌑',眠:'💤',乾:'🌵',終:'⌛',聞:'👂',落:'🪂'};

const LV={
  easy:{n:5,lo:3,hi:6 ,rank:700 ,label:'初級'},
  mid :{n:5,lo:3,hi:8 ,rank:1400,label:'中級'},
  hard:{n:6,lo:4,hi:10,rank:9999,label:'上級'},
};
let DATA=null, G=null;

/* ================= 描画 ================= */
function slots(w){
  // 打った文字は明るく、ヒントで出た文字は白、まだのところは _
  const t=(G.input||'').toLowerCase();
  return w.w.split('').map((ch,i)=>{
    if(i<t.length&&t[i]===ch)return `<em>${ch.toUpperCase()}</em>`;
    if(i<w.reveal)return `<u>${ch.toUpperCase()}</u>`;
    return '_';
  }).join('');
}
function drawHand(){
  const t=(G.input||'').toLowerCase();
  const foe=G.foes[G.target];
  $('#hand').innerHTML=G.hand.map((w,i)=>{
    const hit=t&&w.w.startsWith(t);
    const weak=foe&&w.tk.some(x=>foe.wk.tags.includes(x));
    const tag=w.tk.map(x=>TAGICON[x]).filter(Boolean)[0]||'';
    const h=HINT[w.hint];
    return `<div class="card ${hit?'hit':''} ${weak?'weak':''}" data-i="${i}">
      ${tag?`<span class="tag">${tag}</span>`:''}
      <span class="fam" style="border-color:${w.slotcol}"
        title="${w.jp}"><img src="${CH(w.cimg)}" alt=""></span>
      <img class="pic" src="${WI(w.img)}" alt="" draggable="false">
      <b class="ja">${w.ja}</b>
      <span class="slots">${slots(w)}</span>
      <span class="root">語根「${w.jp}」</span>
      <span class="ety">${w.b||`語根「${w.jp}」から生まれた語。`}</span>
      <span class="hint">${w.hint<3?`ヒント ▸ ${HINT[w.hint+1].n}
        (威力${Math.round(HINT[w.hint+1].mul*100)}%)`:`威力${Math.round(h.mul*100)}%`}</span>
    </div>`;
  }).join('');
  $$('#hand .hint').forEach((e,i)=>e.onclick=ev=>{ev.stopPropagation();hint(i)});
  $$('#hand .card').forEach(e=>e.onclick=()=>$('#typed').focus());
}
function drawFoes(){
  $('#foes').innerHTML=G.foes.map((f,i)=>`
    <div class="foe ${i===G.target?'on':''} ${f.hp<=0?'dead':''}" data-i="${i}">
      <div class="body">${f.icon}<span class="ct ${f.ct<=1?'soon':''}">${f.ct}</span></div>
      <div class="nm">${f.name}</div>
      <div class="st">${f.wk.icon} ${f.wk.jp}</div>
      <div class="hp"><i style="width:${Math.max(0,f.hp/f.max*100)}%"></i></div>
      <div class="num">${Math.max(0,f.hp)} / ${f.max}</div>
    </div>`).join('');
  $$('#foes .foe').forEach(e=>e.onclick=()=>{G.target=+e.dataset.i;drawFoes();drawHand()});
}
function drawParty(){
  $('#party').innerHTML=G.party.map((p,i)=>
    `<div class="mem" style="border-color:${SLOT[i]}">
       <img src="${CH(p.img)}" alt="${p.jp}"></div>`).join('');
}
function drawHP(){
  $('#hpline .bar i').style.width=Math.max(0,G.hp/G.maxhp*100)+'%';
  $('#hpn').textContent=`味方HP ${Math.max(0,G.hp)} / ${G.maxhp}`;
  $('#chain').textContent=G.chain>1?G.chain+'連鎖':'';
}
function log(html){const l=$('#log');const d=document.createElement('div');
  d.innerHTML=html;l.prepend(d);while(l.children.length>5)l.lastChild.remove()}

/* ================= 手札 ================= */
function draw1(){
  const need=G.foes.filter(f=>f.hp>0).flatMap(f=>f.wk.tags);
  const inHand=new Set(G.hand.map(w=>w.w));
  const left=G.pool.filter(w=>!inHand.has(w.w)&&!G.used.has(w.w));
  const src=left.length?left:G.pool.filter(w=>!inHand.has(w.w));
  // 特攻できる札が手札に1枚も無いと、選ぶ意味が消える
  const weak=src.filter(w=>w.tk.some(t=>need.includes(t)));
  const noWeak=!G.hand.some(w=>w.tk.some(t=>need.includes(t)));
  const from=(noWeak&&weak.length)?weak:src;
  const w=from[(G.rnd()*from.length)|0];
  return {...w,hint:0,reveal:0};
}
function refill(){
  while(G.hand.length<G.lv.n)G.hand.push(draw1());
}
function hint(i){
  const w=G.hand[i];
  if(!G.running||w.hint>=3)return;
  w.hint++;
  w.reveal=w.hint>=3?w.w.length:w.hint>=2?Math.ceil(w.w.length/2):1;
  drawHand();
  $('#typed').focus();
}

/* ================= 攻撃 ================= */
function dmgOf(w,foe){
  const lenK=1+(w.w.length-4)*0.18;
  const rareK=1+Math.log(w.r+1)*0.15;
  const weak=w.tk.some(t=>foe.wk.tags.includes(t))?2:1;
  return {n:Math.max(1,Math.round(40*lenK*rareK*weak*HINT[w.hint].mul
        *Math.pow(1.15,G.chain))),weak:weak>1};
}
function fire(i){
  const w=G.hand[i];
  if(!w||!G.running)return;
  const foe=G.foes[G.target];
  const d=dmgOf(w,foe);
  foe.hp-=d.n; G.chain++; G.used.add(w.w); G.dex.set(w.w,w);

  const slot=G.party.findIndex(p=>p.key===w.key);
  const ci=$('#cutin');
  ci.querySelector('img').src=CH(w.cimg);
  ci.querySelector('b').textContent=w.w.toUpperCase();
  ci.querySelector('s').textContent=w.ja+' — '+w.jp;
  ci.classList.add('on'); clearTimeout(G.ciT);
  G.ciT=setTimeout(()=>ci.classList.remove('on'),1000);
  const mem=$$('#party .mem')[slot];
  if(mem){mem.classList.remove('fire');void mem.offsetWidth;mem.classList.add('fire')}

  const fe=$$('#foes .foe')[G.target];
  if(fe){fe.classList.remove('hurt');void fe.offsetWidth;fe.classList.add('hurt');
    const r=fe.getBoundingClientRect(), t=$('#top').getBoundingClientRect();
    const p=document.createElement('div');
    p.className='dmg'+(d.weak?' w':'');
    p.textContent=(d.weak?'特攻 ':'')+d.n;
    p.style.left=(r.left-t.left+r.width/2-24)+'px';
    p.style.top=(r.top-t.top+6)+'px';
    $('#pop').appendChild(p); setTimeout(()=>p.remove(),850);
  }
  log(`<b>${w.w}</b> ${w.ja}${d.weak?' <span style="color:#ffd166">特攻!</span>':''}`
     +`${w.hint?` <span style="color:#9c92ab">ヒント${w.hint}</span>`:''}`
     +`${G.chain>1?` <span style="color:#5ddba1">${G.chain}連鎖</span>`:''}`);

  G.hand.splice(i,1);
  G.input=''; $('#typed').value='';

  if(foe.hp<=0){foe.hp=0;log(`<b>${foe.name}</b> をたおした`);
    if(G.foes.every(f=>f.hp<=0))return finish(true);
    if(G.foes[G.target].hp<=0)G.target=G.foes.findIndex(f=>f.hp>0);}
  step();
}
function step(){   // 1語 = 1手
  let dmg=0;
  G.foes.filter(f=>f.hp>0).forEach(f=>{if(--f.ct<=0){f.ct=f.iv;dmg+=f.atk}});
  if(dmg){
    G.hp-=dmg; G.chain=0;
    log(`<span style="color:#ff5d73">敵の攻撃 -${dmg}</span>`);
    if(G.hp<=0){G.hp=0;drawHP();drawFoes();return finish(false)}
  }
  refill();drawHP();drawFoes();drawHand();
}

/* ================= 入力 ================= */
function onInput(v){
  if(!G||!G.running)return;
  G.input=v.replace(/[^a-zA-Z]/g,'').toLowerCase();
  $('#typed').value=G.input.toUpperCase();
  const i=G.hand.findIndex(w=>w.w===G.input);
  if(i>=0){fire(i);return}
  // どの札にも当たらない打ち方になったら 打った分を捨てる(ペナルティ無し)
  if(G.input&&!G.hand.some(w=>w.w.startsWith(G.input))){
    G.input=G.input.slice(0,-1);
    $('#typed').value=G.input.toUpperCase();
    const t=$('#typed'); t.style.borderColor='#ff5d73';
    setTimeout(()=>t.style.borderColor='',180);
  }
  drawHand();
}
function bindInput(){
  const t=$('#typed');
  t.addEventListener('input',()=>onInput(t.value));
  document.addEventListener('keydown',e=>{
    if(!G||!G.running)return;
    if(e.key>='1'&&e.key<='9'){
      const i=+e.key-1;
      if(G.foes[i]&&G.foes[i].hp>0){G.target=i;drawFoes();drawHand();e.preventDefault()}
      return;
    }
    if(/^[a-zA-Z]$/.test(e.key)&&document.activeElement!==t)t.focus();
  });
  // 画面キーボード(タッチ用)。OSのIMEを出さずに1タップ1文字を確定させる
  const rows=['qwertyuiop','asdfghjkl','zxcvbnm'];
  $('#kb').innerHTML=rows.map(r=>`<div class="r">${r.split('').map(c=>
    `<button data-c="${c}">${c.toUpperCase()}</button>`).join('')
    +(r==='zxcvbnm'?'<button data-c="\\b">⌫</button>':'')}</div>`).join('');
  $$('#kb button').forEach(b=>b.onclick=()=>{
    const c=b.dataset.c;
    onInput(c==='\b'?G.input.slice(0,-1):G.input+c);
  });
  $('#kbtoggle').onclick=()=>{
    const on=$('#kb').classList.toggle('on');
    if(on)t.setAttribute('readonly','');else t.removeAttribute('readonly');
  };
  if(matchMedia('(pointer:coarse)').matches)$('#kbtoggle').click();
}

/* ================= 進行 ================= */
function finish(win){
  G.running=false;
  const list=[...G.dex.values()].map(w=>
    `<div class="dx"><img src="${WI(w.img)}" alt=""><div><b>${w.w}</b> ${w.ja}
      <s>${w.b||w.jp+'の語根から'}</s></div></div>`).join('');
  $('#ovc').innerHTML=`<h1>${win?'勝利':'敗北'}</h1>
    <p>撃った英単語 ${G.dex.size} 語 / ヒント無しで撃てたのは
       ${[...G.dex.values()].filter(w=>!w.hint).length} 語</p>
    <div id="dexlist">${list||'<span style="color:#6b6079">1語も撃てなかった</span>'}</div>
    <div class="row"><button id="again">もう一度</button></div>`;
  $('#ov').classList.remove('off');
  $('#again').onclick=title;
}

let selKeys=[], selLv='mid';
function title(){
  $('#ov').classList.remove('off');
  $('#ovc').innerHTML=`
    <h1>エティモリンゴ:打つバトル</h1>
    <p>意味と語源を見て、その英単語を打つ。打てたら その語根のエティモンが撃つ。<b>4体えらぶ</b></p>
    <div id="pick"></div>
    <div class="row"><div class="seg">${Object.entries(LV).map(([k,v])=>
      `<button data-lv="${k}" class="${k===selLv?'on':''}">${v.label}</button>`).join('')}
    </div></div>
    <div class="row"><button id="go">はじめる</button></div>
    <div class="help">
      <b>あそびかた</b><br>
      ・手札には<b>絵・日本語の意味・語根・語源</b>が出ている。伏せてあるのは<b>綴りだけ</b><br>
      ・綴りが出てこないときは<b>ヒント</b>を開ける。開けるほど威力が落ちる
      <table class="h">
        <tr><td>ヒント無し</td><td>自力で綴る</td><td style="color:#ffd166">威力100%</td></tr>
        <tr><td>ヒント1</td><td>頭文字</td><td>70%</td></tr>
        <tr><td>ヒント2</td><td>前半</td><td>45%</td></tr>
        <tr><td>ヒント3</td><td>全部見せる</td><td>25%(必ず打てる)</td></tr>
      </table>
      ・敵の<b>状態</b>に噛み合う語は<b>特攻2倍</b>。札の左上のしるしが手がかり<br>
      ・<b>1語＝1手</b>。敵の頭の数字が0になると殴られる。時間制限は無い<br>
      ・長い語ほど、珍しい語ほど強い。数字キーでターゲット変更<br>
      ・間違えた打ち方は勝手に戻るだけ。ペナルティは無い
    </div>`;
  $('#pick').innerHTML=DATA.fams.filter(f=>f.gn>=12).map(f=>`
    <div class="pk ${selKeys.includes(f.key)?'on':''}" data-k="${f.key}">
      <img src="${CH(f.img)}" alt=""><b>${f.jp}</b><s>${f.gn}語</s></div>`).join('');
  $$('#pick .pk').forEach(e=>e.onclick=()=>{
    const k=e.dataset.k,i=selKeys.indexOf(k);
    if(i>=0)selKeys.splice(i,1);else if(selKeys.length<4)selKeys.push(k);
    $$('#pick .pk').forEach(p=>p.classList.toggle('on',selKeys.includes(p.dataset.k)));
    $('#go').disabled=selKeys.length!==4;
  });
  $$('.seg button').forEach(e=>e.onclick=()=>{selLv=e.dataset.lv;
    $$('.seg button').forEach(b=>b.classList.toggle('on',b===e))});
  $('#go').disabled=selKeys.length!==4;
  $('#go').onclick=start;
}

const FOES=[
  {name:'かげのぬし',icon:'👹',max:900 ,atk:210,iv:4},
  {name:'ささやき',  icon:'👻',max:700 ,atk:160,iv:3},
  {name:'かたつむり',icon:'🐌',max:1300,atk:280,iv:6},
  {name:'むれ',      icon:'🦇',max:800 ,atk:190,iv:4},
  {name:'いしあたま',icon:'🗿',max:1500,atk:240,iv:5},
];
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,rnd){for(let i=a.length-1;i>0;i--){const j=(rnd()*(i+1))|0;
  [a[i],a[j]]=[a[j],a[i]]}return a}

function start(){
  const lv=LV[selLv], rnd=mulberry(Date.now()&0xffffff);
  const party=selKeys.map(k=>DATA.fams.find(x=>x.key===k));
  const mk=(p,i)=>w=>({...w,key:p.key,jp:p.jp,cimg:p.img,slotcol:SLOT[i]});
  // 絵だけが手がかりなので、絵から当てられない語(機能語・抽象名詞化)は出さない
  let pool=party.flatMap((p,i)=>p.words
    .filter(w=>w.g&&w.w.length>=lv.lo&&w.w.length<=lv.hi&&w.r<=lv.rank).map(mk(p,i)));
  if(pool.length<20)pool=party.flatMap((p,i)=>p.words.filter(w=>w.g).map(mk(p,i)));

  // 敵の状態は「この編成で4語以上答えられるもの」からしか選ばない
  let wk=shuffle(DATA.weak.filter(k=>
    pool.filter(w=>w.tk.some(t=>k.tags.includes(t))).length>=4),rnd);
  while(wk.length<3)wk=wk.concat(shuffle(DATA.weak.slice(),rnd));
  const foes=shuffle(FOES.slice(),rnd).slice(0,3).map((f,i)=>
    ({...f,hp:f.max,wk:wk[i],ct:f.iv}));

  G={lv,rnd,party,pool,foes,target:0,hp:3000,maxhp:3000,chain:0,input:'',
     hand:[],used:new Set(),dex:new Map(),running:true};
  $('#log').innerHTML='';$('#typed').value='';
  drawParty();drawFoes();drawHP();refill();drawHand();
  $('#ov').classList.add('off');
  $('#typed').focus();
  log(`プール ${pool.length}語。ヒント無しで打てるほど強い`);
}

(async function(){
  DATA=self.__DATA||await fetch('data/pie/puzzle.json').then(r=>r.json());
  selKeys=DATA.fams.filter(f=>f.gn>=12).slice(0,4).map(f=>f.key);
  bindInput();title();
})();
</script>
