<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>エティモリンゴ 語源鎮守府</title>
<style>
:root{
  --sea:#12283f; --sea2:#1d3b58; --panel:#243d59; --panel2:#2e4c6d; --line:#456a91;
  --fg:#eef5fb; --dim:#9db4cc; --gold:#f0c04a; --ok:#6dc98a; --ng:#e88a7a;
  --paper:#fdfaf0; --ink:#2b2a24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--sea);color:var(--fg);
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-size:15px;user-select:none;display:flex;flex-direction:column}
.hide{display:none!important}
button{font:inherit;cursor:pointer;font-family:inherit}

.top{flex:0 0 auto;display:flex;gap:5px;align-items:center;padding:7px 10px;
  background:linear-gradient(#1b3busted,#16304a);background:#16304a;
  border-bottom:2px solid var(--line)}
.top h1{font-size:14px;margin:0 6px 0 0;letter-spacing:2px;white-space:nowrap;flex:0 0 auto}
@media(max-width:520px){.top h1{display:none}}
.tab{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:4px;
  padding:6px 13px;font-size:13.5px;white-space:nowrap;letter-spacing:1px;flex:0 0 auto}
.tab.on{background:var(--gold);color:#2b2308;border-color:var(--gold);font-weight:700}
.top .r{margin-left:auto;font-size:12px;color:var(--dim);white-space:nowrap}

.wrap{flex:1 1 auto;overflow-y:auto;padding:0}
.pad{padding:12px 12px 26px}
h2{font-size:16px;margin:0 0 8px;letter-spacing:1.5px}
.sub{color:var(--dim);font-size:12.5px;margin:0 0 12px;line-height:1.7}

/* ---- 母港 ---- */
.port{position:relative;min-height:56vh;
  background:linear-gradient(#2b4a6b 0%,#1d3b58 55%,#16304a 100%);overflow:hidden}
.port::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;
  background:linear-gradient(transparent,rgba(6,18,32,.65))}
.hime{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
  width:min(64vw,290px);z-index:2;cursor:pointer}
.hime img{width:100%;filter:drop-shadow(0 10px 16px rgba(0,0,0,.5))}
.hime.talk img{animation:bob .5s}
@keyframes bob{50%{transform:translateY(-9px)}}
.hime .nameplate{position:absolute;left:50%;transform:translateX(-50%);bottom:-2px;
  background:rgba(10,22,36,.86);border:1px solid var(--line);border-radius:4px;
  padding:2px 14px;white-space:nowrap;font-size:13px;letter-spacing:1px}
.hime .nameplate small{color:var(--dim);font-size:10.5px;margin-left:6px;
  font-family:ui-monospace,monospace}
.bubble{position:absolute;left:10px;right:10px;top:10px;z-index:3;
  background:var(--paper);color:var(--ink);border-radius:6px;padding:12px 14px;
  border-left:5px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.4);
  font-size:15.5px;line-height:1.7;min-height:58px}
.bubble b{font-weight:700}
.bubble .who{font-size:11.5px;color:#8a7f66;letter-spacing:1px;margin-bottom:2px}
.bubble .tapme{font-size:11.5px;color:#a89b80;margin-top:5px}

/* ---- 手持ち ---- */
.fleet{display:flex;gap:6px;overflow-x:auto;padding:9px 10px;background:#16304a;
  border-top:1px solid var(--line)}
.fl{flex:0 0 auto;width:60px;text-align:center;border:1px solid var(--line);border-radius:5px;
  background:var(--panel);padding:3px 2px 4px}
.fl.on{border-color:var(--gold);background:var(--panel2)}
.fl img{width:100%;height:44px;object-fit:contain}
.fl div{font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl small{font-size:9px;color:var(--dim)}

/* ---- 建造 ---- */
.bigbtn{width:100%;background:var(--gold);color:#2b2308;border:0;border-radius:6px;
  padding:14px;font-size:17px;font-weight:700;letter-spacing:2px;box-shadow:0 4px 0 #a8842c}
.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8842c}
.bigbtn:disabled{opacity:.4;box-shadow:none}
.newchar{text-align:center;padding:10px 0}
.newchar img{width:min(52vw,210px);animation:rise .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes rise{0%{transform:translateY(50px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.newchar .nm{font-size:23px;letter-spacing:2px;margin-top:4px}
.newchar .pie{font-size:12px;color:var(--dim);font-family:ui-monospace,monospace}

/* ---- 図鑑 ---- */
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
.dx{border:1px solid var(--line);border-radius:5px;background:var(--panel);
  padding:5px 3px 6px;text-align:center}
.dx.no{opacity:.32}
.dx.no img{filter:brightness(0) invert(.35)}
.dx img{width:100%;height:60px;object-fit:contain}
.dx .jp{font-size:11.5px;letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dx .n{font-size:9.5px;color:var(--dim);font-family:ui-monospace,monospace}
.sheet{position:fixed;inset:0;background:rgba(6,16,28,.9);z-index:40;overflow-y:auto;
  padding:16px 14px 30px;display:none}
.sheet.on{display:block}
.sheet .box{max-width:520px;margin:0 auto;text-align:center}
.sheet .box>img{width:min(50vw,210px)}
.sheet .nm{font-size:23px;letter-spacing:2px}
.sheet .pie{font-size:12px;color:var(--dim);font-family:ui-monospace,monospace;margin-bottom:8px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:5px;
  padding:11px 13px;font-size:13.5px;line-height:1.85;color:var(--dim);text-align:left;
  margin-bottom:10px}
.kids{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.kids span{background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:3px 9px;font-size:13px}
.kids span i{font-style:normal;font-size:10.5px;color:var(--dim);margin-left:4px}

/* ---- 出撃 ---- */
.map{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:11px;
  margin-bottom:10px}
.route{display:flex;align-items:center;gap:5px;margin-bottom:9px}
.route i{flex:1;height:5px;background:#1a3149;border-radius:3px}
.route i.on{background:var(--gold)}
.slog{background:#132a41;border:1px solid var(--line);border-radius:5px;padding:9px 12px;
  font-size:13.5px;line-height:1.8;height:190px;overflow-y:auto}
.slog .say{color:var(--paper)}
.slog .say b{color:var(--gold)}
.slog .sys{color:var(--dim);font-size:12.5px}
</style>
</head>
<body>

<div class="top">
  <h1>語源鎮守府</h1>
  <button class="tab on" data-t="port">母港</button>
  <button class="tab" data-t="build">建造</button>
  <button class="tab" data-t="sortie">出撃</button>
  <button class="tab" data-t="dex">図鑑</button>
  <div class="r" id="rn"></div>
</div>

<div class="wrap" id="wrap">
  <section id="port">
    <div class="port" id="portView">
      <div class="bubble" id="bubble"></div>
      <div class="hime" id="hime"></div>
    </div>
    <div class="fleet" id="fleet"></div>
    <div class="pad"><div class="sub" id="portTip"></div></div>
  </section>

  <section id="build" class="hide"><div class="pad">
    <h2>建 造</h2>
    <p class="sub">ことばの もとを 一人 呼ぶ。<br>
      いま出るのは、まだ来ていない子だけ。</p>
    <div id="buildView"></div>
    <button class="bigbtn" id="doBuild">建造する</button>
  </div></section>

  <section id="sortie" class="hide"><div class="pad">
    <h2>出 撃</h2>
    <p class="sub">連れていく子を えらぶ(最大4人)。<br>
      道中、その子が 自分の子である英単語を 語る。</p>
    <div class="fleet" id="pick" style="background:transparent;border:0;padding:0 0 10px"></div>
    <div class="map"><div class="route" id="route"></div>
      <div class="slog" id="slog"></div></div>
    <button class="bigbtn" id="doSortie">出撃</button>
  </div></section>

  <section id="dex" class="hide"><div class="pad">
    <h2>図 鑑</h2>
    <p class="sub" id="dexTip"></p>
    <div class="dex" id="dexList"></div>
  </div></section>
</div>

<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>

<script id="vdata" type="application/json">{"chars":[]}</script>
<script>
const A='../assets/', $=s=>document.querySelector(s);
let C=(JSON.parse(document.getElementById('vdata').textContent).chars)||[];
const img=c=>A+'chara/'+c.img;
let have=[], hime=null, ti={}, party=[], heard=new Set();

const pick=a=>a[Math.floor(Math.random()*a.length)];
function say(c,txt,tag){
  $('#bubble').innerHTML=`<div class="who">${c.jp} <small>*${c.key}</small></div>
    ${txt}<div class="tapme">${tag||'タップすると もっと話す'}</div>`;
  const h=$('#hime'); h.classList.remove('talk'); void h.offsetWidth; h.classList.add('talk');
}

/* ---- 母港。タップするたびに 語源を1つ話す = ほんのり学習 ---- */
function drawPort(){
  if(!hime) return;
  $('#hime').innerHTML=`<img src="${img(hime)}" alt="">
    <div class="nameplate">${hime.jp}<small>*${hime.key}</small></div>`;
  $('#fleet').innerHTML=have.map((c,i)=>`
    <button class="fl${c.key===hime.key?' on':''}" data-h="${i}">
      <img src="${img(c)}" alt=""><div>${c.jp}</div><small>${c.n}語</small></button>`).join('');
  const t=ti[hime.key]||0, tot=hime.trivia.length;
  $('#portTip').innerHTML=`<b>${hime.jp}</b> から生まれた英単語は <b>${hime.n}語</b>。
    そのうち <b>${Math.min(t,tot)}/${tot}</b> の語源を聞いた。<br>
    ${hime.note||''}`;
  $('#rn').textContent=`${have.length}/${C.length}人 ・ 聞いた語源 ${heard.size}`;
}
$('#hime').addEventListener('click',()=>{
  if(!hime)return;
  const tv=hime.trivia;
  if(tv.length){
    const i=(ti[hime.key]||0)%tv.length;
    ti[hime.key]=(ti[hime.key]||0)+1;
    heard.add(hime.key+':'+tv[i].w);
    say(hime,`<b>${tv[i].w}</b>…… 「${tv[i].ja}」。${tv[i].say.split('。').slice(1).join('。')}`);
  }else{
    say(hime,pick(hime.lines.tap));
  }
  drawPort();
});
$('#fleet').addEventListener('click',ev=>{
  const b=ev.target.closest('.fl'); if(!b)return;
  hime=have[+b.dataset.h];
  say(hime,pick(hime.lines.form)); drawPort();
});

/* ---- 建造 ---- */
$('#doBuild').addEventListener('click',()=>{
  const yet=C.filter(c=>!have.some(h=>h.key===c.key));
  if(!yet.length){ $('#buildView').innerHTML='<p class="sub">もう みんな 来ている。</p>'; return; }
  const c=pick(yet);
  have.push(c); if(!hime)hime=c;
  $('#buildView').innerHTML=`<div class="newchar">
      <img src="${img(c)}" alt="">
      <div class="nm">${c.jp}</div><div class="pie">*${c.key}</div>
    </div>
    <div class="note" style="margin-top:10px">${c.lines.get[0]}</div>`;
  drawPort(); drawDex();
  $('#rn').textContent=`${have.length}/${C.length}人 ・ 聞いた語源 ${heard.size}`;
});

/* ---- 出撃。道中で その子が 自分の子を語る ---- */
function drawPick(){
  $('#pick').innerHTML=have.map((c,i)=>`
    <button class="fl${party.includes(i)?' on':''}" data-p="${i}">
      <img src="${img(c)}" alt=""><div>${c.jp}</div><small>${c.n}語</small></button>`).join('');
}
$('#pick').addEventListener('click',ev=>{
  const b=ev.target.closest('.fl'); if(!b)return;
  const i=+b.dataset.p, at=party.indexOf(i);
  if(at>=0)party.splice(at,1); else if(party.length<4)party.push(i);
  drawPick();
});
$('#doSortie').addEventListener('click',()=>{
  if(!party.length){ $('#slog').innerHTML='<div class="sys">連れていく子を えらんでください。</div>'; return; }
  const team=party.map(i=>have[i]);
  $('#slog').innerHTML=''; $('#doSortie').disabled=true;
  const N=6; let step=0;
  $('#route').innerHTML=Array.from({length:N},()=>'<i></i>').join('');
  const log=(h,cls)=>{ const d=document.createElement('div'); d.className=cls||'say';
    d.innerHTML=h; $('#slog').appendChild(d); $('#slog').scrollTop=1e6; };
  log('出撃。','sys');
  const iv=setInterval(()=>{
    const c=team[step%team.length];
    document.querySelectorAll('#route i')[step].classList.add('on');
    const tv=c.trivia;
    if(tv.length){
      const i=(ti[c.key]||0)%tv.length; ti[c.key]=(ti[c.key]||0)+1;
      heard.add(c.key+':'+tv[i].w);
      log(`<b>${c.jp}</b>「${tv[i].say}」`);
    }else log(`<b>${c.jp}</b>「${pick(c.lines.sortie)}」`);
    step++;
    if(step>=N){
      clearInterval(iv);
      log(`帰投。語源を ${N}つ 聞いた。`,'sys');
      const c2=team[0]; log(`<b>${c2.jp}</b>「${pick(c2.lines.back)}」`);
      $('#doSortie').disabled=false;
      $('#rn').textContent=`${have.length}/${C.length}人 ・ 聞いた語源 ${heard.size}`;
      drawPort();
    }
  },1400);
});

/* ---- 図鑑 ---- */
function drawDex(){
  $('#dexTip').innerHTML=`集めた ${have.length} / ${C.length}人。
    聞いた語源 <b>${heard.size}</b>。タップで その子の 子どもたちを見る。`;
  $('#dexList').innerHTML=C.map((c,i)=>{
    const got=have.some(h=>h.key===c.key);
    return `<button class="dx ${got?'':'no'}" data-d="${i}">
      <img src="${img(c)}" alt=""><div class="jp">${got?c.jp:'???'}</div>
      <div class="n">${String(i+1).padStart(2,'0')}</div></button>`;
  }).join('');
}
$('#dexList').addEventListener('click',ev=>{
  const b=ev.target.closest('.dx'); if(!b||b.classList.contains('no'))return;
  const c=C[+b.dataset.d];
  $('#sheetBox').innerHTML=`<img src="${img(c)}" alt="">
    <div class="nm">${c.jp}</div><div class="pie">*${c.key} ・ ${c.n}語</div>
    ${c.note?`<div class="note">${c.note}</div>`:''}
    <div class="kids">${c.kids.map(k=>`<span>${k.w}<i>${k.ja}</i></span>`).join('')}</div>
    <button class="bigbtn" style="margin-top:16px" data-close="1">閉じる</button>`;
  $('#sheet').classList.add('on');
});
$('#sheet').addEventListener('click',ev=>{
  if(ev.target.closest('[data-close]')||ev.target.id==='sheet')$('#sheet').classList.remove('on');
});

document.querySelector('.top').addEventListener('click',ev=>{
  const b=ev.target.closest('.tab'); if(!b)return;
  const t=b.dataset.t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  ['port','build','sortie','dex'].forEach(s=>$('#'+s).classList.toggle('hide',s!==t));
  if(t==='dex')drawDex();
  if(t==='sortie')drawPick();
});

(async()=>{
  if(location.protocol!=='file:'){
    try{ const r=await fetch('data/pie/voice.json');
      if(r.ok){ const j=await r.json(); if(j.chars&&j.chars.length)C=j.chars; } }catch(e){}
  }
  if(!C.length){ $('#bubble').innerHTML='データがありません。python3 app/build_voice.py を実行してください。'; return; }
  // はじめの3人
  have=[C[0],C[1],C[2]].filter(Boolean); hime=have[0];
  drawPort(); drawDex();
  say(hime,hime.lines.get[0],'タップすると 語源を話す');
})();
</script>
</body>
</html>
