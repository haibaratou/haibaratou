<script>
const ROWS=JSON.parse(document.getElementById('pairs').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=ROWS, shown=0;
$('#cAll').textContent=ROWS.length.toLocaleString();
function draw(){
  const step=120, part=cur.slice(shown,shown+step);
  const old=$('#grid').parentElement.querySelector('.more'); if(old)old.remove();
  $('#grid').insertAdjacentHTML('beforeend', part.map(r=>`<article class="card">
    <img src="../assets/word/${encodeURIComponent(r[3])}.png" alt="${esc(r[0])}" loading="lazy">
    <div><div class="hw">${esc(r[0])}</div><div class="yomi">${esc(r[1])}</div></div>
    <div class="meta">${r[2]?`<span class="pos">${esc(r[2])}</span>`:''}<span class="src">${esc(r[3])}.png</span></div>
    <div class="en">${esc(r[4])}</div></article>`).join(''));
  shown+=part.length;
  if(shown<cur.length){
    $('#grid').insertAdjacentHTML('afterend',
      `<button class="more">つづきを見る(残り ${(cur.length-shown).toLocaleString()})</button>`);
    document.querySelector('.more').onclick=draw;
  }
}
function run(q){
  const s=q.trim().toLowerCase();
  cur=!s?ROWS:ROWS.filter(r=>r[0].includes(q.trim())||r[1].includes(q.trim())
    ||r[3].toLowerCase().includes(s)||r[4].toLowerCase().includes(s));
  shown=0;$('#grid').innerHTML='';
  $('#hits').textContent=cur.length.toLocaleString()+' 語';
  draw();
}
let t=null;
$('#q').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>run(e.target.value),140);});
run('');
</script></body></html>
