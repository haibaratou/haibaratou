<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日本語語源辞典</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600&family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{--paper:#E9EBE6;--card:#F4F5F2;--sunk:#DFE3DC;--line:#CBD1CA;--line2:#DEE2DB;
 --ink:#16211F;--ink2:#43514D;--ink3:#6E7B76;--accent:#2E7D6F;--accent-soft:#DCE8E4;--rust:#A3542F}
@media (prefers-color-scheme:dark){:root{--paper:#12181A;--card:#1A2124;--sunk:#151B1D;
 --line:#2C3639;--line2:#232B2E;--ink:#DDE3E0;--ink2:#A3AFAB;--ink3:#7C8884;
 --accent:#5FB3A1;--accent-soft:#1E3733;--rust:#C97B50}}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);margin:0;font-size:15px;line-height:1.7;
 font-family:"IBM Plex Sans JP","Hiragino Sans",system-ui,sans-serif}
.wrap{max-width:940px;margin:0 auto;padding:0 20px}
header{background:var(--card);border-bottom:1px solid var(--line)}
.mast{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:baseline;padding:22px 0 18px}
h1{font-family:Spectral,"Hiragino Mincho ProN",serif;font-weight:600;font-size:26px;margin:0}
.sub{color:var(--ink2);font-size:13.5px;margin:3px 0 0;max-width:62ch}
.counts{margin-left:auto;display:flex;gap:20px}
.c b{display:block;font-family:"IBM Plex Mono",monospace;font-size:19px}
.c span{font-size:11px;color:var(--ink3);letter-spacing:.05em}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.barin{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 0}
#q{flex:1 1 230px;min-width:170px;padding:8px 11px;font:inherit;font-size:14px;color:var(--ink);
 background:var(--paper);border:1px solid var(--line);border-radius:7px}
#q:focus{outline:2px solid var(--accent);outline-offset:1px}
.chip{font:inherit;font-size:12.5px;padding:6px 11px;cursor:pointer;color:var(--ink2);
 background:transparent;border:1px solid var(--line);border-radius:99px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.hits{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink3)}
main{padding:6px 0 60px}
.row{display:grid;grid-template-columns:60px minmax(0,1fr);gap:4px 15px;
 padding:14px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.row:hover{background:var(--card)}
.thumb{width:60px;height:60px;object-fit:contain;background:var(--sunk);border-radius:8px;grid-row:span 3}
.thumb.none{display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:11px}
.hw{font-size:20px;font-weight:600;line-height:1.35}
.hw .y{font-size:12.5px;color:var(--ink3);font-weight:400;margin-left:9px}
.meta{display:flex;gap:7px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);align-items:center}
.pos{background:var(--accent-soft);border-radius:99px;padding:1px 8px}
.en{font-size:12.5px;color:var(--ink3);font-style:italic}
.nodef{color:var(--rust);font-size:11.5px}
.det{grid-column:2;margin-top:9px}
.sec{border-left:2px solid var(--accent-soft);padding:2px 0 2px 12px;margin-bottom:11px}
.sec b{display:block;font-size:11.5px;color:var(--accent);font-weight:500;letter-spacing:.02em}
.sec .h{font-size:13px;color:var(--ink2);margin-bottom:2px}
.sec p{margin:0;font-size:14px;white-space:pre-wrap}
.more{display:block;width:100%;margin:24px 0;padding:12px;font:inherit;cursor:pointer;
 background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px}
footer{border-top:1px solid var(--line);color:var(--ink3);font-size:12.5px;padding:18px 0 40px}
footer p{margin:0 0 5px;max-width:70ch}
</style></head><body>
<header><div class="wrap mast">
 <div><h1>日本語語源辞典</h1>
 <p class="sub">基本語彙に、国語辞典の語義と語源をそのまま並べたものです。単語をクリックすると辞書ごとの記述が出ます。</p></div>
 <div class="counts">
  <div class="c"><b id="cAll">—</b><span>見出し語</span></div>
  <div class="c"><b id="cDef">—</b><span>語義あり</span></div>
  <div class="c"><b id="cPic">—</b><span>絵あり</span></div>
 </div></div></header>
<div class="bar"><div class="wrap barin">
 <input id="q" type="search" placeholder="見出し・読みでさがす(例: 猫 / ねこ / 山)" autocomplete="off">
 <button class="chip" id="fDef" aria-pressed="true">語義があるものだけ</button>
 <button class="chip" id="fPic" aria-pressed="false">絵があるものだけ</button>
 <span class="hits" id="hits"></span>
</div></div>
<main class="wrap" id="list"><p style="padding:40px 0;color:var(--ink3)">読み込んでいます…</p></main>
<footer class="wrap">
 <p>語義・語源は コトバンク(デジタル大辞泉・精選版 日本国語大辞典 ほか)と Weblio国語辞典 の記述をそのまま引いています。出典は各項目に表示しています。</p>
 <p>見出し語は JMdict (EDRDG, CC BY-SA 4.0) の常用語から。絵は英単語データベースのものを流用しています。</p>
</footer>
<script>
const ROWS_URL='data/ja/ja_index.json', DET='data/ja/ja_det/';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROWS_KANA={'あ':'あいうえおぁぃぅぇぉ','か':'かきくけこがぎぐげご','さ':'さしすせそざじずぜぞ',
 'た':'たちつてとだぢづでどっ','な':'なにぬねの','は':'はひふへほばびぶべぼぱぴぷぺぽ',
 'ま':'まみむめも','や':'やゆよゃゅょ','ら':'らりるれろ','わ':'わをんゎ'};
const C2R={};for(const r in ROWS_KANA)for(const c of ROWS_KANA[r])C2R[c]=r;
function kanaRow(c){if(!c)return '_';
 if(c>='ァ'&&c<='ヴ')c=String.fromCharCode(c.charCodeAt(0)-0x60);
 return C2R[c]||'_';}
let ROWS=[],cur=[],shown=0,onlyDef=true,onlyPic=false,q='';
const shardCache={};
function loadShard(row){
  if(!shardCache[row])shardCache[row]=fetch(DET+row+'.json').then(r=>r.ok?r.json():{}).catch(()=>({}));
  return shardCache[row];
}
fetch(ROWS_URL).then(r=>r.json()).then(d=>{
  ROWS=d;
  $('#cAll').textContent=d.length.toLocaleString();
  $('#cDef').textContent=d.filter(r=>r[5]).length.toLocaleString();
  $('#cPic').textContent=d.filter(r=>r[3]).length.toLocaleString();
  run();
});
$('#fDef').onclick=()=>{onlyDef=!onlyDef;$('#fDef').setAttribute('aria-pressed',String(onlyDef));run();};
$('#fPic').onclick=()=>{onlyPic=!onlyPic;$('#fPic').setAttribute('aria-pressed',String(onlyPic));run();};
let t=null;
$('#q').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>{q=e.target.value.trim();run();},140);});
function run(){
  cur=ROWS.filter(r=>(!onlyDef||r[5])&&(!onlyPic||r[3])
    &&(!q||r[0].includes(q)||r[1].includes(q)||(r[4]||'').toLowerCase().includes(q.toLowerCase())));
  shown=0;$('#list').innerHTML='';$('#hits').textContent=cur.length.toLocaleString()+' 語';
  draw();
}
function draw(){
  const part=cur.slice(shown,shown+60);
  const old=$('#list').querySelector('.more');if(old)old.remove();
  if(!part.length&&!shown){$('#list').innerHTML='<p style="padding:40px 0;color:var(--ink3)">見つかりませんでした。</p>';return;}
  $('#list').insertAdjacentHTML('beforeend',part.map((r,i)=>`<article class="row" data-w="${esc(r[0])}" data-y="${esc(r[1])}">
   ${r[3]?`<img class="thumb" src="../assets/word/${encodeURIComponent(r[3])}.png" alt="" loading="lazy">`
        :'<div class="thumb none">絵なし</div>'}
   <div class="hw">${esc(r[0])}<span class="y">${esc(r[1])}</span></div>
   <div class="meta">${r[2]?`<span class="pos">${esc(r[2])}</span>`:''}
     ${r[5]?'':'<span class="nodef">辞書の記述はこれから取得します</span>'}
     <span class="en">${esc(r[4])}</span></div>
   <div class="det" hidden></div></article>`).join(''));
  shown+=part.length;
  $('#list').querySelectorAll('.row:not([data-b])').forEach(el=>{
    el.dataset.b='1';
    el.onclick=async()=>{
      const box=el.querySelector('.det');
      if(!box.hidden){box.hidden=true;return;}
      box.hidden=false;
      if(box.dataset.done)return;
      box.dataset.done='1';
      box.innerHTML='<p style="color:var(--ink3);font-size:13px">読み込み中…</p>';
      const sh=await loadShard(kanaRow((el.dataset.y||el.dataset.w)[0]));
      const v=sh[el.dataset.w];
      box.innerHTML=(v&&v.length)?v.map(s=>`<div class="sec">
        <b>${esc(s[0])}<span style="color:var(--ink3)"> ・ ${esc(s[1])}</span></b>
        ${s[2]?`<div class="h">${esc(s[2])}</div>`:''}
        <p>${esc(s[3])}</p></div>`).join('')
        :'<p style="color:var(--ink3);font-size:13px">この語の辞書の記述は、まだ取得していません。</p>';
    };
  });
  if(shown<cur.length){
    $('#list').insertAdjacentHTML('beforeend',
      `<button class="more">つづきを見る(残り ${(cur.length-shown).toLocaleString()})</button>`);
    $('#list').querySelector('.more').onclick=draw;
  }
}
</script></body></html>
