<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2740">
<meta name="description" content="ワードドロップ / WORDROP - 降り積もった文字のボールを指でなぞってつなぎ、長い英単語へ育てる毎日1回のパズル。">
<title>ワードドロップ WORDROP</title>
<style>
:root{--ink:#211d2c;--cream:#fffaf0;--yellow:#ffd34d;--shadow:rgba(20,17,30,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#14121d;color:#f2eef7;
  font-family:"M PLUS Rounded 1c","Yu Gothic","Segoe UI",system-ui,sans-serif;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none}
body{display:grid;place-items:center}
.app{width:min(100vw,560px);height:100dvh;min-height:520px;background:#1d1a2b;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;position:relative}

.top{padding:max(6px,env(safe-area-inset-top)) 10px 8px;background:linear-gradient(180deg,#4b3f8f,#372f6b);
  display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:3px solid #12101b}
.brand{min-width:0;overflow:hidden}
.brand h1{margin:0;font-size:clamp(15px,4.4vw,23px);font-weight:1000;line-height:1.05;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.brand .meta{display:flex;gap:6px;align-items:center;margin-top:3px;font-size:10px;font-weight:900;
  color:#c6bcf0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:2px solid #12101b;border-radius:999px;padding:1px 7px;background:#fff;color:#211d2c;
  font-size:10px;font-weight:900;white-space:nowrap;flex:none}
.stats{display:flex;gap:5px}
.stat{min-width:54px;text-align:center;background:#fff;border:3px solid #12101b;border-radius:12px;
  padding:2px 6px;box-shadow:0 3px 0 var(--shadow);color:#211d2c}
.stat small{display:block;font-size:8px;font-weight:900;color:#8e7f92;letter-spacing:.04em}
.stat b{font-size:16px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat.warn b{color:#e0344f}
@media(max-width:392px){.stat{min-width:46px;padding-inline:4px}.stat b{font-size:14px}#dictState{display:none}}

.stage{position:relative;min-height:0;display:grid;place-items:center;padding:6px}
.pit{position:relative;border-radius:16px;overflow:hidden;background:#3a3a3a;
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.4),inset 0 14px 26px rgba(0,0,0,.35)}
canvas{display:block;width:100%;height:100%;touch-action:none}

.read{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:8;pointer-events:none;
  display:none;align-items:center;gap:8px;background:rgba(255,255,255,.97);color:#211d2c;
  border:4px solid #12101b;border-radius:16px;padding:5px 12px;box-shadow:0 5px 0 var(--shadow);max-width:94%}
.read.on{display:flex}
.read.ok{background:#c9f5c8}
.read .art{width:38px;height:38px;border-radius:9px;background:#fff6e0;
  box-shadow:inset 0 0 0 1px rgba(20,17,30,.12);display:grid;place-items:center;overflow:hidden;flex:none}
.read .art img{width:100%;height:100%;object-fit:contain}
.read .w{font-size:clamp(15px,5vw,21px);font-weight:1000;line-height:1;white-space:nowrap;letter-spacing:.04em}
.read .m{font-size:11px;font-weight:800;color:#5b4f63;margin-top:3px;max-width:180px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.read .alt{font-size:10px;font-weight:900;color:#8a7f92;margin-top:2px;max-width:180px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.read .pt{font-size:15px;font-weight:1000;color:#1f8a3d;white-space:nowrap}

.bottom{background:#2a2540;padding:8px 10px max(9px,env(safe-area-inset-bottom));
  display:grid;gap:7px;border-top:3px solid #12101b}
.logrow{display:flex;align-items:center;gap:9px;min-width:0}
.log{min-width:0;flex:1}
.dex{flex:none;text-align:center;background:#3b3459;border:2px solid #12101b;border-radius:11px;
  padding:3px 9px;line-height:1.1;transition:transform .18s,background .18s}
.dex b{display:block;font-size:15px;font-weight:1000;color:#fff;font-variant-numeric:tabular-nums}
.dex small{display:block;font-size:8px;font-weight:900;color:#b7abe4;letter-spacing:.04em}
.dex.pop{transform:scale(1.18);background:#f5c945}
.dex.pop b{color:#211d2c}
.dex.pop small{color:#6b5a12}
.log b{display:block;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.log span{display:block;font-size:10px;font-weight:800;color:#a99fd0;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{appearance:none;border:3px solid #12101b;border-radius:12px;background:#fff;color:#211d2c;
  font:inherit;font-weight:1000;font-size:13px;padding:7px 11px;box-shadow:0 3px 0 var(--shadow);cursor:pointer;
  white-space:nowrap;flex:none}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
button:disabled{opacity:.45}
button.primary{background:var(--yellow)}
button.ghostbtn{font-size:11px;padding:6px 8px}
button.find{background:#7de3a0;font-size:13px}

.over{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(15,13,24,.82);padding:16px}
.over.on{display:grid}
.card{width:min(440px,100%);max-height:92%;overflow:auto;background:var(--cream);color:var(--ink);
  border:5px solid #12101b;border-radius:22px;padding:16px;box-shadow:0 10px 0 rgba(0,0,0,.35)}
.card h2{margin:0 0 4px;font-size:24px;text-align:center}
.card .lead{margin:0 0 12px;text-align:center;font-size:12px;font-weight:800;color:#6f6175}
.hero{display:flex;align-items:center;gap:11px;background:#fff;border:3px solid var(--ink);border-radius:16px;
  padding:9px;margin-bottom:11px}
.hero .art{width:64px;height:64px;flex:none;border-radius:12px;background:#fff6e0;
  box-shadow:inset 0 0 0 1px rgba(33,29,44,.12);display:grid;place-items:center;overflow:hidden}
.hero .art img{width:100%;height:100%;object-fit:contain}
.hero .w{font-size:clamp(19px,6vw,27px);font-weight:1000;line-height:1;word-break:break-all}
.hero .m{font-size:12px;font-weight:800;color:#6b5d71;margin-top:5px}
.hero .tag{display:inline-block;margin-top:6px;border:2px solid var(--ink);border-radius:999px;
  padding:1px 8px;font-size:10px;font-weight:900;background:var(--yellow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:11px}
.box{background:#fff;border:3px solid var(--ink);border-radius:13px;padding:6px;text-align:center}
.box small{display:block;font-size:9px;font-weight:900;color:#8e7f92}
.box b{font-size:19px}
.words{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;max-height:118px;overflow:auto}
.words i{font-style:normal;border:2px solid var(--ink);border-radius:999px;padding:2px 8px;
  font-size:11px;font-weight:900;background:#fff}
.share{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  background:#fff;border:3px solid var(--ink);border-radius:13px;padding:9px;margin-bottom:10px;line-height:1.5}
.card ol{margin:0 0 12px;padding-left:19px;font-size:12.5px;font-weight:750;line-height:1.75}
.card ol b{background:linear-gradient(transparent 62%,var(--yellow) 62%)}
.mini{font-size:11px;font-weight:800;color:#7a6b80;text-align:center;margin:8px 0 0}
button.pick{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px;
  margin-bottom:9px;background:#fff;border-radius:16px}
button.pick .tag{flex:none;min-width:58px;text-align:center;border:3px solid var(--ink);border-radius:12px;
  padding:6px 4px;background:var(--yellow);font-size:14px;font-weight:1000}
button.pick b{display:block;font-size:15px;font-weight:1000}
button.pick i{display:block;font-style:normal;font-size:11px;font-weight:800;color:#6f6175;margin-top:3px;
  white-space:normal;line-height:1.35}
button.pick.on{background:#fff3c4}
.dexlist{display:flex;flex-wrap:wrap;gap:5px;max-height:46vh;overflow:auto;
  background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px}
.dexlist i{font-style:normal;border:2px solid var(--ink);border-radius:10px;padding:3px 7px;
  font-size:12px;font-weight:1000;line-height:1.15;text-align:center}
.dexlist i small{display:block;font-size:8.5px;font-weight:800;color:#5b5164}
.dexlist .none{font-size:12px;font-weight:800;color:#8e7f92;padding:6px}
#dexTabs button{font-size:11px;padding:5px 8px}
#dexTabs button.on{background:var(--yellow)}
.dex{cursor:pointer}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <h1 id="title">ワードドロップ</h1>
      <div class="meta"><span class="chip" id="modeChip">今日の一戦</span><span id="dictState">辞書を読み込み中…</span></div>
    </div>
    <div class="stats">
      <div class="stat"><small id="lbLong">最長</small><b id="statLong">–</b></div>
      <div class="stat"><small id="lbScore">スコア</small><b id="statScore">0</b></div>
      <div class="stat" id="timeBox"><small id="lbTime">つくった語</small><b id="statTime">0</b></div>
    </div>
  </header>

  <section class="stage" id="stage">
    <div class="pit" id="pit"><canvas id="cv"></canvas></div>
    <div class="read" id="read">
      <div class="art" id="readArt"></div>
      <div><div class="w" id="readWord"></div><div class="m" id="readMean"></div><div class="alt" id="readAlt"></div></div>
      <div class="pt" id="readPt"></div>
    </div>
  </section>

  <footer class="bottom">
    <div class="logrow">
      <div class="log"><b id="logMain">ボールを指でなぞってつなぐ</b><span id="logSub"></span></div>
      <div class="dex" id="dex"><b id="dexN">0</b><small id="dexL">ずかん</small></div>
    </div>
    <div class="row">
      <button class="find" id="btnFind" type="button">ヒント</button>
      <button id="btnSound" class="ghostbtn" type="button" aria-label="sound">🔊</button>
      <button id="btnDict" class="ghostbtn" type="button">ABC</button>
      <button id="btnHow" class="ghostbtn" type="button">遊びかた</button>
      <button id="btnLang" class="ghostbtn" type="button">EN</button>
      <button id="btnFree" class="ghostbtn" type="button">フリー</button>
      <button id="btnEnd" class="primary" type="button" style="margin-left:auto">おわる</button>
      <button id="btnRetry" class="ghostbtn" type="button">やりなおす</button>
    </div>
  </footer>

  <div class="over" id="overResult"><div class="card">
    <h2 id="resTitle">おしまい</h2>
    <p class="lead" id="resLead"></p>
    <div class="hero">
      <div class="art" id="resArt"></div>
      <div><div class="w" id="resWord">–</div><div class="m" id="resMean"></div><span class="tag" id="resTag"></span></div>
    </div>
    <div class="grid2">
      <div class="box"><small id="lbResScore">スコア</small><b id="resScore">0</b></div>
      <div class="box"><small id="lbResWords">つくった単語</small><b id="resWords">0</b></div>
    </div>
    <div class="words" id="resList"></div>
    <div class="share" id="resShare"></div>
    <div class="row">
      <button class="primary" id="btnShare" type="button" style="flex:1">結果をコピー</button>
      <button id="btnAgain" type="button">もう一度</button>
    </div>
    <p class="mini" id="resMini"></p>
  </div></div>

  <div class="over on" id="overStart"><div class="card">
    <h2 id="startTitle">ワードドロップ</h2>
    <p class="lead" id="startLead"></p>
    <button class="pick" id="pickEn" type="button">
      <span class="tag">ABC</span>
      <span><b id="pickEnT">英語モード</b><i id="pickEnD">文字をつないで英単語をつくる</i></span>
    </button>
    <button class="pick" id="pickJa" type="button">
      <span class="tag">あ→漢</span>
      <span><b id="pickJaT">日本語モード</b><i id="pickJaD">ひらがなをつないで漢字の語をつくる</i></span>
    </button>
    <button id="startHow" type="button" style="width:100%;margin-top:4px">遊びかた</button>
  </div></div>

  <div class="over" id="overDex"><div class="card">
    <h2 id="dexTitle">ずかん</h2>
    <p class="lead" id="dexLead"></p>
    <div class="row" id="dexTabs" style="flex-wrap:wrap;margin-bottom:10px"></div>
    <div class="dexlist" id="dexList"></div>
    <p class="mini" id="dexMore"></p>
    <button class="primary" id="dexClose" type="button" style="width:100%;margin-top:10px">とじる</button>
  </div></div>

  <div class="over" id="overHow"><div class="card">
    <h2 id="howTitle">遊びかた</h2>
    <ol id="howList"></ol>
    <button class="primary" id="btnHowClose" type="button" style="width:100%">はじめる</button>
    <p class="mini">日本語の辞書は JMdict(EDRDG)/ CC BY-SA 4.0 を使っています。</p>
  </div></div>
</main>

<script>
"use strict";
/* =======================================================================
   ワードドロップ / WORDROP  ── 「1234 つなげるパズル」の英単語版
   ・文字のボールが物理演算で降り積もり、山になる
   ・その山の、触れあっているボールを指でなぞってつなぐ
   ・つないだ文字がならべかえて英単語になれば(順不同=アナグラム)、
     鎖はまるごと1個の「単語ボール」に潰れる
   ・空いた穴に山が崩れ落ち、上から新しいボールが降ってくる
   ・単語ボールも鎖に含められる。含めればもっと長い単語へ育つ
     ── 1234 の「大きな数字をつくろう」がここでは「長い単語をつくろう」
   ======================================================================= */

const $ = s => document.querySelector(s);

/* ---------- 定数 ---------- */
const MINLEN = 2, MAXBALLS = 8;
/* 2つの辞書を切り替える。英語は「文字→英単語」、日本語は「ひらがな→漢字の語」 */
const DICTS = {
  en: { file:"data/worddrop.json", max:10, speak:"en-US", chip:"ABC",  re:/^[a-z]{2,10}$/ },
  ja: { file:"data/worddrop-ja.json", max:8, speak:"ja-JP", chip:"あ→漢", re:/^[ぁ-ゖ]{2,8}$/ }
};
let dictMode = "en";
try { if (localStorage.getItem("wordrop.dict") === "ja") dictMode = "ja"; } catch (_) {}
const D = () => DICTS[dictMode];
const maxLen = () => D().max;
/* ボールに描くもの。英語は 単語/和訳、日本語は 漢字/よみ */
const upper  = x => dictMode === "ja" ? x : x.toUpperCase();
/* 同じ読みに別の漢字があるので(かんじ = 幹事/感じ/漢字/監事)、
   「読み」ではなく「語そのもの」を持ちまわる。ボールも自分がどの語かを覚える。 */
const dispOf = e => !e ? "" : (dictMode === "ja" ? (e.s || e.w) : e.w.toUpperCase());
const subOf  = e => !e ? "" : (dictMode === "ja" ? e.w : (lang === "ja" ? (e.ja || e.en || "") : (e.en || e.ja || "")));
const artOf  = e => !e ? "" : (dictMode === "ja" ? (e.art || "") : (e.pic ? e.w : ""));
const glossOf = e => !e ? "" : (dictMode === "ja" ? (e.g || "") : "");
const FILL = 0.76;                 // ボールで埋める面積のねらい(密だが枠からはみ出さない)
const STARTER_RATE = 0.20;         // 最初の山に混ぜておく単語ボールの割合
const EPOCH = Date.UTC(2026, 0, 1);
const ART_BASE = "../assets/word/";
const SHARE_URL = "https://haibaratou.github.io/haibaratou/app/word-drop.html";
/* 文字ごとに色を固定する。同じ色は1つも無い。
   ・文字ボール(1字)= 中間トーン。英26色は最小色差ΔE24.4、かな78色はΔE13.5
   ・単語ボール(合体後)= 文字数で決まる淡い色。短い=淡く冷たい、長い=濃く熱い
   ・両者は最小ΔE16.0 離してあるので、文字と単語を取りちがえない
   (app/build_word_drop.py と同じ流儀で、生成の手順はコミットログに残してある) */
const JA_KANA = "ぁあぃいうぇえぉおかがきぎくぐけげこごさざしじすずせぜそぞただちぢっつづてでとどなにぬねのはばぱひびぴふぶぷへべぺほぼぽまみむめもゃやゅゆょよらりるれろわをんゔ";
const EN_ALPHA = "abcdefghijklmnopqrstuvwxyz";
const CHAR_COLOR = {
  en: [
  "#f7f7bb", "#d740e7", "#409fe7", "#e9534e", "#40e740", "#f292cf", "#40e7e7", "#dce740", "#b48574", "#63c576", "#8777ee", "#e3a945", "#cfcae7",
  "#e740b0", "#947eb9", "#e55283", "#7eb99c", "#b1c563", "#63aec5", "#9eec69", "#dc7aeb", "#e77e40", "#f4cebe", "#bda76b", "#40e7bb", "#b47490",
  ],
  ja: [
  "#f7f7bb", "#d740e7", "#409fe7", "#e9534e", "#40e740", "#f292cf", "#40e7e7", "#dce740", "#b48574", "#63c576", "#8777ee", "#e3a945", "#cfcae7",
  "#e740b0", "#947eb9", "#e55283", "#7eb99c", "#b1c563", "#63aec5", "#9eec69", "#dc7aeb", "#e77e40", "#f4cebe", "#bda76b", "#40e7bb", "#b47490",
  "#ee8777", "#40e778", "#f1b1c9", "#a2f1b4", "#adb4f5", "#4e87e9", "#bf95ef", "#748db4", "#edad87", "#8db474", "#bd6bba", "#cedfc3", "#8fd6d6",
  "#f0d384", "#d95ea4", "#d95e6a", "#92c5f2", "#a5f292", "#40e799", "#b55fe7", "#caee77", "#d28356", "#e8a19c", "#e552d6", "#b0e740", "#e5ce9e",
  "#8dc95e", "#63c594", "#45cee3", "#83e740", "#8f92e5", "#c4ab92", "#bea5cf", "#b8c492", "#40b5e7", "#d1668d", "#ee77d2", "#c17678", "#62ce5a",
  "#aa6ed8", "#62d5be", "#9cb6c9", "#db694d", "#d4afb3", "#e995ef", "#d2b956", "#b474a9", "#6387c5", "#edc4ed", "#c19167", "#c9d651", "#c1c176",
  "#5fe156", "#d392b9",
  ]
};
function charColor(ch) {
  const list = dictMode === "ja" ? JA_KANA : EN_ALPHA, pal = CHAR_COLOR[dictMode];
  const i = list.indexOf(ch);
  return i >= 0 ? pal[i] : pal[ch.charCodeAt(0) % pal.length];
}
const COLOR_TOP = 10;
const LEN_COLOR = { 2:"#ebf0f4", 3:"#c5e6f1", 4:"#aceccc", 5:"#c4e99b", 6:"#f8e777", 7:"#f5a966", 8:"#f28896", 9:"#daa6e7", 10:"#fdce3f" };
const LEN_BLOCK = { 3:"⬜", 4:"🟫", 5:"🟦", 6:"🟩", 7:"🟨", 8:"🟧", 9:"🟥", 10:"🟪" };
/* 文字数が増えるほどボールを大きく。10文字で半径2倍(直径は盤の3分の1)。
   これ以上大きくすると盤面を1個で塞いでしまう */
const radiusOf = len => R0 * Math.min(2.0, 1 + 0.118 * (len - 1));
const MIN_LETTERS = 16;            // 文字ボールが減りすぎると手が無くなるので下限を置く

/* ---------- 文言 ---------- */
const T = {
  ja: {
    title:"ワードドロップ", daily:"今日の一戦", free:"フリープレイ",
    long:"最長", score:"スコア", time:"つくった語", made:"つくった単語",
    trace:"ボールを指でなぞってつなぐ",
    dictReady:n=>`${n.toLocaleString()}語`, dictLocal:n=>`内蔵辞書 ${n}語(http で開くと全語)`,
    needTwo:"2個以上つなぐ", tooShort:n=>`${MINLEN}文字から。いまは${n}文字`,
    notWord:l=>`${l} … ならべかえても単語にならない`,
    grew:(a,b)=>`${a} → ${b} に育った`,
    perfect:w=>`${w} は最長！ 消えた`,
    findNone:"つながる語が見つからない", find:"ヒント",
    hintPick:(i,n,len,w)=>`確認 ${i}/${n} ・ ${len}文字 ${w}`,
    endTime:"時間切れ", endHand:"ここまでの記録", end:"おわる", resultLead:d=>`${d} ／ 今日の記録`, freeLead:"フリープレイの記録",
    noWord:"単語なし", langBtn:"EN", how:"遊びかた", freeBtn:"フリー", retry:"やりなおす",
    again:"もう一度", copy:"結果をコピー", copied:"コピーしました！",
    tomorrow:"あすの一戦は 0:00 に更新されます", best:"自己ベスト", newBest:"自己ベスト更新！",

  const set = new Set(picked);

    sparks.push({ x: b.x, y: b.y, vx: (Math.random() - .5) * 260, vy: (Math.random() - .8) * 220, life: 1, color: b.color });

  const have = [0,0,0,0,0,0], all = [0,0,0,0,0,0];
  for (const e of DICT) { const n = starOf(e); if (n) all[n]++; }
  const mine = [];
  for (const id of collected) { const e = BYID.get(id); if (e) { mine.push(e); have[starOf(e)]++; } }
  const tabs = [[0, L.dexAll, collected.size, total]];
  for (let n = 1; n <= 5; n++) tabs.push([n, "★".repeat(n), have[n], all[n]]);
  $("#dexTabs").innerHTML = tabs.map(([n, label, h, a]) =>
    `<button type="button" data-tab="${n}" class="${n === dexTab ? "on" : ""}">${label} ${h.toLocaleString()}/${a.toLocaleString()}</button>`).join("");
  $("#dexTabs").querySelectorAll("button").forEach(b =>
    b.onclick = () => { dexTab = Number(b.dataset.tab); paintDexView(); });
  const list = mine.filter(e => !dexTab || starOf(e) === dexTab)
                   .sort((a, b) => b.w.length - a.w.length || a.rank - b.rank);
  const CAP = 400;
  $("#dexList").innerHTML = list.length
    ? list.slice(0, CAP).map(e => {
        const c = LEN_COLOR[Math.min(e.w.length, COLOR_TOP)] || "#fff";
        const sub = dictMode === "ja" ? `<small>${e.w}</small>` : "";
        return `<i style="background:${c}">${dispOf(e)}${sub}</i>`;
      }).join("")
    : `<span class="none">${L.dexEmpty}</span>`;
  $("#dexMore").textContent = list.length > CAP ? L.dexMore(list.length - CAP) : "";
}
$("#dexClose").onclick = () => $("#overDex").classList.remove("on");
$("#dex").onclick = openDex;

function paintDex(flash) {
  $("#dexN").textContent = collected.size.toLocaleString();
  if (!flash) return;
  const el = $("#dex");
  el.classList.add("pop");
  clearTimeout(dexTimer);
  dexTimer = setTimeout(() => el.classList.remove("pop"), 420);
}

/* ---------- 読み上げ ----------
   合体して単語ができたら、その語を英語で読み上げる。綴りと音を結びつける
   ところがこのゲームの学習価値なので、既定で入。🔊 ボタンで切れる。 */
let speakOn = true, enVoice = null;
try { speakOn = localStorage.getItem("wordrop.mute") !== "1"; } catch (_) {}
function pickVoice() {
  if (!window.speechSynthesis) return;
  const vs = speechSynthesis.getVoices() || [];
  const pick = pre => vs.find(v => pre.test(v.lang) && /google|natural|samantha|siri|kyoko/i.test(v.name))
                   || vs.find(v => pre.test(v.lang)) || null;
  enVoice = { en: pick(/^en[-_]?/i), ja: pick(/^ja/i) };
}
if (window.speechSynthesis) {
  pickVoice();
  try { speechSynthesis.addEventListener("voiceschanged", pickVoice); } catch (_) {}
}
function speak(word) {
  if (!speakOn || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();               // 連鎖で読み上げが溜まらないように
    /* 日本語は漢字ではなく「よみ」を読ませる。漢字だと読みが揺れるため */
    const u = new SpeechSynthesisUtterance(word);
    u.lang = D().speak; u.rate = .9; u.pitch = 1; u.volume = 1;
    /* 声の指定だけは別に囲う。ここで転ぶと読み上げごと黙って死ぬので、
       声が使えなければ既定の声のまま読ませる */
    const v = enVoice && enVoice[dictMode];
    if (v) { try { u.voice = v; } catch (_) {} }
    speechSynthesis.speak(u);
  } catch (_) {}
}
function paintSound() { $("#btnSound").textContent = speakOn ? "🔊" : "🔇"; }
$("#btnSound").onclick = () => {
  speakOn = !speakOn;
  try { localStorage.setItem("wordrop.mute", speakOn ? "0" : "1"); } catch (_) {}
  if (!speakOn && window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (_) {} }
  paintSound();
};

/* ---------- 確認用のヒント ----------
   開発の確認用。いま盤面でつながる組を、長さごとに1件ずつ集める。
   タップするたびに 短い語 → 長い語 へ切り替わり、その組が光る。
   どの長さの語まで作れる盤面なのかを一目で確かめられる。            */
function collectChains() {
  const list = bodies.filter(grabbable);
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  const nbr = new Map();
  for (const a of list) nbr.set(a, list.filter(b => b !== a && sideBySide(a, b)));
  const byLen = new Map();
  let nodes = 0;
  const path = [], seen = new Set();
  const walk = (letters) => {
    if (nodes++ > 400000) return true;
    if (path.length >= 2 && letters.length >= MINLEN) {
      const e = pickFrom(BYSIG.get(sortSig(letters)));
      if (e && !byLen.has(e.w.length)) byLen.set(e.w.length, { balls: path.slice(), ent: e });
    }
    if (path.length >= MAXBALLS) return false;
    const around = (nbr.get(path[path.length - 1]) || []).slice();
    for (let i = around.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [around[i], around[j]] = [around[j], around[i]]; }
    for (const b of around) {
      if (seen.has(b) || letters.length + b.len > maxLen()) continue;
      path.push(b); seen.add(b);
      const stop = walk(letters + b.letters);
      path.pop(); seen.delete(b);
      if (stop) return true;
    }
    return false;
  };
  for (const st of list) {
    path.length = 0; seen.clear(); path.push(st); seen.add(st);
    if (walk(st.letters)) break;
  }
  return [...byLen.values()].sort((a, b) => a.ent.w.length - b.ent.w.length);
}
const findChain = () => { const a = collectChains(); return a.length ? a[a.length - 1] : null; };

function doFind() {
  if (!running) return;
  /* 集め直すのは合体したときだけ。補充でボールが増えるたびに集め直すと
     番号が毎回1に戻ってしまう。持っている組のボールが盤から消えたときや、
     山が育って天井の外へ押し出されたときも集め直す */
  const key = String(madeWords.length);
  const alive = hintList.length && hintList.every(h => h.balls.every(b => bodies.includes(b) && onBoard(b)));
  if (key !== hintKey || !alive) { hintKey = key; hintList = collectChains(); hintIdx = -1; }
  if (!hintList.length) { setLog(t().findNone); return; }
  hintIdx = (hintIdx + 1) % hintList.length;       // 短い語から順に、押すたび長い語へ
  const hit = hintList[hintIdx];
  glow = new Set(hit.balls);
  glowUntil = performance.now() + 4000;
  setLog(t().hintPick(hintIdx + 1, hintList.length, hit.ent.w.length, dispOf(hit.ent)),
         hit.balls.map(b => b.isWord ? dispOf(b.ent) : upper(b.letters)).join(" ＋ "));
}
function paintFind() { $("#btnFind").textContent = t().find; $("#btnFind").disabled = false; }

/* ---------- 表示 / 進行 ---------- */
function paintStats() {
  const longest = madeWords.reduce((a, b) => (!a || b.w.length > a.w.length) ? b : a, null);
  $("#statLong").textContent = longest ? String(longest.w.length) : "–";
  $("#statScore").textContent = score.toLocaleString();
  $("#statTime").textContent = String(madeWords.length);
}
function setLog(main, sub) { $("#logMain").textContent = main; if (sub !== undefined) $("#logSub").textContent = sub; }
/* 時間制限は置かない。好きなだけ遊んで、自分で「おわる」を押して終える */
function startClock() { started = true; }
function startGame(m) {
  mode = m;
  if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (_) {} }
  running = true; started = false;
  score = 0; madeWords = []; chain = []; glow = new Set(); glowUntil = 0; hintList = []; hintIdx = -1; hintKey = ""; sigPick.clear();
  marks = []; newCount = 0; loadDex();
  bodies = []; sparks = [];
  rng = mode === "daily" ? mulberry32(hashSeed("wordrop-" + dictMode + "-" + dateKey())) : mulberry32((Math.random() * 4294967296) >>> 0);
  spill = [];
  fitStage();
  /* 最初の山は、上から降らせずに積んだ状態から始める。
     文字ボールだけでなく、すでに合体ずみの単語ボールもいくつか混ぜておく */
  let y = H - R0 * 1.15;
  while (areaOf() < W * H * FILL && y > R0 * 0.7) {   // 枠の外から積み始めない
    let x = 4, rowMax = R0;
    while (x < W - 10) {
      const asWord = STARTER.length && rng() < STARTER_RATE;
      const ent = asWord ? STARTER[Math.floor(rng() * STARTER.length)] : null;
      const letters = ent ? ent.w : nextLetter();
      const r = ent ? radiusOf(letters.length) : R0;
      if (x + r * 2 > W - 4) break;
      const b = addBall(letters, !!ent, x + r + (rng() - .5) * R0 * .18, y - (r - R0), ent);
      b.pop = 0;                       // 開始時はふくらむ演出をしない
      x += r * 2 + 2;
      if (r > rowMax) rowMax = r;
      if (areaOf() >= W * H * FILL) break;
    }
    y -= rowMax * 1.9;
  }
  $("#modeChip").textContent = mode === "daily" ? `${t().daily} #${puzzleNo()}` : t().free;
  $("#overResult").classList.remove("on");
  paintFind(); paintRead(); paintStats(); setLog(t().trace, "");
}
function endGame(reason) {
  if (!running) return;
  running = false; chain = []; paintRead();
  if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (_) {} }
  const longest = madeWords.reduce((a, b) => (!a || b.w.length > a.w.length) ? b : a, null);
  $("#resTitle").textContent = reason;
  $("#resLead").textContent = mode === "daily" ? t().resultLead(dateKey()) : t().freeLead;
  const art = $("#resArt"); art.innerHTML = "";
  if (longest && artOf(longest)) { const im = new Image(); im.src = ART_BASE + artOf(longest) + ".png"; im.onerror = () => im.remove(); art.appendChild(im); }
  $("#resWord").textContent = longest ? dispOf(longest) : t().noWord;
  $("#resMean").textContent = longest ? [subOf(longest), glossOf(longest), starText(longest)].filter(Boolean).join(" ／ ") : "";
  $("#resTag").textContent = longest ? `${longest.w.length}${lang === "ja" ? "文字" : " letters"}` : "";
  $("#resScore").textContent = score.toLocaleString();
  $("#resWords").textContent = madeWords.length + (newCount ? ` (NEW ${newCount})` : "");
  try { localStorage.setItem(dexKey(), [...collected].join("\n")); } catch (_) {}
  $("#resList").innerHTML = [...madeWords].sort((a, b) => b.w.length - a.w.length || a.w.localeCompare(b.w))
    .map(e => `<i>${dispOf(e)}</i>`).join("");
  const rec = saveRecord(longest);
  $("#resMini").textContent = mode !== "daily" ? `${t().best}: ${rec.best || "–"}`
    : rec.replay ? t().practice : (rec.isBest ? t().newBest + " · " + t().tomorrow : t().tomorrow);
  $("#resShare").textContent = shareText();
  $("#overResult").classList.add("on");
}
function saveRecord(longest) {
  let store = {};
  try { store = JSON.parse(localStorage.getItem("wordrop") || "{}"); } catch (_) {}
  const len = longest ? longest.w.length : 0;
  const isBest = len > Number(store.bestLen || 0);
  if (isBest) { store.bestLen = len; store.bestWord = dispOf(longest); }
  let replay = false;
  if (mode === "daily") {
    store.days = store.days || {};
    const dk = dictMode + ":" + dateKey();
    if (store.days[dk]) replay = true;
    else store.days[dk] = { s: score, w: dispOf(longest), n: madeWords.length };
  }
  try { localStorage.setItem("wordrop", JSON.stringify(store)); } catch (_) {}
  return { isBest, replay, best: store.bestWord || "" };
}
function shareText() {
  const top = [...madeWords].sort((a, b) => b.w.length - a.w.length).slice(0, 3);
  const bars = top.map(e => (LEN_BLOCK[e.w.length] || "⬜").repeat(e.w.length) + " " + e.w.length);
  const head = (mode === "daily" ? `WORDROP #${puzzleNo()}` : "WORDROP · free") + (dictMode === "ja" ? " 🇯🇵" : "");
  const tail = lang === "ja" ? `${madeWords.length}語 / ${score.toLocaleString()}点`
                             : `${madeWords.length} words / ${score.toLocaleString()} pts`;
  return [head, ...bars, tail, SHARE_URL].join("\n");
}
async function doShare() {
  const text = shareText();
  try {
    if (navigator.share) { await navigator.share({ text }); return; }
    await navigator.clipboard.writeText(text);
    $("#btnShare").textContent = t().copied;
    setTimeout(() => { $("#btnShare").textContent = t().copy; }, 1400);
  } catch (_) {}
}
function paintLang() {
  document.documentElement.lang = lang;
  const L = t();
  $("#title").textContent = L.title;
  $("#lbLong").textContent = L.long; $("#lbScore").textContent = L.score; $("#lbTime").textContent = L.time;
  $("#lbResScore").textContent = L.score; $("#lbResWords").textContent = L.made;
  $("#btnLang").textContent = L.langBtn; $("#btnHow").textContent = L.how;
  $("#btnFree").textContent = L.freeBtn; $("#btnRetry").textContent = L.retry;
  $("#btnAgain").textContent = L.again; $("#btnShare").textContent = L.copy; $("#btnEnd").textContent = L.end;
  $("#howTitle").textContent = L.how;
  $("#howList").innerHTML = L.howList.map(s => `<li>${s}</li>`).join("");
  $("#btnHowClose").textContent = lang === "ja" ? "はじめる" : "Start";
  $("#modeChip").textContent = mode === "daily" ? `${L.daily} #${puzzleNo()}` : L.free;
  paintDictState(); paintFind(); paintSound(); paintDict(); paintStats(); setLog(L.trace);
  $("#startTitle").textContent = L.title;
  $("#startLead").textContent = L.startLead(puzzleNo());
  $("#pickEnT").textContent = L.pickEnT; $("#pickEnD").textContent = L.pickEnD;
  $("#pickJaT").textContent = L.pickJaT; $("#pickJaD").textContent = L.pickJaD;
  $("#startHow").textContent = L.how;
  $("#dexL").textContent = L.dex;
  $("#dexClose").textContent = L.dexClose;
}
$("#btnLang").onclick = () => { lang = lang === "ja" ? "en" : "ja"; paintLang(); };
$("#btnHow").onclick = () => $("#overHow").classList.add("on");
$("#btnHowClose").onclick = () => $("#overHow").classList.remove("on");
$("#btnFree").onclick = () => startGame(mode === "daily" ? "free" : "daily");
$("#btnRetry").onclick = () => startGame(mode);
$("#btnAgain").onclick = () => startGame("free");
$("#btnShare").onclick = doShare;
$("#btnFind").onclick = doFind;
$("#btnEnd").onclick = () => { if (running) endGame(t().endHand); };
function paintDict() {
  $("#btnDict").textContent = D().chip;
  $("#pickEn").classList.toggle("on", dictMode === "en");
  $("#pickJa").classList.toggle("on", dictMode === "ja");
}
/* 開始前にどちらで遊ぶかを選ぶ */
function startWith(next) {
  $("#overStart").classList.remove("on");
  const go = () => { startGame("daily"); paintLang(); firstTimeHow(); };
  if (next === dictMode) go(); else loadDict(next, go);
}
function firstTimeHow() {
  try {
    if (!localStorage.getItem("wordrop.seen3")) {
      $("#overHow").classList.add("on");
      localStorage.setItem("wordrop.seen3", "1");
    }
  } catch (_) {}
}
$("#pickEn").onclick = () => startWith("en");
$("#pickJa").onclick = () => startWith("ja");
$("#startHow").onclick = () => $("#overHow").classList.add("on");
$("#btnDict").onclick = () => {
  loadDict(dictMode === "en" ? "ja" : "en", () => { startGame(mode); paintLang(); });
};

paintLang();
loadDict(dictMode, () => { startGame("daily"); paintLang(); });
requestAnimationFrame(n => { lastT = n; loop(n); });
</script>
